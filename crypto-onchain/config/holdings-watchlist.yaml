# 已知地址持仓监控（holdings）—— 只监控**人工写进本文件的地址**。
#
# 边界（务必先读）：
# - 本文件是地址标签的唯一来源：地址与归属只能人工填写，并写清 source_note（标签来源/确认方式）。
# - 程序不做地址发现/聚类/归属推断，不抓 Arkham/Nansen 等标签库。
# - label 只是我们给地址起的名字，不是链上事实；第三方标签已明确标注，未经官方核实。
# - 支持 chain: btc / eth / erc20；erc20 必须给 token（合约地址、symbol、decimals）。
# - threshold_pct：单地址余额变化（相对上一次实际采集）绝对值 ≥ 该值才产生告警事件；
#   事件默认 P2（只进每日摘要），条目可加 severity: P0/P1 并在 app.yaml 打开
#   holdings.alerts.push 才即时推送。
# - 可选 price_usd：固定价格（如稳定币 1.0）；不给则读 crypto-price exports，再不行用 Binance 公开价。
#
# 地址来源（2026-11-10 核实）：
# - BTC：BitInfoCharts「Top 100 Richest Bitcoin Addresses」钱包标签（第三方标签，非官方披露）；
#   余额用 Blockstream API 实测核对。
# - ETH：vitalik.eth（Etherscan/ENS 公开地址），公共 RPC 实测核对。

