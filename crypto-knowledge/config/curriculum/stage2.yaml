  # ---------- 概念卡 c201–c220 ----------
  - id: c201
    type: concept
    stage: 2
    order: 1
    title: EVM（以太坊虚拟机）
    en: Ethereum Virtual Machine
    minutes: 11
    tags: [ethereum, evm]
    sections:
      - h: 一句话
        p: EVM（Ethereum Virtual Machine，以太坊虚拟机）是执行智能合约的抽象确定性状态机：同一笔交易在同一份状态上执行，所有节点必须算出完全相同的结果与 Gas 消耗。
      - h: 为什么重要
        p: 它把「状态如何改变」写成了全网统一的规则。Solidity 等语言编译成 EVM 字节码，节点按同一套指令逐条执行，再用状态根互相核对；没有这层约定，就无法做到「一次部署、全网同结果」。多数 L2 兼容 EVM，使同一份合约能低成本迁移，后面的 Gas、代币标准与 DeFi 都建立在这台抽象机器上。
      - h: 核心机制
        p: EVM 的核心是「状态 + 栈式字节码 + Gas 计量」。状态由账户组成（余额、nonce、代码、存储）；每次调用加载一段字节码，在 256 位字长的栈上逐条执行指令，读写存储，最后产生新的状态根。执行是单线程、无时钟、无真随机，也不能访问网络或文件系统，任何外部信息必须由交易或预言机先写入链上。Gas 给每条指令定价，既防死循环，也让区块空间按价分配；Gas 不足时整笔交易回滚，但已消耗部分不退。
      - h: 例子
        p: 以太坊原生转账不执行合约代码，固定消耗 21000 Gas；调用一个 ERC-20 合约的 transfer 通常要 4 万到 6 万 Gas，差额来自存储读写：首次写入一个新的存储槽（storage slot）要 20000 Gas，冷读存储约 2100 Gas，而普通算术指令只要 3 到 5 Gas。同样是 swap，池子状态不同 Gas 也会不同——EVM 按「做了多少存储读写」收费，而不是按金额收费。
      - h: 常见误解
        p: 最常见的是把 EVM 当成一台真机器，以为它有 CPU、时钟与随机数，合约可以自己定时执行。实际上它是规范定义的抽象状态机，不会自己醒来：所有执行都由交易触发，定时任务只能靠外部账户、keeper 或自动化协议反复调用。另一个误解是以为「Solidity 就是以太坊」，Solidity 只是编译到 EVM 的语言之一，Vyper、Yul 和直接用字节码部署的合约同样运行在 EVM 上。
      - h: 边界与代价
        p: 确定性要求每个节点完整重放同一段代码，代价是性能：EVM 单线程执行、区块 Gas 上限限制总计算量，复杂逻辑只能拆成多笔交易。为了可验证，EVM 放弃浮点数，只做 256 位整数运算，价格与利率要用定点数模拟；也不能直接读外部数据。状态还会持续膨胀，写入的存储只要不清空就一直占节点磁盘，这正是新存储槽收费高的原因。高频计算或隐私场景，把逻辑放到链下、只在链上验证结果往往更合适。
    quiz:
      - q: EVM 里的合约能自己定时执行吗？
        a: 不能。EVM 是确定性状态机，没有时钟、没有唤醒机制，合约只在一笔交易调用它时才执行；定时任务要靠外部账户、keeper 或自动化协议反复触发交易。
      - q: 为什么 EVM 只用整数，不支持浮点数？
        a: 浮点数在不同平台上的舍入结果可能不一致，会破坏「所有节点算出相同结果」的确定性。EVM 因此只用 256 位整数，小数用定点数表示，精度由合约自己约定。
      - q: 同一份合约部署到兼容 EVM 的 L2，字节码要重写吗？
        a: 通常不需要。多数 L2 兼容 EVM 执行环境，可直接复用字节码；但链 ID、预编译合约、Gas 定价与个别操作码行为可能有差异，部署前要确认目标链的兼容说明。
    sources:
      - https://ethereum.org/en/developers/docs/evm/

  - id: c202
    type: concept
    stage: 2
    order: 2
    title: Gas：计算的计价单位
    en: Gas
    minutes: 11
    tags: [ethereum, gas]
    sections:
      - h: 一句话
        p: Gas 是以太坊计量计算与存储成本的单位：每条 EVM 指令都有固定 Gas 价签，一笔交易的 Gas 用量乘以 Gas 单价，就是它支付的手续费。
      - h: 为什么重要
        p: 它把计算资源变成可定价、可限额的商品。区块有 Gas 上限，交易要声明 Gas limit，出块者按单价挑选交易。没有 Gas，一个死循环就能让所有节点卡住；有了 Gas，攻击者必须为占用算力付费，区块空间也能按需求分配。理解 Gas 是理解以太坊费用、L2 便宜在哪里、以及为什么某些操作「贵」的前提。
      - h: 核心机制
        p: Gas 要分两层看：用量由指令决定，单价由市场决定。普通 ETH 转账固定 21000 Gas；写入一个新的存储槽 20000 Gas；冷读存储约 2100 Gas；纯算术指令只要 3 到 5 Gas。交易先按 Gas limit 预扣费用，执行结束按实际用量结算，剩余退还。执行中 Gas 耗尽的交易整体回滚，但已消耗部分照付，因为节点确实做了计算。EIP-1559（2021 年 8 月伦敦升级）之后单价拆成协议自动调整并销毁的 base fee，与给打包者的小费。
      - h: 例子
        p: 一笔转账用 21000 Gas，若 base fee 为 20 gwei、小费 2 gwei，手续费是 21000×22 gwei = 462000 gwei，即 0.000462 ETH，其中 21000×20 gwei 被协议销毁。同一笔交易在区块打满、base fee 涨到 100 gwei 时要贵约 5 倍，Gas 用量仍是 21000。这就是「用量」与「单价」的差别：前者由操作决定，后者由拥堵决定。
      - h: 常见误解
        p: 常见误解有三个。其一，把 Gas 当成手续费本身：Gas 是量，手续费是量乘单价。其二，以为交易失败不收费：只要被打包上链，即使回滚，nonce 加 1、Gas 照付。其三，以为把 Gas limit 调高会多付钱：limit 只是上限，按实际用量结算，多余退还；但 limit 设得太低，交易会在计算途中耗尽 Gas 而失败，已消耗部分仍要付。
      - h: 边界与代价
        p: Gas 带来按资源付费的公平性，代价是使用门槛：用户要理解 base fee 波动、要留缓冲，否则交易容易卡住或失败。拥堵时小额操作在经济上不划算，把逻辑搬到 L2 往往比抠 EVM 指令更有效。Gas 也挡不住状态膨胀——写入的存储越多、长期成本越高。另外 Gas 价格反映的是区块空间供需，不是「网络价值」，不能据此推断任何价格走势。
    quiz:
      - q: 同一笔交易，Gas 用量和手续费是一回事吗？
        a: 不是。Gas 用量由交易执行的操作决定，基本固定；手续费等于 Gas 用量乘 Gas 价格，价格随拥堵变化，所以费用会大幅波动。
      - q: 交易执行回滚了，Gas 会退回来吗？
        a: 不会退已消耗的部分。交易一旦打包，节点已按指令执行并占用区块空间，即使最终 revert，Gas 照收；回滚只是撤销状态变更，不撤销计算成本。
      - q: 为什么「首次写入存储」比「修改已有存储」贵很多？
        a: 首次写入会给全节点新增一份需要长期保存的状态，成本由网络承担，所以收 20000 Gas；修改已有存储槽不增加状态规模，费用低得多。
    sources:
      - https://ethereum.org/en/developers/docs/gas/

  - id: c203
    type: concept
    stage: 2
    order: 3
    title: nonce：账户的交易计数器
    en: Nonce
    minutes: 10
    tags: [ethereum, account]
    sections:
      - h: 一句话
        p: nonce 是每个外部账户（EOA）的交易计数器：账户每发出一笔交易，nonce 加 1；网络用「账户地址 + nonce」保证交易唯一，从而拒绝重复与乱序。
      - h: 为什么重要
        p: 它同时解决两件事：防重放和定顺序。签名里含 nonce，同一笔签名交易重复广播不会被再次执行；出块者也必须按 nonce 递增打包，前一笔卡住时后面的都得排队。钱包里「交易 pending 很久」最常见的原因就是 nonce 被卡住，而不是网络坏了。
      - h: 核心机制
        p: nonce 从 0 开始，每被打包一笔加 1。这里的「成功」指进入区块，不是执行成功：交易 revert 也消耗 nonce。要跳过卡住的交易，常见做法是用同一个 nonce、更高的 Gas 单价重发一笔替换交易（replacement），旧交易被丢弃；也可以先补一笔 nonce 相邻的交易把它顶掉。合约账户没有这种计数器，合约内部逻辑若需要防重放，得自己维护计数变量。
      - h: 例子
        p: 假设账户当前 nonce 是 5，你发了 nonce 6 的交易但单价太低，它会在内存池排队；随后发的 nonce 7、8 也只能等，因为节点不会跳过 6。此时用同一 nonce 6、更高单价重发，替换成功后后面的交易才会依次上链。另一种情况：6 号交易最终 revert，nonce 仍推进到 7，说明顺序推进与执行结果无关。
      - h: 常见误解
        p: 以为「交易失败 nonce 不变」。只要被打包，无论 revert 与否 nonce 都加 1 且 Gas 照付；只有始终没进区块、被替换或丢弃的交易才不占 nonce。也有人以为可以随便设一个很大的 nonce 来插队，实际上高于当前值的 nonce 只会一直排队，低于当前值的会直接被节点拒绝。
      - h: 边界与代价
        p: 顺序保证意味着账户天然串行：想并行发出多笔交易，必须提前分配连续 nonce，任何一笔失败都会阻塞后续。多设备共用一个账户时，各端本地 nonce 可能不同步，容易互相覆盖。托管钱包与智能合约钱包用别的机制（例如账户抽象里的多维 nonce）缓解，但普通 EOA 只能靠替换交易解决。nonce 一旦被占用就不能撤销，这是账户模型的硬约束。
    quiz:
      - q: 一笔交易 revert 了，nonce 会变吗？
        a: 会。交易一旦打包上链，无论成功还是 revert，nonce 都加 1 且 Gas 照付；只有未被写入区块、被替换或丢弃的交易不消耗 nonce。
      - q: 交易卡住时，为什么不能直接发一笔更大的 nonce 跳过它？
        a: 因为节点要求 nonce 按顺序递增，中间缺口不会被跳过，后面的交易只会一直排队。正确做法是用同一个 nonce 加价重发替换交易，或补一笔填补缺口的交易。
    sources:
      - https://ethereum.org/en/developers/docs/accounts/

  - id: c204
    type: concept
    stage: 2
    order: 4
    title: 智能合约
    en: Smart Contract
    minutes: 11
    tags: [ethereum, contract]
    sections:
      - h: 一句话
        p: 智能合约是部署在链上的账户，规则由代码而非人执行；它有自己的地址和存储，只能被交易或其它合约调用，执行结果由全网节点共同验证。
      - h: 为什么重要
        p: 它把「谁在什么条件下拿到什么」变成公开可审计的代码。借贷、兑换、清算、稳定币发行都是合约；任何人可以读代码、看历史调用，也可以组合别人的合约做出新协议。但代码即规则，也意味着漏洞、逻辑错误和权限后门同样是规则的一部分，上线后不一定能改。
      - h: 核心机制
        p: 部署合约就是发一笔交易，把字节码写到新地址，构造函数初始化存储。之后每次调用都是一笔交易（或另一合约的内部调用），EVM 据此执行、更新状态、按 Gas 收费。合约不能主动发起调用，只能被动响应；它读取的链上数据是确定的，读取链外数据要靠预言机。合约之间的调用是同步的，被调合约失败会让整个调用链回滚。权限通常用 owner、admin 或治理合约实现，是否可升级由部署时选择的模式决定。
      - h: 例子
        p: 一个最小 ERC-20 合约部署后，地址上存着余额映射和总供应量。用户调用 transfer 时，EVM 执行代码，把调用者余额减去、接收者余额加上，并发出 Transfer 事件；钱包和浏览器靠事件重建余额视图。如果有人调用一个没有权限检查的函数把余额清零，这不是「被黑」，而是代码本来就允许——审计看的是代码实际权限，而不是它的宣传语。
      - h: 常见误解
        p: 以为合约会自动执行、无法干预。多数合约留了管理员权限或使用可升级代理（proxy），部署者能改逻辑、暂停功能甚至转移资金；真正放弃权限且不可升级的合约是少数，而且一旦有 bug 也没法修。另一种误解是以为「开源就安全」——代码可见不等于代码正确，大量损失来自逻辑错误和价格假设错误。
      - h: 边界与代价
        p: 合约适合规则明确、多方参与、需要共同审计的场景；不适合需要频繁改规则、依赖外部数据或要求隐私的业务。代价包括：每次执行都要全网重复计算并付 Gas；状态公开，商业逻辑和用户行为都可被分析；出错后修复成本极高，往往要靠迁移到新合约并说服用户搬家。可升级性带来修复能力，也引入了「谁有权升级」的中心化风险。
    quiz:
      - q: 部署在链上的合约一定不可篡改吗？
        a: 不一定。不少合约用可升级代理或保留管理员权限，可以事后改逻辑甚至暂停；只有放弃权限且不可升级的合约才真正不可篡改，看权限比看名字重要。
      - q: 智能合约能主动读取互联网上的价格吗？
        a: 不能。EVM 无法访问链外数据，合约只能读链上状态。价格要靠预言机把外部数据写成链上记录，所以预言机的更新频率和被操纵风险会直接影响合约安全。
    sources:
      - https://ethereum.org/en/developers/docs/smart-contracts/

  - id: c205
    type: concept
    stage: 2
    order: 5
    title: ERC-20 代币标准
    en: ERC-20
    minutes: 11
    tags: [ethereum, token]
    sections:
      - h: 一句话
        p: ERC-20 是同质化代币（fungible token）的接口标准，规定 transfer、approve、transferFrom 等函数和 Transfer、Approval 两个事件，让不同代币对钱包和协议呈现同一副面孔。
      - h: 为什么重要
        p: 统一接口让钱包、DEX、借贷协议能一次性支持成千上万种代币，不必为每个项目写适配。你在钱包里看到的「添加代币」「授权额度」，背后都是这套接口的具体调用。它也降低了发币门槛，因此代币数量极多、质量差异极大，标准普及反而让「看接口」不足以判断风险。
      - h: 核心机制
        p: 标准维护一张 address 到余额的映射和一张「owner 授权给 spender 的额度」映射。transfer 从调用者余额扣；approve 设置 allowance；transferFrom 允许被授权方在额度内从 owner 账户转出，DEX 正是靠它拉走你的代币。所有转账必须发 Transfer 事件，索引器据此重建余额。标准只规定函数签名与语义，不规定实现细节，也不规定总供应量如何产生或能否增发。
      - h: 例子
        p: 你在 DEX 用 USDC 换 ETH，流程是两笔交易：先 approve 该 DEX 路由合约可以花掉你指定数量的 USDC，再调用 swap，路由通过 transferFrom 把 USDC 从你账户划到池子、把 ETH 转给你。如果 approve 给了「无限额度」，这笔授权会一直有效，直到你主动撤销或该代币合约被替换——这也是「定期检查授权」的意义。
      - h: 常见误解
        p: 以为符合 ERC-20 就安全、行为就一样。标准只统一接口，不统一实现质量：有的代币收转账税、有的能冻结或拉黑地址、有的在失败时返回 false 而不 revert、有的余额可被管理员任意修改。接入方必须单独处理这些差异；同名代币也可能是完全不同的合约，认地址而不是认名字。
      - h: 边界与代价
        p: ERC-20 只适合同质化资产，NFT 需要 ERC-721 或 ERC-1155，带钩子逻辑的变体（如 ERC-777）会引入额外回调风险。标准的历史包袱是 approve 竞态：先改额度再改回去，可能被夹在中间花掉；实践中多采用「先归零再设置」或无限授权来规避。代币本身没有内在价值，价格、流动性、能否赎回都由发行方与市场决定。
    quiz:
      - q: 符合 ERC-20 的代币，行为都一样吗？
        a: 不一样。标准只统一函数与事件签名，实现可以加转账税、黑名单、冻结；有些代币失败时返回 false 而不 revert，接入方必须单独处理这些差异。
      - q: DEX 为什么需要你先 approve 才能换币？
        a: 因为合约不能直接动你账户里的代币，只能通过 transferFrom 在额度内划转。approve 就是你事先授予它的额度，额度越大、有效期越长，风险越高。
      - q: 钱包里两个代币同名，能认为是同一个资产吗？
        a: 不能。代币身份由合约地址决定，任何人都能部署同名同符号的合约。判断资产要看合约地址、发行方与链上记录，而不是看名字和图标。
    sources:
      - https://eips.ethereum.org/EIPS/eip-20

  - id: c206
    type: concept
    stage: 2
    order: 6
    title: EIP：以太坊改进提案
    en: Ethereum Improvement Proposal
    minutes: 10
    tags: [ethereum, governance]
    sections:
      - h: 一句话
        p: EIP 是以太坊改进提案（Ethereum Improvement Proposal）：任何人按模板提交技术规范，经编辑与社区讨论评审后，才可能被客户端实现并随硬分叉激活。
      - h: 为什么重要
        p: 以太坊的规则变化都走这条路：ERC-20 是 EIP-20，Blob 是 EIP-4844，账户抽象涉及 EIP-4337 与 EIP-7702。看状态（Draft、Review、Last Call、Final）就能判断一个功能是「还在讨论」「已定稿」还是「已随某次升级上线」，这比看新闻标题可靠得多。
      - h: 核心机制
        p: 提案分几类：Standards Track 定义接口与协议规则，Meta 处理流程，Informational 只提供信息。Standards Track 又分 Core（共识与执行层规则，需硬分叉）、Networking、Interface（如 ERC 系列）和 ERC。状态从 Draft 开始，经 Review、Last Call，定稿为 Final；也可能被撤回或停滞。Final 表示规范定稿并被采纳为标准，但真正改变主网行为还要客户端实现、测试网验证和硬分叉激活，时间表由核心开发者协调。
      - h: 例子
        p: EIP-1559 在 2021 年 8 月随伦敦升级激活，改变费用市场；EIP-4844 在 2024 年 3 月随 Dencun 升级引入 Blob，给 Rollup 提供廉价数据空间；EIP-7702 随 Pectra（2025-05-07）激活，允许 EOA 临时委托执行。它们都先在提案仓库定稿，再进客户端，最后在指定区块高度生效——同一份编号在三个阶段的含义完全不同。
      - h: 常见误解
        p: 以为 EIP 编号等于已上线。大量提案停在 Draft 甚至被撤回；Final 也只代表规范定稿，仍要等硬分叉部署到主网才算生效。还有人以为 EIP 由基金会「批准」，实际上没有最终决策机构，靠客户端团队、验证者与社区的实际采用来收敛，分歧大时可以长期搁置。
      - h: 边界与代价
        p: 开放提案降低了准入，也带来噪音与协调成本：讨论周期长、标准可能反复修改，Core EIP 还要兼顾共识与执行两层、兼容现有合约。不是所有改进都需要 EIP，客户端内部优化可以不走提案；也不是所有 EIP 都会上线。判断一个功能是否真的可用，要看它在哪次升级、哪个区块高度激活，而不是只看提案编号。
    quiz:
      - q: 某个 EIP 状态是 Final，说明它已在主网生效了吗？
        a: 不一定。Final 只表示规范定稿并被采纳为标准，真正生效要等客户端实现并随硬分叉部署到主网；也有提案只是接口标准，不改变链上规则。
      - q: 为什么 EIP 从定稿到主网生效要等很久？
        a: 因为要多个客户端团队分别实现、在测试网验证、协调激活高度，Core 类提案还涉及共识变更与生态兼容，任何一环出问题都可能推迟。
    sources:
      - https://eips.ethereum.org/EIPS/eip-1

  - id: c207
    type: concept
    stage: 2
    order: 7
    title: 质押：用资产做担保
    en: Staking
    minutes: 11
    tags: [ethereum, pos]
    sections:
      - h: 一句话
        p: 质押是把 32 ETH 存入存款合约、运行验证者节点参与出块与投票，用这笔资产为自己的诚实行为做担保；作恶会被罚没，离线会被缓慢扣钱。
      - h: 为什么重要
        p: 它是 PoS 的安全来源。攻击者要控制足够多的质押才能影响共识，而一旦作恶，罚没会直接烧掉其保证金，攻击成本可以量化。理解质押也就能理解为什么以太坊的最终性「要等约 12.8 分钟」、为什么超过三分之一验证者离线链会停止最终确定，以及为什么各类「质押凭证」多了一层对手方风险。
      - h: 核心机制
        p: 每个验证者需要 32 ETH 有效余额，被随机分配到提议或投票任务。诚实履职有奖励，奖励来自协议增发和交易小费；离线会被小幅扣钱，只有可证明的恶意行为（如双重签名、环绕投票）才会被罚没并逐出。退出要排队，入口和出口都有速率限制，防止质押量剧烈波动。质押的 ETH 在退出完成前不能动用，这是安全成本的一部分；退出排队时间取决于当时的进出队列，可能从数小时到数周。
      - h: 例子
        p: 假设网络有约 3000 万 ETH 参与质押，单个验证者的权重约为总量的三千万分之一，随机抽到出块的概率极低，收益主要来自持续的投票奖励。若某个运营方同时用同一组密钥在两个分叉上签名，被检测到后会被罚没部分本金并强制退出；而只是机器宕机离线，损失通常远小于罚没。这就是「恶意」与「故障」的定价差别：前者会被罚没并逐出，后者只是缓慢扣钱，所以验证者的运维质量直接决定长期收益。
      - h: 常见误解
        p: 以为质押就是「存币生息」。自建验证者要 32 ETH、要运维节点、要保管签名密钥，并承担罚没与停机扣款；交易所或流动性质押产品通常是你把币交给平台、拿回一张凭证，多出平台违约、凭证脱锚与托管风险。收益率也不是固定利率，会随全网质押量和网络活动变化。
      - h: 边界与代价
        p: 质押把资产锁定换成安全性，代价是流动性与运维责任：退出排队可能很长，密钥泄露可能导致罚没，硬件和网络故障会持续扣钱。质押奖励是协议层机制，不是投资建议；不同参与方式的风险结构差别很大，托管方案还要额外评估对手方。中国内地虚拟货币相关业务活动一律禁止，相关安排以 2026-02-06 八部门 42 号文为准。
    quiz:
      - q: 交易所里的「质押」和自建验证者一样吗？
        a: 不一样。自建验证者要自己管密钥和节点，承担罚没风险；交易所产品通常是你把币交给平台、拿回凭证，多了平台违约与托管风险。
      - q: 验证者离线会立刻被罚没吗？
        a: 不会。离线只是按时间缓慢扣钱，通常远小于罚没；罚没只针对可证明的恶意行为，例如同一高度双重签名或环绕投票，并会强制退出。
    sources:
      - https://ethereum.org/en/staking/

  - id: c208
    type: concept
    stage: 2
    order: 8
    title: 验证者
    en: Validator
    minutes: 11
    tags: [ethereum, pos]
    sections:
      - h: 一句话
        p: 验证者是 PoS 的出块与投票单位，每个需要 32 ETH 存款；它们被随机分配为某个 slot 的提议者或委员会成员，对区块头和检查点投票。
      - h: 为什么重要
        p: 验证者是共识的实际执行者：决定哪个区块被提出、哪个检查点被最终确定。随机分配加罚没，让收买多数验证者既昂贵又容易被发现。理解验证者的数量、余额与分布，才能判断一条链的去中心化程度和故障模式——比如「三分之一离线」和「三分之二离线」的后果完全不同。
      - h: 核心机制
        p: 每个 epoch 有 32 个 slot，每 slot 12 秒，约 6.4 分钟；每个 slot 由一个随机选出的提议者出块，并由一个委员会投票 attest。验证者按有效余额加权投票，余额越高权重越大。Pectra（2025-05-07）之后，单个验证者的有效余额上限从 32 ETH 提高到 2048 ETH（EIP-7251），大额质押者可以合并验证者、减少节点数量；奖励与罚没仍按有效余额计算。
      - h: 例子
        p: 一个 epoch 约 6.4 分钟，一天约 225 个 epoch，每个 slot 一个提议者，因此全网每天产生约 7200 个区块。若某运营方运行 1000 个验证者，它在任一瞬间被选为提议者的概率与质押占比成正比；被选入委员会则参与投票。活跃验证者集合太大时，单个验证者被抽中的频率会下降，这也是质押收益随全网质押量上升而摊薄的原因。
      - h: 常见误解
        p: 以为一台机器只能跑一个验证者。一个节点可以运行多个验证者，每个需要 32 ETH 存款，只要机器资源足够；Pectra 之后还能把多个 32 ETH 验证者合并成一个高余额验证者。另一个误解是以为验证者「保管用户资产」——验证者只保管自己的质押与签名密钥，并不托管他人的币。
      - h: 边界与代价
        p: 验证者越多，单个节点的带宽与磁盘压力越大，状态增长和 attestation 广播会推高运维成本；密钥管理也更难，重复使用密钥或错误配置可能触发罚没。验证者的惩罚只针对协议层行为，不保护智能合约漏洞或私钥被盗。质押集中到少数运营方会削弱抗审查性，这是比「有多少验证者」更值得关注的指标。
    quiz:
      - q: 一台机器只能运行一个验证者吗？
        a: 不是。一个节点可以运行多个验证者，每个需要 32 ETH 存款；Pectra 之后单个验证者有效余额上限提高到 2048 ETH，还能进一步合并。
      - q: 为什么验证者要随机分配任务，而不是固定顺序？
        a: 随机分配让攻击者无法预测谁将出块，也就无法定点收买或攻击；配合罚没，收买多数验证者的成本极高且容易留下证据。
    sources:
      - https://ethereum.org/en/developers/docs/consensus-mechanisms/pos/

  - id: c209
    type: concept
    stage: 2
    order: 9
    title: Rollup：把执行搬到 L2
    en: Rollup
    minutes: 11
    tags: [l2, rollup]
    sections:
      - h: 一句话
        p: Rollup 是把交易执行搬到 L2、把结果和必要数据发回以太坊的扩容方案，安全性锚定在 L1 而不是运营方信用。
      - h: 为什么重要
        p: 它把大量交易压成一批提交到 L1，摊薄单笔成本，同时保留「任何人可重算」的可验证性。这是以太坊扩容路线的主线：L1 负责共识与数据可用，L2 负责执行。理解 Rollup 的数据与证明如何回到 L1，才能判断一条 L2 到底继承了多少以太坊的安全性，而不是只看它多快多便宜。
      - h: 核心机制
        p: Rollup 节点执行交易、更新自己的状态，周期性把一批交易的数据（或数据摘要）和状态根提交到 L1 合约。关键在于数据回到 L1：只要数据可获取，任何人都能重算出正确状态，运营方提交错误结果会被挑战（Optimistic）或被证明推翻（ZK）。资产从 L1 进入 L2 通过桥合约锁定，退出通过提款流程，同时受挑战期或证明时间约束。排序、执行、证明、数据发布是四个可以分别去中心化的环节。
      - h: 例子
        p: 假设一笔 L2 转账在 L2 上只花几分钱，是因为它没有单独占用 L1 区块空间，而是和其它上千笔交易一起被打包进一个批次，只分摊一次 L1 数据与证明成本。若这条 L2 把数据发到以太坊 Blob，成本进一步下降；若它把数据放到外部 DA 层或自己的服务器，L1 就无法独立重算状态，安全性假设随之改变。
      - h: 常见误解
        p: 以为 Rollup 已经完全去中心化。多数 Rollup 的排序器仍是单一运营方，能决定交易顺序甚至暂停服务；升级多由多签或安全委员会控制；强制提现通道有的尚未开放。另一种误解是把「便宜」当成「安全」：费用低只说明数据与计算成本被摊薄，不说明信任假设更弱或更强，要看 ETHBEAT 阶段与具体组件。
      - h: 边界与代价
        p: Rollup 的代价是复杂性：跨层通信有延迟，退出要等挑战期或证明，桥合约与升级权限都是新的攻击面。L2 还要为 L1 数据付费，数据成本占运营成本的大头；排序器中心化会带来审查与 MEV 分配问题。不同 Rollup 之间并不互通，资产跨 L2 仍需桥，流动性被切分。「继承 L1 安全」是有条件的，条件写在它的证明系统、DA 方案与升级权限里。
    quiz:
      - q: Rollup 把交易搬到链下，为什么还说是安全的？
        a: 因为交易数据或有效性证明仍回到以太坊：数据可获取时任何人都能重算状态，错误结果会被挑战或证明推翻，安全性锚定在 L1 而非运营方。
      - q: 判断一条 L2 是否继承以太坊安全性，最该看什么？
        a: 看它的数据发布到哪里、证明系统能否独立运行、升级由谁控制、用户能否不依赖运营方强制退出；费用高低与出块速度不能说明这些。
    sources:
      - https://ethereum.org/en/developers/docs/scaling/

  - id: c210
    type: concept
    stage: 2
    order: 10
    title: Sequencer：L2 的排序器
    en: Sequencer
    minutes: 10
    tags: [l2, rollup]
    sections:
      - h: 一句话
        p: Sequencer（排序器）是 L2 上负责接收交易、排定顺序并打包出块的组件，目前多数由单一运营方运行，它给出的是「软确认」。
      - h: 为什么重要
        p: 用户感受到的「L2 很快」主要来自它：秒级确认和低费用都先由排序器承诺。它同时也是中心化风险点，可以审查交易、延迟、停机甚至重排以提取 MEV。判断一条 L2 是否可信，要看排序器中心化到什么程度、有没有强制交易入口让用户绕过它。
      - h: 核心机制
        p: 用户把交易发给排序器，排序器按自己的规则排序、执行、生成 L2 区块，并把结果与状态根定期提交到 L1。因为 L2 区块还没在 L1 上被证明或挑战，这个阶段的确认是可撤销的；真正的结算要等批次上 L1 并通过挑战或证明。排序器收入主要是 L2 交易费减去 L1 数据成本。去中心化排序器方案（共享排序、拍卖、强制包含）仍在演进，各链进度不同；排序器还能看到用户的待处理交易，这使它对 MEV 的获取能力远高于普通参与者。
      - h: 例子
        p: 你在 L2 上 swap，界面 1 秒显示成功，这是排序器给的软确认，资产已经在你 L2 账户里；但如果排序器宕机，你可能无法发新交易，只能等它恢复，或通过 L1 合约的强制交易入口提交。若你从不等待挑战期就「把 L2 上的余额当成已最终结算」，遇到排序器作恶或批次被推翻时就会吃亏——这也是为什么大额跨层转移要等挑战期。
      - h: 常见误解
        p: 以为排序器确认就不可逆。排序器给的只是软确认，真正结算要等批次提交到 L1 并完成挑战或证明；排序器作恶或宕机时，用户要靠 L1 的强制通道退出或强制交易。另一个误解是以为排序器只影响速度，实际上它决定交易顺序，直接影响谁被夹、谁先成交，MEV 分配和抗审查性都绕不开它。
      - h: 边界与代价
        p: 单一排序器实现简单、延迟低，代价是信任集中：它可以审查特定地址、优先自己的交易、在极端情况下暂停。多排序器或共享排序能缓解，但会引入协调开销与新的激励问题，且目前多数方案尚未在主网完整落地。排序器宕机不影响已上 L1 的资产安全，但会影响可用性；用户要清楚「这条 L2 现在能不能绕过排序器」，答案写在其桥合约与文档里；排序器地址与运营方信息通常公开，定期核对有助于判断集中度是否变化。
    quiz:
      - q: L2 上「已确认」的交易一定最终有效吗？
        a: 不一定。排序器给的只是软确认；真正的保障来自 L1 的数据可用与证明或挑战机制，必要时还得走 L1 的强制提现或强制交易入口。
      - q: 排序器中心化会带来哪些具体问题？
        a: 可以审查或延迟特定交易、决定交易顺序以提取 MEV、在故障时暂停服务；用户能否绕过它，取决于是否有可用的强制交易与强制退出通道。
    sources:
      - https://ethereum.org/en/developers/docs/scaling/optimistic-rollups/
  - id: c211
    type: concept
    stage: 2
    order: 11
    title: 数据可用性（DA）
    en: Data Availability
    minutes: 11
    tags: [l2, data]
    sections:
      - h: 一句话
        p: 数据可用性（DA，Data Availability）指「重算状态所需的交易数据是否真的对所有人公开可获取」，它是 L2 结果能被独立验证的前提，而不是指数据是否永久保存在链上。
      - h: 为什么重要
        p: 数据不公开，验证者就无法重算，运营方可以偷偷转走资产而没人能证明；DA 层的作用就是把数据发布出去，让任何人取得到。以太坊把「数据可用」与「数据执行」分开：L1 提供共识与数据空间，Rollup 负责执行。判断一条 L2 的安全假设，第一个该问的问题往往不是证明系统，而是数据到底放在哪里。
      - h: 核心机制
        p: 传统完整节点靠下载整个区块、检查数据确实存在来验证 DA，代价是带宽与存储。以太坊用 Blob 承载 Rollup 数据，Fusaka（2025-12-03）引入 PeerDAS（对等数据可用性采样，EIP-7594），让节点随机抽样部分数据列就能高概率确认整块数据可用；纠删码（erasure coding）把数据扩展编码，只要拿到足够多的分片就能重建原始数据。外部 DA 层（如 Celestia、EigenDA）则把数据发布到自己的网络，再把承诺交给 L1 或桥合约。
      - h: 例子
        p: 某 Rollup 把每批交易数据发到以太坊 Blob：即使运营方跑路，任何人也都能从 Blob 取回数据、重算完整状态并取走资产，前提是桥合约允许强制退出。若它只把数据放在自家服务器、L1 合约只接收状态根，运营方关掉服务器后就没人能重建状态，用户只剩对运营方或多签的信任。同样叫「Rollup」，这两种设计的安全性相差一个数量级。
      - h: 常见误解
        p: 把「数据上链」与「数据可用」混为一谈，也把「数据可用」与「数据永久保存」混为一谈。节点不必永久保存全部历史，但必须能在需要时取到数据；Blob 会在大约 18 天后被修剪，长期历史要靠归档节点或外部索引。另一个误解是以为 DA 只是成本优化，实际上它决定了「出问题时谁能为你的资产兜底」。
      - h: 边界与代价
        p: 把数据发到 L1 最安全，也最贵；发到外部 DA 层便宜，但把一部分安全性转移给了那层网络和它的桥接假设。采样与纠删码提高了可扩展性，也增加实现复杂度与新的失败模式。数据可用只保证「能取到」，不保证「内容正确」，正确性仍要靠执行层的证明或挑战。DA、执行、结算、排序是四件不同的事，不能互相替代。
    quiz:
      - q: 为什么 Rollup 一定要解决数据可用性？
        a: 因为验证者必须拿到交易数据才能重算状态。数据不可用时没人能证明运营方作恶，资产安全就退化成对运营方的信任。
      - q: 「数据可用」等于「数据永久保存」吗？
        a: 不等于。可用是指需要时能取到、能重算状态；Blob 数据约 18 天后会被修剪，长期历史需要 Rollup、归档节点或第三方另行保存。
      - q: 外部 DA 层的引入改变了什么？
        a: 把数据发布与可用性保证从以太坊转移到另一张网络，成本和吞吐更好，但增加了那层网络的验证者假设与桥接风险，安全性不再完全继承 L1。
    sources:
      - https://ethereum.org/en/developers/docs/data-availability/

  - id: c212
    type: concept
    stage: 2
    order: 12
    title: Blob：临时数据空间
    en: Blob
    minutes: 11
    tags: [ethereum, blob]
    sections:
      - h: 一句话
        p: Blob 是 EIP-4844 引入的大块临时数据空间，专供 Rollup 发布交易数据，价格由独立的 blob Gas 市场决定，内容不进入 EVM 执行。
      - h: 为什么重要
        p: 它把 L2 的数据成本从「按 calldata 永久存储」变成「按 blob 短期保存」，Dencun（2024-03-13）激活后 L2 费用明显下降。之后的扩容都在这一层叠加：Pectra（2025-05-07）把每块 blob 目标提高到 6、上限 9（EIP-7691），Fusaka（2025-12-03）用 PeerDAS 与 BPO 分叉继续扩容。理解 Blob 才能理解「L2 为什么便宜」「便宜到什么程度有上限」。
      - h: 核心机制
        p: Blob 附着在一笔交易上，由共识层保存，EVM 只能看到一个版本化哈希承诺，读不到原始数据。每个区块有 blob 目标值与上限，blob 费独立于普通 Gas 按供需调整：用量超过目标就上调，低于目标就下调。数据用 KZG 承诺绑定，配合纠删码与采样可以验证「数据确实发布过」而不必下载全部内容。因为不进入状态，Blob 不会造成执行层状态膨胀。
      - h: 例子
        p: 一个 Rollup 批次把数千笔交易压缩成几百 KB，拆成 3 个 blob 提交，只支付 blob 费和数据承诺的 Gas。同样这批数据如果作为 calldata 写入，要按字节付贵得多的费用，而且永久占用状态。若某一区块大家都来发 blob、用量超过目标 6 个，blob 费按公式上调，下一块就更贵——Rollup 的成本因此随全网需求波动。
      - h: 常见误解
        p: 以为 blob 数据永久可查。共识层会在约 4096 个 epoch（约 18 天）后修剪 blob，长期历史要靠 Rollup 自存或外部索引。以为合约能直接读 blob 内容也不对：EVM 只拿得到承诺，需要外部提供数据并验证。还有人以为 blob 只服务 Rollup，实际上任何协议都能用，只是主要用户确实是 Rollup。
      - h: 边界与代价
        p: Blob 降低了数据成本，但没有解决排序器中心化、证明系统成熟度和桥权限问题；它只是扩容拼图的一块。数据不永久意味着需要长期可验证历史的应用要自行归档。blob 市场也会拥堵，费用随需求上涨。以太坊的路线图还在继续扩展这一层（Fusaka 之后的 PeerDAS 与后续升级，具体时点以 ethereum.org/roadmap 为准）。
    quiz:
      - q: Blob 里的数据会永久保存在以太坊上吗？
        a: 不会。Blob 只在约 4096 个 epoch、约 18 天内保证可用，之后被修剪；需要长期保存的数据要由 Rollup 或第三方另行存档。
      - q: 为什么 Blob 能让 L2 变便宜？
        a: 因为 Blob 提供了单价更低的数据空间，且不进入执行层状态；Rollup 把大量交易压进少量 Blob，单笔分摊的数据成本因此大幅下降。
      - q: 智能合约能直接读取 Blob 里的原始数据吗？
        a: 不能。EVM 只能看到 Blob 的版本化哈希承诺，原始数据需要由外部提供并配合证明来验证，所以 Blob 主要作为数据发布层使用。
    sources:
      - https://eips.ethereum.org/EIPS/eip-4844

  - id: c213
    type: concept
    stage: 2
    order: 13
    title: 跨链桥
    en: Bridge
    minutes: 11
    tags: [bridge, security]
    sections:
      - h: 一句话
        p: 桥是把资产或消息从一条链搬到另一条链的机制，常见做法是「锁定—铸造」或「销毁—释放」，核心问题始终是「目标链上的凭证由谁担保」。
      - h: 为什么重要
        p: 链与链之间没有原生通信，所有跨链都要在一端锁定价值、在另一端生成凭证。桥的担保方式决定了它的安全边界：原生 Rollup 桥靠 L1 合约与证明，第三方桥常靠多签或轻客户端。历史上跨链桥是被盗金额最集中的类别，因为桥里锁着大量资产，且攻击一次就能凭空增发。选桥本质上是选信任模型。
      - h: 核心机制
        p: 资产桥的典型流程是：源链合约锁定资产，验证方确认锁定事件后，在目标链铸造等量凭证；反向操作时销毁凭证、解锁源链资产。验证方式分三类：外部验证（多签、MPC、预言机网络）、轻客户端验证（目标链能验证源链共识）、原生 Rollup 桥（由 L1 合约与证明保证）。此外还有流动性桥，用两边资金池直接兑换，不铸造新凭证，但依赖做市商与池子深度。桥还分资产桥与消息桥，前者搬运价值，后者传递指令，后者一旦被伪造，往往能触发目标链上的任意调用。
      - h: 例子
        p: 把 ETH 桥到一条侧链：如果桥由 5/9 多签控制，攻破其中 5 个私钥就能在目标链凭空铸造凭证，而源链资产仍被锁着，等于偷走整个池子。Rollup 原生桥则通过 L1 上的证明与提款流程转移资产，攻击面小得多，但提现要等挑战期。两种桥在界面上都叫「跨链」，安全假设完全不同。
      - h: 常见误解
        p: 以为桥只是「转账工具」。跨链后你在目标链拿到的通常是对源链资产的索取权，而不是原生资产本身；担保方跑路、多签被攻破、验证逻辑有 bug，都会让凭证变废纸。也有人以为「去中心化桥」没有信任假设，实际上任何桥都要有某种验证者或证明系统，只是分布程度不同。还有一种误解是以为「桥里 TVL 高就安全」，实际上 TVL 高只说明锁着的资产多，一旦验证环节被攻破，损失也更大。
      - h: 边界与代价
        p: 不存在无信任桥：跨链本质是在两条链之间复制状态，必然引入验证者、证明系统或流动性提供者。代价包括：额外的信任假设、提现延迟与费用、桥合约与升级权限的攻击面，以及跨链后资产在两条链上同时被使用的「双重记账」风险。中国内地虚拟货币相关业务活动一律禁止，相关安排以 2026-02-06 八部门 42 号文为准。
    quiz:
      - q: 用第三方桥跨链后，你在目标链拿到的是什么？
        a: 通常是桥发行的索取权凭证，而不是原生资产本身；能否兑回取决于担保方式，是多签、轻客户端还是流动性池，是否可靠要看具体设计。
      - q: 为什么多签桥的安全上限等于多签阈值？
        a: 因为验证完全依赖这组私钥的签名，攻破达到阈值的私钥就能伪造跨链消息、凭空铸造凭证；多签人数再多也不改变这个结构。
    sources:
      - https://ethereum.org/en/developers/docs/bridges/

  - id: c214
    type: concept
    stage: 2
    order: 14
    title: 稳定币
    en: Stablecoin
    minutes: 11
    tags: [stablecoin]
    sections:
      - h: 一句话
        p: 稳定币是试图把价格锚定到法币（多数是美元）的代币，靠法币储备、加密资产超额抵押或算法调节来维持锚定，锚定是目标而不是保证。
      - h: 为什么重要
        p: 它是链上交易的计价单位和 DeFi 的底层抵押品：借贷、做市、清算都大量使用稳定币计价。锚定机制决定风险来源——储备型看托管与透明度，抵押型看抵押率与清算，算法型看信心能否自我维持。同叫「稳定币」，风险结构可能完全不同，2022 年 UST 归零与 2023 年 USDC 短暂脱锚就是两种机制的分水岭。
      - h: 核心机制
        p: 法币储备型由发行方持有现金与短期国债等资产，承诺按 1 比 1 赎回，靠托管、审计披露和赎回通道维持信心。加密超额抵押型把 ETH 等资产锁进合约，超额抵押后发行稳定币，价格下跌时靠清算保持偿付能力。算法型用铸赎与套利调节供应：价格高于锚定就鼓励增发、低于就鼓励回购，但没有真实资产兜底时，机制依赖新资金和信心，容易形成反身性螺旋。收益型稳定币则把储备资产的利息部分传导给持有人。
      - h: 例子
        p: 2023 年 3 月硅谷银行倒闭，USDC 发行方披露有约 33 亿美元储备存在该行，周末 USDC 一度跌到约 0.87 美元；美国监管机构接管并保障存款后回锚。而 UST 在 2022 年 5 月脱锚后没有真实资产兜底，铸赎与套利机制反转成挤兑，最终归零。同样是「脱锚」，一个有可验证的资产、一个只有机制，结局不同。
      - h: 常见误解
        p: 以为「锚定 1 美元」等于「有 1 美元」。算法稳定币可以完全没有等额储备；储备型也要看储备构成、托管地点、赎回门槛与审计口径，而不是看名字和宣传。另一个误解是把市值当成储备规模：市值是流通量乘价格，和发行方实际持有多少资产是两回事。
      - h: 边界与代价
        p: 稳定币的稳定依赖发行方、托管银行、监管环境与市场流动性，任何一环出问题都可能脱锚；储备资产的信用与期限错配也是风险。算法型在极端行情下可能失去锚定且无法恢复。合规风险同样真实：中国内地虚拟货币相关业务活动一律禁止，RWA 代币化按分类监管，以 2026-02-06 八部门 42 号文为准。本文只讲机制，不构成任何持有或使用建议。
    quiz:
      - q: 稳定币价格稳定，就说明它有足额储备吗？
        a: 不能这么推。价格靠机制维持：算法型靠套利与信心，抵押型靠超额抵押；稳定是结果，足额储备只是其中一种实现方式。
      - q: 法币储备型稳定币最该关注哪三件事？
        a: 储备资产构成与质量、托管在哪里、赎回通道是否顺畅可验证；再加上发行方披露频率与审计口径，才能判断锚定是否有真实资产支撑。
      - q: 加密超额抵押型稳定币为什么需要清算？
        a: 因为抵押物价格会下跌，抵押率跌破阈值时若不及时清算，稳定币就会变成资不抵债；清算是维持 1 比 1 兑付能力的最后防线。
    sources:
      - https://ethereum.org/en/stablecoins/

  - id: c215
    type: concept
    stage: 2
    order: 15
    title: 脱锚
    en: Depeg
    minutes: 10
    tags: [stablecoin, risk]
    sections:
      - h: 一句话
        p: 脱锚（depeg）是稳定币的市场价格偏离目标锚定的现象，通常由储备疑虑、挤兑、流动性枯竭或机制失效触发，偏离幅度与持续时间反映市场对兑付能力的判断。
      - h: 为什么重要
        p: 它是稳定币风险的可见信号，也是 DeFi 连锁反应的起点：稳定币在借贷协议里是主要抵押品，脱锚会推高清算、压低抵押率，甚至让以稳定币计价的池子失衡。观察脱锚的触发原因和恢复条件，比记住某次跌到多少更有用——那决定了它是流动性事件还是偿付能力事件。
      - h: 核心机制
        p: 典型路径是：负面消息出现，持有人争相赎回或卖出，做市商撤走报价、流动性变薄，价格偏离锚定；此时若铸赎通道开放且储备充足，套利者会低价买入并赎回套利，把价格拉回。若赎回受限、储备不透明或资产真实亏损，套利无法闭合，折价就会持续甚至扩大。预言机若仍报 1 美元，借贷协议会按错误价格清算；若报市价，则会触发抵押品价值下跌的连锁清算。不同协议的预言机更新频率与偏差阈值不同，这决定了脱锚时清算会被延迟还是被放大。
      - h: 例子
        p: 2023 年 3 月 USDC 因硅谷银行敞口跌到约 0.87 美元，属于「托管疑虑」：储备资产仍在，只是短期不确定能否取出，澄清并获兜底后回锚。2022 年 5 月 UST 脱锚属于「机制失效」：储备不足以承接赎回，抛售压低价格又进一步削弱信心，形成死亡螺旋。两种脱锚在图表上都是价格下跌，但一个可修复、一个不可修复。从链上看，前者对应储备资产仍在、但流动性溢价飙升；后者对应储备被抽干、供应量崩塌。
      - h: 常见误解
        p: 以为短暂脱锚必然恢复，或必然崩盘。储备型在托管疑虑澄清后常回锚，但若储备真实亏损也可能长期折价；算法型一旦进入死亡螺旋就很难逆转。还有人把「市价回到 1 美元」当成风险解除，实际上若赎回通道关闭，账面价格和可兑付价值可能仍然分离。判断时要同时看市价、赎回状态与储备披露，三者缺一不可。
      - h: 边界与代价
        p: 脱锚可以是几分钟的流动性事件，也可以是持续数月的信用折价；判断要看发行方披露、赎回记录、储备托管与监管环境，而不是只看价格曲线。数据只能说明发生过什么，不能预测下一次。本文只做机制分析，不构成任何交易或配置建议；中国内地虚拟货币相关业务活动一律禁止，以 2026-02-06 八部门 42 号文为准。
    quiz:
      - q: 稳定币短暂脱锚后一定会回锚吗？
        a: 不一定。储备型若只是流动性或托管疑虑，澄清后可以回锚；若储备真实亏损，或机制本身依赖新资金进场，脱锚会演变成挤兑甚至归零。
      - q: 同样是脱锚，怎么区分「流动性事件」和「偿付能力事件」？
        a: 看储备资产是否真实存在、赎回通道是否开放、套利能否闭合。资产在、通道通、只是暂时卖压，偏流动性；资产亏损或赎回受限，偏偿付能力，恢复难度大得多。
    sources:
      - https://defillama.com

  - id: c216
    type: concept
    stage: 2
    order: 16
    title: AMM：自动做市商
    en: Automated Market Maker
    minutes: 11
    tags: [defi, amm]
    sections:
      - h: 一句话
        p: AMM（Automated Market Maker，自动做市商）用数学公式代替订单簿报价，最经典的是恒定乘积 x·y=k，价格由池中两种资产的比例决定，任何人随时可以按公式成交。
      - h: 为什么重要
        p: 它让交易不再需要对手方挂单，也让任何人都能把资产放进池子做市、赚取手续费。这是 DeFi 最基础的组件：兑换、借贷清算、稳定币兑换都建立在 AMM 或其变体上。同时它把「做市」的风险显性化：价格偏移带来滑点，价格变动带来无常损失，池子深度决定大额交易的成交价。
      - h: 核心机制
        p: 恒定乘积池保持 x·y=k 不变，买走 A 会让 A 减少、B 增加，价格沿曲线滑动；瞬时价格是 y/x，但成交价是这一段曲线的平均价，交易越大偏离越多。流动性提供者（LP）按份额存入两种资产，获得代表份额的凭证，手续费按份额累积进池子，k 因此缓慢增长。变体包括稳定币专用曲线（把价格集中在 1 附近）、集中流动性（把资金集中在某价格区间）和加权池。不同公式对价格区间的假设不同：恒定乘积适合波动大的资产，稳定币曲线适合价格接近 1 的交易对。
      - h: 例子
        p: 池中有 100 A 和 100 B，初始价格 1。有人用 10 B 换 A，解 (100+10)×(100−ΔA)=10000，得到 ΔA≈9.09，平均成交价约 1.1，滑点接近 10%。如果池子是 10000 A 与 10000 B，同样 10 B 的交易只换来约 9.99 A，滑点约 0.1%——池子深度直接决定大额交易的成本。
      - h: 常见误解
        p: 以为池子里的价格就是「市场价」。池子报价完全由储备比例决定，可能明显偏离其它市场，套利者正是靠这个价差把价格拉回去。另一个误解是以为做市必然赚钱：手续费要覆盖无常损失、被夹风险和智能合约风险，行情剧烈时 LP 可能跑输「什么都不做」。
      - h: 边界与代价
        p: AMM 的代价是滑点、无常损失和 MEV 暴露：大额交易可被三明治攻击，公开内存池里的交易会被抢跑。用池子现货价当预言机的协议极易被操纵，因为一笔大额交易就能临时改变比例。集中流动性提高了资本效率，也让区间失效后的收益骤降。AMM 只负责定价与撮合，不保证流动性质量，更不保证做市盈利。理解一条池子的曲线与费率，比记住它的年化数字更重要。
    quiz:
      - q: AMM 池子里的价格是谁定的？
        a: 由池中两种资产的储备比例决定，例如 x·y=k 时价格约为 y/x，不是某个做市商挂的单；与外部市场的价差由套利者交易来收敛。
      - q: 为什么大额交易在 AMM 里成交价更差？
        a: 因为价格沿曲线滑动，交易越大、池中比例变化越大，平均成交价偏离初始报价越多，这个差额就是滑点；池子越浅越明显。
    sources:
      - https://ethereum.org/en/defi/
  - id: c217
    type: concept
    stage: 2
    order: 17
    title: 无常损失
    en: Impermanent Loss
    minutes: 11
    tags: [defi, amm]
    sections:
      - h: 一句话
        p: 无常损失（impermanent loss，IL）是「把钱放进 AMM 池」相对「一直持有这两种资产」的差额，来自池子在价格变动时被套利者动高卖低买的再平衡。
      - h: 为什么重要
        p: 它决定做市是否划算，也是 LP 最常低估的成本：手续费收入要先覆盖无常损失，剩下的才是净收益。价格变动越大，损失越大；只有价格回到入池时的比例，这部分损失才基本消失，「无常」指的就是这种未实现状态。理解它，才能看懂为什么高 APR 的池子不一定赚钱。
      - h: 核心机制
        p: 池子始终维持固定公式，当外部价格变化时，套利者会买入池中变便宜的资产、卖出变贵的资产，直到池内价格与市场一致。这个过程让 LP 被动地在上涨时卖出、下跌时买入，组合价值因此偏离「什么都不做」。对恒定乘积池，价格变动为原来的 n 倍时，相对持有两种资产的损失约为 1 − 2√n/(1+n)：n=2 时约 5.7%，n=4 时约 20%。手续费与流动性激励会增加 LP 的资产，可能覆盖这部分差额。
      - h: 例子
        p: 你在池中放入价值 1000 美元的 ETH 与 USDC 各半。ETH 相对 USDC 涨到 2 倍，如果一直持有，组合价值约 1500 美元；在恒定乘积池里约 1414 美元，差额约 86 美元，即约 5.7%。涨到 4 倍时，持有约 2500 美元，池中约 2000 美元，差额 500 美元，即 20%。这段时间累计的手续费如果超过差额，做市才是净赚的。
      - h: 常见误解
        p: 以为只有亏钱才叫无常损失。它是相对「不动」的机会成本，单边上涨时少赚的部分同样算损失，此时账户里的绝对金额可能还在增加。也有人以为「无常」意味着一定会回来——只有价格回到入池比例才回来，而一旦你撤出池子，损失就变成现实的。把年化手续费率直接当成收益率，同样忽略了无常损失与激励结束后的变化。
      - h: 边界与代价
        p: 单边行情中损失最大，横盘或价格回到原点时损失最小；稳定币之间波动小，损失也小。集中流动性把资金压在一个价格区间，资本效率更高，但区间被突破后的无常损失与失效风险更大。无常损失是机会成本而不是账面亏损，实际决策还要考虑手续费、激励、被夹风险与合约风险。任何收益率数字都不构成参与建议。
    quiz:
      - q: 币价涨了，做市就一定赚吗？
        a: 不一定。相比一直持有，做市在单边行情里会少赚，也就是无常损失，要靠手续费覆盖；只有价格回到入池水平，这部分损失才基本消失。
      - q: 价格变动到 2 倍时，恒定乘积池的无常损失大约是多少？
        a: 约 5.7%。公式为 1 − 2√n/(1+n)，n 为价格倍数；n=2 时约 5.7%，n=4 时约 20%，变动越大损失越大。
      - q: 「无常损失」里的「无常」是什么意思？
        a: 指损失在价格回到入池比例前只是账面上的相对差额，尚未实现；一旦撤出池子或价格长期偏离，损失就变成现实的。
    sources:
      - https://ethereum.org/en/defi/

  - id: c218
    type: concept
    stage: 2
    order: 18
    title: TVL：总锁仓价值
    en: Total Value Locked
    minutes: 10
    tags: [defi, data]
    sections:
      - h: 一句话
        p: TVL（Total Value Locked，总锁仓价值）是协议合约里被锁定的资产按当前价格折算出的总额，是 DeFi 最常用的规模指标。
      - h: 为什么重要
        p: 它衡量协议体量与流动性深度，也是比较不同协议、不同链的通用口径。但 TVL 是「数量乘价格」的结果，会被币价波动放大：币价下跌时 TVL 自动缩水，即使没有任何人撤资。把它当成安全性评分或资金流入指标，是最常见的误用，也正是很多叙事失真的来源。
      - h: 核心机制
        p: 计算方式是把合约里每种资产的数量乘以对应价格再加总。难点在口径：借贷协议里存款和借款怎么算、同一笔资产通过循环抵押在多个协议出现怎么去重、AMM 池中两种资产是否都计入、跨链资产按哪条链计价。不同数据平台对这些问题的处理并不一致，同一协议在不同网站的 TVL 可能相差不少。DefiLlama 等平台会标注是否包含重复计算、是否调整流动性激励。
      - h: 例子
        p: 某借贷协议显示 10 亿美元 TVL，其中 6 亿是存款、4 亿是借款；如果把这 4 亿又存进另一个协议再借出，同一笔资金会被重复计入多次，各平台加总后就会出现「DeFi 总 TVL 大于链上真实资产」的现象。再比如币价腰斩时，一个只持有 ETH 的协议 TVL 会自动减半，但用户数和仓位都没变——这不是资金流出。所以比较两个月的 TVL 变化时，要先把价格因素拆掉，再看币本位数量有没有变化。
      - h: 常见误解
        p: 以为 TVL 越高就越安全。TVL 可能被循环抵押重复计算，可能被代币补贴「租赁」来的临时资金撑大，也可能只是币价涨出来的。以为 TVL 增长就代表新资金流入，同样不对：币价上涨、新协议计入、统计口径变化都会推高它。用 TVL 给协议排序，等于把规模当成了安全性。
      - h: 边界与代价
        p: TVL 适合看趋势、体量与流动性深度，不适合当安全评分；要结合净流入、资产构成、锁仓期限与激励可持续性一起看。数据本身也有延迟和口径差异，跨平台比较时要确认统计范围。TVL 不反映杠杆、坏账、合约权限和治理风险——这些恰恰决定资金能否取回。把 TVL 当作「锁仓规模」而不是「安全预算」，是使用这个指标的基本纪律。
    quiz:
      - q: TVL 增长一定代表有新资金流入吗？
        a: 不一定。TVL 按币价折算，价格上涨会推高 TVL；还有循环抵押导致的重复计算，和挖矿补贴带来的临时资金，要看净流入与资产构成。
      - q: 为什么不同平台显示的同一协议 TVL 会不一样？
        a: 因为统计口径不同：是否去重循环抵押、存款与借款如何计入、流动性激励是否调整、跨链资产按哪条链计价，都会导致数字差异。
    sources:
      - https://defillama.com

  - id: c219
    type: concept
    stage: 2
    order: 19
    title: 链上借贷
    en: Lending
    minutes: 11
    tags: [defi, lending]
    sections:
      - h: 一句话
        p: 链上借贷是超额抵押的：先存入资产做抵押，再借出另一种资产，可借额度由抵押率与预言机价格共同决定，利率由资金利用率决定。
      - h: 为什么重要
        p: 没有身份与信用评分，协议无法判断谁会还钱，只能用超额抵押加自动清算控制风险。这套设计让借贷可以完全由代码执行，也让利率随供需实时变化，成为 DeFi 的「信用层」：做市、杠杆、稳定币发行都依赖它。理解抵押率、健康因子与清算阈值，才能理解链上杠杆的风险结构。
      - h: 核心机制
        p: 存入资产获得利息，借出资产支付利息。可借额度等于抵押物价值乘以抵押率（LTV）；当抵押物价值下跌、债务相对抵押物上升，健康因子（抵押物价值×清算阈值÷债务）跌破 1 时，任何人都能触发清算。利率由资金利用率 U＝借款÷存款决定：U 越高利率越高，激励更多存款、抑制借款；多数协议在利用率接近 100% 时设置陡峭的「拐点」利率，防止流动性被抽干。存款人赚利息，协议抽取一部分作为储备金。
      - h: 例子
        p: 抵押价值 1000 美元的 ETH，抵押率 80%，最多借 800 美元。若 ETH 跌到 900 美元，可借额度降到 720 美元，低于 800 美元债务，健康因子小于 1，清算启动；如果清算阈值是 85%，则要跌到约 941 美元以下才会触发。LTV 与清算阈值之间的差额就是安全垫，也是协议留给清算人的缓冲。
      - h: 常见误解
        p: 以为抵押率只是「能借多少」。它同时是风险缓冲：抵押物价格下跌会推高债务与抵押之比，触及阈值就自动清算，而不是等到还款到期。也有人以为利率是固定的——利率由资金利用率实时决定，池子被借空时会飙升。还有人把「清算」当成协议违约，实际上清算正是协议在借款人无法还款时保护存款人的常规操作。
      - h: 边界与代价
        p: 链上借贷依赖预言机：价格更新滞后会清算不及时，价格被操纵会错误清算。极端行情下清算交易拥堵、抵押物流动性枯竭，可能留下坏账。清算罚金会加速小仓位被清掉，杠杆用户可能损失全部抵押。利率在流动性紧张时会飙升，借款成本不可预测。闪电贷可以无抵押借出并在同一交易内归还，常被用于套利，也常被用于攻击有漏洞的协议。
    quiz:
      - q: 链上借贷为什么几乎都要求超额抵押？
        a: 因为无法验证借款人身份与还款意愿，只能用抵押物覆盖违约风险；抵押物价值一旦跌破阈值，协议就自动清算，保证存款人取回资金。
      - q: 借款利率为什么会随资金利用率变化？
        a: 利率是调节供需的价格：借得多、池子剩余流动性少时提高利率，既抑制借款又吸引存款；利用率接近上限时曲线变陡，防止池子被借空。
      - q: 健康因子小于 1 意味着什么？
        a: 意味着按当前价格，抵押物已经不足以覆盖清算阈值下的债务，任何人都可触发清算；清算人代还债务并折价拿走抵押物，存款人因此避免坏账。
    sources:
      - https://ethereum.org/en/defi/

  - id: c220
    type: concept
    stage: 2
    order: 20
    title: 清算
    en: Liquidation
    minutes: 11
    tags: [defi, risk]
    sections:
      - h: 一句话
        p: 清算是抵押物价值跌破安全线时，允许他人代为偿还债务、并按折价拿走抵押物的过程，它是链上借贷协议的兜底机制。
      - h: 为什么重要
        p: 借款人不会主动补仓，协议只能靠外部激励维持偿付能力：清算人赚清算罚金，存款人因此避免坏账。但清算不是万能的，行情剧烈波动时清算会拥堵、预言机可能滞后，容易形成连环清算；清算罚金与折价卖出又会进一步压低价格，把风险传导到其它仓位。
      - h: 核心机制
        p: 健康因子跌破 1 后，清算人可代还部分债务（受 close factor 限制，通常一次只能还一部分），并接收相应抵押物。抵押物按预言机价格折算，再给清算人一定比例的清算罚金（liquidation bonus），这就是清算人的利润来源。不同协议用不同方式处理抵押物：有的直接把抵押物转给清算人，有的通过拍卖或稳定币模块吸收。若清算后仍资不抵债，就形成坏账，由协议金库或存款人承担。清算参数（阈值、罚金、close factor）是安全与效率的权衡。
      - h: 例子
        p: 2020 年 3 月 12 日 ETH 单日暴跌，链上拥堵导致清算拍卖无人及时出价，出现零竞价赢得抵押物的情况，协议留下坏账，最终通过拍卖治理代币弥补缺口。这次事件推动了清算机制改进：引入更多抵押品类型、用稳定币拍卖、调整拍卖参数，也给所有借贷协议留下一个教训——清算依赖网络可用性和流动性，极端行情下两者都会消失。此后不少协议增加了清算缓冲、提高清算激励，并用更稳健的预言机来降低同类风险。
      - h: 常见误解
        p: 以为清算只和借款人自己有关。清算会折价卖出抵押物，进一步压低价格，影响其它借款人；出现坏账时损失由存款人或协议承担。也有人以为清算人一定赚钱：清算交易本身要付 Gas、可能被抢跑，抵押物折价后不一定能立即变现；在极端行情里，清算人也会亏。
      - h: 边界与代价
        p: 清算机制依赖三个前提：预言机价格准确、网络足够畅通、抵押物有流动性。任何一个失效，都会让清算来不及或拍不出价格。清算不是惩罚借款人，而是保护存款人；但清算罚金会让高杠杆用户损失惨重，这点必须在借之前算清楚。参数越保守，坏账越少，但借款体验越差。本文只讲机制，不构成任何借贷或杠杆操作指引。清算参数是否合理，可以通过极端行情下的历史表现来检验，而不是看白皮书里的描述。
    quiz:
      - q: 清算对存款人是好事还是坏事？
        a: 通常是保护：及时清算能避免坏账，存款人得以取回资金；但清算过慢或拍卖无人接盘就会留下坏账，损失最终由存款人或协议金库承担。
      - q: 清算人靠什么赚钱，又承担什么风险？
        a: 靠清算罚金，即代还债务后按折价获得抵押物的差额；风险是 Gas 成本、被抢跑、抵押物难以变现，以及极端行情下折价后仍亏。
    sources:
      - https://ethereum.org/en/defi/
  # ---------- 理论课 t201–t212 ----------
  - id: t201
    type: theory
    stage: 2
    order: 1
    title: 以太坊交易的生命周期
    minutes: 13
    tags: [ethereum, transaction]
    sections:
      - h: 核心机制
        p: 一笔以太坊交易从钱包签名开始，经历广播、进入内存池（mempool）、被出块者打包、EVM 执行，最后等共识层最终确定。这五步中任何一步都可能出问题，而失败发生在哪一步，后果完全不同：没广播出去就不扣费，广播了但没被打包就一直排队，打包了但执行回滚就扣 Gas 且 nonce 前进。
      - h: 关键细节
        p: 签名内容包含 nonce、chainId、收款地址、金额、data、Gas 参数；chainId 用于防止在别的链上重放签名。EIP-1559 之后交易声明 max fee 与 max priority fee，实际支付 base fee 加小费，预扣多余部分退还。Gas limit 是计算上限，用完仍未结束就回滚。上链后区块进入后续检查点，约两个 epoch（约 12.8 分钟）后才最终确定，期间仍可能因重组改变位置。
      - h: 例子
        p: 在钱包点「发送」：本地取 nonce=5，估算 Gas limit 21000，设 max fee 30 gwei、小费 2 gwei；签名后广播到 RPC 节点，节点校验余额和 nonce 后放进内存池；出块者按单价优先挑选，把它打进区块 N；区块 N 及其后续检查点被足够多验证者投票后最终确定。若 RPC 节点没把它转发出去，钱包显示的「已发送」只是本地状态，链上什么也不会发生。
      - h: 对比或演进
        p: 早期交易只有 gasPrice 一个价格字段；伦敦升级后有了 EIP-1559 交易类型，费用可分拆、base fee 可预测；之后又加入 access list 类型与 EIP-7702 的委托类型。L2 上的生命周期更短：交易先由排序器给出软确认，再批量提交到 L1，因此「秒级确认」和「最终结算」之间的距离被拉得更长，跨层操作要按最慢的那一步安排。
      - h: 代价与边界
        p: 交易生命周期的每一段都有不确定性：内存池是公开的，交易可能被抢跑；出块者可以延迟或重排；RPC 节点可能宕机或作恶，返回的 pending 状态不一定真实。重组虽然罕见，但对大额到账要按最终确定时间安排。钱包里的「成功」通常指已被某个区块包含，不等于已最终确定，也不等于对方已经能安全使用这笔钱。
      - h: 常见误读
        p: 最常见的误读是把「pending」当成已成功，或把「失败」当成没上链。交易失败但扣了手续费，说明它已上链、EVM 执行回滚，nonce 和 Gas 都消耗了；交易一直不出现，可能是根本没广播成功、被替换或 RPC 没有转发。还有人以为提高 Gas limit 就能加速，实际上加速靠提高单价，limit 只影响失败与否。
    quiz:
      - q: 钱包显示交易失败，为什么 Gas 还是被扣了？
        a: 因为交易已被打包上链，EVM 执行到 revert，但打包和计算已经消耗资源，所以 Gas 照收；真正没上链的交易才不收费。
      - q: 「已被区块包含」和「最终确定」有什么区别？
        a: 被包含只表示进入了当前链的某个区块，仍可能因重组改变位置；最终确定要等约两个 epoch 的检查点投票完成，约 12.8 分钟后回滚成本极高。
      - q: 交易卡在 pending，可能的原因有哪些？
        a: Gas 单价偏低排不上队、nonce 出现缺口被后面交易堵住、RPC 节点没有真正广播，或者交易被同 nonce 的替换交易顶掉。
    sources:
      - https://ethereum.org/en/developers/docs/transactions/

  - id: t202
    type: theory
    stage: 2
    order: 2
    title: EIP-1559 与费用市场
    minutes: 13
    tags: [ethereum, gas]
    sections:
      - h: 核心机制
        p: EIP-1559 在 2021 年 8 月随伦敦升级激活，把手续费拆成两部分：base fee 由协议根据区块拥堵自动调整并直接销毁，priority fee（小费）由用户自设、付给打包的验证者。区块空间从「拍卖出价」变成「基础价 + 小费」，用户不必再猜一个统一 Gas 价格。
      - h: 关键细节
        p: 每个区块有 Gas 目标值，约为上限的一半。实际用量高于目标时 base fee 上调，单块最多加 12.5%；低于目标则下调，同样有上限。用户签名时设 max fee（愿付单价上限）和 max priority fee，实际支付是 base fee 加小费，不超过 max fee；预扣的差额会退还。销毁让拥堵时 ETH 供应收缩，也避免打包者独吞全部费用。
      - h: 例子
        p: 区块被打满，用量是目标的两倍，下一块 base fee 上涨 12.5%，从 20 gwei 变成 22.5 gwei；若连续多块打满，会逐块复利上涨。用户设 max fee 30 gwei、小费 2 gwei，当 base fee 为 22.5 gwei 时实际支付 24.5 gwei；若 base fee 涨到 31 gwei，超过 max fee，交易就暂时打不进块，只能等 base fee 回落或重发。
      - h: 对比或演进
        p: 旧模式下 gasPrice 同时是出价和支付价，用户很难判断该给多少；1559 把「协议定的基础价」与「给打包者的激励」分开，报价更可预测。同样的机制后来被用到 Blob 上，形成独立的 blob 费用市场：两套 base fee 各自调节，互不干扰。L2 的费用结构也分 L1 数据成本与 L2 执行成本两层，拥堵时两层会同时上涨。
      - h: 代价与边界
        p: 它没有降低费用总额，只是让报价可预测、把 base fee 销毁；拥堵时照样贵，真正降费要靠 L2 扩容而不是继续改公式。base fee 的调整有滞后，剧烈波动时用户仍会遇到「设低了打不进、设高了多付」的两难。销毁机制让 ETH 供应在活跃期收缩，但这不是价格机制，不能用来推断任何价格走势。
      - h: 常见误读
        p: 以为 1559 之后手续费都给了验证者——base fee 被销毁，只有小费归打包者。以为 1559 降低了手续费——它改变的是收费结构，不改变区块空间的稀缺性。还有人以为「base fee 是基金会收的」，实际上它没有任何接收方，直接从流通中移除。
    quiz:
      - q: EIP-1559 之后，手续费都给了验证者吗？
        a: 不是。base fee 被协议销毁，只有 priority fee 作为小费给打包的验证者；所以拥堵时 ETH 会因销毁而减少供应。
      - q: 为什么区块用量超过目标时，下一块会更贵？
        a: 因为 base fee 按规则自动上调，单块最多加 12.5%；用量持续高于目标就会逐块复利上涨，直到需求回落到目标附近。
      - q: 用户设置了 max fee，为什么交易仍可能打不进区块？
        a: 因为 base fee 可能涨到超过 max fee，交易在费用上不合格，出块者不会打包；只能等 base fee 回落，或用更高 max fee 重发替换交易。
    sources:
      - https://eips.ethereum.org/EIPS/eip-1559

  - id: t203
    type: theory
    stage: 2
    order: 4
    title: 以太坊 PoS 与最终性
    minutes: 13
    tags: [ethereum, pos]
    sections:
      - h: 核心机制
        p: 合并（The Merge，2022-09-15）之后以太坊改用权益证明（PoS）：验证者质押 32 ETH，按 slot（12 秒）轮流出块，按 epoch（32 个 slot，约 6.4 分钟）投票形成检查点。区块被提出后不是立刻不可逆，要等检查点被足够多验证者投票「最终确定」，才真正难以回滚。
      - h: 关键细节
        p: Casper FFG 让两个连续 epoch 的检查点获得超过三分之二质押权重投票后被最终确定，因此从打包到最终确定约两个 epoch，即约 12.8 分钟。超过三分之一验证者离线时，链仍能出块但停止最终确定；离线比例越高，空 slot 越多，最终性恢复也越慢。罚没只针对可证明的恶意行为，例如同一高度双重签名；单纯离线只是缓慢扣钱。退出质押要排队，入口和出口都有速率限制。
      - h: 例子
        p: 一笔交易在 12 秒内被打包，只是「已上链」，仍有小概率因重组改变位置；等到两个 epoch 后检查点最终确定，回滚需要销毁大量质押，成本高到不现实。交易所给不同资产设不同确认数，本质就是把这个风险量化：金额越大，越应该等到最终确定再视为到账。跨链桥也常以最终确定作为释放资产的条件。
      - h: 对比或演进
        p: 工作量证明下「确认数」是概率性的，越多确认越难回滚；PoS 的最终性是一道明确的边界，越过之后协议层面保证不会回滚，除非发生远超三分之一质押被罚没的极端事件。合并把能耗降低约 99.95%，但安全模型从「算力贵」变成「质押贵」，攻击成本和质押分布、客户端多样性绑定在一起。Pectra 之后单个验证者有效余额上限提高到 2048 ETH，节点结构也在演变。
      - h: 代价与边界
        p: 代价是资本锁定与活跃性依赖：质押的 ETH 在退出完成前不能动用，大量验证者离线会让最终性停摆。安全以「三分之二诚实」为前提，质押集中到少数运营方会削弱这个前提的实际意义。最终性保护的是共识层，不保护智能合约漏洞、私钥被盗或桥的设计缺陷；这些风险与最终性无关。
      - h: 常见误读
        p: 以为交易被打包就等于最终确定，实际上重组窗口仍然存在。以为 PoS 没有成本，实际上质押资金被锁定、机会成本与运维成本都在。以为验证者可以随意改余额，实际上执行结果由 EVM 规则决定，验证者只能选择包含、排序或拒绝，作恶会被罚没并留下证据。
    quiz:
      - q: 交易被打包进区块，就等于最终确定了吗？
        a: 不等于。打包只是进入当前链，重组仍可能发生；要等两个 epoch 的检查点被最终确定，约 12.8 分钟后回滚成本才高到几乎不可能。
      - q: 超过三分之一验证者离线会发生什么？
        a: 链仍能继续出块，但无法达到三分之二投票，检查点不再被最终确定，最终性停摆；等离线比例回落后才会恢复，期间已上链交易仍可正常执行。
    sources:
      - https://ethereum.org/en/developers/docs/consensus-mechanisms/pos/

  - id: t204
    type: theory
    stage: 2
    order: 6
    title: Rollup：乐观还是零知识
    minutes: 14
    tags: [l2, rollup]
    sections:
      - h: 核心机制
        p: 两种 Rollup 都把执行搬到 L2、把数据发回 L1，区别在于「如何让 L1 相信结果正确」：Optimistic Rollup 先假定批次正确，留出挑战期让人提交欺诈证明；ZK Rollup 在提交批次时附带有效性证明，L1 直接验证数学证明，不需要等待。
      - h: 关键细节
        p: Optimistic Rollup 的挑战窗口通常是 7 天，提现到 L1 要等窗口结束，或由第三方快速桥垫资（把等待期风险转给桥）。ZK Rollup 提交的是 validity proof，数学上可立即验证，但证明生成昂贵、通用 EVM 兼容更难，证明系统的实现复杂度本身也是风险。两者都要把数据发回 L1（或外部 DA 层），否则用户无法重算状态；也都依赖排序器给出快速软确认。
      - h: 例子
        p: 同样从 L2 提现到主网：Optimistic 方案要等约 7 天挑战期，期间资金在 L1 桥合约里锁定；ZK 方案在证明上链后即可确认，通常几小时到一天内完成，但证明生成需要算力，批量提交的成本结构也不同。若你用第三方快速桥，Optimistic 的等待被「买断」，代价是承担桥运营方的信用风险。
      - h: 对比或演进
        p: Optimistic 路线生态成熟、EVM 兼容度高、开发迁移成本低；ZK 路线在最终性速度与证明可验证性上有优势，随着 zkEVM 成熟，兼容性差距在缩小。此外还有 validium（数据放链下）、based rollup（排序交给 L1）等变体，它们改变的是 DA 或排序假设，而不只是证明类型。判断一条 L2 不能只看「Optimistic 还是 ZK」，还要看数据、排序、升级权限。
      - h: 代价与边界
        p: Optimistic 的代价是提现延迟与挑战期内的不确定性；挑战机制依赖有人真的去验证，若无人监控，错误结果可能被接受。ZK 的代价是证明成本、证明系统与可信设置、以及「证明正确不等于代码无 bug」。两者都不是无条件安全：排序器可以审查交易，升级多由多签控制，DA 方案决定用户能否独立恢复状态。
      - h: 常见误读
        p: 以为「ZK 更快」意味着日常交易更快——日常两者都是秒级软确认，速度差异主要在最终性。以为 Optimistic 不安全——它依赖至少一个诚实验证者提交欺诈证明，这个假设在有人监控时成立。以为 ZK 就完全去信任——证明系统、电路实现、升级权限都可能是薄弱环节。
    quiz:
      - q: Optimistic Rollup 提现为什么要等约 7 天？
        a: 因为它先假定批次正确，留出挑战期让人提交欺诈证明；窗口结束前 L1 无法确定这批交易不会被推翻，所以提现要等待。
      - q: ZK Rollup 的「有效性证明」解决了什么问题？
        a: 它让 L1 无需重放交易就能确认状态转换正确，因此不用等挑战期；代价是证明生成成本高、证明系统与电路实现复杂。
      - q: 判断 L2 安全性，只看证明类型够吗？
        a: 不够。还要看数据发布到哪里、排序器是否中心化、升级由谁控制、用户能否强制退出；证明类型只是其中一环。
    sources:
      - https://ethereum.org/en/developers/docs/scaling/

  - id: t205
    type: theory
    stage: 2
    order: 7
    title: L2 风险框架：ETHBEAT 阶段
    minutes: 12
    tags: [l2, risk]
    sections:
      - h: 核心机制
        p: ETHBEAT（原 L2BEAT）用「阶段 0、1、2」衡量 Rollup 的去中心化程度，核心看三件事：证明系统能否独立运行、升级由谁控制、用户能否不依赖运营方强制退出。阶段越高，运营方单方面改变结果或冻结资金的能力越弱。
      - h: 关键细节
        p: 阶段 0 由运营方主导，安全委员会能在短时间内升级合约，用户主要靠运营方诚实；阶段 1 要求证明系统可以独立运行，并且要把 L2 结果强行推回 L1 需要攻破至少 75% 的安全委员会成员，升级要有延迟；阶段 2 要求结果完全由代码与证明约束，安全委员会只在不影响结果、可链上证明的 bug 出现时才可介入。ETHBEAT 还会记录 DA 层、排序器状态、退出窗口等细节。
      - h: 例子
        p: 比较 Arbitrum One、OP Mainnet、Base：同样是以太坊 Rollup，但证明系统、升级权限、退出机制不同，ETHBEAT 给出的阶段标签也不同。一个阶段 1 的项目可能仍由单一排序器运行，能延迟交易；一个阶段 0 的项目可能费用很低、体验很好，但用户退出依赖运营方配合。这些差异在界面上看不出来，在风险上却是决定性的。
      - h: 对比或演进
        p: 早期 L2 评估多靠团队自述，L2BEAT 把标准写成可核对的条目，并随生态变化更新；更名为 ETHBEAT 后仍是同一套阶段框架。它也在演进：数据可用性方案、强制交易入口、多证明系统等新变量逐渐被纳入评估。阶段不是永久标签，项目升级或改架构后会被重新评级，所以查看时要记录日期。
      - h: 代价与边界
        p: 阶段衡量的是去中心化程度，不是安全本身：ETHBEAT 明确提示，若证明系统很实验、合约没审计，也可能出现「阶段 2 却不安全」的情况。排序器、DA 依赖、治理结构、桥合约权限都要单独看。阶段信息是公开资料，但判断需要读具体的评估条目，而不是只看一个数字。
      - h: 常见误读
        p: 以为达到阶段 1 就「完全去中心化」——排序器、DA、治理仍可能集中。以为阶段 2 就「绝对安全」——证明系统有 bug、合约权限设计不当同样会出事。以为阶段标签可以跨链比较——不同链的评估标准有差异，阶段只能作为同类 Rollup 之间的参照。
    quiz:
      - q: 一个 Rollup 达到 ETHBEAT 阶段 1，说明它完全去中心化了吗？
        a: 不是。阶段 1 只表示证明系统可独立运行、升级门槛较高；排序器、DA 依赖、治理仍可能中心化，要结合多个维度一起看。
      - q: 阶段 1 里「75% 安全委员会」是什么意思？
        a: 指要把 L2 的错误结果强行推回 L1，必须攻破至少 75% 的安全委员会成员；这个门槛越高，运营方单方面改变结果越难。
      - q: 为什么说阶段高不等于安全？
        a: 阶段只衡量去中心化约束；若证明系统实验性、合约未审计或存在隐蔽权限，仍可能被攻击，安全要结合审计与实现质量一起判断。
    sources:
      - https://ethbeat.org

  - id: t206
    type: theory
    stage: 2
    order: 9
    title: 稳定币的三种机制
    minutes: 13
    tags: [stablecoin]
    sections:
      - h: 核心机制
        p: 按「靠什么维持 1 美元」分三类：法币储备型（发行方持有现金、短期国债等资产，承诺按 1 比 1 赎回，如 USDC、USDT）、加密超额抵押型（把 ETH 等资产锁进合约、超额抵押后发行，如 DAI、USDS）、算法型（靠铸赎与套利调节供应，UST 已失败）。近年还有把储备利息部分传导给持有人的收益型稳定币。
      - h: 关键细节
        p: 储备型看托管、储备构成与赎回通道：现金与国债的比例、托管银行是谁、赎回门槛多高、披露频率如何。抵押型看抵押率、清算机制与预言机，以及抵押资产本身的波动性。算法型看有没有真实储备支撑、套利能否闭合，以及是否存在反身性——价格下跌引发抛售、抛售又压低价格。三类机制的失效方式不同，不能用一个「稳定」概括。
      - h: 例子
        p: 2023 年 3 月硅谷银行倒闭，USDC 发行方披露约 33 亿美元储备存在该行，周末 USDC 一度跌到约 0.87 美元；美国监管机构接管并保障存款后回锚。同一时期算法型稳定币没有这种兜底。抵押型则在抵押物暴跌时靠清算维持偿付，例如 ETH 大跌会触发大量清算，清算不及时就会产生坏账。
      - h: 对比或演进
        p: 算法型在 2022 年 UST 崩盘后基本退出主流；储备型转向更透明的披露与短期国债储备，并出现受监管的发行结构；抵押型则发展出多抵押品、稳定币锚定稳定币等复杂形态。监管框架也在成型，储备与赎回要求逐渐明确。中国内地虚拟货币相关业务活动一律禁止，RWA 代币化按分类监管，以 2026-02-06 八部门 42 号文为准。
      - h: 代价与边界
        p: 「足额储备」也必须可验证：审计报告、托管是否分散、赎回是否顺畅。发行主体离岸、储备不透明，会让折价长期存在。抵押型在极端行情下可能资不抵债，算法型没有真实资产兜底时无法承受挤兑。稳定币的稳定依赖发行方、托管银行与监管环境，任何一环出问题都可能传导到链上。
      - h: 常见误读
        p: 以为锚定 1 美元就有 1 美元储备——算法型可以完全没有等额储备。以为市值等于储备规模——市值是流通量乘价格。以为「稳定币都一样」——托管、抵押、算法三种机制在极端行情下的表现完全不同，风险来源也不同。
    quiz:
      - q: 同样是稳定币，为什么 USDC 脱锚能回锚而 UST 不能？
        a: USDC 有真实美元与美债储备，托管风险澄清后赎回价值仍在；UST 靠算法与信心维持，进入死亡螺旋后没有真实资产兜底，只能归零。
      - q: 加密超额抵押型稳定币的偿付能力靠什么维持？
        a: 靠超额抵押加自动清算：抵押物价值下跌、抵押率跌破阈值时清算抵押物偿还债务，使稳定币仍有资产支撑；清算不及时就会资不抵债。
      - q: 评估法币储备型稳定币，最该核实哪几点？
        a: 储备资产构成与质量、托管在哪里、赎回通道是否顺畅可验证，以及发行方披露频率和审计口径；只看「1 比 1」的宣传不够。
    sources:
      - https://ethereum.org/en/stablecoins/
  - id: t207
    type: theory
    stage: 2
    order: 10
    title: DeFi 收益从哪来
    minutes: 12
    tags: [defi, risk]
    sections:
      - h: 核心机制
        p: 链上收益最终来自四类现金流：交易手续费（AMM 与协议费）、借贷利息、质押与验证奖励，以及协议代币补贴。除此之外的「收益」多半是风险溢价、会计幻觉或别人的亏损。看一个产品，先把它标称的收益率拆成这四类，再问每一类能持续多久。
      - h: 关键细节
        p: 补贴型收益来自代币增发，本质是稀释现有持有人换取流动性，激励一停就消失；真实收益要看协议有没有净收入。收益聚合器还会再收一层管理费与业绩费，标称 APR 未必等于到手。APR 是单利年化，APY 把复利算进去，同一数字在两种口径下差别不小。再叠加循环抵押（同一份资产反复抵押再借出），会把一份本金放大成多份风险。
      - h: 例子
        p: 一个标着 30% APR 的池子拆开看：手续费约 4%、借贷利息约 3%，剩下 23% 全是代币补贴，而补贴来自每年增发的新代币。激励期一结束，APR 掉回 7% 左右，同时池子流动性可能大幅撤出。若这 30% 里还有循环抵押，实际风险敞口可能是本金的数倍，清算时亏的也远不止手续费那点收益。
      - h: 对比或演进
        p: 2020 年的流动性挖矿把补贴收益推到极致，2021 至 2022 年间大量高收益池随代币下跌而崩塌，之后行业叙事转向「真实收益」：有净收入的协议、质押与再质押奖励、国债类 RWA 收益。收益来源在变，判断方法没有变——把收益拆开，看它由谁支付、能持续多久、承担了什么风险。
      - h: 代价与边界
        p: 高数字通常是风险溢价的标价：智能合约漏洞、清算连锁、对手方违约、流动性枯竭、监管不确定性。收益率不是承诺，协议可以随时改参数，激励可以随时停。循环抵押与再质押会把协议之间的风险连成网络，一处清算可能传导到多处。本文只做机制分类，不构成任何参与或配置建议。
      - h: 常见误读
        p: 以为高 APR 等于高回报——它往往只是高风险或高补贴的另一种写法。以为 APR 和 APY 可以混用——复利口径不同，长期差别显著。以为收益是协议「凭空发」的——补贴来自增发，最终由持有人承担稀释；真实收益来自使用协议的人支付的费用。
    quiz:
      - q: 看到一个高收益产品，第一步该问什么？
        a: 问收益从哪来：是手续费、利息、质押奖励，还是代币补贴。补贴来自增发，激励结束就消失，还要考虑循环抵押与清算风险。
      - q: 代币补贴型收益为什么不可持续？
        a: 因为它靠增发新代币支付，稀释现有持有人；一旦激励减少或代币需求下降，收益率迅速回落，资金也会随之撤出。
      - q: APR 和 APY 有什么区别？
        a: APR 是单利年化，不考虑复利；APY 把收益再投入的复利算进去。同一产品在复利频率高时，APY 会明显高于 APR。
    sources:
      - https://ethereum.org/en/defi/

  - id: t208
    type: theory
    stage: 2
    order: 12
    title: AMM 的数学与无常损失
    minutes: 14
    tags: [defi, amm]
    sections:
      - h: 核心机制
        p: 恒定乘积池满足 x·y=k。买走 A 会让池中 A 减少、B 增加，价格沿曲线滑动；k 在每次交易后因手续费略微增长，但池中两种资产的比例已经改变。瞬时价格是 y/x，实际成交价是一段曲线上的平均价，因此交易越大、偏离报价越多。
      - h: 关键细节
        p: 用 Δx 的 A 换出 B，成交量为 y·Δx/(x+Δx)，反过来同理。价格等于储备比 y/x，滑点随交易量相对池子的比例上升，池子越浅越明显。流动性提供者（LP）拿到份额凭证，手续费按份额累积进池子，所以 k 缓慢变大、每份份额的价值也随之上升。无常损失来自套利再平衡：价格变动 n 倍时，相对持有两种资产的损失约为 1 − 2√n/(1+n)。
      - h: 例子
        p: 池中有 100 A 和 100 B，价格为 1。有人用 10 B 换 A：解 (100+10)(100−ΔA)=10000 得 ΔA 约 9.09，平均成交价约 1.1，滑点接近 10%。如果池子是 10000 A 与 10000 B，同样 10 B 只换来约 9.99 A，滑点约 0.1%。再看无常损失：ETH 相对 USDC 涨到 2 倍时，恒定乘积 LP 相对持有约少 5.7%；涨到 4 倍时约少 20%。
      - h: 对比或演进
        p: Uniswap v2 用统一费率与全价格区间做市，资金效率低；v3 引入集中流动性，把资金集中在某个价格区间，资本效率更高，但区间被突破后收益骤降、无常损失放大；v4 增加 hooks 定制逻辑。稳定币兑换多用 Curve 式曲线，把价格集中在 1 附近以降低滑点；Balancer 用加权池支持多资产与自定义权重。公式在变，核心权衡始终是资本效率与风险。
      - h: 代价与边界
        p: 公式不保证做市赚钱：手续费要先覆盖无常损失、被夹风险和合约风险。集中流动性提高了资本效率，也提高了区间管理与被动失效的风险。用池子现货价当预言机的协议很容易被一笔大额交易操纵，因此主流借贷协议改用多源聚合预言机。AMM 只负责定价与撮合，不评估资产质量，也不保护 LP 免受 MEV。
      - h: 常见误读
        p: 以为 k 不变价格就不变——k 不变时比例仍会变，价格沿曲线移动。以为 LP 份额价值恒定——份额价值随池中资产价格与手续费累积变化。以为无常损失可以精确预测——它取决于未来价格路径，只能事后计算，事前只能做情景估算。
    quiz:
      - q: AMM 里一笔大额交易为什么成交价会更差？
        a: 因为价格沿 x·y=k 曲线滑动：交易越大，池中资产比例变化越大，平均成交价偏离初始报价越多，这个差额就是滑点。
      - q: 恒定乘积池里，用 10 B 换 A 的成交量怎么算？
        a: 用 y·Δx/(x+Δx)：池中 100 A、100 B 时，换出约 9.09 A；成交公式保证交易后 x·y 仍等于 k，差额就是价格冲击。
      - q: 手续费收入和无常损失是什么关系？
        a: 手续费让 k 增长、LP 份额升值，无常损失是相对持有的机会成本；做市净收益等于手续费收入减去无常损失，再扣掉被夹与合约风险。
    sources:
      - https://ethereum.org/en/defi/

  - id: t209
    type: theory
    stage: 2
    order: 14
    title: 借贷与清算
    minutes: 13
    tags: [defi, lending]
    sections:
      - h: 核心机制
        p: 借贷协议用「抵押率加健康因子」控制风险：抵押物价值乘抵押率是可借额度；当债务相对抵押物超过清算阈值，任何人都能触发清算。没有信用评估，只能用超额抵押和自动清算替代「催收」，这是链上借贷与银行信贷最根本的区别。
      - h: 关键细节
        p: 借款利率由资金利用率决定：借得越多、池子剩余流动性越少，利率越高，既激励存款又抑制借款，接近上限时曲线变陡。清算人代还部分债务（受 close factor 限制），按清算罚金折价获得抵押物，存款人因此得到保护。预言机提供抵押物价格，价格更新滞后或可被操纵时，清算会过早或过晚。参数上，LTV 与清算阈值之间的差额就是安全垫。
      - h: 例子
        p: 抵押价值 1000 美元的 ETH、抵押率 80%，最多可借 800 美元。ETH 跌到 900 美元时，可借额度降到 720 美元，低于 800 美元债务；若清算阈值是 85%，则健康因子在价格约 941 美元以下跌破 1，清算启动。清算人代还 400 美元债务，按 5% 罚金拿到价值约 420 美元的抵押物，剩余债务仍由借款人承担，直到仓位被完全清算或补足抵押。
      - h: 对比或演进
        p: 早期协议用单一池子与固定参数；后来出现隔离市场（每种抵押品独立风险）、e-mode（同类资产更高抵押率）、固定利率与期限产品，以及闪电贷——无抵押借出、同一交易内归还，用于套利与再融资。再质押与 RWA 抵押又把外部收益与信用风险带进借贷市场。结构越复杂，风险传导路径越多。
      - h: 代价与边界
        p: 预言机滞后、清算拥堵、极端行情下抵押物流动性枯竭，都会让清算来不及，最终产生坏账。利率随利用率波动，借款成本不可预测；清算罚金让高杠杆用户可能损失全部抵押。闪电贷本身不是漏洞，但它把攻击成本降到极低，任何有价格或权限缺陷的协议都可能被一次性抽干。
      - h: 常见误读
        p: 以为抵押率只是「能借多少」——它同时是风险缓冲，决定了多小的价格波动会触发清算。以为清算只影响借款人——清算会折价卖出抵押物，压低价格并影响其它仓位。以为利率固定——利率由利用率实时决定，池子被借空时会飙升。
    quiz:
      - q: 抵押物价格下跌时，为什么不等借款到期再处理？
        a: 因为链上借贷没有信用评估和到期催收，只能靠实时清算控制风险；跌破阈值不及时清算，抵押物可能不够还债，存款人要承担坏账。
      - q: LTV 与清算阈值之间的差额有什么用？
        a: 它是安全垫：价格跌到 LTV 对应的水平只是不能再借，跌到清算阈值才触发清算，这个缓冲给借款人和清算人留出反应时间。
      - q: 为什么闪电贷会放大协议风险？
        a: 它允许在无抵押的情况下瞬间借出巨额资金并在同一交易内归还，攻击者可以用极低成本操纵价格或触发逻辑缺陷，把协议资金抽走。
    sources:
      - https://ethereum.org/en/defi/

  - id: t210
    type: theory
    stage: 2
    order: 16
    title: MEV：谁拿走了你的滑点
    minutes: 13
    tags: [mev, ethereum]
    sections:
      - h: 核心机制
        p: MEV（Maximal Extractable Value，最大可提取价值）指出块者通过选择、排序、插入或审查交易能额外获得的价值。典型形式有三类：套利（拉平不同市场的价差）、清算（抢先执行清算拿罚金）、三明治攻击（在用户大额交易前后各插一笔，赚取价差）。MEV 不是漏洞，而是「谁有权决定交易顺序」这件事的定价。
      - h: 关键细节
        p: 以太坊把区块生产拆成提议者（proposer）与构建者（builder）分工：搜索者寻找机会、构建者竞价打包、提议者挑出价最高的区块。MEV-Boost 让这个市场标准化，验证者不必自己跑复杂策略。用户侧可以用私有交易通道避免交易在公开内存池被看见，或设置更低的滑点容忍、拆单，减少被夹的空间。
      - h: 例子
        p: 你在 DEX 上以 5% 滑点容忍度换一笔较大的单子，交易进入公开内存池。搜索者看到后，在前一笔买入把价格推高，让你的交易以更差价格成交，随后再卖出获利。你损失的滑点就是他们的利润；若你设的容忍度只有 0.5%，扣除 Gas 与竞争后这笔夹击就无利可图，攻击自然减少。
      - h: 对比或演进
        p: PoW 时代 MEV 主要通过提高 Gas 价格竞争出块顺序；合并后 PBS 与 MEV-Boost 成为主流，提议者把排序外包给构建者市场。以太坊计划在 Glamsterdam 升级（计划 2026 年第四季度，日期未定，以 ethereum.org/roadmap 为准）把提议者与构建者的分工写进协议（ePBS），减少对可信中继的依赖。L2 上则出现排序器 MEV，中心化排序器可以直接决定顺序。
      - h: 代价与边界
        p: MEV 不全是坏事：套利帮助价格跨市场收敛，清算帮助借贷协议保持健康。但三明治攻击、抢跑和审查直接损害普通用户，也会让区块空间分配更不公平。缓解手段包括降低滑点容忍、使用私有交易通道、批量拍卖与加密内存池，但没有一种能完全消除 MEV，因为排序权本身有价值。
      - h: 常见误读
        p: 以为 MEV 都是攻击——套利与清算是生态运转需要的。以为只有出块者能赚——搜索者、构建者、提议者分走了不同部分。以为设好滑点就安全——滑点容忍度本身就是攻击者的利润空间，设得越宽越容易被夹。
    quiz:
      - q: 三明治攻击里，攻击者赚的是谁的钱？
        a: 赚的是被夹用户的滑点损失：攻击者在前买入推高价格，用户以更差价格成交，攻击者再卖出获利，本质是抢先交易抽取价差。
      - q: 为什么说 MEV 不完全是坏事？
        a: 套利让不同市场的价格收敛，清算让借贷协议及时处理风险仓位；这些行为对生态有用，问题在于三明治、抢跑与审查会直接损害普通用户。
      - q: 普通用户能怎么减少被夹的风险？
        a: 降低滑点容忍度、拆单、使用私有交易通道避免交易在公开内存池暴露，并避开流动性过浅的池子；这些能减少空间，但不能完全消除 MEV。
    sources:
      - https://ethereum.org/en/developers/docs/mev/

  - id: t211
    type: theory
    stage: 2
    order: 17
    title: 账户抽象：ERC-4337 与 7702
    minutes: 13
    tags: [ethereum, account]
    sections:
      - h: 核心机制
        p: 账户抽象让「账户」不再只能由私钥直接控制，而可以由合约逻辑定义：社交恢复、批量交易、代付 Gas、会话密钥、消费限额都能做。传统账户分两类——私钥控制的 EOA 和代码控制的合约账户；账户抽象的目标是让 EOA 也能享受合约账户的可编程性。
      - h: 关键细节
        p: ERC-4337 不改协议，用 UserOperation、EntryPoint 合约、Bundler、Paymaster 在应用层实现：用户签的是 UserOperation，Bundler 打包提交，EntryPoint 验证并执行，Paymaster 可以代付 Gas。EIP-7702 随 Pectra（2025-05-07）激活，允许 EOA 设置一段委托代码，把执行临时交给合约逻辑，是更轻量的过渡方案，不需要迁移资产到新地址。
      - h: 例子
        p: 新用户手上没有 ETH 也能操作：Paymaster 代付 Gas，用户用稳定币结算，第一次使用不必先买 ETH。或者用社交恢复：私钥丢失时由守护人投票更换密钥，而不是直接失去账户。用 7702，一个已有地址可以临时获得批量交易与代付能力，不必把资产转到新合约钱包。
      - h: 对比或演进
        p: 4337 是应用层方案，好处是不依赖硬分叉、可逐步推广；7702 是协议层改动，让 EOA 直接获得委托能力，但委托代码可以被钓鱼滥用。更长期的路线仍在讨论，包括把账户抽象写进协议本身；具体升级内容与时点以 ethereum.org/roadmap 为准。两条路线并非互斥，钱包可以同时支持。
      - h: 代价与边界
        p: 代付与恢复都引入新的信任方：Paymaster 可以拒付或审查，守护人可能被收买，Bundler 能看到待打包的 UserOperation。7702 的委托代码一旦被恶意合约利用，可能导致批量授权或资产被转走，安全边界与普通 EOA 不同。此外，额外的合约调用会增加 Gas，批量操作省下的手续费未必能覆盖复杂度。
      - h: 常见误读
        p: 以为 ERC-4337 需要以太坊硬分叉——它在应用层实现，不改共识规则；真正改协议的 EIP-7702 才需要通过硬分叉激活。以为 7702 会把 EOA「变成合约账户」——账户类型仍是 EOA，只是执行时委托给代码。以为账户抽象等于不需要私钥——密钥仍在，只是多了恢复与权限管理机制。
    quiz:
      - q: ERC-4337 需要以太坊硬分叉才能用吗？
        a: 不需要。它在应用层用 UserOperation 和 EntryPoint 合约实现，不改共识规则；真正改协议的 EIP-7702 才需要通过硬分叉（Pectra）激活。
      - q: EIP-7702 让 EOA 获得了什么能力？
        a: EOA 可以设置一段委托代码，把执行交给合约逻辑，从而支持批量交易、代付 Gas 等；资产不必迁移到新地址，但委托代码本身带来新的钓鱼风险。
      - q: 账户抽象引入的新信任方有哪些？
        a: Paymaster 可以代付或拒付、可能审查交易；守护人掌握恢复权限；Bundler 能看到待打包操作。便利性来自这些角色，风险也来自它们。
    sources:
      - https://eips.ethereum.org/EIPS/eip-4337

  - id: t212
    type: theory
    stage: 2
    order: 19
    title: 跨链桥的信任假设
    minutes: 13
    tags: [bridge, security]
    sections:
      - h: 核心机制
        p: 桥的安全取决于「谁来验证跨链消息」。常见三类：外部验证（多签、MPC 或预言机网络，靠一组私钥确认源链事件）、轻客户端验证（目标链合约能验证源链共识）、Rollup 原生桥（由 L1 合约与证明保证，最接近继承以太坊安全）。此外还有流动性桥，用两边资金池直接兑换，不铸造新凭证。
      - h: 关键细节
        p: 多签桥的安全上限等于多签阈值与成员可靠性：5/9 多签意味着攻破任意 5 个私钥就能伪造消息。轻客户端桥的安全取决于能否正确验证源链共识，实现复杂、成本高。原生 Rollup 桥的提取要靠 L1 上的证明与提款流程，攻击面小，但受挑战期约束。桥还要处理消息重放、nonce 管理、合约升级权限和流动性深度，任何一环出问题都可能被利用。
      - h: 例子
        p: 2022 年 Ronin 桥因验证者私钥被攻破损失约 6.24 亿美元；同年 Wormhole 因签名验证逻辑漏洞损失约 3.26 亿美元；Nomad 因初始化配置错误被大量地址复制提款，损失约 1.9 亿美元。三起事件的共同点是：桥里锁着大量资产，验证逻辑或权限一旦有缺口，攻击者可以凭空生成凭证，损失一次就足够大。
      - h: 对比或演进
        p: 早期桥多为多签托管，随被盗事件增加，行业转向轻客户端桥、ZK 桥与意图桥（intent-based，用竞争性求解者完成跨链，用户只签意图）。共享安全与模块化 DA 又带来新的验证组合。方向是减少对单一多签的依赖，但每种方案都要付出成本：更复杂、更慢、更贵，或者引入新的信任方。
      - h: 边界与代价
        p: 不存在「无信任桥」：跨链本质是在两条链之间复制状态，必然引入验证者、证明系统或流动性提供者。桥的风险还包括跨链后资产在两条链上同时被抵押的「双重记账」、桥合约升级权限、以及流动性枯竭导致无法兑回。中国内地虚拟货币相关业务活动一律禁止，相关安排以 2026-02-06 八部门 42 号文为准。
      - h: 常见误读
        p: 以为桥只是转账工具——跨链后拿到的是索取权凭证，担保方出问题凭证就会失效。以为去中心化桥没有信任假设——多签、轻客户端、ZK 桥各有各的验证假设，只是分布程度不同。以为审计过就安全——上述三起事件中的项目多数经过审计，漏洞出在配置、权限与实现细节里。
    quiz:
      - q: 为什么说跨链桥的风险比普通合约更高？
        a: 因为桥要在两条链间转移价值，必须依赖某种验证者或证明系统，一旦被攻破或作恶就能凭空增发凭证；桥内锁定的资产又集中，单次损失巨大。
      - q: 5/9 多签桥的安全上限是什么？
        a: 攻破任意 5 个签名私钥就能伪造跨链消息、凭空铸造凭证，因此安全上限等于这 5 个私钥的可靠性，而不是签名者总数。
      - q: 「不存在无信任桥」是什么意思？
        a: 跨链必须复制状态，天然需要验证者、证明系统或流动性提供方来确认源链发生了什么，这些角色都带来某种信任假设，只是强弱与分布不同。
    sources:
      - https://ethereum.org/en/developers/docs/bridges/
  # ---------- 实践课 p201–p208 ----------
  - id: p201
    type: practice
    stage: 2
    order: 3
    title: 看懂一笔交易的 Gas
    minutes: 11
    tags: [gas, etherscan]
    sections:
      - h: 目标
        p: 在区块浏览器上把一笔真实交易的 Gas 拆开看：Gas 用量、base fee、priority fee 分别是什么，钱最后付给了谁，为什么交易失败也会扣费。全程只读，不需要钱包。
      - h: 准备
        p: 浏览器打开 etherscan.io，不需要注册或登录。选一笔最近的普通 ETH 转账作为样本，再选一笔合约调用（例如一次 DEX swap）作为对照，这样能看出纯转账与执行合约的 Gas 差异。准备好纸笔或表格记录数字，单位注意 gwei 与 ETH 的换算（1 ETH = 10^9 gwei）。
      - h: 步骤
        p: 1) 在 etherscan 首页或区块页找到一笔 ETH 转账，点进交易详情；2) 记录 Gas Limit、Gas Used by Txn 和 Gas Price；3) 展开 Gas Price，分别记下 Base Fee 与实际生效的小费（Max Priority Fee 与 Effective Priority Fee 可能不同）；4) 用「Gas Used ×（Base Fee + 小费）」算出实际手续费；5) 核对页面上的 Transaction Fee 与 Burnt Fees，验证 Burnt Fees 等于 Gas Used × Base Fee；6) 再打开一笔合约调用交易，比较 Gas Used 是 21000 还是几万；7) 在同一个区块里找几笔交易，比较它们的 Base Fee 是否相同、小费是否不同。
      - h: 验收
        p: 你能独立算出这笔交易的手续费，指出其中多少被销毁、多少给打包者，并解释 Gas Limit 与 Gas Used 的区别。还能回答：为什么同一区块里所有交易的 Base Fee 相同、小费却不同；为什么合约调用的 Gas 远高于普通转账；为什么一笔失败交易同样消耗 Gas。
      - h: 安全与常见坑
        p: 全程只读，不连接钱包、不签名、不发交易；任何页面要求「连接钱包领空投」都直接关掉，认准 etherscan.io 域名，警惕搜索广告里的假站。常见坑：把 Max Fee 当成实际支付（实际按 base fee 加小费结算）、把 gwei 当成 ETH、把 Gas Limit 当成 Gas Used。数据只用于理解机制，不构成任何操作建议。
    quiz:
      - q: 同一区块里，为什么所有交易的 Base Fee 相同而小费不同？
        a: Base Fee 由协议按上一区块的用量统一计算，同一区块内固定；小费是用户自己设的竞价，用于让打包者优先选择，所以每笔交易可以不同。
      - q: 怎么验证一笔交易里被销毁的 ETH 是多少？
        a: 用 Gas Used 乘 Base Fee，得到的就是销毁部分；页面上的 Burnt Fees 应该等于这个数，剩下的小费部分归打包的验证者。
    sources:
      - https://etherscan.io

  - id: p202
    type: practice
    stage: 2
    order: 5
    title: 在 Sepolia 部署 ERC-20
    minutes: 15
    tags: [erc20, remix, testnet]
    sections:
      - h: 目标
        p: 在测试网亲手部署一个 ERC-20 代币并转账，体会「部署就是发一笔交易，合约地址就是一个新账户」，同时把编译、部署、调用、看事件这条完整链路走一遍。
      - h: 准备
        p: 准备一个专门的测试钱包（新建、不存放真实资产），从 Sepolia 水龙头领取少量测试 ETH 用于付 Gas；打开 remix.ethereum.org；准备一份 OpenZeppelin ERC20 合约源码（Remix 里可通过向导引入，或从官方仓库复制）。确认钱包网络能切到 Sepolia，并且只导入测试钱包的私钥或助记词。
      - h: 步骤
        p: 1) 在 Remix 新建文件，粘贴 ERC20 模板，构造函数设置名称、符号和初始供应量（注意 18 位小数，供应量要乘 10^18）；2) 在 Solidity Compiler 面板选匹配的编译器版本并编译，确认没有报错；3) 在 Deploy 面板把 Environment 改成 Injected Provider，确认钱包弹窗显示的是 Sepolia；4) 点 Deploy 并在钱包里确认，等待交易上链；5) 复制部署出的合约地址，在 sepolia.etherscan.io 查看创建记录与合约代码；6) 回到 Remix，在合约面板调用 name、symbol、totalSupply、balanceOf 核对；7) 调用 transfer，把 100 个代币转到你准备的第二个测试地址；8) 在浏览器里打开这笔 transfer 交易，展开 Logs 看 Transfer 事件。
      - h: 验收
        p: 浏览器能看到合约地址、代币符号与总量；transfer 成功后两个测试地址的余额一增一减、总量不变；Logs 里能找到 Transfer 事件且参数与转账一致；你能说清部署交易与普通转账交易在 Gas 上的差别，以及为什么合约地址也是一个「账户」。
      - h: 安全与常见坑
        p: 只用 Sepolia 测试币，绝不部署到主网、绝不在 Remix 里导入真实钱包的助记词或私钥；测试网代币没有价值，不要相信任何「代币兑换」的说法。常见坑：Solidity 版本与模板不匹配导致编译失败、供应量忘记乘 10^18、钱包网络没切到 Sepolia 就点 Deploy、误点钓鱼水龙头并签署授权。练习结束可以不管这个测试合约，它没有任何价值。
    quiz:
      - q: 部署合约为什么也算一笔交易？
        a: 因为部署要把字节码写到链上、占用新的地址与存储，节点要执行并永久保存，必须由一笔签名交易触发并支付 Gas；部署完成后代码才成为该地址的一部分。
      - q: transfer 之后总量不变，为什么余额会变化？
        a: 因为 transfer 只做账户间余额的加减，不增发也不销毁；总量由构造函数一次性确定，除非合约另有增发逻辑，否则转账前后 totalSupply 相同。
    sources:
      - https://ethereum.org/en/developers/docs/smart-contracts/

  - id: p203
    type: practice
    stage: 2
    order: 8
    title: 用 ETHBEAT 比较三个 L2
    minutes: 12
    tags: [l2, ethbeat]
    sections:
      - h: 目标
        p: 用 ETHBEAT（原 L2BEAT）的公开资料把三条主流 L2 放进同一张表比较，理解「都叫 L2」背后的风险差异，学会读阶段标签背后的具体条件。
      - h: 准备
        p: 浏览器打开 ethbeat.org，不需要注册、不需要钱包。准备一张三列的表格，行设为：阶段（0/1/2）、证明系统、数据可用性方案、升级权限、强制退出方式、排序器状态。选 Arbitrum One、OP Mainnet、Base 三个项目作为对照。读资料时把「阶段标签」和「为什么是这个阶段」分开记，后者才是判断依据。
      - h: 步骤
        p: 1) 打开 ethbeat.org，找到项目列表；2) 分别进入 Arbitrum One、OP Mainnet、Base 的详情页；3) 记录它们的阶段标签与评估日期；4) 在详情页找到证明系统、DA 层、升级权限与退出机制的具体说明，逐项填表；5) 看风险分析或里程碑部分，记录「距离下一阶段还差什么」；6) 把三列并排比较，标出至少两处明确差异；7) 在每个差异旁写一句「这意味着什么风险」；8) 记下查看日期，因为阶段与实现会更新；9) 对照三条链的排序器说明，判断交易能否绕过运营方。
      - h: 验收
        p: 表格里至少两列有明确差异，例如证明类型、阶段标签或升级门槛，并能用一句话说明这个差异带来什么风险。你能解释为什么阶段 1 不等于「完全去中心化」，也能指出某条 L2 的排序器是否仍由单一运营方运行。最后用三句话总结：谁的退出最依赖运营方、谁的升级门槛最低、谁最接近以太坊原生安全。
      - h: 安全与常见坑
        p: 只浏览公开资料，不连接钱包、不参加任何需要签名的活动；不点页面上的赞助或空投链接。常见坑：只看阶段数字不看评估条目、把旧的阶段标签当成现状、把「L2」当成同一种安全模型。资料只用于理解结构，不构成任何参与建议；评估条目会随项目升级更新，引用时要写查看日期。
    quiz:
      - q: ETHBEAT 的阶段标签衡量的是什么？
        a: 衡量 Rollup 的去中心化程度，主要看证明系统能否独立运行、升级由谁控制、用户能否强制退出；它不等于安全评分，还要看实现与审计质量。
      - q: 为什么三条主流 L2 的「阶段」可能不同？
        a: 因为它们的证明系统成熟度、升级权限设计和退出通道进度不同；阶段反映的是这些具体条件的组合，而不是团队名气或交易量。
    sources:
      - https://ethbeat.org

  - id: p204
    type: practice
    stage: 2
    order: 11
    title: 在 DefiLlama 看稳定币
    minutes: 11
    tags: [stablecoin, data]
    sections:
      - h: 目标
        p: 用 DefiLlama 的稳定币页面看总量、品种与链上分布，学会把「市值」和「储备」分开看，理解稳定币数据口径的差异，以及为什么同一个数字在不同平台会不一样。
      - h: 准备
        p: 浏览器打开 defillama.com 的稳定币页面，不需要注册、不需要钱包。准备记录三类数字：稳定币总市值、前三大品种及占比、主要分布在哪几条链。再准备一个问题：市值的涨跌可能由什么造成；再想一个口径问题：同一稳定币在两条链上的数量是否算重复计入。
      - h: 步骤
        p: 1) 打开稳定币页面，记录总市值与前三名；2) 切到链的视图，看稳定币主要分布在哪些链，记录前两名及大致占比；3) 分别打开 USDT 与 USDC 的详情页，看流通量、链分布与 24 小时变化；4) 找到页面上的分类或标签，区分法币储备型与加密超额抵押型；5) 对比两个品种在同一时段的市值变化方向；6) 写下你对「市值变化」的三种可能解释（新发行、价格波动、赎回）；7) 点开某个品种的透明度说明，看页面标注了哪些数据来源与披露来源；8) 把数据、查看日期与口径一起记录。
      - h: 验收
        p: 能回答稳定币总量最大的两条链是哪两条，并说明市值变化不等于新发行——价格波动、赎回与跨链迁移都会影响它。还能指出页面上的数据属于哪类口径，以及为什么不同平台对同一稳定币的统计可能不同。最后说出一个具体品种的储备结构与风险来源：储备托管在哪里、有没有第三方披露、赎回通道是否公开可查。
      - h: 安全与常见坑
        p: 只读网页数据，不点任何「连接钱包」按钮；页面数据只用于理解结构，不做任何决策依据。常见坑：把市值当成储备规模、把单日变化当成趋势、忽略链上分布与发行方披露的差别。数据有延迟也会修订，引用时要标日期与来源；聚合平台的分类标签不等于审计结论，涉及具体资产应查发行方一手披露。
    quiz:
      - q: 稳定币市值增长，一定代表新发行了稳定币吗？
        a: 不一定。市值是流通量乘价格，价格短暂偏离锚定、跨链迁移统计、平台口径变化都会让数字变化；要区分新发行与现有存量的重估。
      - q: 为什么看稳定币要同时看链上分布？
        a: 因为同一种稳定币可能大部分集中在少数链上，流动性、桥的依赖与风险都随之集中；只看总量会忽略资产实际停放在哪里。
    sources:
      - https://defillama.com

  - id: p205
    type: practice
    stage: 2
    order: 13
    title: 读懂一笔 swap 的日志
    minutes: 13
    tags: [amm, etherscan]
    sections:
      - h: 目标
        p: 在区块浏览器里读懂一笔 AMM swap 的日志，把价格、数量、方向从原始事件里还原出来，理解「界面显示的数量」与「链上事件」是同一份数据。
      - h: 准备
        p: 浏览器打开 etherscan.io，找到一笔 Uniswap V2 或类似恒定乘积池的 swap 交易（例如从某个池子合约的最近交易里点进去）。需要知道 token0 与 token1 是两个代币合约地址，以及它们各自的小数位（decimals），否则算出来的数量会差几个数量级。
      - h: 步骤
        p: 1) 打开一笔 swap 交易，找到 Logs 标签；2) 定位 Swap 事件（通常 topic0 对应 Swap 签名），展开查看 data；3) 读出 amount0In、amount1In、amount0Out、amount1Out 四个字段；4) 查代币合约的 decimals，把整数换算成人类可读数量；5) 判断方向：哪个是支付、哪个是收到；6) 用「支付数量 ÷ 收到数量」算出隐含成交价；7) 与页面上显示的数量对照，确认一致；8) 若池子储备可查，比较隐含成交价与池子瞬时价格 y/x 的差异；9) 再看交易详情里的 Gas Used，理解这笔 swap 的存储读写成本。
      - h: 验收
        p: 能写出这笔 swap 的方向、两种代币各多少、隐含成交价，并解释为什么它和池子里的现货价格不同（大额交易沿曲线滑动，成交价是平均价）。还能指出哪个字段对应手续费，以及这笔交易是否可能被三明治攻击。最后用一句话说明：界面上显示的数量和 Logs 里的字段是一一对应的。
      - h: 安全与常见坑
        p: 只读浏览，不点击来源不明的「Claim」按钮，不响应任何签名请求。常见坑：忽略 decimals 导致数量差 10^18 倍、把 token0 当成支付方（顺序由池子合约决定）、把 Pool 地址的 Swap 事件与 Router 的调用混淆。数据只用于理解机制。如果页面字段与事件对不上，先检查代币合约地址与 decimals，再怀疑自己读错了事件。
    quiz:
      - q: Uniswap V2 的 Swap 事件里，怎么判断谁是支付方？
        a: 看 amountXIn 与 amountXOut：进池子的方向是 amountIn 非零，出池子的方向是 amountOut 非零；再对照池子的 token0 与 token1 地址确定代币。
      - q: 为什么隐含成交价和池子现货价不一样？
        a: 因为成交价是整笔交易沿曲线滑动后的平均价，现货价只是交易前的瞬时比例；交易越大，两者偏离越多，这个差额就是滑点。
    sources:
      - https://etherscan.io

  - id: p206
    type: practice
    stage: 2
    order: 15
    title: 复盘 USDC 2023 脱锚
    minutes: 12
    tags: [stablecoin, risk]
    sections:
      - h: 目标
        p: 用公开数据复盘 2023 年 3 月的 USDC 脱锚事件，理解「储备风险」如何传导成市场价格，并区分哪些环节可以链上验证、哪些只能依赖发行方披露。复盘的目的是练方法，不是评判某一次事件。
      - h: 准备
        p: 打开 defillama.com 的稳定币页面，找到 USDC 的历史价格与市值曲线；准备记录 2023-03-10 到 03-14 的价格最低点、回锚时间与市值变化。再准备查发行方公告与监管机构接管硅谷银行的公开信息，注意只引用官方或权威来源，并把「事实」「披露」「市场传闻」分开标注。
      - h: 步骤
        p: 1) 在稳定币页面打开 USDC，切到历史价格视图；2) 记录 3 月 10 日至 13 日的最低价格与对应时间；3) 记录价格回到 0.99 美元以上的时间；4) 查发行方当时披露的储备情况，确认与硅谷银行相关的敞口规模；5) 查监管机构接管并保障存款的公开信息；6) 对照同期 USDT 的价格曲线，看是否同步脱锚；7) 写下「若储备存在别处」的对照情景；8) 把时间线整理成四行：消息、价格、赎回、恢复；9) 对每一行标注信息来源类型，区分链上数据与发行方声明。
      - h: 验收
        p: 能说清三件事：脱锚幅度、触发原因、回锚条件；并指出哪些环节可验证、哪些只能依赖披露。还能解释为什么这次脱锚与 2022 年 UST 的机制失效不同，以及稳定币价格回到 1 美元是否等于风险完全解除。还要指出哪些环节只能依赖披露，例如储备构成与托管安排。
      - h: 安全与常见坑
        p: 纯历史复盘，不涉及任何交易；也不要把一次历史事件当作同类事件未来走向的预测。常见坑：把「价格回锚」当成「储备无损」、混淆发行方披露与第三方传闻、忽略周末流动性极薄对价格的影响。数据要标来源与日期；另外，不要用今天的储备结构反推当时的情况。
    quiz:
      - q: USDC 2023 年脱锚的直接触发因素是什么？
        a: 发行方披露有约 33 亿美元储备存放在硅谷银行，而该行倒闭带来能否取回的疑虑，持有者抛售或赎回导致价格短时跌到约 0.87 美元。
      - q: 这次脱锚能回锚，关键条件是什么？
        a: 储备资产本身没有消失，且监管机构接管并保障了存款，赎回价值恢复；价格回锚是市场对兑付能力重新定价的结果，而不是机制自身修复。
    sources:
      - https://defillama.com

  - id: p207
    type: practice
    stage: 2
    order: 18
    title: 撤销一次测试授权
    minutes: 11
    tags: [security, approval]
    sections:
      - h: 目标
        p: 在测试网上练习查看并撤销 ERC-20 授权，理解 approve 留下的长期风险，以及「无限授权」为什么危险。练习的重点是把「授权—使用—撤销」这条链路走通，知道授权与转账是两种不同的链上操作。
      - h: 准备
        p: 准备一个专门的 Sepolia 测试钱包，里面放少量测试 ETH 和测试代币（可以用上一课自己部署的代币）；打开 revoke.cash 并确认能切换到 Sepolia 测试网。全程不输入助记词，只用钱包连接与交易确认；如果找不到可撤销的授权，可以先用测试代币做一次小额 approve，再回来刷新。
      - h: 步骤
        p: 1) 在 Sepolia 用测试钱包对测试代币执行一次 approve，把额度设为较大值，spender 填一个测试地址；2) 打开 revoke.cash，选择与练习相同的测试网；3) 连接测试钱包，查看授权列表；4) 找到刚才的授权，核对代币、spender 地址与 allowance 额度；5) 点 Revoke 并在钱包里确认交易；6) 刷新页面，确认该条授权已消失或额度归零；7) 在 Sepolia 浏览器打开这笔撤销交易，确认它上链成功；8) 再查一次代币余额，确认没有变化；9) 回到 revoke.cash 再看一次授权列表，确认没有遗漏的其它授权。
      - h: 验收
        p: 撤销后代币余额没变，但 allowance 归零，且能在区块浏览器看到这笔撤销交易；你能解释无限授权为什么危险，以及撤销授权本身为什么也要付 Gas。还能说出授权与转账是两种不同操作，撤销不会动你的余额。你还能说出为什么有些授权会显示为「无限」，以及它和有限额度在风险上的差别。
      - h: 安全与常见坑
        p: 只用测试网和测试钱包；不要向任何网站输入助记词，也不要为「验证钱包」签署不明消息。常见坑：进了仿冒 revoke 的钓鱼站、把「签名消息」当成撤销交易、以为撤销授权会把代币转走、忽略有些代币的 approve 存在竞态。主网授权也建议定期检查，但本课不涉及任何真实资金操作；撤销授权前先确认代币合约地址正确，假代币的授权页面可能诱导你签更多交易。
    quiz:
      - q: 撤销授权会动到我的代币余额吗？
        a: 不会。撤销只是把 allowance 设为 0，取消对方代你转账的权限；余额仍在你账户里，变化的只是授权额度，撤销交易本身需要付 Gas。
      - q: 无限授权为什么危险？
        a: 因为一旦 spender 合约被攻破或本身有恶意，它可以在任意时间把你该代币的全部余额转走，而授权不会自动过期，风险一直存在直到撤销。
    sources:
      - https://etherscan.io

  - id: p208
    type: practice
    stage: 2
    order: 20
    title: 在 Dune 写第一个查询
    minutes: 15
    tags: [dune, sql]
    sections:
      - h: 目标
        p: 用 Dune 的 SQL 编辑器查一条链上数据，体会「链上记录可被任何人重算」到底是什么意思，并学会用过滤条件控制查询成本，理解为什么同一份数据在不同工具里应当一致。
      - h: 准备
        p: 浏览器打开 dune.com 注册免费账户，不需要连接钱包。了解基本 SQL 的 SELECT、WHERE、ORDER BY、LIMIT 即可。找一笔以太坊上的交易作为对照样本，记下它的交易哈希或区块号，稍后用来验证查询结果与浏览器一致。
      - h: 步骤
        p: 1) 登录后新建 query，选择以太坊数据集；2) 在编辑器里写查询，取最近若干笔交易的 block_time、from、to、gas_used，注意 from 是 SQL 保留字，要用双引号包起来；3) 加上时间或区块范围过滤，例如限定最近一天；4) 加 ORDER BY block_time DESC 与 LIMIT 10；5) 运行查询，确认返回 10 行且字段可读；6) 把查询里的时间范围改成具体某一天，再跑一次；7) 用之前记下的交易哈希过滤，核对该笔交易的 gas_used 与浏览器显示是否一致；8) 保存查询并加一个简单可视化；9) 把查询另存一份，只改过滤条件再跑一次，体会参数对结果的影响。
      - h: 验收
        p: 查询能跑出结果并导出一次；能用一句话说明这条数据与区块浏览器上看到的是同一份链上记录；能解释为什么要加时间或区块过滤，以及不加过滤会带来什么成本。你还应该能说清 from 与 to 在交易里分别是什么角色。如果查询结果与浏览器不一致，先检查数据集是主网还是测试网、时间范围是否重叠。
      - h: 安全与常见坑
        p: 只做只读查询，不连接钱包；免费额度有限，避免全表扫描这类大查询。常见坑：不加时间过滤导致查询超时或消耗额度、把 from 当普通列名导致语法错误、忘记 decimals 换算导致金额差几个数量级、把测试网数据与主网数据混在一张表里。查询结果只用于理解数据，不构成任何决策依据。写查询时尽量用 LIMIT 与时间过滤，既能省额度，也能让结果更容易复核。
    quiz:
      - q: 为什么 Dune 查询里 from 要加双引号？
        a: 因为 from 是 SQL 的保留字，用来指定数据来源表；作为列名时必须加双引号或反引号，否则解析器会把它当成语法关键字而报错。
      - q: 为什么写链上查询要先加时间或区块过滤？
        a: 以太坊数据量巨大，不加过滤会扫描大量行，查询慢且消耗额度；限定范围能大幅降低成本，也更容易与浏览器上的具体交易对照。
    sources:
      - https://dune.com
