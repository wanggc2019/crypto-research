schema_version: 1
stage: 4
title: 输出：监管、安全、前沿与研究方法
weeks: "W13–W16"
items:
  # ===== 概念课 c401–c420（order 1–20，固定六节）=====
  - id: c401
    type: concept
    stage: 4
    order: 1
    title: Howey 测试
    en: Howey Test
    minutes: 11
    tags: [regulation, securities]
    sections:
      - h: 一句话
        p: Howey 测试（Howey Test）源自美国最高法院 1946 年 SEC 诉 W.J. Howey 案的判决，用来判断一笔交易是否构成“投资合同”（investment contract）这一证券类别；若构成，其发行与销售就要遵守美国证券法。
      - h: 为什么重要
        p: 它决定代币是否被当作证券监管，进而决定注册或豁免、披露义务、交易场所的合规成本与执法风险。美国 SEC 的加密执法几乎都从“四要件是否满足、买方是否依赖他人关键努力”展开，读不懂 Howey 就读不懂美国的监管动作与和解条件。
      - h: 核心机制
        p: 四要件是：投入金钱、共同事业（common enterprise）、合理期待利润、利润来自他人努力。四者同时满足才算投资合同。判断对象是“交易的经济实质”——买方为什么付钱、期待什么、依赖谁，而不是资产的名字或是否用了区块链。判断时不看白皮书怎么自称，而看资金流向、承诺与信息不对称：买方是否只能依赖发行方交出关键成果。
      - h: 例子
        p: Ripple 案中，法院把机构销售（有合同、锁仓与营销承诺，买方依赖团队）与交易所程序化盲卖（买方不知道交易对手、不依赖发行方）区分开，结论不同；Telegram 的 Grams 预售则因购买者依赖团队把 TON 网络做起来而被认定构成证券发行。
      - h: 常见误解
        p: 误以为“代币去中心化后自动脱离证券认定”，或“做了 KYC 就不是证券”，或“上线大交易所就合规”。Howey 看的是具体销售情形；单一动作（发币、上所、做 KYC）都无法自动改变定性，同理也不存在“注册一次就一劳永逸”。
      - h: 边界与代价
        p: 它是判例标准，边界由个案累积，缺乏事前确定性：项目方在发行前难有确定结论，只能靠律师意见、限制销售对象（如排除美国人士）、充分披露来降低风险。它也不处理商品、支付工具等其他类别，不能代表全部监管（本文不构成法律意见）。
    quiz:
      - q: Howey 四要件中“共同事业”指什么？
        a: 投资者的资金与发行方的努力被捆绑在同一事业里、收益相互关联；常见形式是横向共同性（资金汇集共享收益）或纵向共同性（投资者依赖发起人的经营能力）。
      - q: 为什么 Howey 分析必须“逐交易”而不是“逐代币”？
        a: 因为四要件考察具体销售情形：买方是否投入金钱、是否依赖发行方努力获利。同一代币的私募与二级盲卖可能得出不同结论，甚至相反。
      - q: Howey 给项目方带来的最大成本是什么？
        a: 事前不确定性。判例标准要逐案适用，项目在发行前难有确定答案，只能靠法律意见、销售对象限制与披露设计来降低风险，并承担事后被重新认定的可能。
    sources:
      - https://www.sec.gov

  - id: c402
    type: concept
    stage: 4
    order: 2
    title: MiCA
    en: Markets in Crypto-Assets (MiCA)
    minutes: 11
    tags: [regulation, eu]
    sections:
      - h: 一句话
        p: MiCA 是欧盟《加密资产市场条例》（Regulation (EU) 2023/1114），为加密资产发行与加密资产服务商（CASP）建立统一规则与牌照，2024 年 12 月 30 日起全面适用，一张牌照可在成员国间通行（passporting）。
      - h: 为什么重要
        p: 它是覆盖面最广的成文立法，把“要不要监管”变成“归到哪一类”：资产参照型代币（ART）、电子货币代币（EMT）与其他加密资产分别对应不同义务。其他辖区的立法常以它为参照，理解它的分类法比记住条文更有用。
      - h: 核心机制
        p: 分类监管加牌照通行：ART 锚定一篮子资产，须白皮书、储备与赎回；EMT 锚定单一法币，同时叠加电子货币规则；其余代币原则上只需白皮书（若构成金融工具则另说）。CASP 在任一成员国获授权后即可向全欧盟提供服务，并按交易、托管、兑换、转移等服务类型承担义务。
      - h: 例子
        p: 一家交易平台若在爱尔兰取得 CASP 授权，可依 passporting 向其他成员国提供服务，但仍须遵守东道国营销与消费者保护规则；若它同时上架某种构成金融工具的代币，还要叠加 MiFID II 的牌照与披露要求——一张 MiCA 牌照并不覆盖全部业务。
      - h: 常见误解
        p: 误以为 MiCA 管住所有加密活动。DeFi 协议本身、多数 NFT、完全去中心化的服务目前多不在其核心范围；借贷生息、衍生品等产品往往仍归 MiFID II 等既有法规。写“MiCA 合规”之前，先确认资产与服务落在哪一档。
      - h: 边界与代价
        p: MiCA 是条例而非指令，成员国直接适用，但落地依赖各国主管机构与 ESMA 的技术标准，执行节奏与解释仍有差异。合规成本（资本、治理、白皮书审阅、持续披露）对小机构是硬门槛，也可能抬高欧盟市场的服务价格。此外，监管技术标准（RTS、ITS）由 ESMA 与各国主管机构制定，读 MiCA 时要连这些二级文件一起看，否则会漏掉操作层要求。
    quiz:
      - q: MiCA 的 ART 与 EMT 有什么关键差别？
        a: ART 锚定一篮子资产或其他资产组合，EMT 只锚定单一法定货币。EMT 叠加电子货币规则，两者都必须持有储备并支持按面值赎回，但适用范围与约束强度不同。
      - q: 什么叫 passporting，为什么它重要？
        a: 在任一成员国获得 CASP 授权后即可向其他成员国提供服务，无需逐国申请。这让合规成本一次性投入、市场覆盖整个欧盟，是 MiCA 统一市场的核心设计。
      - q: 为什么“MiCA 合规”不能替代其他牌照判断？
        a: MiCA 只管加密资产及其服务；若代币或产品构成金融工具（如衍生品、基金份额），仍要适用 MiFID II 等法规并额外授权，两者是并行而非替代关系。
    sources:
      - https://www.esma.europa.eu

  - id: c403
    type: concept
    stage: 4
    order: 3
    title: GENIUS Act
    en: GENIUS Act (US, 2025)
    minutes: 11
    tags: [regulation, stablecoin]
    sections:
      - h: 一句话
        p: GENIUS Act 是美国联邦层面的支付稳定币法，2025 年 7 月 18 日签署成法，为“支付稳定币”（payment stablecoin）发行人建立联邦与州两套牌照路径，并规定储备、披露与禁止付息等要求。
      - h: 为什么重要
        p: 它第一次把稳定币从“可能算证券、可能算存款”的模糊地带单独立法，把监管落点放在发行人而不是代币本身。稳定币是链上美元的主要载体，其储备与赎回标准直接决定 DeFi 与 RWA 的底层资产质量。
      - h: 核心机制
        p: 发行人须持有至少 1:1 的合格流动资产（如现金、短期国债等），与自有资产隔离，定期披露储备构成；不得向持币人支付利息或收益；达到规模门槛的发行人进入联邦监管框架，未达门槛者可在满足条件的州制度下运营，两套路径标准并不完全一致。
      - h: 例子
        p: 一家发行量超过门槛的发行人，需要按联邦框架申请牌照、定期披露储备与赎回政策并接受检查；储备以短期国债为主时，利息归发行人而非持币人。这正是“禁止付息”条款要处理的利益分配问题，也是它被类比为“窄银行”的原因。对做支付的公司，这意味着合规路径要先定下来：走联邦牌照还是州制度、储备放在哪类资产、托管由谁做，直接决定产品能不能上线。
      - h: 常见误解
        p: 误以为 GENIUS Act 管所有加密资产。它只覆盖支付稳定币发行人及特定相关活动，不解决比特币、以太币或证券型代币的定性；也不等于稳定币获得存款保险，破产时持币人仍按法定清偿顺序受偿。
      - h: 边界与代价
        p: 法律落地靠实施规则：OCC 实施终规于 2026 年 10 月 21 日定稿、2027 年 1 月 18 日生效（以官方公告为准），过渡期内已发行稳定币的安排要看细则。州与联邦双轨可能带来标准差异，境外发行人如何适用也需看后续规则。另外，法律明确把支付稳定币排除在证券与商品之外，但这不改变其他类型代币的定性，也不代表发行人的其他业务自动合规。
    quiz:
      - q: GENIUS Act 对稳定币储备的核心要求是什么？
        a: 至少 1:1 的合格流动资产，与自有资产隔离，定期披露构成；不得挪用储备，也不得向持币人支付利息或收益，储备收益归发行人。
      - q: 为什么“禁止付息”是这部法的关键条款？
        a: 付息会让支付稳定币更像存款或证券，模糊监管边界并引发与银行体系的竞争；禁止付息把稳定币定位为支付工具，避免其变成影子存款。
      - q: 这部法没有解决哪些问题？
        a: 它不管比特币、以太币等资产的定性，不给稳定币存款保险，也没有统一州与联邦的实施细节；跨境发行与境外发行人的适用仍待后续规则。
    sources:
      - https://www.occ.treas.gov

  - id: c404
    type: concept
    stage: 4
    order: 4
    title: 42 号文
    en: PBoC Notice No.42 (2026)
    minutes: 12
    tags: [regulation, china]
    sections:
      - h: 一句话
        p: 42 号文是 2026 年 2 月 6 日中国人民银行等八部门发布的《关于进一步防范和处置虚拟货币等相关风险的通知》（银发〔2026〕42 号），自发布之日起施行，同时废止 2021 年 9 月 24 日的银发〔2021〕237 号通知。
      - h: 为什么重要
        p: 它是当前中国内地监管的基准文件，把“虚拟货币”与“现实世界资产（RWA）代币化”并列处理：前者相关业务活动属非法金融活动、一律严格禁止；后者原则禁止、例外须经同意。做合规判断、写研究报告，都不能再引用已废止的 924 通知表述。
      - h: 核心机制
        p: 三条主线：一是定性（虚拟货币无法偿性，不得作为货币流通；境内兑换、作为中央对手方买卖、信息中介与定价、代币发行融资等属非法金融活动）；二是链条治理（金融机构、支付机构、互联网平台、市场监管、地方政府的责任分工）；三是跨境（未经同意，境内主体及其控制的境外主体不得在境外发行虚拟货币）。
      - h: 例子
        p: 一家境内公司为境外交易所提供支付通道或撮合，可能被认定为“为虚拟货币相关业务提供信息中介或资金服务”；一家境内企业以境内应收账款收益权为基础到境外发行代币，则落入“以境内权益为基础的境外 RWA 代币化”，按“相同业务、相同风险、相同规则”由发改委、证监会、外汇局等分工监管，未经同意或备案不得开展。
      - h: 常见误解
        p: 误以为 42 号文只是重申旧通知。它新增了 RWA 代币化的定义与例外通道、境内主体赴境外的限制、企业名称与经营范围禁用相关字样、金融机构不得为未获同意的 RWA 业务提供托管清算等规定；继续引用 924 表述会失准。
      - h: 边界与代价
        p: 例外通道是“经业务主管部门依法依规同意、依托特定金融基础设施”，不等于一般许可，个案判断；文件约束境内主体与向境内提供服务的行为，不评价境外辖区合法性。它属规范性文件而非司法解释，具体定性仍看后续执法与配套规则（本文不构成法律意见）。
    quiz:
      - q: 42 号文如何界定 RWA 代币化？
        a: 用加密技术与分布式账本把资产所有权、收益权等转化为代币或具有代币特性的权益凭证，并发行和交易的活动；境内开展及提供中介、技术服务原则禁止。
      - q: “经同意并依托特定金融基础设施”意味着什么？
        a: 这是例外通道，不是普遍许可：只有经业务主管部门依法依规同意、在特定金融基础设施上开展的业务才可能被允许，需个案判断。
      - q: 42 号文对跨境发币与跨境代币化怎么说？
        a: 未经同意，境内主体及其控制的境外主体不得在境外发行虚拟货币；以境内权益为基础的境外代币化业务须经同意或备案，按“相同业务、相同风险、相同规则”监管。
    sources:
      - https://www.pbc.gov.cn/tiaofasi/144941/3581332/2026020619591971323/index.html

  - id: c405
    type: concept
    stage: 4
    order: 5
    title: VASP
    en: Virtual Asset Service Provider
    minutes: 10
    tags: [regulation, aml]
    sections:
      - h: 一句话
        p: VASP（Virtual Asset Service Provider，虚拟资产服务商）是金融行动特别工作组（FATF）定义的概念：以业务形式提供虚拟资产与法币兑换、虚拟资产间兑换、转移、保管或代管，以及相关金融服务的机构。
      - h: 为什么重要
        p: 各国反洗钱制度以 VASP 为落点：注册或牌照、客户尽调、记录保存、可疑交易报告与 Travel Rule。虚拟资产在多数辖区没有“证券法入口”时，反洗钱往往是第一道、有时是唯一一道监管闸门；理解它才能理解平台为何被要求持牌、封禁地址、上报可疑交易。
      - h: 核心机制
        p: FATF 建议 15 要求各国对 VASP 实施注册或许可与监督，并按风险为本（risk-based approach）施加义务；VASP 之间的转账要传递发起人与受益人信息（建议 16 的延伸）。定义的关键在“以业务形式”提供服务，而非技术形态：托管钱包、场外兑换、转账撮合都可能落入。
      - h: 例子
        p: 香港自 2023 年 6 月起按《打击洗钱条例》对虚拟资产交易平台实施发牌，平台须满足资本、托管、客户资产隔离、KYC 与 Travel Rule 等要求；一家只做场外兑换的门店若被认定为经营虚拟资产服务，同样可能落入牌照或注册范围。反过来，只提供区块浏览器或非托管钱包软件的公司，通常不被要求持 VASP 牌照，因为它不掌握客户资产。
      - h: 常见误解
        p: 误以为“只有中心化交易所算 VASP”。只做代管钱包、OTC 兑换、支付转账的机构也可能落入定义；反过来，纯软件开发者或完全非托管的工具通常不属于 VASP。是否受监管取决于辖区定义与豁免，不能拿一地名单套另一地。
      - h: 边界与代价
        p: VASP 是反洗钱框架下的概念，不解决证券、商品或税务定性；同一机构可能同时是 VASP 与持牌证券商，需要叠加两套义务。合规成本高（KYC、链上分析、Travel Rule 消息层），这正是很多小平台退出或被并购的原因。对研究者，判断一个平台是否受某地监管，要看它是否在该地招揽客户、提供本地支付渠道，而不只看注册地。
    quiz:
      - q: VASP 的监管落点为什么主要在反洗钱？
        a: 因为虚拟资产常先进入反洗钱框架：注册或牌照、客户尽调、记录保存、可疑交易报告与 Travel Rule 都在这一层落地，证券或商品定性则另需单独判断。
      - q: 判断一个机构是不是 VASP，关键看什么？
        a: 看是否以业务形式提供兑换、转移、保管等服务，而不是看是否用了区块链；托管与撮合是关键特征，纯非托管工具通常不在范围内。
    sources:
      - https://www.sfc.hk

  - id: c406
    type: concept
    stage: 4
    order: 6
    title: KYC 与 AML
    en: KYC / AML
    minutes: 10
    tags: [aml, compliance]
    sections:
      - h: 一句话
        p: KYC（Know Your Customer，了解你的客户）是识别并验证客户身份、受益所有人与资金来源的动作；AML（Anti-Money Laundering，反洗钱）是包含 KYC、交易监测、可疑报告与记录留存的整套制度。
      - h: 为什么重要
        p: 链上资金可追溯但身份不可追溯，合规卡点几乎都在入金、出金与托管环节。理解 KYC 与 AML 能解释很多链上现象：交易所为何冻结账户、下架匿名币、对高风险地址要求补充材料，稳定币发行方为何能冻结地址。
      - h: 核心机制
        p: 典型流程是“识别—验证—风险分级—持续监测—报告”：开户时收集身份与受益所有人信息，按风险分级决定尽调强度（简化或加强），交易中做名单筛查与行为监测，触发阈值就提交可疑交易报告（STR），并按规定年限保存记录。风险分级通常按地域、业务类型、客户类型与资金来源划分；高风险客户要做加强尽调（EDD），必要时拒绝服务并留存理由。
      - h: 例子
        p: 一笔从混币器流出的资金进入交易所充值地址，链上分析会给出风险评分；合规系统命中后，交易所可能要求说明资金来源、限制提现或上报。近年对混币服务的制裁与执法，使许多平台直接把“与受制裁地址交互”列为拒绝服务条件。
      - h: 常见误解
        p: 误以为“链上匿名所以反洗钱无效”。公链是假名（pseudonymous）不是匿名：地址聚类、交易所 KYC 记录、IP 与设备信息、链下情报可以把地址簇还原到真实主体。反过来，也别把“链上可追溯”当成“必然被追到”，混币、跨链与场外交易仍能提高追踪成本。
      - h: 边界与代价
        p: KYC 让守规矩的平台承担全部身份成本，而离岸不合规平台反而“体验更好”，形成监管套利；过度合规会排除正常用户（如无银行账户者），这也是去中心化身份讨论的起点。身份数据留存本身还带来隐私与泄露风险。另外，AML 的有效性依赖跨境协作：一国冻结的账户，在另一国可能照常运营；反过来，制裁名单的域外效力又会让平台在多地同时受限，合规团队要同时盯多套名单。
    quiz:
      - q: KYC 与 AML 的关系是什么？
        a: KYC 是 AML 的一个基础动作：先识别并验证客户身份与受益所有人，AML 再叠加风险分级、交易监测、可疑交易报告与记录留存。
      - q: 为什么说公链是“假名”而不是“匿名”？
        a: 地址不直接绑定身份，但交易永久公开且可聚类；只要地址簇中任一地址在中心化平台完成 KYC，整簇就可能被关联到真实主体。
    sources:
      - https://www.hkma.gov.hk

  - id: c407
    type: concept
    stage: 4
    order: 7
    title: Travel Rule
    en: Travel Rule
    minutes: 10
    tags: [aml, transfer]
    sections:
      - h: 一句话
        p: Travel Rule 是把 FATF 建议 16 延伸到虚拟资产转账的规则：转账时付款方与收款方的 VASP 必须随转账传递发起人与受益人信息（姓名、账号或地址等），并按辖区要求留存。
      - h: 为什么重要
        p: 它把传统电汇的“汇款人信息”搬进链上世界，是 VASP 合规中最难落地的一环：需要链下消息层、统一数据格式（如 IVMS101）与地址归属识别。它也划定了隐私边界——非托管钱包转账是否要额外验证，各辖区规定不同。对机构，它还是审计最容易挑出问题的一环：字段缺失、未留存、未做地址归属判断，都会被记为缺陷。
      - h: 核心机制
        p: 两个 VASP 之间通过协议（如 TRP、TRISA 等）交换信息；链上交易本身只承载地址与金额，身份信息走链下通道。发起方要判断收款地址是否属于某 VASP（否则信息无处可送），这就是“地址归属”难题；金额门槛与自托管钱包规则由各辖区设定。IVMS101 是常用的字段标准，把姓名、地址、账号等结构化，方便不同系统对接。
      - h: 例子
        p: 欧盟《资金转移条例》（TFR）要求对自托管钱包的转账在超过 1000 欧元时采取额外措施（如验证地址所有权）；一笔从交易所提到自托管钱包的转账，交易所可能要求用户证明钱包归属，否则限制或拒绝出金。对用户最直观的体验是“转账要填对方姓名”与“提币到陌生地址需额外确认”，这些都是 Travel Rule 在产品层的投影。
      - h: 常见误解
        p: 误以为“链上没附言就无法传递信息”。Travel Rule 的信息不走链上，而走服务商之间的链下通道；反过来也别以为“链上公开就等于合规方能看到全部”——地址归属识别才是真正难点。
      - h: 边界与代价
        p: 它只覆盖 VASP 之间的转账，两个自托管钱包之间的转账通常不在范围内；不同辖区门槛、字段与执行时间不一致，跨境转账“缺字段”时只能人工补录或阻断。对小机构，接入消息层的工程与合规成本很高。因此它的落地顺序通常是：先覆盖交易所之间的转账，再处理自托管钱包，最后才是跨辖区互认；任何一步缺失，跨境链路都会断在“信息不全”上。
    quiz:
      - q: Travel Rule 的信息走链上还是链下？
        a: 链下。由付款方与收款方 VASP 通过约定协议交换发起人与受益人信息，链上交易本身只有地址与金额，因此还需要额外的地址归属识别。
      - q: 为什么“地址归属识别”是 Travel Rule 的关键难点？
        a: 只有先判断收款地址属于哪个 VASP，才能把信息送到对应机构；非托管钱包与交易所共用地址池时很难区分，只能靠额外验证与人工处理。
    sources:
      - https://www.hkma.gov.hk

  - id: c408
    type: concept
    stage: 4
    order: 8
    title: RWA
    en: Real World Assets
    minutes: 11
    tags: [rwa, tokenization]
    sections:
      - h: 一句话
        p: RWA（Real World Assets，现实世界资产）指把国债、货币基金、应收账款、房地产、大宗商品等资产的所有权或收益权转化为链上代币，并进行发行与交易的活动。
      - h: 为什么重要
        p: 它的价值不是“上链更酷”，而是把分销、结算、抵押与对账搬到可编程账本上，减少中介环节；同时把证券法、信托、审计、托管等线下合规要求一起引入链上。理解 RWA 就是理解“链上收益从哪来、法律上归谁”。
      - h: 核心机制
        p: 典型结构是“资产—法律载体—代币”三层：持牌机构或基金持有底层资产，通过 SPV、信托或基金份额做法律隔离，再由发行方在链上铸造代表份额的代币；托管行保管资产，审计与净值披露按日或按月进行，赎回由发行方按合同处理。
      - h: 例子
        p: 代币化国债产品通常由持牌资管持有短期国债，代币价格锚定每日净值，赎回按基金规则在 T+1 或 T+2 结算；代币在链上可以 7×24 转让，但申购赎回受营业日与合规审查限制——“链上流动”与“法律赎回”是两套时钟。
      - h: 常见误解
        p: 误以为“代币化就等于去中心化”。绝大多数 RWA 由中心化主体发行，需要托管、审计与法律实体隔离；持有人享有的是对发行人的合同与法律追索权，而不是对链上协议的信任。也别把“链上有余额”当成“资产已被隔离”。还有一类误解是“有了链上代币就自动获得流动性”：真实流动性取决于做市安排与投资者准入，很多 RWA 代币的实际成交极少。
      - h: 边界与代价
        p: 三类风险最易被低估：破产隔离是否真的成立、储备与代币的 1:1 是否可验证（审计频率、托管方是谁）、赎回通道是否畅通。中国内地 42 号文对境内 RWA 代币化原则禁止、例外须经同意；跨境结构还要看外汇与证券监管（本文不构成法律意见）。另外，RWA 的利息与赎回款通常走传统银行通道，链上代币只是权益凭证，资金流与信息流并不同步。
    quiz:
      - q: RWA 的“三层结构”指什么？
        a: 底层资产、法律载体（SPV、信托或基金）、链上代币。代币只承载份额的登记与转让，权利与追索靠法律结构。
      - q: 为什么“链上流动性”不等于“能赎回”？
        a: 代币可以随时转让，但赎回权由发行文件与基金规则决定，受营业日、合规审查与托管流程限制；两者是不同机制，不能互相替代。
      - q: 评估 RWA 项目最先要问什么？
        a: 破产隔离是否成立、储备与代币是否 1:1 且可验证、赎回通道是否畅通；这三点决定代币背后的法律与经济实质。
    sources:
      - https://ethereum.org

  - id: c409
    type: concept
    stage: 4
    order: 9
    title: DePIN
    en: DePIN
    minutes: 10
    tags: [depin, infrastructure]
    sections:
      - h: 一句话
        p: DePIN（Decentralized Physical Infrastructure Networks，去中心化物理基础设施网络）指用代币激励分散参与者贡献物理资源（带宽、存储、算力、传感器数据、充电桩等），再由网络调度并出售给需求方的模式。
      - h: 为什么重要
        p: 它把资本开支从一家公司转移给大量个人：设备谁买、谁维护、收益怎么分由链上规则与代币结算。它也是“代币是否有真实需求”的试金石——如果只有供给被补贴、没有人为服务付费，网络在激励退坡后就会萎缩。它的判断标准其实与 SaaS 类似：付费客户留存、单位经济模型与毛利，而不是节点数量或代币市值。
      - h: 核心机制
        p: 三角结构：供给方（贡献设备与运维）、需求方（购买服务并付费）、协议（计量、结算与惩罚）。链上负责记账与激励分配，链下负责真实资源的计量与质量验证（带宽测速、存储挑战、传感器数据校验），这个“计量”环节是攻击重点。计量数据的可信度依赖硬件与挑战机制，若硬件可被伪造，链上结算的就是假数据。
      - h: 例子
        p: 去中心化存储网络要求节点定期提交存储证明，未通过则扣罚质押；带宽网络按实际流量结算，需求方用稳定币付费。判断项目时看两个数：单位资源成本与付费需求增长率，而不是设备总数或质押量。再看成本端：设备折旧、电费、带宽与运维都由供给方承担，代币价格下跌时这些成本不会同步下降，这是理解 DePIN 周期性的关键。
      - h: 常见误解
        p: 误以为“设备多就是网络强”。很多项目只有供给没有需求，设备是冲着代币补贴买的，补贴下降后离线率立刻上升，这是补贴驱动的虚增而非网络效应。反过来，也有项目需求真实但代币设计与资源贡献脱节，价值难以捕捉到代币上。
      - h: 边界与代价
        p: 物理资源的边际成本、延迟与合规（频谱、数据出境、隐私）决定它能否与中心化云竞争；代币激励还会吸引“薅羊毛”设备，挤压真实供给方收益。多数 DePIN 的护城河在需求侧合约与运维网络，不在代币本身。此外，DePIN 的“去中心化”常只在供给侧成立：需求方往往由一家基金会签下来，与传统云厂商的分销并无本质差别，评估时要区分。
    quiz:
      - q: DePIN 的“三角结构”是什么？
        a: 供给方贡献设备与运维，需求方付费购买服务，协议负责计量、结算与惩罚；链上记账，链下做资源计量与质量验证。
      - q: 判断 DePIN 项目最关键的两个数是什么？
        a: 单位资源成本与需求侧付费收入（及其增长率）。设备数量与质押量只是补贴的结果，不能证明网络有真实需求。
    sources:
      - https://defillama.com

  - id: c410
    type: concept
    stage: 4
    order: 10
    title: 意图
    en: Intent
    minutes: 10
    tags: [intent, execution]
    sections:
      - h: 一句话
        p: 意图（Intent）是“声明想要的结果”而不是“逐步写操作”：用户签名表达目标（例如用 100 USDC 换至少 99 USDC 等值的 ETH、并在某个期限内完成），由求解器（solver）竞争完成，用户只验证结果。
      - h: 为什么重要
        p: 它把路由、Gas、撮合等执行复杂度从用户转移到专业方，改变了钱包、订单流与 MEV 的产品形态；跨链意图标准（如 ERC-7683）让“一次签名、多链成交”成为可能。代价是信任假设变了：谁能看见你的意图、谁替你执行、失败如何退款，都要重新评估。
      - h: 核心机制
        p: 用户签一份包含约束的订单（资产、数量、最低成交、截止时间、可撤销性），广播到订单池；求解器竞价撮合并承担执行风险；成交由合约校验约束后结算。关键设计是“约束是否可验证”与“谁能抢先执行”——签名即授权，不能事后反悔。订单通常写明“部分成交也可接受”还是“全部成交或取消”，这个参数决定求解器能否拆单，也直接影响成交概率与价格。
      - h: 例子
        p: 跨链 swap 中，用户在主链签名一个意图，求解器先在其他链垫付资金完成成交，再回主链结算。用户不必自己桥接、不必持有目标链 Gas；但若求解器违约或订单被抢跑，用户拿到的价格可能变差，责任界定也更复杂。链上只看到结算结果，看不到中间路径。
      - h: 常见误解
        p: 误以为“只是签个名就没风险”。意图签名常包含授权求解器可执行的内容，签名即承诺；钓鱼常伪装成“领取空投”的签名请求，签了资产就可能被划走。也别把意图等同于“零成本”——费用被折进成交价或由求解器转嫁。另一种误解是把意图当成“万能订单”：若资产本身没有流动性，求解器也不会凭空造出成交，意图只是改变了撮合的组织方式。
      - h: 边界与代价
        p: 意图适合“结果可验证、失败可退款”的场景；对需要精确控制的策略（逐笔风控、合规审查）反而增加不确定性。求解器集中会带来审查与串谋风险，订单池可见性也可能泄露交易意图、加剧 MEV。还要注意，意图把“失败”的成本重新分配：求解器垫付后若用户撤单，谁承担滑点与 Gas，需要在协议层写清楚。
    quiz:
      - q: 意图架构把哪些工作转给了求解器？
        a: 路径选择、路由、Gas 支付与撮合等执行细节；用户只声明约束（数量、时限、最低成交价），由求解器竞争寻找可行执行方案。
      - q: 意图签名的最大安全风险是什么？
        a: 签名即授权。用户往往看不清签名内容的可执行范围，钓鱼网站用“领空投”诱导签名后，求解器或攻击者可按授权划走资产。
    sources:
      - https://eips.ethereum.org

  - id: c411
    type: concept
    stage: 4
    order: 11
    title: 零知识证明
    en: Zero-Knowledge Proof
    minutes: 11
    tags: [zk, privacy]
    sections:
      - h: 一句话
        p: 零知识证明（ZKP，Zero-Knowledge Proof）让证明者在不泄露秘密本身的前提下，向验证者证明某个陈述为真，例如证明自己知道某地址的私钥、或证明某笔转账合法，而不公开私钥或金额。
      - h: 为什么重要
        p: 它把“验证成本”与“计算成本”分开：链上只验证一个短证明，重计算放到链下。zkRollup 的压缩、隐私交易、以及“证明年龄满 18 岁但不暴露生日”这类凭证都建立在它之上，是扩容与隐私的共同底座。
      - h: 核心机制
        p: 证明系统要满足完备性（真陈述可被证明）、可靠性（假陈述难以被证明）、零知识（不泄露额外信息）。常见构造有 zk-SNARK（证明短、验证快，但通常需要可信设置）与 zk-STARK（透明设置、无需信任初始化，但证明体积更大）。证明的生成与验证是两套算法：生成要慢、要重，验证要快、要便宜；这种不对称正是可验证计算的价值来源。
      - h: 例子
        p: zkRollup 把上千笔交易在链下执行，生成一份证明提交到主网：主网验证证明即可确认状态转换正确，无需重放每笔交易。隐私池则用证明“我的存款在池中且未被花过”，而不公开是哪一笔存款。
      - h: 常见误解
        p: 误以为“零知识等于完全匿名”。ZKP 只保护陈述之外的信息；地址、金额、时间关系仍可能从链上元数据泄露，隐私强度取决于整套系统设计（匿名集大小、存取款模式）。也别把“用了 ZK”当成“技术更先进”。
      - h: 边界与代价
        p: 证明生成需要重型计算与专门硬件，开发门槛高；可信设置若被攻破会破坏可靠性；验证开销虽小但仍是链上成本。对不需要隐藏信息的场景，ZKP 带来的复杂度没有对应收益。另外，ZKP 并不自动带来可组合性：证明系统、电路与验证合约往往绑定特定应用，跨协议复用需要重新开发与审计，这是采用成本高的一部分原因。
    quiz:
      - q: zkRollup 为什么能降低主网负担？
        a: 它在链下执行大量交易，只向主网提交一份简洁证明与少量状态数据；主网验证证明的成本远低于逐笔重放全部交易。
      - q: zk-SNARK 与 zk-STARK 的主要权衡是什么？
        a: SNARK 证明小、验证便宜，但常需可信设置；STARK 透明设置、无需信任初始化，但证明体积更大、验证成本更高。
      - q: 为什么“用了零知识证明”不等于匿名？
        a: ZKP 只隐藏证明所涉的秘密；地址、金额与时序等元数据仍可能暴露，隐私取决于匿名集大小与整套系统设计。
    sources:
      - https://ethereum.org

  - id: c412
    type: concept
    stage: 4
    order: 12
    title: DAO
    en: DAO
    minutes: 11
    tags: [dao, governance]
    sections:
      - h: 一句话
        p: DAO（Decentralized Autonomous Organization，去中心化自治组织）是用智能合约与代币投票管理共同资金和规则的协作组织，提案、投票与执行记录在链上，没有传统的董事会与雇佣结构。
      - h: 为什么重要
        p: 它把组织规则变成可审计代码：金库支出、参数调整、协议升级都走提案流程。同时暴露新问题：投票权按持币量分配、参与率低、委托集中于少数人，治理容易被大户与联盟俘获；理解 DAO 是判断“协议到底谁说了算”的入口。
      - h: 核心机制
        p: 典型流程是“提案—讨论—投票—时间锁—执行”：提案需达到门槛与押金，投票期固定，通过后进入时间锁（timelock）供退出或否决，再由多签或执行合约落地。关键参数是门槛、法定人数（quorum）、投票权来源与执行权限。委托（delegate）机制让持币人把票委托给代表，提高了形式参与率，但也把实际权力集中到少数代表手里。
      - h: 例子
        p: 一个协议要调整借贷利率参数，提案者质押代币发起，投票率达门槛后进入 48 小时时间锁；期间若社区反对，可通过紧急提案或多签否决。若升级权限其实在基金会多签手里，链上投票就只是建议。时间锁到期前，持币人可以选择退出，这是“用脚投票”的硬约束。
      - h: 常见误解
        p: 误以为“代码即法律所以没有法律争议”。链上决议在多数辖区法律效力并不明确，代币持有人是否对实体行为负责、提案是否可诉，取决于注册实体与当地法律；也别把“有治理代币”当成“有治理权”。
      - h: 边界与代价
        p: 完全链上治理慢且贵，紧急情况响应差，所以多数项目用“链下讨论加多签执行”的混合模式，代价是透明度下降。投票权与持币量挂钩会把治理变成资本投票，长期持有者与短期投机者的利益也不一致。另一个现实问题是参与度：多数 DAO 的实际投票率很低，法定人数门槛若也低，少数活跃地址即可决定结果。另一个隐性成本是协调：提案、讨论与投票都要占用贡献者时间，治理越活跃，开发节奏越容易被拖慢，这也是很多团队转向委托与专门委员会的原因。
    quiz:
      - q: DAO 治理的典型流程有哪几步？
        a: 提案（含门槛与押金）、讨论、投票（含法定人数）、时间锁、执行；时间锁用于给社区留出退出或否决的窗口。
      - q: 为什么“治理代币”不等于“治理权”？
        a: 若升级与资金实际由基金会多签执行、提案可被单方否决，代币投票只是建议；真实控制权要看链上权限表与多签成员。
    sources:
      - https://ethereum.org

  - id: c413
    type: concept
    stage: 4
    order: 13
    title: 链上治理
    en: Onchain Governance
    minutes: 11
    tags: [governance, multisig]
    sections:
      - h: 一句话
        p: 链上治理（onchain governance）指提案、投票、执行全部通过链上合约完成，结果可自动触发参数修改或资金划转；与之相对的是链下讨论加多签执行的混合模式。
      - h: 为什么重要
        p: 区分“治理表演”与“真实控制权”是研究协议的关键：升级权限在谁手里、多签成员是谁、时间锁多长，比白皮书里写不写“去中心化”重要得多。很多被称作“社区治理”的协议，实际升级权在一个 3/5 多签。
      - h: 核心机制
        p: 三个可查的权限点：一是升级权限（代理管理权在谁手里，能否直接替换实现合约）；二是资金权限（金库多签的成员、门槛、能否绕过时间锁）；三是参数权限（预言机、费率、抵押率由谁改）。这些都能在区块浏览器与治理合约里逐条核对。多签的成员与门槛通常对外披露，但签名人之间的独立性（同一家公司、同一台设备）往往不披露，那才是真实风险点。
      - h: 例子
        p: 某协议声称完全去中心化，但其代理管理权由一个 3/5 多签持有，成员是基金会与早期投资人；这意味着三人合谋即可替换合约逻辑，代币投票无法阻止。判断时先看权限表，再看投票数据。反过来，若升级必须经过代币投票且时间锁足够长，即使多签存在，攻击者也来不及悄悄替换合约逻辑。
      - h: 常见误解
        p: 误以为“有治理代币就有治理权”。若升级可由多签直接执行、提案门槛被基金会控制、或投票结果可被延迟到“有利时机”执行，代币投票就只是建议；也别把“投票率高”当成“治理健康”。另一个误解是“把权限交给多签就安全了”：多签的安全性取决于签名人的独立性与操作纪律，若签名人共用同一台设备或同一个密码管理器，多签就退化成单签。
      - h: 边界与代价
        p: 完全链上治理的安全性依赖合约正确性与参与度，低参与度会让少数人低成本控制；时间锁提高安全性却牺牲响应速度。治理攻击（借币投票、闪电贷投票）说明“按持币量分配权力”本身有结构性缺陷。因此阅读文档时应把“治理”拆成三层：谁有权改代码、谁有权动钱、谁有权改参数；三者可能由完全不同的主体控制，任何一层集中都足以否决“去中心化”的说法。
    quiz:
      - q: 判断协议治理是否真去中心化，最直接看什么？
        a: 看链上权限：升级与资金由谁执行、多签成员与门槛、是否有时间锁、提案通过后能否被单方否决。这些可在合约与权限记录中查到。
      - q: 什么是“治理攻击”，为什么可能发生？
        a: 通过临时借入或买入代币获得投票权，推动有利于自己的提案；按持币量分配权力且参与率低时，攻击成本远低于收益。
    sources:
      - https://ethereum.org

  - id: c414
    type: concept
    stage: 4
    order: 14
    title: 空投
    en: Airdrop
    minutes: 10
    tags: [airdrop, incentive]
    sections:
      - h: 一句话
        p: 空投（airdrop）是项目把代币免费分发给特定地址的活动，常见目的是冷启动用户、奖励早期交互，或把治理权分散给社区；分发规则通常按链上行为、持仓或快照时点确定。
      - h: 为什么重要
        p: 空投本质是“用未来代币购买当前行为”的激励设计：规则决定用户怎么刷量，也决定代币分配是否集中。研究者要区分真实使用与女巫（sybil）地址——后者专为领空投制造交互，会系统性污染链上数据。
      - h: 核心机制
        p: 常见判定维度包括：交互的合约与频率、资金跨地址聚类（同一出资地址）、时间分布（批量地址同一时段操作）、Gas 来源与设备指纹、快照前是否留存资产。反女巫常用图分析找出“同一控制人的地址簇”，再整体剔除或降低权重。快照时点一旦公开，地址会在快照前集中操作，这也是很多项目改用随机快照或多期快照的原因。
      - h: 例子
        p: 某项目按“链上交互次数”分配，结果出现大量循环交易地址；下一期改用“资金来源聚类+留存余额+交互合约多样性”，刷量成本随之上升。被判定为女巫的地址通常失去全部份额，已付的 Gas 与桥费无法收回。发放方式也有差异：直接空投、先到先领（claim）、或按任务领取，三者的地址行为与女巫风险完全不同。
      - h: 常见误解
        p: 误以为“交互越多空投越多”。多数项目用反女巫规则剔除批量地址，专门刷量的投入常常打水漂；也别把空投当成无风险收益——领取本身可能要求签名授权，钓鱼常伪装成“空投领取”页面。还有一类风险来自“领取链接”：真实空投通常由官方合约直接分发或官方站点领取，任何要求先授权代币或先签名的“领取”都应先怀疑。
      - h: 边界与代价
        p: 空投会造成代币集中抛压，也把治理权分散到不关心治理的人手里，项目方常用线性释放、锁仓或委托来缓解。对研究者，空投期数据会系统性偏高，分析时须标注“激励期”并剔除女巫地址。对项目方，空投还涉及法律与税务问题：不同辖区对“免费分发”的定性与纳税义务不同，空投与公开销售的边界通常需要法律意见。
    quiz:
      - q: 反女巫筛查通常看哪些信号？
        a: 资金跨地址聚类、交互模式与频率、时间分布、Gas 来源与设备指纹、快照前是否留存资产；核心是找“同一控制人的地址簇”。
      - q: 空投规则为什么会扭曲链上数据？
        a: 规则公布后用户会针对性制造交互，使交易量、活跃地址等指标被激励放大；分析时须剔除女巫地址与短期刷量行为，否则会把补贴误读成需求。
    sources:
      - https://dune.com

  - id: c415
    type: concept
    stage: 4
    order: 15
    title: 模块化区块链
    en: Modular Blockchain
    minutes: 11
    tags: [modular, rollup]
    sections:
      - h: 一句话
        p: 模块化（modular blockchain）把区块链的职能拆成执行、结算、共识与数据可用性（DA）四层，各层由不同网络承担，而不是像单体链那样全在一层完成。
      - h: 为什么重要
        p: 拆分后每层可独立优化：Rollup 做执行，以太坊做结算与共识，外部 DA 层承担数据发布。理解分层才能解释 Rollup 费用为何取决于 DA 成本，以及“以太坊被吸血”争论的实质——费用流向哪一层，价值就留在哪一层。
      - h: 核心机制
        p: 执行层产出交易与状态，结算层提供争议解决与最终性，共识层排序，DA 层保证数据可获取。以太坊的路线是“以 Rollup 为中心”：blob 空间（EIP-4844 引入）为 Rollup 提供更便宜的数据发布，DA 成本因此成为 Rollup 费率的主要变量。Rollup 把“执行结果”与“数据”分开：状态根上链保证正确性，数据上链保证可重建，两者缺一不可。
      - h: 例子
        p: 一个 Rollup 把批量交易压缩后发布到以太坊 blob，每笔交易分摊的 DA 成本较 calldata 时代大幅下降；当 blob 使用率饱和时，Rollup 会回退到更贵的模式或排队等待，这就是“DA 成本决定 Rollup 费率”的具体体现。
      - h: 常见误解
        p: 误以为“模块化一定更便宜更安全”。把 DA 外包会引入新的信任假设：DA 层若不保证数据可获取，用户可能无法重建状态或强制退出。成本与安全必须在同一张表上比较，不能只看手续费。
      - h: 边界与代价
        p: 分层越多，跨层通信与故障处理的复杂度越高；结算层拥堵会传导到所有 Rollup，DA 层的去中心化程度也参差。对开发者，选型要在成本、最终性时间与数据可获取性保证之间权衡。另一个常被忽略的代价是流动性碎片化：资产分散在越来越多的 Rollup 上，跨链桥接与流动性调度本身成了新的成本中心。
    quiz:
      - q: 模块化把区块链拆成哪四层？
        a: 执行、结算、共识、数据可用性（DA）。Rollup 做执行，以太坊承担结算与共识，外部 DA 层负责数据发布。
      - q: 为什么 DA 成本会决定 Rollup 的费率？
        a: Rollup 必须把交易数据发布到 DA 层供任何人重建状态，这笔成本按批次分摊到每笔交易；DA 价格或容量变化会直接改变单位成本。
      - q: 外包 DA 的主要风险是什么？
        a: 引入对 DA 层的信任假设：若数据不可获取，用户无法重建状态或执行强制退出，桥与 Rollup 的安全性都会受影响。
    sources:
      - https://ethereum.org

  - id: c416
    type: concept
    stage: 4
    order: 16
    title: 隐私交易
    en: Private Transaction
    minutes: 10
    tags: [privacy, zk]
    sections:
      - h: 一句话
        p: 隐私交易指隐藏转账的发送方、接收方或金额，常见技术包括零知识证明（如 shielded pool，屏蔽池）、环签名与机密交易（confidential transaction）。
      - h: 为什么重要
        p: 公开账本让金额与地址关系永久可见，对人身安全（被针对）与商业机密（供应商、薪资）都是问题；隐私技术同时是合规争议焦点，混币器因被用于洗钱而遭制裁与执法，隐私与合规的张力集中在这里。
      - h: 核心机制
        p: 屏蔽池的做法是存款时把资产换成承诺（commitment），转账时用零知识证明“输入承诺有效且未被花过”，输出生成新承诺；链上只看到承诺与证明，金额与地址被隐藏。匿名集（anonymity set）越大，链上分析越难把存取款对应起来。环签名用“签名者集合”隐藏真实签名人，机密交易用同态承诺隐藏金额，三者解决的信息维度不同。
      - h: 例子
        p: 一笔进入屏蔽池的存款与一笔提款若金额相同、时间接近，即使链上看不到直接关联，也可能被统计对齐推断；反之，资金在池中经过多笔拆分与延迟，推断成本显著上升。这就是“隐私强度取决于使用人数”的具体含义。合规方通常把“来源不明的隐私资金”标为高风险，这也是隐私工具在中心化交易所难以落地的原因之一。
      - h: 常见误解
        p: 误以为“用了隐私协议就查不到”。隐私池的匿名集若很小、存取款金额与时间又能对齐，仍可被统计分析穿透；也别把隐私工具当成规避监管的手段——合规义务不因技术而消失。另一个误解是“隐私交易等于违法”：隐私本身是中性技术，合规判断看资金来源与用途；但受制裁或高风险资金进入隐私池，会连带影响整个池子的可用性。
      - h: 边界与代价
        p: 隐私交易提高合规成本（VASP 难以做 Travel Rule 与风险筛查），可能被交易所拒绝入金；证明生成有计算开销，池子还需要流动性。对个人，隐私保护应优先用于不必公开的信息，而不是掩盖资金来源。此外，隐私工具的合法性因辖区而异：同样的混币技术在部分辖区被视为隐私工具，在另一些辖区可能触发制裁与刑事风险，使用前必须确认所在地规则（本文不构成法律意见）。
    quiz:
      - q: 屏蔽池用零知识证明证明了什么？
        a: 证明输入承诺有效且未被花过、输出金额守恒，而不公开具体金额、发送方与接收方；链上只留承诺与证明。
      - q: 匿名集大小为什么决定隐私强度？
        a: 匿名集越大，攻击者越难把某笔存款与某笔提款对应起来；池子小、金额与时间可对齐时，统计推断仍能穿透。
    sources:
      - https://ethereum.org

  - id: c417
    type: concept
    stage: 4
    order: 17
    title: MEV 拍卖
    en: MEV Auction
    minutes: 11
    tags: [mev, pbs]
    sections:
      - h: 一句话
        p: MEV（Maximal Extractable Value，最大可提取价值）拍卖是把“区块内交易排序权”竞价的市场机制：搜索者（searcher）出价争夺打包位置，出价与区块奖励一起流向验证者。
      - h: 为什么重要
        p: 以太坊的提议者与构建者分离（PBS，Proposer-Builder Separation）把出块拆成构建区块和提议区块，构建者通过 MEV-Boost 竞价把最有价值的区块交给提议者。收益提高的同时，排序权向少数构建者集中，带来审查与中心化风险。
      - h: 核心机制
        p: 搜索者发现套利、清算、三明治机会，构造交易包并向构建者出价；构建者组装区块、模拟收益、出价给提议者；提议者只签名出价最高的区块头，看不到完整内容。拍卖把 MEV 从“验证者独吞”变成“搜索者、构建者、提议者分账”。出价的单位通常是 ETH，构建者之间的竞争会把大部分价值让渡给提议者。
      - h: 例子
        p: 一笔大额 swap 进入内存池后，搜索者构造“前跑+后跑”的三明治包，把用户滑点变成自己的利润；在 PBS 下，这笔利润的大部分以出价形式流向构建者与提议者，用户只承担更差的成交价。清算场景更典型：借贷协议清算有固定奖励，搜索者会竞价抢跑，把本应属于协议的收益部分转成 MEV。
      - h: 常见误解
        p: 误以为“MEV 只是套利者赚差价”。成本由普通用户承担：三明治攻击抬高滑点，抢跑让交易变贵；拍卖机制只是重新分配这笔钱，并不消除它的来源。也别把“MEV 收入高”当成协议健康的标志。另一个误解是“MEV 只影响大额交易”：任何可能被抢跑的交易都可能被夹，滑点容忍度设得越高，被夹的空间越大。
      - h: 边界与代价
        p: 构建者集中会带来审查风险（某些交易被系统性排除）与信任假设（提议者依赖构建者提供区块）；MEV 拍卖也催生“订单流付费”等新中介。缓解手段包括加密内存池、批量拍卖与协议层 PBS。值得区分“善意 MEV”（如清算套利帮助协议恢复偿付）与“恶意 MEV”（三明治、抢跑）：两者对用户体验的影响相反，监管讨论却常把它们混在一起。
    quiz:
      - q: PBS 架构下，谁实际决定区块里的交易顺序？
        a: 构建者（builder）组装区块并竞价，提议者只挑出价最高的区块头签名；排序权事实上集中在构建者手里，这也是审查风险的来源。
      - q: 为什么说 MEV 的成本最终由普通用户承担？
        a: 三明治攻击抬高滑点、抢跑让交易变贵；拍卖只是把这笔价值在搜索者、构建者、验证者之间分配，并未消除来源。
    sources:
      - https://ethereum.org

  - id: c418
    type: concept
    stage: 4
    order: 18
    title: 再质押
    en: Restaking
    minutes: 10
    tags: [restaking, staking]
    sections:
      - h: 一句话
        p: 再质押（restaking）指把已质押的 ETH（或流动性质押代币）再次用于为其他协议提供经济安全，例如 EigenLayer 的主动验证服务（AVS）；同一份资本承担多份罚没（slashing）风险。
      - h: 为什么重要
        p: 它把“经济安全”变成可租用的商品：新协议无需自建验证者集合即可获得安全保障，启动成本大幅下降。代价是风险叠加——底层质押、再质押协议、AVS 三层都可能出错，罚没条件与传染路径是评估核心。
      - h: 核心机制
        p: 存入的 ETH 通过再质押协议登记为“可被 AVS 罚没”的抵押；AVS 定义自己的验证任务与罚没条件，运营商（operator）受托运行；一旦违约，罚没从共享抵押中扣除。可选的保险层能对冲罚没，但增加了对手方风险。罚没金额与条件通常写在 AVS 的合约与参数里，投入前应逐条读，而不是只看宣传页上的收益率。再质押协议通常给运营商设置佣金与准入条件，用户把资产委托给运营商，收益与风险都随运营商的表现放大。
      - h: 例子
        p: 一个数据可用性 AVS 要求运营商持续提交证明，连续缺席即触发罚没；同一笔 ETH 同时为三个 AVS 提供安全，若其中一个 AVS 的罚没条件设计过宽，可能因误判扣掉全部共享抵押。若 AVS 的罚没需要治理投票才能触发，风险就从“代码自动执行”变成“人做判断”，这是评估时容易忽略的集中点。
      - h: 常见误解
        p: 误以为“再质押是免费的额外收益”。收益来自额外风险与流动性锁定，罚没规则由各 AVS 自定；极端情况下同一笔 ETH 可能被多个服务同时追责。也别把“TVL 大”当成“安全”。
      - h: 边界与代价
        p: 风险传染是核心隐患：底层质押被罚没会同时影响所有 AVS，流动性紧缩时退出排队变长；运营商集中也会带来相关性风险。对研究者的检查项是罚没条件、抵押隔离方式、退出队列长度与保险覆盖。另外，流动性质押代币（LST）再质押会叠加一层流动性风险：若 LST 脱锚，抵押品价值下跌可能触发连锁清算，这与 AVS 罚没是两套独立机制。
    quiz:
      - q: 再质押带来的核心权衡是什么？
        a: 用同一份资本为多个服务提供安全，换来更高的资本效率与收益；但风险随之叠加，一旦某个服务触发罚没，损失范围与传染路径比单一质押更难评估。
      - q: 评估一个 AVS 时最该看什么？
        a: 罚没条件是否清晰可验证、抵押是否隔离、退出队列多长、运营商是否集中；这些决定风险是否会传染到整笔本金。
    sources:
      - https://ethereum.org

  - id: c419
    type: concept
    stage: 4
    order: 19
    title: 香港稳定币条例
    en: Stablecoins Ordinance (HK)
    minutes: 12
    tags: [regulation, hongkong]
    sections:
      - h: 一句话
        p: 香港《稳定币条例》（Stablecoins Ordinance）2025 年 8 月生效，建立法币稳定币发行人发牌制度，由香港金融管理局（HKMA）负责发牌与监管，2026 年起进入发牌实施阶段。
      - h: 为什么重要
        p: 它是少数专门为稳定币单独立法的辖区：发行人须持牌、储备资产足额并隔离托管、按面值赎回、定期披露与审计。观察它等于观察“稳定币从灰色地带进入持牌金融”的完整路径，也影响离岸人民币稳定币与跨境支付的产品设计。
      - h: 核心机制
        p: 发牌门槛包括资本与治理要求、储备资产范围与托管安排、赎回机制与时限、披露与审计频率、反洗钱与风险管理；无牌发行或在香港推广未获许可的稳定币属违法。发牌与持续监督由金管局执行，具体细则与指引以官方公告为准。发牌还会考察管理层的适当人选（fit and proper）与持续资本要求，这些是持续性义务，而不是一次性审批。
      - h: 例子
        p: 一家拟发行港元稳定币的机构，需先向金管局申请牌照并证明储备为高质量流动资产、由独立托管人保管、可按面值赎回；在获牌前公开发行或营销推广，可能构成违法。境外稳定币若面向香港零售推广，也要看是否落入规管范围。
      - h: 常见误解
        p: 误以为“条例生效就等于所有稳定币合法”。无牌发行、或在香港推广未获许可的稳定币属违法；条例约束的是发行与销售环节，不改变其他辖区对同一代币的认定，也不等于持币人获得存款保障。
      - h: 边界与代价
        p: 高门槛会压缩小发行人的空间，短期内可能减少市场上的稳定币数量；储备与赎回要求提高透明度，但也把利率与托管成本转嫁给发行人。跨境发行、离岸人民币稳定币与内地 42 号文的衔接，仍需看后续安排（以官方公告为准）。另外，储备收益归属、托管银行的风险隔离、境外发行人的互认安排，都是判断“持牌是否等于安全”时要比对的细节。另一个代价是时间：从申请、补充材料到获牌通常以月计，产品上线节奏必须按监管时间表安排，而不是按市场窗口安排（本文不构成法律意见）。
    quiz:
      - q: 香港稳定币制度由谁发牌，核心要求有哪些？
        a: 由金管局（HKMA）发牌；要求足额高质量储备、储备资产隔离托管、按面值赎回、定期披露与审计，并满足反洗钱与风险管理要求（细节以官方公告为准）。
      - q: 条例生效后，哪些行为可能违法？
        a: 无牌发行法币稳定币，或在香港推广、销售未获许可的稳定币；条例管的是发行与销售环节，不只管技术上的发币动作。
    sources:
      - https://www.hkma.gov.hk

  - id: c420
    type: concept
    stage: 4
    order: 20
    title: 证券型代币
    en: Security Token
    minutes: 11
    tags: [securities, sto]
    sections:
      - h: 一句话
        p: 证券型代币（security token）指本身构成证券的链上代币，通常代表股权、债权、基金份额或收益权，须遵守对应辖区证券法的发行、披露与交易要求；相关发行常被称为 STO（security token offering）。
      - h: 为什么重要
        p: 它把合格投资者、信息披露、转让限制等证券义务带到链上。与 RWA 有交集但不同：RWA 描述标的资产，证券型代币描述法律性质；先看权利与义务，再看技术。判断一个代币化项目，第一步永远是“它是不是证券”。
      - h: 核心机制
        p: 判定看权利与销售方式：持有人是否获得利润分配、治理权或债权，是否依赖发行方经营；发行要走注册或豁免（如美国 Reg D 私募、Reg S 境外发行），交易场所需持牌或适用豁免。链上常用白名单、转让限制与合规托管来满足要求。
      - h: 例子
        p: 一个代币化基金份额若向美国投资者公开销售，可能触发证券注册义务；改走 Reg D 私募并对投资者做合格投资者认证后，可豁免注册，但代币转让要限制在合格投资者之间，二级流动性因此明显下降。反过来，若代币只代表使用权、不带来利润分配与治理权，被认定为证券的概率会低很多，但仍要看销售时的承诺与宣传。
      - h: 常见误解
        p: 误以为“做了 KYC 就不是证券”。KYC 只是合规动作，不改变资产的法律性质；是否构成证券仍按当地标准判断（如美国 Howey、欧盟 MiCA 与 MiFID 的边界）。也别把“上链”当成“天然合规”。另一种误解是“只要不向美国销售就没事”：证券法的域外效力、反洗钱与制裁规则、以及各地对“向本地居民推广”的认定，都可能把项目拉回监管范围。
      - h: 边界与代价
        p: 证券型代币的流动性受转让限制与合格投资者规则约束，与“7×24 自由交易”的叙事冲突；跨境发行要同时满足多地证券法，合规成本高。法律定性还可能随销售方式与后续去中心化程度变化（本文不构成法律意见）。对持有人，证券型代币的收益来自法律权利而非协议激励，二者在违约时的救济路径完全不同。
    quiz:
      - q: RWA 与证券型代币的差别在哪？
        a: RWA 描述标的是现实资产，证券型代币描述法律性质是证券；同一个 RWA 代币可能构成证券，也可能不构成，取决于持有人获得的权利与发行结构。
      - q: 为什么证券型代币的流动性通常较低？
        a: 因为它受合格投资者、转让限制与持牌交易场所约束；为满足证券法义务，发行方会用白名单与锁定期限制二级转让。
    sources:
      - https://www.sec.gov

  # ===== 课程轨道（理论 11 + 实践 9，order 1–20 交错）=====
  - id: t401
    type: theory
    stage: 4
    order: 1
    title: 美欧港监管三辖区对比
    minutes: 14
    tags: [regulation, comparison]
    sections:
      - h: 核心机制
        p: 三地的差别不在“谁更严”，而在监管入口不同：美国以判例与执法定义边界，欧盟以成文条例分类，香港以牌照准入控制。比较时固定三个维度：监管对象（代币、服务商、发行人）、法律性质（证券、商品、支付工具）、准入方式（注册、牌照、豁免），否则就会把不同义务混在一起。
      - h: 关键细节
        p: 美国：SEC 依 Howey 执法，CFTC 主张比特币、以太币为商品，稳定币由 GENIUS Act（2025 年 7 月 18 日成法）单独立法，OCC 实施终规 2026 年 10 月定稿、2027 年 1 月 18 日生效（以官方公告为准）。欧盟：MiCA 自 2024 年 12 月 30 日全面适用。香港：交易平台按《打击洗钱条例》由证监会发牌，稳定币由金管局按《稳定币条例》（2025 年 8 月生效）发牌。
      - h: 例子
        p: 同一家交易所向三地用户提供服务：在美国要先判断上架代币是否构成证券并安排合规路径；在欧盟需要 CASP 授权并按 passporting 覆盖成员国；在香港须取得交易平台牌照并满足客户资产隔离与 Travel Rule 要求。三套义务不能相互替代。
      - h: 对比或演进
        p: 演进方向也不同：美国在“执法先行”之后转向单行法（稳定币），欧盟把 MiCA 作为统一框架并设过渡期，香港选择“先窄后宽”（先平台与稳定币，再考虑其他）。判断某类业务何时合规，要跟各自的立法与实施时间表，而不是看新闻标题。
      - h: 代价与边界
        p: 比较研究最容易犯的错是“跨辖区平移结论”：美国某代币被认定不是证券，不代表在欧盟不构成金融工具；香港允许的营销，在内地可能属于非法金融活动（42 号文）。三地规则的对象与豁免不同，任何对比都要先对齐定义（本文不构成法律意见）。
      - h: 常见误读
        p: 误以为“监管越严市场越小”，或“发牌等于合法化”。发牌是准入，不等于所有产品都获批；也别把监管沙盒、试点当成普遍许可。研究中应区分“法律文本、实施规则、执法个案”三个层次。另一常见误读是把“监管明确”等同于“监管宽松”，两者是不同的维度，不能互相替代。
    quiz:
      - q: 比较三地监管时，为什么要先对齐“监管对象”？
        a: 因为同一业务在三地可能落在不同类别：代币、服务商、发行人分别对应不同规则，不对齐对象就会把不同义务混为一谈。
      - q: 为什么不能把美国对某代币的认定直接套用到欧盟？
        a: 两地框架不同：美国靠 Howey 判例与执法逐案认定，欧盟用 MiCA 按资产类别成文分类；同一代币在两地可能落在不同类别、承担不同义务。
      - q: 香港“先窄后宽”的监管路径指什么？
        a: 先对交易平台与稳定币发行人设牌照门槛，把风险最高的环节纳入监管，再视情况扩展到其他业务，而不是一次性放开。
    sources:
      - https://www.sec.gov
      - https://www.esma.europa.eu

  - id: p401
    type: practice
    stage: 4
    order: 2
    title: 整理辖区监管对照表
    minutes: 12
    tags: [regulation, table]
    sections:
      - h: 目标
        p: 用一张表把“辖区 × 监管对象 × 核心要求”对齐，覆盖美国、欧盟、香港、中国内地四个辖区，形成可复核的监管索引；目标不是背条文，而是能快速定位“某业务在某地受什么约束、依据哪份文件”。
      - h: 准备
        p: 一份本地表格工具；四个辖区的官方入口（sec.gov、esma.europa.eu、hkma.gov.hk、pbc.gov.cn）；本仓库 crypto-policy 法规库作为找文件的线索来源。预留查证时间，不要凭记忆填表。
      - h: 步骤
        p: 1) 建表头：辖区、监管对象、法律依据、准入方式、核心义务、官方链接、最后核对日期；2) 每个辖区填三类对象：代币本身、交易平台、稳定币发行人；3) 法律依据只写一手文件；4) 每条补官方链接；5) 用第二来源交叉验证至少 3 行；6) 对每一行标注“已核对”或“待核实”，并写清缺口；7) 找一个反例检验表格：某地允许的业务，在另一地为何被禁止；8) 给每行标出证据强度：法律文本、实施规则还是执法个案，强度不同，能支撑的结论也不同。
      - h: 验收
        p: 表格至少 12 行，每行法律依据能点开到官方页面；能不看笔记讲清“同一业务在三地为何义务不同”；标出自己仍不确定的三处，并写清缺哪份文件才能确认。另外把表格导出为纯文本或 CSV，便于在笔记里引用；若你无法在 5 分钟内定位某行业务的约束，说明索引结构需要重做。
      - h: 安全与常见坑
        p: 只做信息整理，不判断具体项目是否合规，成稿注明“不构成法律意见”。常见坑：把新闻稿当法规原文、把某地处罚案例当普遍规则、把“发牌”写成“合法化”；也不复制付费数据库内容。注意区分“监管对象”与“监管主体”：前者是代币、平台、发行人，后者是 SEC、ESMA、HKMA、人民银行等机构，两列分开写才不会混淆。最后提醒：表格是索引不是结论，写报告引用前仍要回原文核对一次措辞与生效日期。另外，表格里不要出现“据说”“业内普遍”这类表述；每一条要么有一手来源，要么标为待核实，否则这份表会在引用时反噬你。
    quiz:
      - q: 这张表至少要覆盖哪三类监管对象？
        a: 代币本身（是否证券、商品或其他）、交易平台（准入与客户资产规则）、稳定币发行人（储备、赎回与披露）。
      - q: 为什么每行要写“最后核对日期”？
        a: 监管规则与实施时间表在变（过渡期、新规生效），写明核对日期才能判断这条结论是否已过期、是否需要重新查证。
    sources:
      - https://www.pbc.gov.cn

  - id: t402
    type: theory
    stage: 4
    order: 3
    title: 中国 42 号文精读
    minutes: 15
    tags: [china, regulation]
    sections:
      - h: 核心机制
        p: 银发〔2026〕42 号由人民银行等八部门于 2026 年 2 月 6 日发布、自发布之日起施行，同时废止 2021 年 9 月 24 日的银发〔2021〕237 号通知。它用三条线组织：定性（虚拟货币与 RWA 代币化分别是什么）、治理（金融机构、支付机构、互联网平台、市场监管、地方政府的分工）、跨境（境内主体赴境外的限制）。
      - h: 关键细节
        p: 虚拟货币不具有法偿性、不应且不能作为货币流通；境内法币与虚拟货币兑换、虚拟货币间兑换、作为中央对手方买卖、信息中介与定价服务、代币发行融资等属非法金融活动，一律严格禁止。RWA 代币化被定义为用加密与分布式账本技术将资产所有权、收益权转化为代币并发行交易，境内开展及提供中介、技术服务应予禁止，经同意并依托特定金融基础设施的除外。
      - h: 例子
        p: 一家境内公司为境外交易所提供做市或支付通道，可能被认定为“为虚拟货币相关业务提供信息中介或资金服务”；一家境内企业以境内应收账款收益权为基础在境外发行代币，则落入“以境内权益为基础的境外 RWA 代币化”，按“相同业务、相同风险、相同规则”由发改委、证监会、外汇局等分工监管，未经同意或备案不得开展。
      - h: 对比或演进
        p: 相比 237 号通知，42 号文新增 RWA 代币化专门条款与例外通道、境内主体及其控制的境外主体赴境外发币的限制、企业名称与经营范围禁用“虚拟货币”“稳定币”“RWA”等字样、以及金融机构不得为未获同意的 RWA 业务提供托管清算。继续引用 924 表述会失准。
      - h: 代价与边界
        p: 例外通道是“经业务主管部门依法依规同意、依托特定金融基础设施”，不等于一般许可，个案判断；文件约束境内主体与向境内提供服务的行为，不评价境外辖区合法性。它属规范性文件而非司法解释，具体定性仍看后续执法与配套规则（本文不构成法律意见）。
      - h: 常见误读
        p: 三处常见误读：把“境内禁止”扩写成“境外也禁止”；把“经同意”当成“申请就能批”；把稳定币与虚拟货币混为一谈——42 号文同时禁止未经同意在境外发行挂钩人民币的稳定币。
    quiz:
      - q: 42 号文对境内现实世界资产代币化的基本态度是什么？
        a: 原则禁止：在境内开展 RWA 代币化及其中介、技术服务涉嫌非法金融活动；经业务主管部门依法依规同意、依托特定金融基础设施开展的除外。
      - q: 42 号文对境内主体赴境外发币怎么规定？
        a: 未经相关部门依法依规同意，境内主体及其控制的境外主体不得在境外发行虚拟货币；以境内权益为基础的境外代币化业务同样须经同意或备案。
      - q: 42 号文与 2021 年 237 号通知的关系是什么？
        a: 42 号文自 2026 年 2 月 6 日发布之日起施行，同时废止 237 号通知；它新增了 RWA 代币化、跨境限制与名称广告等条款。
    sources:
      - https://www.pbc.gov.cn/tiaofasi/144941/3581332/2026020619591971323/index.html
      - https://policy.mofcom.gov.cn

  - id: p402
    type: practice
    stage: 4
    order: 4
    title: 法规库三条摘要
    minutes: 13
    tags: [regulation, practice]
    sections:
      - h: 目标
        p: 从本仓库 crypto-policy 模块的法规库（crypto-policy/data/docs 下的 JSON 文件，近 300 条）中选 3 条不同辖区或不同发布机构的文件，各写一段 200 字内的摘要，训练“读原文—提炼约束—标注来源”的能力。
      - h: 准备
        p: 本地 Python 环境与仓库只读权限；先弄清库里的字段：id、source_name、jurisdiction、title、url、published_at、body。跑一遍统计看看有哪些辖区与发布机构（US、EU、UK、JP 以及中国内地机构），再决定选哪三条。
      - h: 步骤
        p: 1) 用脚本按 jurisdiction 与 source_name 筛选，选出 US、EU 与中国内地各一条；2) 读 title、published_at、url 与 body 原文；3) 每条写“规定了什么、约束谁、何时生效”；4) 记下文件名作为引用锚点；5) 标出原文里没写清的部分；6) 三条写完后做一次横向对比：同一类业务在不同辖区的准入方式差在哪（注册、牌照还是豁免）。
      - h: 验收
        p: 三条摘要都能在原文里指到对应句子；辖区、发布机构、日期三项齐全；若 body 不完整，只写能确认的部分并标注缺口；不把媒体报道当原文；三条之间能对比出监管口径差异。对比时要说明“为什么不同”（法律传统、监管目标、市场结构），而不是只列差异；这一步决定摘要是否只是翻译。如果三条摘要里有一条说不清“约束谁”，就回去重读原文，而不是靠上下文猜。
      - h: 安全与常见坑
        p: 只读本地文件，不改动 crypto-policy 数据、不额外抓取；摘要注明“不构成法律意见”，不据此判断具体项目能否开展业务。常见坑：把摘要写成评论、把发布日期当生效日期、把征求意见稿当成定稿。另一个坑是把“发布机构”与“文号”混为一谈：同一机构会发布规章、规范性文件与新闻稿，效力层级不同；摘要里要写清文件类型，必要时注明“非规范性文件”。
    quiz:
      - q: 写法规摘要时至少要交代哪三件事？
        a: 它规定了什么、约束谁、何时生效（以及发布机构与文号）；缺任何一项，摘要都无法支撑后续判断。
      - q: 为什么要记录文件名而不是只记标题？
        a: 文件名是库内唯一锚点，便于他人复核原文；标题可能重复或近似，只记标题容易引错文件。
    sources:
      - https://www.pbc.gov.cn

  - id: t403
    type: theory
    stage: 4
    order: 5
    title: 证券认定与 Howey
    minutes: 13
    tags: [securities, howey]
    sections:
      - h: 核心机制
        p: Howey 四要件是：投入金钱、共同事业、合理期待利润、利润来自他人努力。四者同时满足才构成投资合同。分析顺序是“这笔交易的经济实质是什么”：买方为什么付钱、期待什么、依赖谁，而不是资产叫什么、是否用了区块链。
      - h: 关键细节
        p: “共同事业”分横向（资金汇集、收益共享）与纵向（投资者依赖发起人经营能力）；“期待利润”包括资本增值与收益分配；“他人努力”指关键管理努力，而非日常琐碎工作。判例把边界画得更细：Ripple 案区分机构销售与交易所程序化盲卖，Telegram 案认定 Grams 预售构成证券发行。值得注意的是，法院看的是“买方的合理期待”，而不是发行方的主观意图；宣传语、AMA 承诺、上所安排都会成为证据。
      - h: 例子
        p: 某项目向机构私募，合同写明锁仓、团队用募集资金开发并承诺上所，买方不参与经营——四要件基本满足。同一代币后来在交易所匿名撮合，买方不知道对手是谁、也不依赖团队交付，认定可能不同。结论随交易与时间变化，这正是“逐交易”的含义。
      - h: 对比或演进
        p: 早期 Howey 针对柑橘园合同，后来用于合伙份额、度假村与加密资产；法院逐步引入“去中心化程度”“买方是否只能被动依赖”等考量，但没有给出量化标准。美国之外，欧盟用 MiCA/MiFID 分类，香港按证券与集体投资计划规则判断，标准不同源。
      - h: 代价与边界
        p: 判例标准缺乏事前确定性：项目在发行前难有确定结论，只能靠法律意见、限制销售对象（如排除美国人士）、披露与结构设计降低风险；一旦被认定违规，后果包括注册、罚款、返还与市场禁入。它也不处理商品、支付工具等其他类别（本文不构成法律意见）。
      - h: 常见误读
        p: 误以为“代币去中心化后自动脱离证券认定”，或“做了 KYC 就不是证券”，或“上线大交易所就合规”。Howey 考察具体销售情形与依赖关系，任何单一动作都无法自动改变定性。另一个误读是“只要代币不上交易所就不算证券”：私募与场外销售同样可能构成发行，销售对象与承诺才是关键。
    quiz:
      - q: Howey 分析为什么必须“逐交易”而不是“逐代币”？
        a: 因为它考察具体销售情形：买方是否投入金钱、是否依赖发行方努力获利；同一代币在不同销售方式与不同阶段，结论可能完全不同。
      - q: Howey 四要件中“利润来自他人努力”如何理解？
        a: 指买方期待的关键经营与管理努力来自发起人，而非自己或市场；团队开发交付、营销承诺、回购安排都会强化这一要件。
      - q: 加密项目降低证券认定风险常用哪些做法？
        a: 限制销售对象（如排除美国人士）、走私募豁免、充分披露、避免承诺利润与回购；但结构设计不能改变交易的经济实质。
    sources:
      - https://www.sec.gov

  - id: t404
    type: theory
    stage: 4
    order: 6
    title: RWA 监管与市场
    minutes: 14
    tags: [rwa, regulation]
    sections:
      - h: 核心机制
        p: RWA 的市场结构是“资产—载体—代币—分销”四段：底层资产（国债、私人信贷、商品）、法律载体（SPV、信托、基金）、代币化发行、以及分销与交易场所。每一段对应不同监管：资产端看证券法，载体端看信托与破产隔离，代币端看是否构成证券或电子货币，分销端看持牌与营销规则。
      - h: 关键细节
        p: 主流品类是代币化国债与货币基金、私人信贷，其次是大宗商品与房地产。规模看发行方披露与 DefiLlama 的 RWA 分类，注意口径（是否重复计算、是否只统计公链部分）。美国看是否构成证券并适用注册或豁免；欧盟除 MiCA 外还要看 MiFID II 对金融工具的界定；香港按证监会规则处理。另外，RWA 的代币化程度是分层的：只把登记上链，与把现金流和结算也上链，是两件不同的事，前者并不改变结算周期。
      - h: 例子
        p: 代币化国债产品的典型流程：持牌资管持有短期国债，通过 SPV 或信托发行代币，托管行保管资产，每日计算净值并披露，赎回按基金规则在 T+1 或 T+2 结算。代币在链上 7×24 可转让，但申购赎回受营业日与合规审查限制——“链上流动”与“法律赎回”是两套时钟。
      - h: 对比或演进
        p: 与纯链上资产相比，RWA 多了一层法律追索与托管链，因此多了交易对手风险，但也因此能承载大额资金。演进方向是从“包装型”（代币化基金份额）走向“原生型”（链上直接发行债务工具），后者对法律与清算基础设施要求更高。
      - h: 代价与边界
        p: 三类风险最易被低估：破产隔离是否真的成立、储备与代币 1:1 是否可验证、赎回通道是否畅通。中国内地 42 号文对境内 RWA 代币化原则禁止、例外须经同意；跨境结构还要看外汇与证券监管（本文不构成法律意见）。
      - h: 常见误读
        p: 误以为“代币化就等于去中心化”，或“链上有余额就等于资产被隔离”。绝大多数 RWA 由中心化主体发行，需要托管与法律实体；代币只是份额的登记与转让载体，权利来自发行文件。另一个误读是“规模大就代表成熟”：规模可能来自少数大额发行，集中度与赎回压力才是真实风险。
    quiz:
      - q: RWA 的四段结构指什么？
        a: 底层资产、法律载体（SPV、信托或基金）、代币化发行、分销与交易场所；每段对应不同的监管与风险来源。
      - q: 评估 RWA 项目时，为什么“赎回通道”比“链上流动性”更关键？
        a: 代币能随时转让不等于能换回底层资产；赎回权由发行文件与法律结构决定，若赎回受限或依赖单一做市方，链上流动性只是账面数字。
      - q: 为什么 RWA 规模数据容易失真？
        a: 统计口径不一：是否含重复计算的嵌套产品、是否只算公链部分、按市值还是发行量；不标口径的“总规模”不可比。
    sources:
      - https://defillama.com
      - https://www.sec.gov

  - id: p403
    type: practice
    stage: 4
    order: 7
    title: 三个黑客案例复盘
    minutes: 15
    tags: [security, postmortem]
    sections:
      - h: 目标
        p: 选 3 个已公开的链上攻击案例（可参考 Ronin 桥 2022、Wormhole 桥 2022、2025 年 2 月 Bybit 事件），各写一页复盘，练“信任假设在哪里失效”的分析框架，并沉淀一份可复用的检查清单。复盘的目标不是背下案例，而是能在看新项目时问出“你的桥靠谁签名、谁能在多长时间内改规则”。
      - h: 准备
        p: rekt.news 与 SlowMist 的公开报告、区块浏览器、一个四栏表格模板。不需要任何钱包或真实资金，也不需要搭建复现环境；所有材料都在公开渠道。建议先读一份官方事后报告（项目方 postmortem），再读第三方分析，最后自己核对链上交易；顺序反了容易被别人的结论带走。
      - h: 步骤
        p: 1) 拉事件时间线（发现、攻击、暂停、追回）；2) 记下攻击手法、受影响合约或验证者、损失计价方式；3) 用区块浏览器核对关键交易；4) 按“进入点—失效假设—损失—事后修复”四栏成文；5) 提炼一条可复用的检查项；6) 把三个案例的检查项合并、去重，形成自己的“桥与合约检查清单”（不少于 8 条）。
      - h: 验收
        p: 每篇不少于 400 字，含至少一个交易哈希或官方公告链接；能回答“当时多做哪一步，攻击成本会显著上升”；能区分代码漏洞与密钥、流程漏洞，并说明各自怎么防。另外相互对照：三个案例中至少两个的根因不在同一层（代码、密钥、流程），否则说明案例选得过于单一。
      - h: 安全与常见坑
        p: 只用公开资料做分析，不尝试复现攻击、不接触任何真实协议资金、不下载来源不明的“复现工具”；引用金额须注明当时计价口径。常见坑：只看二手总结、把时间线写成故事、混淆“被盗金额”与“最终损失”。如果某个案例的公开信息互相矛盾，就以链上交易与官方事后报告为准，并把这个矛盾记录下来。另一个坑是“用结论倒推动机”：看到巨额损失就先假定是代码漏洞，结果漏掉密钥与流程问题；正确顺序是先看签名与权限记录，再看合约逻辑，最后才谈攻击动机。
    quiz:
      - q: 复盘黑客案例时，四栏模板是什么？
        a: 进入点（攻击者从哪进来）、失效假设（哪一层信任被打破）、损失（如何计价）、事后修复（改了什么）；四栏都填完才算复盘完成。
      - q: 为什么不能直接用媒体报道的损失金额？
        a: 媒体常用事发时币价换算，与最终损失、追回金额、保险赔付不同；不标口径会导致跨案例不可比，结论失真。
    sources:
      - https://rekt.news
      - https://www.slowmist.com

  - id: t405
    type: theory
    stage: 4
    order: 8
    title: 安全威胁模型
    minutes: 13
    tags: [security, threatmodel]
    sections:
      - h: 核心机制
        p: 威胁模型（threat model）回答三个问题：要保护什么资产、对手是谁、对手能做什么。它不是漏洞清单，而是按“对手能力 × 资产价值”给攻击面排序的方法；输出应是一组按优先级排列的缓解措施，而不是一堆安全建议。
      - h: 关键细节
        p: 四类攻击面：私钥与签名（钓鱼、恶意授权、盲签、供应链劫持）、合约（重入、预言机操纵、权限缺失、升级漏洞）、协议经济（清算级联、流动性枯竭、参数被治理攻击）、人的环节（假客服、假空投、地址投毒、社工）。每类都要写清“攻击者需要什么能力”。
      - h: 例子
        p: 小资金热钱包的主要风险是钓鱼与恶意授权，最坏损失是余额归零；多签金库的主要风险是签名人设备被攻破与流程合谋，最坏损失是全部金库。两者排序完全不同：前者先做授权清理与域名核对，后者先做设备隔离与多签流程。再比如，只读钱包不承担签名风险，但会泄露持仓与关联地址，隐私与安全要分开评估。
      - h: 对比或演进
        p: 传统安全的威胁模型以边界防御为主（防火墙、权限），链上环境的边界消失了：任何地址都能与你交互，签名即授权，攻击面从“服务器”扩展到“每一次点击”。因此链上威胁模型更强调最小授权与可撤销性。
      - h: 代价与边界
        p: 威胁模型必须写在具体场景里：同一个钱包收空投与管金库，风险等级完全不同；不写场景的“安全建议”无法执行。它也无法覆盖未知攻击，只能降低已知风险并留出恢复空间（备份、分散、保险）。实践中可以把威胁模型写成一张两列表：左边是最坏损失场景，右边是当前缓解措施与缺口。
      - h: 常见误读
        p: 误以为“用了硬件钱包就安全”，或“小资金不用管”。硬件钱包防的是私钥外泄，不防盲签与恶意授权；小资金同样会因一次钓鱼而损失，只是金额小——分类防护才是正解。另一个误读是“威胁模型做完一次就够”：设备、协议与对手都在变，至少每季度重看一次，新链、新应用都要重新评估。
    quiz:
      - q: 威胁模型要回答的三个问题是什么？
        a: 要保护什么资产、对手是谁、对手能做什么；据此按“最坏损失 × 概率”排优先级并给出缓解措施。
      - q: 为什么“无限授权”在威胁模型里优先级很高？
        a: 它把损失上限开到该代币全部余额，且无需再次确认：一旦对方合约或私钥被攻破，被授权的资产可被直接划走，属于一次归零的风险。
      - q: 硬件钱包能防什么、不能防什么？
        a: 防私钥外泄与被远程盗取；不防用户盲签、恶意授权或不核对收款地址，签名环节的错误仍会造成损失。
    sources:
      - https://www.slowmist.com

  - id: p404
    type: practice
    stage: 4
    order: 9
    title: 写个人威胁模型
    minutes: 12
    tags: [security, threatmodel]
    sections:
      - h: 目标
        p: 为自己当前的链上活动写一份威胁模型，明确“保护什么、对手是谁、先修什么”，并落成 3 条当天就能执行的规则，而不是一份泛泛的安全清单。输出应当能指导本周的具体动作，而不是一份理念宣言。
      - h: 准备
        p: 一页纸或本地文档；列出资产清单（按价值分档，不写具体余额与地址）、设备清单（手机、电脑、硬件钱包）、常用交互（DEX、借贷、NFT、空投）。再准备一份最近的交互记录（授权过哪些合约、连接过哪些站点），这是威胁模型最直接的输入。
      - h: 步骤
        p: 1) 给资产分三档：长期不动、日常交互、试验小额；2) 列对手：钓鱼站、恶意签名、社工、设备丢失、供应链插件；3) 对每个“资产档 × 对手”估“最坏损失 × 概率”并排序；4) 给前 3 项各写一条规则；5) 写清残余风险；6) 检查一遍已有代币授权，把不再使用的撤销；7) 给每个设备写明“只做什么”（手机只做小额、电脑只做研究），减少交叉污染；8) 把规则写成一份“出事时先做什么”的清单（断网、转移、撤销授权、联系平台），放在离线可查的位置；9) 把“不做什么”也写下来：不点陌生链接、不签看不懂的授权、不在公共网络下操作大额资产。
      - h: 验收
        p: 文档一页以内，含资产分级、对手清单、排序后的风险表与 3 条规则；每条规则可当天执行；能说出“如果明天被盗，最可能从哪一步进来”。能指出当前最大的单点：一台设备、一个签名人，还是一个助记词存放位置。并把这份文档与“出事时先做什么”清单放在同一处。
      - h: 安全与常见坑
        p: 文档里不写助记词、私钥、具体余额与地址；只存本地，不上传云端或聊天工具；若已怀疑泄露，先转移资产再改流程。常见坑：规则太抽象（“提高安全意识”）、只做一次不更新、把“分散”当成“备份”。另外，每季度重做一次：设备、交互习惯与对手都在变，旧模型很快失效。还有一个坑是“把安全当成购买行为”：买硬件钱包不等于安全，关键是把流程（谁签、签什么、怎么核对）写下来并执行。
    quiz:
      - q: 个人威胁模型里资产为什么要先分档？
        a: 不同档位的资产面对的对手与可承受损失不同，分档后才能把有限精力放在“一次归零”的环节，而不是平均用力。
      - q: 写规则时最常见的无效写法是什么？
        a: 写成抽象口号（如“提高安全意识”）。有效规则要具体到动作与触发条件，例如“超过某金额的转账必须用硬件钱包二次核对地址”。
    sources:
      - https://www.slowmist.com

  - id: t406
    type: theory
    stage: 4
    order: 10
    title: 桥与合约漏洞复盘
    minutes: 14
    tags: [security, bridge]
    sections:
      - h: 核心机制
        p: 跨链桥在两端各持资产，靠验证者、多签或轻客户端证明“另一端真的锁定了”。这个信任中介常是单点：Ronin 桥 2022 年被盗约 6.2 亿美元，起因是 9 个验证者中有 5 个私钥被攻破，达到多签门槛。
      - h: 关键细节
        p: 桥的类型决定风险：多签或验证者桥依赖人，轻客户端桥依赖链上证明与中继经济性，流动性网络依赖做市方偿付能力。合约层常见漏洞是重入（The DAO 2016，约 6000 万美元，直接导致以太坊分叉）、权限配置错误、预言机被闪电贷操纵、升级代理初始化漏洞。
      - h: 例子
        p: Ronin 的攻击链是“攻破签名人设备与社工—拿到 5 个验证者私钥—伪造提款交易—资金经混币器流出”；Wormhole 2022 则是 Solana 端合约的签名验证被绕过，攻击者凭空铸出 wrapped ETH。一个是密钥与流程问题，一个是代码问题，检查项完全不同。两个案例的共同点是：信任假设没写进文档，用户以为自己面对的是代码，实际面对的是人和流程。
      - h: 对比或演进
        p: 桥的设计在向“更少信任”演进：从多签桥到轻客户端桥、再到基于意图与流动性网络的跨链。但信任并未消失，只是从“少数签名人”转移到“中继经济性、证明系统正确性与做市方偿付能力”，风险形态变了。
      - h: 代价与边界
        p: 更强的信任最小化往往意味着更慢、更贵、更难支持异构链；多签桥便宜灵活但单点风险高。桥的验证者集合规模应与所护资金匹配，否则“小验证者护大资金”就是结构性隐患。
      - h: 常见误读
        p: 误以为“审计过就没问题”，或“桥被盗只因为代码写得差”。大量案例根因在密钥管理、多签流程与社会工程，不在合约语言；审计只覆盖代码，不覆盖运维与治理。另一个误读是“桥的 TVL 越高越安全”：TVL 高意味着攻击收益更大，若验证者集合没有同比扩大，反而是更危险的目标。
    quiz:
      - q: Ronin 桥被盗的直接原因是什么？
        a: 攻击者拿到 9 个验证者中 5 个的签名私钥，达到多签门槛后伪造提款。根因是验证者密钥集中与门槛设置不足，而非合约代码漏洞。
      - q: 桥的三种主要类型，风险各在哪？
        a: 验证者或多签桥依赖人的安全；轻客户端桥依赖证明系统与中继经济性；流动性网络依赖做市方偿付能力与结算速度。
      - q: 为什么“审计过”不等于桥安全？
        a: 审计只覆盖代码逻辑，不覆盖私钥管理、多签流程、运维与社会工程；多数桥事故的根因在代码之外。
    sources:
      - https://rekt.news
      - https://www.slowmist.com

  - id: p405
    type: practice
    stage: 4
    order: 11
    title: 1500 字专题写作
    minutes: 15
    tags: [writing, research]
    sections:
      - h: 目标
        p: 选一个本阶段主题（如 Travel Rule 的落地难点、RWA 的赎回风险、桥的信任假设），写一篇 1500 字左右的分析，要求每个论点都有一手证据，并给出可检验的证伪条件。字数不是目的，能被别人引用才是。选题越窄，越容易写出可验证的结论；宽题往往只能写背景。
      - h: 准备
        p: 一个可查的选题、3 至 5 个一手来源（法规原文、官方公告、链上数据、审计或事后报告）、以及本课程前几个阶段的笔记。先列证据清单再动笔，避免“先有结论再找证据”。先写一段 100 字摘要；如果摘要里没有可验证的结论，说明选题还没想清楚。把“一句话结论”和“三条支撑”先写成卡片；若某条支撑找不到一手来源，就换选题或把它降级为背景描述。
      - h: 步骤
        p: 1) 先写一句核心判断与三条支撑；2) 每条支撑配一个来源，标明日期与文号；3) 写反方观点与自己的回应；4) 写一节“什么情况下我错了”；5) 自检：删掉所有形容词后还剩什么，剩下的就是证据；6) 请一个不了解该主题的人读一遍，标出他看不懂或不信的句子，逐条补证据或删掉；7) 给每个论点标注证据等级（法规原文、官方公告、估算数据），读者才能判断结论强度。
      - h: 验收
        p: 全文 1300 至 1700 字；至少 3 个可点开的来源；含明确的证伪条件；结论不与证据脱节；通读一遍不出现价格、收益或买卖建议。最后检查引用：每条结论都能在文中找到对应来源编号，没有“悬空引用”。最后核对一次事实与观点的边界：哪些句子是证据、哪些是推断，读者应能一眼分辨。
      - h: 安全与常见坑
        p: 不写价格、收益与投资建议；涉及监管时注明“不构成法律意见”；引用他人观点要标出处。常见坑：证据链倒置（先定结论再挑证据）、把二手转述当一手、用规模数字代替机制分析。另外，发布前通读一遍，确认没有把项目方的宣传语当成结论。另一个坑是“引用二手总结当一手证据”：二手总结可能已经省略了限定条件，写进报告后会被读者当成原文结论。
    quiz:
      - q: 1500 字专题的验收标准里，哪一条最能检验质量？
        a: 是否写出“什么情况下我错了”与可查的证伪条件；只有能列出反证条件，才说明作者真的理解了机制而不是复述叙事。
      - q: 为什么要求每个论点配一手来源？
        a: 一手来源能直接支撑结论，二手转述会叠加错误与立场；配一手来源也让读者可以复核，报告才具备可信度。
    sources:
      - https://dune.com

  - id: t407
    type: theory
    stage: 4
    order: 12
    title: 前沿专题：RWA 与 AI+DePIN
    minutes: 14
    tags: [frontier, rwa]
    sections:
      - h: 核心机制
        p: 三条线在回答同一个问题：链上如何为链下资源定价与结算。RWA 把既有资产搬上来，DePIN 把物理设备接进来，AI 加 Crypto 把算力、数据与模型调用变成可计价的商品。三者都需要“链下计量 + 链上结算”的桥接层。
      - h: 关键细节
        p: 判断标准是三个问题：需求是否真实付费、结算是否必须上链、代币是否只是补贴工具。RWA 看发行量与赎回量，DePIN 看收入与设备在线率，AI 加 Crypto 看实际调用与付费用户；数据源限官方披露、DefiLlama 与 Dune 上的公开看板。
      - h: 例子
        p: 一个算力网络若只有代币激励、没有外部客户为推理付费，收入结构就是“补贴上线设备、代币增发再补贴”的循环，补贴下降后设备离线率立刻上升；若已有 AI 公司按用量付费，即便代币价格波动，网络收入仍然存在。
      - h: 对比或演进
        p: 三条线成熟度不同：RWA 已有法律结构与传统金融参与，DePIN 在存储与带宽上有真实需求但毛利薄，AI 加 Crypto 多数还停留在叙事与激励阶段。演进方向是从“代币补贴需求”转向“真实收入分成”，这需要可验证的计量与合规的结算。三者的估值逻辑也不同：RWA 看规模与息差，DePIN 看毛利与客户留存，AI 加 Crypto 看调用量与单位成本。
      - h: 代价与边界
        p: 链上结算带来透明与可组合，也带来合规与隐私成本：数据出境、模型版权、算力来源都可能触发监管。物理资源的延迟与边际成本决定它能否与中心化云竞争，代币并不能改变这些约束。
      - h: 常见误读
        p: 误以为“AI 加 Crypto 就是 AI 代理自动交易”，或“DePIN 设备多就等于网络强”。真正的判断在需求侧：谁在付费、付多少、能否持续；只有供给被补贴的网络，在激励退坡后必然萎缩。另一个误读是“只要有真实收入就值得关注”：收入质量、毛利与可持续性同样重要，网络收入与代币价格并不必然同步。
    quiz:
      - q: 判断 DePIN 或 AI 加 Crypto 项目时，哪类指标最能证伪叙事？
        a: 需求侧真实付费收入。若没有外部客户为服务付费、只有代币补贴在循环，说明网络尚未产生真实价值，激励退坡后规模必然收缩。
      - q: 三类前沿方向的共同技术需求是什么？
        a: 都需要“链下计量 + 链上结算”：把物理资源或资产的状态可信地映射到链上，再用代币或稳定币完成结算与激励分配。
      - q: 为什么“结算是否必须上链”是关键判据？
        a: 若业务只需要一个收费接口，链上结算带来的透明与可组合未必抵消其成本与合规负担；不必要上链的项目通常是叙事驱动。
    sources:
      - https://defillama.com
      - https://dune.com

  - id: p406
    type: practice
    stage: 4
    order: 13
    title: 3000 字研报大纲
    minutes: 14
    tags: [writing, outline]
    sections:
      - h: 目标
        p: 为一份 3000 字研报搭出可执行大纲：标题、核心判断、章节结构、每节证据清单、风险与附录；只写大纲，不写正文，检验自己能否把研究拆成可执行的任务。大纲是给未来的自己看的施工图。
      - h: 准备
        p: 选题与研究对象、时间窗口、已有笔记与数据源清单；先确认 3 个可查的数据入口（官方披露、Dune 查询、财报或法规原文），确认它们能覆盖核心判断的验证需求。把三条核心判断先写在一张卡片上；若写不出可检验的指标，说明选题过大，需要缩小范围。
      - h: 步骤
        p: 1) 定研究对象与时间窗口；2) 写 3 条核心判断，各配可查的验证指标；3) 分 4 至 5 章，每章列 2 至 3 个一手来源；4) 单列“证伪条件”与数据缺口；5) 估算每章字数并检查合计接近 3000；6) 把每章的“必须回答的问题”写成一句话，避免只写主题词；7) 标出哪一章是全文重心（应占四成以上篇幅）；8) 给每章写一句“如果这章结论不成立，全文会怎样”，提前发现结构性依赖。
      - h: 验收
        p: 大纲能让另一个人照着写；每章都有来源与指标；证伪条件具体到可查的数据点；字数分配加起来接近 3000；数据缺口写清“缺哪份文件或哪个字段”。另一个人拿到大纲后，应能说出“这篇报告的核心结论是什么、靠什么证据支撑”。另外，把大纲贴给一位同伴，请他指出“哪一章最像凑数”，那通常就是该删或该补的地方。
      - h: 安全与常见坑
        p: 不使用未公开信息与内幕信息；不写目标价、收益预测与买卖建议；涉及监管处注明“不构成法律意见”。常见坑：大纲只有标题没有证据清单、把“背景介绍”写成第一章、证伪条件写成“如果判断错了”。另外，大纲阶段就要问清“谁出钱、为谁写”：利益相关方的立场会影响结论取舍，应事先声明。提交前请人挑刺：哪一章最可能被反驳、证据最薄，那就是下一轮要补的地方。另一个坑是“把大纲写成目录”：只有章节名没有证据与指标，写正文时仍要重新想一遍；大纲的价值在于提前暴露证据缺口。
    quiz:
      - q: 一份可执行大纲必须包含哪两类容易被省略的内容？
        a: 每章的证据清单与“证伪条件”（含数据缺口）。没有证据清单就无法动笔，没有证伪条件就无法判断结论是否成立。
      - q: 为什么大纲阶段就要定时间窗口？
        a: 时间窗口决定数据范围与对比基准；不定窗口，后面引用的数字会跨期不可比，结论也无法被验证。
    sources:
      - https://dune.com

  - id: t408
    type: theory
    stage: 4
    order: 14
    title: 研究方法：信源分级
    minutes: 13
    tags: [method, sources]
    sections:
      - h: 核心机制
        p: 把信源按“能否直接证明结论”排序：一手（法规原文、官方公告、链上交易、协议代码与治理提案）优于二手（机构摘要、审计报告、主流财经媒体），二手再优于三手（KOL 推文、聚合快讯、转述）。等级不是身份，而是距离事实的层数。
      - h: 关键细节
        p: 监管看官方公报与机构站点（pbc.gov.cn、sec.gov、esma.europa.eu、hkma.gov.hk）；链上数据看区块浏览器与 Dune；协议看 GitHub 与治理论坛。引用给日期与文号，不给孤链；同一结论至少两个独立来源，区分“官方披露”与“第三方估算”。引用链接要能回到原文页面而不是二手转述；必要时截图存档，防止页面改版后无法回溯。
      - h: 例子
        p: 一则“某国将批准某类代币”的快讯，三手来源只写“据知情人士”；追到一手，可能只是监管机构的征求意见稿或官员表态，与正式立法相差数个环节。写出这个差异，比复述快讯更有价值。
      - h: 对比或演进
        p: 传统研究以机构权威分级（央行高于媒体），链上研究还要加“口径”分级：同一指标的不同计算方式（TVL 是否去重、活跃地址是否剔除机器人）会给出不同结论，口径说明比来源名气更重要。
      - h: 代价与边界
        p: 一手来源也有偏差：官方公告有立场，链上数据有标签误差，代码可能有未披露的管理权限。分级的作用是让你知道“这条证据能支持多强的结论”，而不是替代判断。因此引用时最好同时给出方法与口径，而不只是给一个数字。
      - h: 常见误读
        p: 误以为“一手就绝对可信”，或“媒体都是错的”。正确做法是标注证据强度：法规原文可支撑“规定如此”，执法个案只能支撑“曾如此执行”，估算数据只能支撑“量级如此”。另一个误读是“引用越多越严谨”：十个三手来源不如一个一手文件；审稿时应数一手来源的比例，而不是数参考文献的条数。
    quiz:
      - q: 为什么“链上数据”算一手来源，但仍需谨慎引用？
        a: 交易本身不可篡改，但指标口径与地址标签由分析方定义（TVL 去重、机器人剔除、归属判定），口径不同结论会差很多，所以必须看方法与原始数据。
      - q: 信源分级的实质是什么？
        a: 按“距离事实的层数”和“能支撑多强的结论”排序，而不是按机构名气；一手支撑规定，二手支撑背景，三手只能当线索。
      - q: 为什么不同来源的 TVL 数字经常对不上？
        a: 口径不同：是否剔除重复质押与借贷再存款、是否只算公链、是否用币价折算；不统一口径的数字不可直接比较。
    sources:
      - https://dune.com
      - https://www.sec.gov

  - id: p407
    type: practice
    stage: 4
    order: 15
    title: 整理一个 Dune 看板
    minutes: 14
    tags: [data, dune]
    sections:
      - h: 目标
        p: 在 Dune 上选一个公开数据集，做一个含 3 个图表的看板（例如某条链的日活地址、稳定币转账量、DEX 交易量），并写清每个指标的口径，最终能独立解释一个尖峰。目标是能独立复现，并从数据里得出一个可验证的结论。看板做完后，把结论写成一句话，并注明它可能被什么数据推翻。
      - h: 准备
        p: Dune 账号（免费额度足够）、选定的链与合约地址、10 分钟理解数据集字段的时间；先用区块浏览器确认合约地址与事件表，避免在错误的表上写 SQL。先看 2 至 3 个别人做的同类看板，记录它们的口径与图表类型，作为对照。
      - h: 步骤
        p: 1) 浏览公开看板与数据集，选定数据表；2) 用 Query 写或改一条 SQL，限定时间范围与合约地址；3) 存为图表并组合成 Dashboard；4) 每个图表下补一句口径说明，含排除项；5) 写 200 字结论；6) 把 SQL 保存并写注释（数据表、过滤条件、单位），便于一周后复查；7) 给每个图表配一句“这图回答什么问题”；8) 设一个固定刷新周期（如每周），避免看板停在旧数据上被误读。
      - h: 验收
        p: 看板有 3 个图表、时间范围明确、口径写在标题或描述里；能解释某个尖峰是真实活动、刷量还是口径变化；结论与图表一致，不含未标注口径的数字。能让别人只看看板描述就复现同样的查询；结论中不含“感觉”“大概”这类词。最后检查一遍：图表标题是否自解释、单位是否写全、数据截止日期是否标注。
      - h: 安全与常见坑
        p: 只用公开链上数据；免费额度有限，避免无意义的重查询；看板只作研究记录，不当投资依据。常见坑：把合约调用次数当用户数、把转账笔数当资金流、把时间范围写成“最近”而没写具体区间。还有一点：公开看板可能被他人引用，口径写不清会放大误解，宁可多写一句限制条件。另一个坑是“只看总量不看分布”：稳定币转账量可能被少数地址刷高，日活地址可能被空投猎人抬高；分布与中位数往往比总量更能说明问题。
    quiz:
      - q: 一个合格看板的三个必备要素是什么？
        a: 明确的图表与指标、固定的时间范围、写清的统计口径（含排除项）；缺口径的图只能看趋势，不能用于结论。
      - q: 为什么“转账笔数”不能直接代表资金流？
        a: 笔数不含金额分布与内部转账：一笔巨额转账与一万笔微额转账可能笔数相近，资金规模却差几个数量级。
    sources:
      - https://dune.com

  - id: t409
    type: theory
    stage: 4
    order: 16
    title: 可证伪判断
    minutes: 13
    tags: [method, falsifiability]
    sections:
      - h: 核心机制
        p: 一个判断要能被证伪，必须写明观察对象、方向或量级、时间窗口，以及什么情况算错。例如“未来 12 个月内该链的 DA 费用占 Rollup 成本比重会下降”，而不是“模块化是未来”——后者无法被任何数据推翻。写判断时把“预期”与“阈值”分开：预期是方向，阈值是判定标准，两者混在一起就无法证伪。
      - h: 关键细节
        p: 写判断时至少列出一种替代解释：数据变好可能来自补贴、一次性事件或口径变化。不列替代解释的结论，多半把相关性当成了因果；同时要写明“若观察到什么，就说明我错了”。写完后隔一天再读一遍：如果自己都说不清什么数据会推翻它，就该重写。
      - h: 例子
        p: 判断“某 DePIN 网络已产生真实需求”，可证伪的写法是“未来两个季度，外部付费收入占比超过 50%，且补贴减半后设备在线率不低于 70%”；两个数字任一不达标，判断就被削弱。这样写也让别人能替你检验。若只看结果不看条件，事后很容易把“恰好发生”解释成“早就料到”。
      - h: 对比或演进
        p: 用基准、乐观、悲观三档并给概率区间，比单点预测更诚实；同时记录当时的输入数据，事后才能分清是判断错还是运气差。概率估计本身也需要复盘校准，否则区间只是装饰。
      - h: 代价与边界
        p: 可证伪不等于正确：一个能被证伪的判断可能仍然是错的，它只保证你能知道自己错在哪。对结构性趋势（技术演进、监管方向），量化窗口往往很长，此时更适合写成“条件式判断”。写作时把“我预期看到什么”与“我实际看到什么”分开列，是让判断可复盘的简单办法。
      - h: 常见误读
        p: 误以为“给结论加个日期就算可证伪”，或“无法证伪就是深刻的洞察”。缺少观测指标与否定条件的判断，无论多宏大，都无法被检验，也无法指导决策。另一个误读是“证伪条件越严格越专业”：条件必须可观测、可获取，否则就是另一种不可证伪；写之前先确认数据能不能拿到。
    quiz:
      - q: 一个判断“不可证伪”通常缺了什么？
        a: 缺少明确的观察对象、量级、时间窗口与否定条件；当任何结果都能被解释成支持结论时，这个判断就没有信息量，也无法复盘。
      - q: 为什么可证伪判断要写替代解释？
        a: 同一现象常有多种成因；不列替代解释，容易把补贴、一次性事件或口径变化当成趋势，得出错误因果。
      - q: 什么是“条件式判断”，适用于什么场景？
        a: 写成“若 A 发生，则 B 更可能”的形式；适用于时间窗口很长的结构性趋势，无法给出短期量化指标时。
    sources:
      - https://dune.com

  - id: p408
    type: practice
    stage: 4
    order: 17
    title: 测试网体验账户抽象
    minutes: 15
    tags: [account-abstraction, testnet]
    sections:
      - h: 目标
        p: 在测试网上体验一次账户抽象（account abstraction）：用 ERC-4337 智能账户完成一笔由 Paymaster 代付 Gas 的转账，理解“用户不必先持有原生代币”到底改变了什么。
      - h: 准备
        p: 测试网钱包、测试 ETH（从水龙头领取）、支持 ERC-4337 的钱包应用、区块浏览器；确认全程在测试网（如 Sepolia）。不导入任何持有真实资产的钱包，也不连接主网。先看一遍 ERC-4337 的四个角色再动手，避免操作完仍不知道自己做了什么。
      - h: 步骤
        p: 1) 创建或导入测试钱包并领取测试 ETH；2) 在支持 ERC-4337 的应用里创建智能账户；3) 走一笔 Paymaster 代付 Gas 的交易；4) 在区块浏览器查看 UserOperation 与最终上链交易的对应关系；5) 记录失败时 Gas 由谁承担。
      - h: 验收
        p: 完成至少一笔经 Paymaster 代付的测试交易；能说清 UserOperation、Bundler、EntryPoint、Paymaster 各自的角色；能解释为什么“免 Gas”其实是有人替你付，以及这笔成本可能以什么形式转嫁。再补一句：如果 Bundler 没有接单，交易会停在“待打包”状态，这是账户抽象新增的一类失败模式。
      - h: 安全与常见坑
        p: 全程测试网，不用真实资产；不把主网私钥导入任何新应用；遇到“限时免费 Gas”类推广先核实来源。常见坑：把测试网代币当真实资产、不核对智能账户合约地址、忽略 Bundler 失败时的重试成本。另一个坑是用真实助记词在测试应用里“顺手试试”：测试网与主网共用同一助记词会放大泄露风险，测试就用独立钱包。还有一个坑是“忽略恢复路径”：智能账户的恢复与升级权限若掌握在单一服务商手里，账户抽象反而引入了新的托管风险。
    quiz:
      - q: ERC-4337 里 UserOperation 与普通交易的区别是什么？
        a: UserOperation 是描述“意图执行什么”的结构化请求，由 Bundler 打包后通过 EntryPoint 合约上链；它不是用户私钥直接签名的原始交易。
      - q: “Paymaster 代付 Gas”意味着用户完全没有成本吗？
        a: 不是。Gas 由 Paymaster 或其赞助方支付，成本会以补贴、手续费或代币形式转嫁；用户仍可能承担价格差或资格限制。
    sources:
      - https://eips.ethereum.org

  - id: t410
    type: theory
    stage: 4
    order: 18
    title: 研报写作
    minutes: 13
    tags: [writing, research]
    sections:
      - h: 核心机制
        p: 可读的研报按“结论—依据—风险—附录”组织：开头三段写清核心判断与关键数据，主体用证据链支撑，风险章节主动写出自己可能错在哪。读者的时间有限，结论必须前置，但不能与证据脱节。
      - h: 关键细节
        p: 每个论点配一手证据：法规文号、链上交易哈希、治理提案编号、官方披露数字；数字必须给口径与时间。避免“业内普遍认为”这类无来源表述；图表要有坐标单位、时间范围与来源注。初稿写完后，把所有数字圈出来，逐个补口径与来源，再交给别人读。
      - h: 例子
        p: 一段合格的论证是“42 号文自 2026 年 2 月 6 日施行并废止 237 号通知（银发〔2026〕42 号），因此境内 RWA 代币化原则上被禁止，例外须经同意”，而不是“监管趋严，行业承压”。前者可复核，后者只是情绪。反面例子是“该项目获得多家机构关注，未来可期”：既无观察对象，也无指标，读者无法验证。
      - h: 对比或演进
        p: 与新闻稿相比，研报要提供可复核的推理链与证伪条件；与学术论文相比，研报更强调时效与决策相关，但仍须区分事实、推断与观点。三类文本的读者预期不同，写作标准也不同。写作时先确定“这篇报告要让读者做什么决定”，再决定详略；没有决策对象的报告容易写成资料汇编。
      - h: 代价与边界
        p: 严谨写作更慢，且会暴露不确定性，读者可能觉得“不够果断”；但把假设藏起来的报告事后无法复盘，也无法建立可信度。合规边界：不写价格目标、收益承诺与买卖建议（本文不构成投资或法律意见）。
      - h: 常见误读
        p: 误以为“叙事流畅就是好报告”，或“引用越多越权威”。堆砌来源但结论与证据不对应，比少引用更糟；审稿时逐段问“这句话的证据是什么”。审稿清单可以很短：结论是否有证据、风险是否写了、数字是否标口径、是否越界给了建议。另一个误读是“结论写得越绝对越有分量”：绝对化表述经不起一次反例，反而降低可信度；用条件与概率表达，读者更容易跟随。
    quiz:
      - q: 研报的“风险章节”为什么不能省？
        a: 它迫使作者写出判断可能错的条件与观察指标，读者据此评估结论稳健性；没有风险章节的报告，通常把关键假设藏了起来。
      - q: 什么样的数字才可以直接写进研报？
        a: 有口径、有时间、有来源的数字；缺任一项都要注明“待核实”，或改写为不需要该数字的表述。
      - q: 研报与新闻稿在结构上最大的差别是什么？
        a: 研报要给出可复核的证据链与证伪条件，新闻稿只需转述事件；前者能支撑决策，后者只提供信息。
    sources:
      - https://www.sec.gov

  - id: p409
    type: practice
    stage: 4
    order: 19
    title: 整理个人术语表
    minutes: 11
    tags: [glossary, review]
    sections:
      - h: 目标
        p: 把四个阶段学到的术语整理成一份可检索的个人术语表，每条含中英文、一句话定义、一个例子与一个常见误解，最终能当作写作时的查证索引。术语表的价值在于写作时能快速查证，而不是收藏。每条术语最后都要经得起“换个说法还算不算”的追问。
      - h: 准备
        p: 本地文档或表格、本课程前三个阶段的笔记与概念卡、一个固定模板（中文、英文、定义、边界、来源位置）。先确定分组方式，再开始填，避免后期返工。先浏览四个阶段的条目清单，按“高频出现、容易混淆、有监管含义”三类挑出优先收录的术语。给自己定一个数量目标（如每周补 5 条），否则术语表很容易停在开头。
      - h: 步骤
        p: 1) 从课程概念卡里逐个抽取术语；2) 每条填四栏：中文、英文、定义、边界（误用情形）；3) 按监管、安全、机制、市场分组；4) 给每条标一个可查来源或例子位置；5) 标出仍需核实的条目；6) 每条写一个反例：什么时候这个术语会被误用；7) 每月回看一次，把“待核实”改成已确认或删除；8) 给高频术语写一句“讲给外行听”的版本，检验自己是否真的理解。
      - h: 验收
        p: 不少于 40 条；随机抽 5 条能不看原文讲清；分组清晰，能直接当写作时的查证索引；明确标出仍待核实的三条，并写清缺什么材料才能确认。能在一分钟内查到任一术语的定义与出处；同一术语在不同阶段含义不同时，要分别标注。另外抽查 3 条有监管含义的术语，确认定义与 42 号文、MiCA 等文件的口径一致，而不是沿用旧表述。抽查时要连例子一起讲，而不是只背定义。
      - h: 安全与常见坑
        p: 定义以官方文件与课程内容为准；不确定的标“待核实”，不要凭印象补全；术语表本地维护，不混入任何私钥或账户信息。常见坑：把定义写成宣传语、只收缩写不收全称、同一条目在不同分组重复且定义不一致。维护上建议一条一版本，改动时写日期，便于追溯。另一个坑是“抄百科定义”：百科往往缺少边界与反例，写进报告后无法支撑判断；每条定义都应能指向一份官方文件或课程条目。
    quiz:
      - q: 术语表每条至少要包含哪四栏？
        a: 中文名、英文名、一句话定义、边界（误用情形或反例）；有例子与来源位置更好，便于写作时快速查证。
      - q: 为什么要给术语标“待核实”？
        a: 标出不确定项能防止把猜测写进后续报告；术语表是查证索引，不是权威结论，明确不确定性比假装确定更有用。
    sources:
      - https://ethereum.org

  - id: t411
    type: theory
    stage: 4
    order: 20
    title: 复盘方法
    minutes: 13
    tags: [method, review]
    sections:
      - h: 核心机制
        p: 复盘要分开看三件事：判断（当时结论对不对）、过程（信息收集与推理是否可靠）、执行（有没有按计划做）。混在一起记，就会把运气好记成能力强，或把坏运气当成方法错误。分开记录的好处是：判断错可以改方法，执行错可以改流程，运气差则不必自责，这三种应对完全不同。
      - h: 关键细节
        p: 每条固定五栏：日期与场景、当时的判断与概率、依据与来源、事后结果、偏差归因（信息缺失、推理错误或运气）。模板固定才能横向比较；归因要具体到“哪条证据缺失”，而不是笼统写“判断失误”。命中率只在样本足够时有意义；样本少于十条时，更应关注“错在哪类证据上”而不是百分比。
      - h: 例子
        p: 一条复盘记录可以这样写：“10 月判断某项目 TVL 增长来自真实需求，概率 60%，依据是发行方披露；两个月后增长停滞而补贴翻倍，归因为把补贴当需求，当时缺的证据是分用户收入的拆分数据。”复盘的常见产出是一条“下次遇到同类情形先查 X”的规则，而不是“下次要更谨慎”这种口号。
      - h: 对比或演进
        p: 从“周复盘”到“季度复盘”分层：周复盘看执行与信息源，季度复盘抽 10 条旧判断核对结果、统计命中率与偏差类型，形成下季度检查清单。复盘的产出是规则，不是感想。
      - h: 代价与边界
        p: 复盘需要如实记录当时的判断与概率，事后修改记录会让复盘失效；样本少时命中率没有统计意义，只能看偏差类型。它也无法消除不确定性，只能提高校准度。另一个限制是记忆偏差：人会自动美化当时的判断，所以要在决策当天写记录，而不是月底补写。
      - h: 常见误读
        p: 误以为“复盘就是写总结”，或“结果好就说明判断对”。常见四类偏差是确认偏误、叙事偏误、后见之明与样本偏差，复盘的价值在于识别它们，而不是给过去打分。另一个误读是“复盘要找出唯一原因”：多数失误是多因素叠加，强行归因到单一原因会让改进落空；写下主因与次因，比找“真凶”更有用。
    quiz:
      - q: 复盘要分开看哪三件事？
        a: 判断（结论对不对）、过程（信息与推理是否可靠）、执行（是否按计划做）；分开记录才能分清能力、方法与运气。
      - q: 为什么复盘必须把“判断”与“运气”分开？
        a: 结果好不等于判断对。把运气当能力会强化错误方法，把坏运气当错误会否定正确方法；分开记录才能校准下一次的概率估计。
      - q: 复盘的五栏模板是什么？
        a: 日期与场景、当时的判断与概率、依据与来源、事后结果、偏差归因；归因要具体到缺了哪条证据。
    sources:
      - https://ethereum.org
