# 阶段 3：市场——交易所、链上数据、代币经济与宏观
# 格式规范见同目录 README.md；校验器见 scripts/content.py。
# v2：每条 10–15 分钟，概念 6 节 / 理论 5–6 节 / 实践 5 节，quiz 为题目列表。
schema_version: 1
stage: 3
title: "市场：交易所、链上数据、代币经济与宏观"
