items:
  # ===== 概念卡 c301–c320 =====
  - id: c301
    type: concept
    stage: 3
    order: 1
    title: 市值
    en: Market Cap
    minutes: 11
    tags: [market, valuation]
    sections:
      - h: 一句话
        p: "市值（Market Cap）等于当前价格乘以流通供应量，衡量市场为这个资产标出的总价，而不是沉淀在其中的资金量；它是一个乘法结果，不是一个统计出来的资金池。"
      - h: 为什么重要
        p: "同样是 10 亿美元市值，流通量大的资产往往需要更多资金才能推动价格；比较项目规模之前，必须先看清分子和分母的口径。市值还是各类指数、基金权重与杠杆产品的基础参数：一个标的被纳入某个指数，往往直接由市值排序决定，流通量口径一改，排名就整体挪位。"
      - h: 核心机制
        p: "市值等于价格乘以流通供应量。价格来自最近一次成交，属于边际定价：只要一小部分筹码在交易，成交价就会被当成全部存量的标价。流通量由数据商按各自规则统计——扣除锁仓、团队未解锁、金库与销毁地址的方式各不相同，所以同一时点在两个网站看到的市值可以不同，差额通常来自分母而不是价格。"
      - h: 例子
        p: "假设某代币总量 10 亿枚、流通 1 亿枚、市价 2 美元：市值 2 亿美元，完全稀释估值（FDV）20 亿美元，两者相差十倍。若某天只有 100 万枚换手、价格被抬到 4 美元，市值立刻变成 4 亿美元，而实际成交金额可能只有几百万美元——这就是边际定价把总市值放大的直观演示。"
      - h: 常见误解
        p: "误以为市值等于投进去的钱。反例：一枚币只有 1% 在流通，一笔小单把价格抬高一倍，市值也跟着涨一倍，但项目实际收到的资金并没有增加。另一个误解是把市值当成可变现规模：真到想卖出时，可承接的买盘远小于市值，盘口深度与滑点才是兑现的约束。"
      - h: 边界与代价
        p: "市值适合同类资产之间做规模排序，不适合跨资产衡量风险或流动性；流通比例低、持仓集中的标的，市值更接近账面数字。要判断市场为这些筹码实际付出过多少成本，应换成已实现市值（Realized Cap）这类按最后移动价格计价的口径，两者不能互相替代。"
    quiz:
      - q: "总供应 10 亿枚、流通 1 亿枚、每枚假设 2 美元，市值是多少？"
        a: "2 亿美元。市值只用流通量计算：1 亿乘以 2 美元；若用总量计算得到 20 亿美元，那是完全稀释估值 FDV。两个口径不能混用，比较项目时要说明用的是哪一个。"
      - q: "为什么市值不等于流入这个资产的资金量？"
        a: "市值是价格乘以流通供应量的乘积，价格只由最近一笔边际成交决定；少量资金就能改变成交价，从而放大或缩小全部存量的标价，但并没有对应数量的资金真正进入这个资产。"
    sources:
      - https://coingecko.com/

  - id: c302
    type: concept
    stage: 3
    order: 2
    title: 订单簿
    en: Order Book
    minutes: 11
    tags: [exchange, microstructure]
    sections:
      - h: 一句话
        p: "订单簿是买单（bid）与卖单（ask）按价格排序的挂单列表，撮合遵循价格优先、同价时间优先，是中心化交易所的基础设施；它记录的是意愿，而不是已经发生的成交。"
      - h: 为什么重要
        p: "买卖价差（spread）和可成交数量都要从订单簿读出；只看最新成交价，会漏掉“这笔单到底能不能成交、要吃掉几档”这个关键问题。订单簿的价差、厚度与挂单分布，直接决定交易成本、短期价格弹性，也是判断流动性真假的第一手材料。"
      - h: 核心机制
        p: "买单按价格从高到低排、卖单从低到高排；最优买价与最优卖价之间是价差，价差除以中间价得到相对价差。市价单从最优档开始逐档吃掉对手方挂单，直到数量满足。撮合引擎只做两件事：排序与扣减；同价时先挂单的先成交，所以排队位置本身有价值，撤单重挂会失去时间优先。"
      - h: 例子
        p: "卖侧挂单：100.0 有 2 枚、100.5 有 5 枚、101.0 有 10 枚。一笔 6 枚的市价买单会先吃掉 100.0 的 2 枚，再吃掉 100.5 的 4 枚，平均成交价约 100.33，最后一枚成交在 100.5，偏差部分就是滑点。只看最新成交价 100.0，会误以为 6 枚都能在 100.0 成交。"
      - h: 常见误解
        p: "以为订单簿显示所有想买卖的人。它只包含尚未成交的限价挂单；市价单立即撮合、不留在簿上，隐藏单与冰山单也可能不显示。还有一层误解是认为挂单代表真实意愿：挂单随时可以撤销，屏幕上的大额挂单可能是诱导，看到它不等于能按那个价格成交。"
      - h: 边界与代价
        p: "订单簿在参与者多、流动性集中时效率最高；链上全量订单簿每笔挂单与撤单都要付 Gas 并等待出块，成本很高，所以链上更多采用 AMM 池子或链下撮合、链上结算。订单簿对高频撤单式操纵也更脆弱，普通用户读簿时需要同时看价差、深度和成交明细。订单簿数据还依赖交易所的披露质量：有的平台只提供聚合后的档位，有的会合并或隐藏部分挂单，读簿前最好先确认数据的生成方式。"
    quiz:
      - q: "订单簿上只有挂单，那市价单去哪了？"
        a: "市价单直接与簿上的对手方挂单撮合成交，不会作为挂单留下；成交后从对手方挂单里扣减数量，所以订单簿只反映还没成交的意愿，已经成交的部分只出现在成交记录里。"
      - q: "买卖价差变大通常说明什么？"
        a: "说明提供流动性的成本或风险上升：波动加大、做市商撤单或库存压力变大时，报价会更宽。价差是即时交易的隐性成本，价差越宽，市价单一进一出损耗越大。"
    sources:
      - https://ethereum.org/

  - id: c303
    type: concept
    stage: 3
    order: 3
    title: 订单深度
    en: Market Depth
    minutes: 11
    tags: [liquidity, microstructure]
    sections:
      - h: 一句话
        p: "深度指订单簿在某个价格区间内累计可成交的数量，衡量一笔大单能吃掉多少而不把价格推得太远；常见问法是“在中间价上下 1% 以内，能成交多少名义金额”。"
      - h: 为什么重要
        p: "同样的名义金额，深度厚的市场滑点小、被单笔交易冲击小；深度薄的时刻，少量资金就能把价格推动很远，强平也更容易被连锁触发。判断一个市场能不能承接大额交易，看的是深度而不是成交量，因为成交量统计的是已经发生的事，深度描述的是此刻还能承接多少。"
      - h: 核心机制
        p: "深度是把订单簿按价格累积后得到的曲线：把买卖两侧各档数量从最优价向外累加，就能读出吃穿到某一价位需要多少名义金额。深度不是常数，它随波动率、做市商库存与激励计划变化；数据商常用中间价上下 0.5%、1%、2% 区间的累计量来标注深度，跨平台比较时必须对齐这个区间。"
      - h: 例子
        p: "某合约中间价 100，卖侧 1% 以内累计 300 万美元、买侧累计 250 万美元。一笔 500 万美元的市价买单会扫穿 1% 区间继续吃更远的档位，平均成交价明显变差。若同一时刻两侧各只有 50 万美元，同样一笔单可能把价格推高数个百分点，再触发上方空头止损与下方多头强平。"
      - h: 常见误解
        p: "把深度当成静态属性。挂单可以随时撤销，波动放大时做市商收缩报价，屏幕上的深度会瞬间变薄，甚至出现只用来诱导的虚假挂单。另一个误解是把多家交易所的深度直接相加：同一批做市商在多个场所重复报价，加总会高估真实可成交能力，极端行情下这些挂单还会同时消失。"
      - h: 边界与代价
        p: "深度指标只在同一交易场所、同一时间窗内可比；它不告诉你挂单会不会被撤、成交后价格会不会回来。做市商维持厚报价要承担库存风险，这部分成本会以更宽的价差和更贵的资金费率转回给交易者，所以深度从来不是免费的公共品。深度还会随时间变化：同一天的开盘与收盘、周一与周末，深度可能相差数倍，所以记录深度时必须同时记录时间与行情状态。"
    quiz:
      - q: "为什么平时深度很好，不代表大额成交时滑点就小？"
        a: "可见深度只是挂单快照，可被撤销或隐藏；行情波动时做市商撤单、隐藏单不显示，真实可成交的深度可能远低于屏幕上看到的数量，所以要用小单试探或分批执行来验证。"
      - q: "比较两个交易所的深度时，为什么要先对齐价格区间？"
        a: "深度是区间内累计可成交数量的定义，区间不同数字就不可比；只有统一用中间价上下同一百分比区间、同一时间点的快照，才能比较两侧承接大单的能力。"
    sources: []

  - id: c304
    type: concept
    stage: 3
    order: 4
    title: 滑点
    en: Slippage
    minutes: 11
    tags: [trading, market]
    sections:
      - h: 一句话
        p: "滑点是预期价格与实际成交价之间的差额，来源是盘口深度不足、成交延迟与价格波动，而不是手续费；它衡量的是“看到的价”能否变成“拿到的价”。"
      - h: 为什么重要
        p: "滑点决定一笔交易的真实成本。名义金额越大、市场越薄，滑点越大；去中心化交易所的滑点还包含价格冲击与 MEV 抢跑。评估任何交易场所时，手续费只是显性成本，滑点往往才是大额交易的主要损耗，而且它在成交前很难精确预知。"
      - h: 核心机制
        p: "滑点有两个来源：一是吃单深度，市价单在订单簿上多档成交，越往后价格越差；二是延迟滑点，从你按下确认到订单真正执行或上链打包之间价格已经移动。AMM 用恒定乘积曲线定价时，价格随池中储备比例变化，买入会推高价格，滑点由成交额相对池子总锁仓量的比例决定。"
      - h: 例子
        p: "假设某 AMM 池有 1000 ETH 与 200 万 USDC，隐含价格约 2000。买入 1 万 USDC 只占池子 0.5%，价格冲击很小；买入 20 万 USDC 约占池子 10%，平均成交价会被推高约 10%，而流动性提供者手续费可能只有 0.3%，两者相差一个量级。同样的逻辑也适用于薄盘口的订单簿。"
      - h: 常见误解
        p: "把滑点和手续费混为一谈。反例：手续费只有 0.1% 的池子，一笔大单把价格推偏 2%，总成本主要来自滑点，而不是那 0.1%。还有人以为把滑点容忍度调高就能“成交得更好”，其实它只是允许更差的成交价，真实成本仍然从成交价里扣走，调高只会增加被抢跑的空间。"
      - h: 边界与代价
        p: "降低滑点的办法是拆单、用限价单、寻找深度更好的场所或使用聚合器，代价是时间成本、部分成交与失败率上升。大额交易把价格推走这件事本身无法消除，只能管理：任何承诺“零滑点”的说法，通常是把延迟或隐藏成本挪到了别处。另一个现实约束是报价与成交分离：界面上看到的报价是当时快照，真正成交时池子状态可能已经改变，这也是链上交易要设置滑点保护的原因。"
    quiz:
      - q: "在恒定乘积的 AMM 池子里，买得越多平均成交价越差，为什么？"
        a: "买入会消耗池中一种资产并推高其价格，成交量越大价格冲击越大；平均成交价偏离初始报价的部分就是滑点，与手续费是两个不同来源，两者相加才是真实成本。"
      - q: "滑点容忍度设得很高，会带来什么额外风险？"
        a: "容忍度只是允许以更差的价格成交，真实成本仍从成交价中扣除；设得过高会让抢先交易者有利可图，交易可能被引导到明显偏离市场价的成交上。"
    sources: []

  - id: c305
    type: concept
    stage: 3
    order: 5
    title: 中心化交易所
    en: CEX
    minutes: 11
    tags: [exchange, custody]
    sections:
      - h: 一句话
        p: "中心化交易所（Centralized Exchange, CEX）把撮合、清算与资产托管放在自己的服务器和账本上，用户看到的是平台数据库里的余额，而不是自己地址上的链上资产。"
      - h: 为什么重要
        p: "CEX 提供深流动性、法币通道与衍生品，同时把对手方风险集中到一家公司：链上资产一旦转入交易所地址，控制权就交给了平台。理解这层关系，才能分清“平台账本上的数字”和“链上真正属于你的资产”，也才知道为什么要关注提现通道、储备披露与平台治理。"
      - h: 核心机制
        p: "用户充值后在平台内部记账，买卖在内部账本撮合，链上只发生充值与提现两件事。平台掌握热钱包与冷钱包私钥，用户持有的是对平台的债权；平台另外承担撮合引擎、风控、保证金清算与合规义务。提现本质上是把平台债权换回链上资产，所以提现通道是否畅通，直接反映平台偿付能力。"
      - h: 例子
        p: "在平台内部买卖 BTC 时，链上不会产生任何交易，只有账本上两行分录变化；只有充值和提现才真正上链，这也是链上数据看不到“交易所内部成交”的原因。2022 年 FTX 倒闭时，用户账面上的余额无法足额提取，说明账面数字与链上资产是两套账，私钥在谁手里才是最终控制权。"
      - h: 常见误解
        p: "把交易所余额当成自己的链上资产。反例：2022 年 FTX 倒闭时，用户账面上的余额无法足额提取；私钥在平台手里，用户持有的是对平台的债权。另一个误解是以为“有储备证明就等于安全”，储备证明通常只是某个时点的资产快照，不覆盖负债完整性。"
      - h: 边界与代价
        p: "托管带来便利也带来平台风险：挪用、挤兑、黑客、账户冻结，以及跨境司法的不确定性。降低风险的做法是把资产提到自控私钥的地址，代价是自担私钥安全、链上手续费与操作复杂度。中国内地按 2026 年 2 月 6 日八部门 42 号文，境内虚拟货币业务一律禁止，本课只做机制解释，不涉及任何开户或交易操作。"
    quiz:
      - q: "把币充进中心化交易所后，私钥在谁手里？"
        a: "在交易所手里。用户拿到的只是平台账本上的余额记录，只有提现到自控私钥的地址后资产才真正由自己掌握，这也是托管风险的来源。"
      - q: "为什么链上数据看不到交易所内部的买卖？"
        a: "因为内部撮合只改平台自己的数据库账本，不产生链上交易；链上只记录充值与提现。所以链上转账额和交易所内成交量是两个不同口径，不能直接比较。"
    sources: []

  - id: c306
    type: concept
    stage: 3
    order: 6
    title: 去中心化交易所
    en: DEX
    minutes: 11
    tags: [dex, defi]
    sections:
      - h: 一句话
        p: "去中心化交易所（Decentralized Exchange, DEX）在链上用智能合约完成兑换或撮合，资产始终留在用户自己的地址，不需要托管给平台。"
      - h: 为什么重要
        p: "它把“信任平台”换成“信任代码与价格源”，是可组合 DeFi 的基础：任何合约都能直接调用它的流动性。代价是每笔操作都要付 Gas，并承担合约漏洞、价格源操纵与 MEV 抢跑风险。理解这一点，才能判断一笔链上兑换的真实成本由哪几块构成。"
      - h: 核心机制
        p: "主流实现是自动做市商（AMM）：流动性提供者把两种资产放进池子，合约按公式（如恒定乘积 x 乘 y 等于 k）定价，用户用其中一种换另一种，价格随储备比例移动。也有链上订单簿与聚合器模式，后者把多个池子的报价拼成一条最优路径。所有结算都在链上完成，谁都能验证，但每笔交易都要支付 Gas 并等待打包。"
      - h: 例子
        p: "一次链上兑换的流程是：钱包签名发起交易，交易进入内存池，被区块打包后合约按当时储备比例执行，你拿到资产，池子储备改变。同样的兑换，池子越浅滑点越大；另外 MEV 搜索者可能看到你的交易后在其前后插入交易，让你以更差价格成交。2020 年 bZx 事件中，攻击者用闪电贷操纵价格源从协议套走资金，说明代码与价格源本身就是风险点。"
      - h: 常见误解
        p: "以为 DEX 没有对手方风险。反例：2020 年 bZx 事件中，攻击者用闪电贷操纵价格源从协议套走资金；代码和价格源本身就是风险点。另一个误解是以为 DEX 一定更便宜：小额兑换时 Gas 与固定成本占比更高，深度不足时滑点也会吃掉优势，便宜与否取决于金额与池子深度。"
      - h: 边界与代价
        p: "DEX 的风险面包括智能合约漏洞、预言机或价格源被操纵、MEV 抢跑、Gas 价格波动以及跨链桥风险；无需许可上币也意味着大量低质量代币与貔貅盘。它适合需要自托管与可组合性的场景，不适合追求极低延迟和深度的场景，两者是不同工具。"
    quiz:
      - q: "DEX 和 CEX 最本质的区别是什么？"
        a: "资产由谁控制。DEX 用智能合约在链上完成交易，资产不离开用户地址；CEX 把资产托管进平台账本，用户承担平台违约风险。"
      - q: "在 AMM 上兑换时，真实成本由哪几部分构成？"
        a: "至少包括流动性提供者手续费、价格冲击带来的滑点、链上 Gas，以及可能被 MEV 抢跑造成的额外损失；只看手续费会严重低估一次兑换的实际成本。"
    sources:
      - https://ethereum.org/

  - id: c307
    type: concept
    stage: 3
    order: 7
    title: 做市商
    en: Market Maker
    minutes: 11
    tags: [liquidity, market]
    sections:
      - h: 一句话
        p: "做市商（Market Maker）在买卖两侧持续报价，用买卖价差和成交量覆盖库存风险，为市场提供随时可以成交的深度，是流动性的主要供给方。"
      - h: 为什么重要
        p: "用户感觉到的“随时能成交”，背后是做市商在承担库存与逆向选择风险；做市商退出时价差变宽、深度变薄，市场看起来会突然没有流动性。理解做市商的收益结构，就能明白为什么行情剧烈时交易成本会同步上升，以及为什么“挂单量”不等于“可成交承诺”。"
      - h: 核心机制
        p: "做市商围绕自己估计的公允价值挂出买单和卖单，赚取价差，同时承担两类风险：库存风险（成交后持仓被动累积）与逆向选择风险（对手方往往比你更知情）。它用现货、永续或期权对冲方向暴露，用更宽的报价覆盖波动，报价宽度通常随波动率与库存偏离上升。这是一门规模、速度与风险管理的生意。"
      - h: 例子
        p: "某做市商在买卖两侧各挂 10 万美元、价差 5 个基点。平稳行情里每轮换手赚一点价差；一旦出现单边下跌，它被迫不断买入、库存持续累积，若价格再跌 2%，库存浮亏可能远超当天赚到的价差。于是它要么撤单、要么把价差拉宽到 20 个基点，屏幕上的深度随之变薄。"
      - h: 常见误解
        p: "把做市商当成稳赚价差的人。反例：单边行情里做市商被迫接盘、库存越积越多，对冲不及时就会亏损；这是风险管理生意，不是无风险套利。另一个误解是把做市商等同于操纵者：它的报价行为受竞争与风控约束，价差变宽更多是风险定价的结果。还有人把做市商的高频撤单当成操纵：在多数市场，快速更新报价是正常的风险管理行为，真正需要警惕的是诱导性的虚假挂单。"
      - h: 边界与代价
        p: "做市商在流动性与波动率之间做取舍：报价越窄越有竞争力，但被逆向选择打穿的概率越高。交易激励计划可以吸引做市商提供深度，但补贴停止后深度往往回落，说明那部分流动性是租来的，而不是市场自生的。对交易者而言，价差、深度与资金费率是同一次风险定价的三个侧面，深度变薄时成本会以多个口径同时上升。"
    quiz:
      - q: "为什么极端行情中盘口深度会突然变差？"
        a: "做市商在波动放大时收缩报价或直接撤单来控制库存风险，挂单减少后深度变薄、价差变宽；这是风险定价的结果，而不是系统故障。"
      - q: "做市商赚的价差为什么不是无风险收益？"
        a: "因为成交后它会留下库存，并在单边行情中被动累积方向性敞口；逆向选择还会让它在信息劣势下成交。价差是对承担这些风险的补偿，对冲不及时就会变成亏损。"
    sources: []

  - id: c308
    type: concept
    stage: 3
    order: 8
    title: 永续合约
    en: Perpetual Futures
    minutes: 11
    tags: [derivatives, futures]
    sections:
      - h: 一句话
        p: "永续合约（Perpetual Futures）是没有到期日的期货，用资金费率把价格锚在现货附近，并允许以保证金放大头寸，因此价格里始终含着一个持仓成本项。"
      - h: 为什么重要
        p: "永续是加密市场成交量最大的衍生品，未平仓合约、资金费率与清算数据都来自它；理解永续，才看得懂杠杆资金在做什么。它也是价格发现的主要场所之一：现货反映当下供需，永续更多反映对未来的边际押注，两者的偏离会通过套利与资金费率被约束。"
      - h: 核心机制
        p: "交易双方签的是差价合约，按标记价格计算盈亏与保证金；没有到期日，因此没有交割收敛机制，改用资金费率、标记价格与强平引擎维持锚定。标记价格通常由现货指数加权计算，避免用最后成交价触发强平而被操纵。保证金不足时，强平引擎接管仓位，先撮合，再动用保险基金，仍不足时可能触发自动减仓。"
      - h: 例子
        p: "10 倍杠杆做多 1 万美元名义价值，只需约 1000 美元保证金。若维持保证金率为 0.5%，当亏损接近 9.5% 时就已触及维持保证金线，强平先于本金归零发生，剩下的是手续费与滑点；价格继续下跌时，强平单会进一步放大卖压。这就是杠杆把价格波动放大到账户层面的具体路径。"
      - h: 常见误解
        p: "以为永续价格一定等于现货。反例：多头拥挤时永续可以长期高于现货，形成溢价，正是资金费率在持续把价格拉回。另一个误解是把杠杆理解为“只需付一点保证金就能放大收益”，实际上它同时放大亏损概率、强平风险与资金费成本，保证金越薄，被短期波动扫出的概率越高。"
      - h: 边界与代价
        p: "永续依赖流动性与指数质量：流动性差时锚定会失效，指数成分有偏差时标记价格也会失真；强平机制则会把个体风险转化为市场级联。中国内地按 2026 年 2 月 6 日八部门 42 号文，境内虚拟货币业务一律禁止，本课只讲机制，不涉及任何杠杆操作或交易指引。标记价格与指数成分的透明度也值得关注：成分交易所、权重与异常值处理方式都会影响强平触发点，这些规则通常写在交易所的风险说明里。"
    quiz:
      - q: "永续合约靠什么机制避免价格长期偏离现货？"
        a: "资金费率。永续相对现货的溢价会转化为多空之间的定期支付，溢价越高多头支付成本越大，持仓激励改变后价差被拉回。"
      - q: "为什么强平价格通常早于“本金亏光”的价格？"
        a: "因为交易所要求账户权益不低于维持保证金，触线就强制平仓；维持保证金是仓位名义价值的一定比例，所以亏损还没到 100% 时就已经触发强平，剩余权益扣掉手续费与滑点。"
    sources: []

  - id: c309
    type: concept
    stage: 3
    order: 9
    title: 资金费率
    en: Funding Rate
    minutes: 11
    tags: [derivatives, funding]
    sections:
      - h: 一句话
        p: "资金费率（Funding Rate）是永续合约多空双方定期互相支付的比率：费率为正时多头付给空头，为负时反向支付，用来把永续价格拉回现货附近。"
      - h: 为什么重要
        p: "它把“永续价格偏离现货”变成持仓成本，是观察杠杆拥挤度的公开指标，也是现货与永续对冲时的主要成本项。很多人只盯价格，却忽略了只要一直持仓，就会持续被划转资金费；持仓时间越长，这项成本越不能忽略，它也可能在不知不觉中吃掉大部分持仓收益。"
      - h: 核心机制
        p: "交易所先用永续标记价与现货指数算出溢价指数，再加上利率成分并按各自公式与上下限调整，得到结算费率；每隔固定间隔（常见 8 小时，也有 1 小时或 4 小时）在结算时点按持仓名义价值划转。支付发生在多空账户之间，交易所只负责结算，不做对手方。"
      - h: 例子
        p: "假设费率为每 8 小时 0.01%，一天结算三次就是 0.03%；持有 10 万美元名义价值的多头，每天付出的资金费约 30 美元，一个月约 900 美元。按单利粗略年化，0.03% 乘以 365 约 11%，这还未计入手续费与滑点——所以对冲策略必须先算清这笔持续成本。"
      - h: 常见误解
        p: "把高资金费率当成看涨信号。反例：费率极高说明多头持仓拥挤、持有成本高，一旦价格不再上涨，多头平仓本身就会形成卖压。另一个误解是把资金费当成交易所收费：它其实是多空之间的划转，交易所通常另有交易手续费。还有人把费率符号当成多空比例的精确读数，其实它只反映永续相对现货的溢价程度。"
      - h: 边界与代价
        p: "高费率可以持续很久，把它当方向信号容易在趋势里反复被打脸；不同交易所的结算间隔、指数成分与上下限不同，跨所横向比较费率时要先统一口径。费率还是套利与对冲策略的核心成本项，忽略它会高估收益，而且费率可以在很短时间内从正转负。跨期比较时还要注意结算频率差异：8 小时结算的 0.01% 与 1 小时结算的 0.01%，单次数字相同但年化成本相差数倍，直接比较会得出错误结论。"
    quiz:
      - q: "资金费率为正时，谁付钱给谁？"
        a: "多头付给空头。正费率通常出现在永续价格高于现货时，用来抬高做多成本、降低做空成本，从而把永续价格拉回现货。"
      - q: "为什么把资金费率当作方向信号容易出错？"
        a: "费率只描述持仓拥挤与持有成本，不预示价格方向；高费率可以持续很久，直到价格不再上涨才可能引发平仓压力。它是状态指标，不是方向指标。"
    sources: []

  - id: c310
    type: concept
    stage: 3
    order: 10
    title: 未平仓合约
    en: Open Interest
    minutes: 10
    tags: [derivatives, oi]
    sections:
      - h: 一句话
        p: "未平仓合约（Open Interest, OI）是市场上尚未平掉的合约总量，按张数或名义价值统计，只计算还没结束的头寸。"
      - h: 为什么重要
        p: "OI 增减说明资金在进场还是离场：价格上涨且 OI 增加，通常是新多头进场；价格下跌且 OI 下降，更像去杠杆而不是新增抛售。它是判断行情有没有新增资金参与的核心变量，能区分“存量博弈”和“增量推动”这两种性质完全不同的上涨。"
      - h: 核心机制
        p: "每份合约都对应一个多头和一个空头，OI 只记总量：开新仓时 OI 加一，平仓时 OI 减一，换手与转让不改变 OI。交易所统计口径不同，有按张数、按币本位、按美元名义价值三种，跨所加总前必须先换算。OI 与成交量是两种东西：成交量记的是换手，OI 记的是仍在场内的存量。"
      - h: 例子
        p: "价格上涨 3% 而 OI 同步增加 5%，通常解释为新多头进场推动；价格下跌 3% 而 OI 下降 5%，更像多头平仓去杠杆，而不是有人在大举做空。反过来，价格下跌但 OI 上升，说明有新空头进场承接，这种组合的下跌结构更扎实。实务中还要配合资金费率：涨、OI 增且费率为正，说明多头愿意付费持仓；若费率同时走低，则更像存量换手。"
      - h: 常见误解
        p: "把 OI 当成多空人数。OI 只记总量，多空数量永远相等；单看 OI 判断不了方向，必须结合价格、资金费率与清算数据。另一个误解是以为 OI 越大越安全：高 OI 意味着杠杆更集中，一旦价格快速波动，连锁强平的规模也更大。OI 也不直接说明杠杆倍数：同样名义的 OI 可能来自少量高杠杆仓位，也可能来自大量低杠杆仓位。"
      - h: 边界与代价
        p: "OI 是聚合量，看不到方向、主体与杠杆倍数；同一实体在多家交易所对冲时，跨所加总会重复计算。按美元名义统计的 OI 还会随价格本身变化——价格涨了，同一批张数换算出的美元 OI 也变大，读数时要注意区分张数变化与价格变化带来的影响。"
    quiz:
      - q: "为什么说 OI 增加不等于多头变多？"
        a: "每份合约都对应一个多头和一个空头，OI 增加只说明开了新仓，多空数量同步增加；方向要看价格变化、资金费率和主动成交方向。"
      - q: "价格上涨而 OI 下降，通常怎么解释？"
        a: "更像空头平仓推动的上涨：空头买入回补形成买盘，同时使未平仓合约减少。这种上涨缺少新增多头，持续性通常弱于价格上涨伴随 OI 上升的组合。"
    sources: []

  - id: c311
    type: concept
    stage: 3
    order: 11
    title: 清算瀑布
    en: Liquidation Cascade
    minutes: 12
    tags: [derivatives, risk]
    sections:
      - h: 一句话
        p: "价格触及保证金线后交易所强制平仓，强平单以市价卖出又推低价格，触发更多强平，形成自我强化的下跌循环，直到承接盘接住抛压。"
      - h: 为什么重要
        p: "它解释了为什么下跌会比预期更快：杠杆越高、持仓越集中，同样的跌幅能引发越大的被动卖盘；强平单执行完后价格往往快速回抽。理解这条链条，也能看清为什么“跌幅”与“爆仓量”会在同一时段集中出现，而不是均匀分布在行情里。数据上的典型特征是短时强平金额集中放大、OI 快速下降，同时价格偏离幅度远大于同期成交量能解释的范围。"
      - h: 核心机制
        p: "杠杆仓位有维持保证金要求。价格不利时账户权益下降，触及维持保证金线后，强平引擎按规则接管：先撤掉该仓位的挂单、再以市价或分批方式吃对手盘成交。逐仓只损失该仓位的保证金，全仓会动用整个账户余额。强平单在薄盘口上会连续扫穿多档，成交价远差于标记价，把亏损扩大后再触发下一批仓位。"
      - h: 例子
        p: "假设盘口在 100 附近只有很少买单，一笔 1 亿美元的强平卖单会连续吃掉 99.5、99、98 的挂单，最低成交价远低于中间价；价格短暂下探后触发下方更多多头强平，卖压叠加。等强平执行完、承接盘出现，价格又快速回到 100 附近，K 线上留下一根长针。这就是“瀑布”与“插针”往往同时出现的原因。"
      - h: 常见误解
        p: "把每根插针都当成操纵。反例：流动性薄加上一笔大额市价单，也能连续扫穿多档挂单形成插针；判断操纵需要订单流与持仓证据。另一个误解是把爆仓量当成亏损金额：爆仓量统计的是被强平的仓面名义价值，实际损失只有其中的保证金部分，两者差一个杠杆倍数。还有一种误读是把强平当成交易所“帮忙止损”：强平价格由当时盘口决定，可能远差于预期，且强平费用与滑点都会从剩余保证金中扣除。"
      - h: 边界与代价
        p: "强平机制是衍生品风控的必要设计，但它把个体风险转化为市场级联：杠杆越集中，尾部风险越大。保险基金与自动减仓（ADL）是对这类尾部的缓冲，不同交易所规则不同，参数调整也会改变强平行为。本课不讨论任何杠杆操作，也不构成交易指引。"
    quiz:
      - q: "清算瀑布中的被动卖盘从哪里来？"
        a: "来自被强制平仓的多头：价格下跌使其保证金不足，交易所按规则以市价平掉仓位，卖单继续压低价格并触发更多强平。"
      - q: "为什么爆仓量远大于实际亏损金额？"
        a: "爆仓量统计的是被强平仓位的名义价值，包含杠杆放大的部分；实际亏损只是这部分名义价值里用户投入的保证金，两者相差约一个杠杆倍数。"
    sources: []

  - id: c312
    type: concept
    stage: 3
    order: 12
    title: 预言机
    en: Oracle
    minutes: 11
    tags: [oracle, defi]
    sections:
      - h: 一句话
        p: "预言机（Oracle）把链下的价格、汇率等数据写进链上合约，让 DeFi 能读到现实世界的信息，是链上合约与外部数据之间唯一的桥。"
      - h: 为什么重要
        p: "借贷协议的抵押率、清算线与衍生品结算都依赖价格源；价格源被操纵或延迟，会直接变成错误清算或协议坏账。智能合约本身无法主动读取外部世界，因此“数据由谁写进来、按什么规则更新”就成了整条业务链上最关键的信任假设之一。"
      - h: 核心机制
        p: "常见做法是多个独立节点从多个交易所取价，去掉异常值后取中位数或加权平均，再按心跳（固定间隔）或偏差阈值（价格变动超过阈值）写链上。为抵抗短期操纵，协议常用时间加权平均价（TWAP）：把一段时间内的价格按时间加权，单笔或单块内的价格操纵会被摊薄。也有拉取式预言机，由使用方在需要时读取链下签名报价。"
      - h: 例子
        p: "若某借贷协议只用单一现货池的即时价格给抵押品定价，攻击者可以在同一区块内用闪电贷把池子价格拉偏，再以虚高抵押借出资产，归还闪电贷后获利，协议留下坏账。2020 年 bZx 系列事件与 2022 年 Mango Markets 事件都属同一类问题的不同变体：喂价被操纵，清算与借贷逻辑随之失真。"
      - h: 常见误解
        p: "以为用了预言机就安全。反例：只读单一现货池价格的协议，可被闪电贷瞬间拉偏价格；多源聚合、时间加权与偏差阈值都是必要防护。另一个误解是认为去中心化程度越高越好：更多的数据源意味着更强抗操纵性，也意味着更高成本与更长更新延迟，极端行情下可能更晚触发清算。"
      - h: 边界与代价
        p: "预言机引入延迟与信任假设，无法做到既即时又抗操纵；TWAP 更抗操纵但更慢，快速下跌时清算会更晚发生。数据源故障、喂价停止或上下游指数异常都会传导成协议级损失，所以借贷协议通常还要设置清算上限、坏账缓冲等第二层防护。选择预言机时还要考虑故障模式：喂价停止与喂价错误是两种不同风险，前者让清算暂停，后者让清算执行在错误价格上，防护手段也不同。"
    quiz:
      - q: "为什么 DeFi 清算特别依赖可靠的价格源？"
        a: "清算按合约读到的价格判断抵押是否充足；价格错误会把健康仓位错误清算，或让资不抵债的仓位逃过清算，直接造成协议损失。"
      - q: "TWAP 相比即时价格，优点和代价各是什么？"
        a: "优点是单笔或单块内的价格操纵会被时间摊薄，更难被闪电贷拉偏；代价是更新更慢，快速下跌时清算触发更晚，可能积累更多坏账。"
    sources:
      - https://ethereum.org/

  - id: c313
    type: concept
    stage: 3
    order: 13
    title: 储备证明
    en: Proof of Reserves
    minutes: 12
    tags: [exchange, transparency]
    sections:
      - h: 一句话
        p: "储备证明（Proof of Reserves, PoR）是交易所用链上地址余额和默克尔树等方式，向用户证明平台持有的资产能够覆盖用户存款。"
      - h: 为什么重要
        p: "2022 年多家平台暴雷之后，PoR 成为透明度工具；但它是某个时点的快照，常见做法只证明资产端，负债是否完整仍依赖平台自报。它更像一次体检报告，而不是长期健康保险：证明的是某一刻的余额，不是持续的经营约束。"
      - h: 核心机制
        p: "资产端：平台公布其控制的链上地址并签名，公众可以核对余额；负债端：把每个用户余额做成一棵默克尔树，用户可用自己的路径证明余额被包含在树根里，同时不暴露他人余额。理论上偿付能力要求资产大于等于负债，但完整证明需要第三方审计负债总额。实践中常见缺口是地址控制权未经验证、负债只覆盖部分账户、资产被借出或再抵押。"
      - h: 例子
        p: "假设平台资产端 100 亿美元、用户负债 150 亿美元，只披露资产端仍然资不抵债；或者资产端真实，但负债端的默克尔树只包含部分账户，树根之外的存款没有计入。还有一种情况是快照时临时借入资金把地址余额做高，证明发布后再归还——这些都说明“有 PoR”与“有偿付能力”之间还有距离。"
      - h: 常见误解
        p: "把 PoR 当成偿付能力证明。反例：资产 100 亿、用户负债 150 亿时，只披露资产端仍然资不抵债；资产还可能被借出或抵押。另一个误解是以为用户验证了自己的余额被包含，就等于全部负债被覆盖——单点验证只能证明“我在树里”，不能证明“树是全的”。"
      - h: 边界与代价
        p: "PoR 提高了透明度，但持续更新的成本高、隐私与安全也有冲突：公开地址会让资金流向被追踪，频繁快照可能泄露运营信息。它无法防止快照之后的挪用，也无法替代审计、监管与公司治理，只能作为一组辅助证据。中国内地按 42 号文，境内虚拟货币业务一律禁止，本课只讲机制。对用户而言更实际的做法是看平台是否持续更新证明、是否披露负债口径，以及历史快照能否被第三方复核，而不是只看有没有发布过一份证明。"
    quiz:
      - q: "为什么储备证明通过，不代表交易所安全？"
        a: "PoR 通常只证明某一时点的资产余额，不证明负债完整、资产未被挪用或抵押；快照之外的变化和未披露负债都可能让结论失效。"
      - q: "默克尔树在储备证明里解决什么问题？"
        a: "它让每个用户在不暴露他人余额的前提下，验证自己的余额被计入平台公布的负债树根；但它只能证明单点被包含，不能证明树根覆盖了全部用户负债。"
    sources: []

  - id: c314
    type: concept
    stage: 3
    order: 14
    title: ETF 申赎
    en: ETF Creation and Redemption
    minutes: 12
    tags: [etf, institutions]
    sections:
      - h: 一句话
        p: "交易所交易基金（ETF）的份额由授权参与者（Authorized Participant, AP）用一篮子资产或现金申购、赎回，二级市场买卖只改变持有人，不直接改变基金持仓。"
      - h: 为什么重要
        p: "ETF 净流入来自申购减赎回，它把场外资金合规地接入标的资产，也是观察机构需求的高频公开数据。分清一级市场申赎与二级市场交易，才能避免把成交量、换手率误读成资金流入，也才能理解为什么 ETF 价格能长期贴近净值。"
      - h: 核心机制
        p: "授权参与者是具备资格的机构，它可以按基金公布的篮子向基金申购新份额，或把份额赎回成一篮子资产（实物申赎）或现金（现金申赎）。二级市场上，普通投资者之间买卖份额，只是持有人变化，不改变基金资产。当二级市场价格偏离净值时，授权参与者通过申赎套利把价格拉回，这个套利机制是 ETF 跟踪指数的核心。"
      - h: 例子
        p: "某日净流入 3 亿美元，可能是 5 亿美元申购减去 2 亿美元赎回的结果；同样是 3 亿美元，也可能只来自一两个大机构的资产配置，而不是“很多人在买”。反过来，某天二级市场换手 10 亿美元，如果当天没有申购赎回，基金持仓可以完全不变。同一份数据，口径不同，结论完全不同。"
      - h: 常见误解
        p: "以为在交易所买 ETF 份额就等于基金在买币。反例：二级市场换手 10 亿美元，若当天没有申购赎回，基金持仓可以完全不变。另一个误解是把成交额当成净流入：成交额是换手，净流入是申赎差额，两者可以一个很大、一个为零甚至为负。"
      - h: 边界与代价
        p: "流量数据是滞后的日频快照；现金申赎时，做市商可能用期货或其他工具对冲，ETF 的买入不完全等于现货买入，跟踪误差与费用率也会侵蚀长期表现。申报与费用结构以各基金招募说明书为准。中国内地不提供此类产品，境内虚拟货币业务一律禁止（2026 年 2 月 6 日八部门 42 号文）。另外要注意披露时区：不同基金按各自交易日统计，跨基金加总时可能把不同日期的流量混在一起，得出错误的净流入。"
    quiz:
      - q: "ETF 的净流入在申赎机制里指什么？"
        a: "指当日申购份额减去赎回份额对应的资金净额；二级市场买卖只是份额换手，不改变基金资产，只有申赎才改变基金持仓。"
      - q: "为什么 ETF 的二级市场价格能长期贴近净值？"
        a: "因为授权参与者可以在一级市场按净值申赎份额，在二级市场价格出现折溢价时进行套利，套利压力把价格拉回净值附近；这个机制依赖申赎通道畅通。"
    sources:
      - https://sec.gov/

  - id: c315
    type: concept
    stage: 3
    order: 15
    title: 完全稀释估值
    en: FDV
    minutes: 10
    tags: [valuation, tokenomics]
    sections:
      - h: 一句话
        p: "完全稀释估值（Fully Diluted Valuation, FDV）等于当前价格乘以最大或总供应量，假设所有未释放代币都按今天的价格计算。"
      - h: 为什么重要
        p: "低流通、高 FDV 的项目市值看起来小，但未来解锁会持续增加流通盘；比较项目时市值和 FDV 要一起看，才能判断稀释压力。FDV 与市值之比，粗略等于“总量除以当前流通量”，它告诉你从现在到全部释放，流通盘还要扩大多少倍。"
      - h: 核心机制
        p: "FDV 是纯算术乘积：价格乘以总供应量（或最大供应量，两个口径在无限增发模型里会分叉）。它与市值的差别完全在分母：市值用流通量，FDV 用总量。这个比例会随解锁逐步收敛到一，收敛速度由归属与释放计划决定；若存在销毁机制，总量本身还会下降，FDV 的分母就不再固定。"
      - h: 例子
        p: "总量 10 亿枚、流通 1 亿枚、价格 1 美元：市值 1 亿美元、FDV 10 亿美元，稀释倍数约 10 倍。若此后四年线性释放剩余 9 亿枚，平均每年新增约 2.25 亿枚流通，第一年结束时流通量约 3.25 亿枚，仅为总量的三分之一——这就是为什么只看市值会低估未来的供给压力。"
      - h: 常见误解
        p: "把 FDV 当成未来一定会达到的市值。反例：FDV 只是算术乘积，不代表有人愿意在那个价格买下全部解锁代币；价格与需求都会变化。另一个误解是以为 FDV 高就一定是坏项目：高 FDV 只说明潜在供给多，是否构成压力取决于解锁节奏、需求增长与市场深度。"
      - h: 边界与代价
        p: "FDV 在总量不确定的模型里口径模糊：无限增发、动态销毁、通胀调整都会让“完全稀释”失去唯一答案；跨项目比较时还要对齐是否包含生态激励与金库未分配部分。它是供给侧的算术上限，不是估值结论，更不能当目标价使用。比较项目时还应把解锁曲线画出来：同样是 10 倍稀释，集中在半年内释放与摊到五年，对市场深度的压力完全不同。"
    quiz:
      - q: "市值 10 亿、FDV 100 亿说明了什么？"
        a: "当前只有约 10% 的代币在流通，其余大部分尚未解锁；未来供给会增加，评估稀释压力要看解锁时间表，而不是只看市值。"
      - q: "为什么在无限增发模型里 FDV 的口径会变得模糊？"
        a: "因为总供应量本身不固定，通胀会持续增加分母、销毁又会减少分母，“完全稀释”没有唯一终值；比较时必须声明用的是总量、最大供应还是某个时点的预测值。"
    sources:
      - https://coingecko.com/

  - id: c316
    type: concept
    stage: 3
    order: 16
    title: 代币解锁
    en: Token Unlock
    minutes: 10
    tags: [tokenomics, supply]
    sections:
      - h: 一句话
        p: "代币解锁是按归属（vesting）计划，把此前锁定或未释放的代币逐步变为可流通，常见形式是悬崖期（cliff）之后线性释放。"
      - h: 为什么重要
        p: "解锁直接改变流通供应量，也是项目方、投资人与团队拿到可卖筹码的时点；冲击大小取决于解锁量占流通盘的比例。它把代币经济学里抽象的供给曲线变成日历上可查的事件，是分析稀释节奏最直接的抓手。同一份解锁日历，对高流通比例、持有人分散的项目影响很小，对低流通、筹码集中的项目可能是分水岭。"
      - h: 核心机制
        p: "归属计划通常由两部分组成：悬崖期（一段时间内完全不能动）与线性释放（之后按块或按月匀速解锁）。解锁只意味着代币变为可流通，不等于卖出：持有人可以选择继续持有、质押、做场外转让，或转入交易所。真实的卖压取决于解锁量占流通盘的比例、持有人结构、以及当时市场能承接的深度。"
      - h: 例子
        p: "假设流通量 1 亿枚，单次解锁 500 万枚（占流通盘 5%），若其中约 20% 转入交易所并以日均 1% 流通盘的深度分批卖出，冲击可能可观测但有限；反过来，单次解锁 2000 万枚（占流通盘 20%）且持有人高度集中，抛压会明显更大。同样的事件，比例与持有人结构决定结果。"
      - h: 常见误解
        p: "以为解锁一定砸盘。反例：解锁的代币可以继续质押，或解锁量只占流通盘 0.5%；实际卖压取决于持有人行为与市场深度，而不是日历本身。另一个误解是以为解锁日就是抛压日：不少机构会提前通过场外交易或对冲安排消化筹码，日历上的日期未必对应链上或交易所的实际卖压时点。"
      - h: 边界与代价
        p: "解锁信息依赖项目方披露的归属表，私下协议与场外安排可能不公开；已解锁但未移动的代币在链上看起来也像“锁定”，口径容易混淆。把解锁日历当成卖出信号是过度简化，它更适合用来衡量未来供给增量与稀释速度。判断一次解锁的实际影响，可以跟踪解锁前后交易所净流入与链上大额转账是否同步放大，而不是只看日历上标红的日期。"
    quiz:
      - q: "为什么有解锁不必然带来下跌？"
        a: "解锁只是让代币变得可流通，持有人可以选择继续持有或质押；实际卖压取决于解锁量占流通盘的比例、持有人结构和当时的市场深度。"
      - q: "悬崖期与线性释放分别指什么？"
        a: "悬崖期是一段时间内代币完全不能动，用来锁定早期参与者；线性释放是悬崖期结束后按时间匀速解锁。两者组合决定供给进入流通的节奏。"
    sources: []

  - id: c317
    type: concept
    stage: 3
    order: 17
    title: 已实现市值
    en: Realized Cap
    minutes: 12
    tags: [onchain, valuation]
    sections:
      - h: 一句话
        p: "已实现市值（Realized Cap）把每枚代币按最后一次链上移动时的价格计价后加总，近似得到全市场持币者的总成本基础。"
      - h: 为什么重要
        p: "它与市值一起构成 MVRV：市值远高于已实现市值，说明整体浮盈高；已实现市值上升，往往对应有币在更高价格换手。相比只看价格，它刻画的是“这些筹码是花多少钱换来的”，因此能反映持仓成本随换手如何上移。它也是少数能反映筹码成本结构的公开指标，适合与价格和换手一起看，不宜单独使用。"
      - h: 核心机制
        p: "在比特币这类 UTXO 模型里，每个未花费输出都带着创建时的价格与时间；当它被花费时，新的输出按当时价格重新计价。把所有未花费输出按各自最后移动价格加总，就得到已实现市值。长期不动的币按很久以前的价格计价，所以已实现市值通常远小于市值，差额近似全市场的账面浮盈。"
      - h: 例子
        p: "一枚币在多年前以 100 美元买入后再未移动，即使今天价格很高，它仍按 100 美元计入已实现市值。因此当大量筹码在当前价位换手时，已实现市值会快速抬升；而当价格横盘、筹码不动时，即使市值不变，已实现市值也几乎不动。这个滞后性正是指标的特征，而不是缺陷。"
      - h: 常见误解
        p: "把已实现市值当成真实价值。反例：长期不动的币按很久以前的价格计价，会低估当前市场价值；交易所内部转账也会污染口径。另一个误解是把已实现市值下降理解为“资金流出”：它也可能只是低价筹码在移动，或数据商调整了实体聚类规则。还有一种情形是把它的绝对大小当成安全边际：它只是成本加总，不构成任何价格支撑位。"
      - h: 边界与代价
        p: "已实现市值依赖地址聚类与实体调整方法，不同数据商结果可以不同；丢失私钥的币永远不会再移动，会永久压低这个指标；在账户模型的智能合约链上，余额变动与成本追踪更复杂，指标可解释性弱于比特币。它适合描述成本结构，不适合单独用作买卖判断。解读时最好同时给出市值与已实现市值两个数：只看比值会忽略两者各自的绝对规模，而绝对规模决定了一个百分点的浮盈对应多少资金。"
    quiz:
      - q: "已实现市值和普通市值的关键差别是什么？"
        a: "普通市值按当前价格乘流通量；已实现市值按每枚币最后移动时的价格加总，反映成本基础，两者之比能刻画整体浮盈程度。"
      - q: "为什么大量筹码在当前价位换手会推高已实现市值？"
        a: "因为换手意味着这些代币被重新按当前价格计价，成本基础整体上移；而长期不动的币仍按旧价格计入，所以只有真正发生链上移动的部分才会抬高这个指标。"
    sources:
      - https://glassnode.com/

  - id: c318
    type: concept
    stage: 3
    order: 18
    title: MVRV
    en: Market Value to Realized Value
    minutes: 12
    tags: [onchain, valuation]
    sections:
      - h: 一句话
        p: "MVRV（Market Value to Realized Value）是市值与已实现市值之比，用来衡量全市场持币者平均处于浮盈还是浮亏状态。"
      - h: 为什么重要
        p: "MVRV 大于 1 表示平均成本低于现价、整体浮盈；小于 1 表示整体浮亏。它把“价格贵不贵”换成了“持有者赚不赚钱”的视角，而后者才是抛压的真实来源之一：浮盈越大，兑现动机越强；浮亏越深，割肉与死扛的分布越极端。"
      - h: 核心机制
        p: "分子是市值，随价格实时变化；分母是已实现市值，只随链上换手缓慢变化。因此 MVRV 的短期波动几乎全部来自价格，长期趋势则由换手成本上移决定。价格横盘但大量筹码在更高价换手时，分母变大，MVRV 会下降——这不是价格跌了，而是成本基础抬高了。"
      - h: 例子
        p: "假设市值 7000 亿美元、已实现市值 5000 亿美元，MVRV 约 1.4，说明全市场平均浮盈约 40%。若之后价格横盘，但大量筹码在更高价位换手，已实现市值升到 6000 亿美元，MVRV 回落到约 1.17，尽管价格没有下跌。同一指标的两种变化路径，含义完全不同。"
      - h: 常见误解
        p: "把 MVRV 当买卖信号。反例：同一数值在牛市初期和末期含义不同；它描述状态而非预测方向，还受长期不动币与交易所内部转账影响。另一个误解是把历史阈值当成通用规律：不同数据商口径、不同市场结构下，所谓的高位与低位区间都会漂移。"
      - h: 边界与代价
        p: "MVRV 是描述性指标：它告诉你平均持仓者处于什么状态，不告诉你这种状态会持续多久。已实现市值分母受实体聚类、丢失币与内部转账影响，跨数据商数值不可直接比较；它也不适用于筹码结构完全不同的资产，跨资产比较意义有限。把它和其他指标叠加使用，比单看一个数值更接近真实图景。使用 MVRV 还应明确周期位置：在长期底部区域，同样的数值可能对应完全不同的持仓结构，历史分位数比绝对值更有参考价值，而分位数本身也依赖数据商的历史长度。"
    quiz:
      - q: "MVRV 小于 1 说明什么？"
        a: "说明按当前价格计算的总市值低于全市场已实现成本，平均持币者处于浮亏状态；这是状态描述，不能直接推出价格会上涨。"
      - q: "价格没跌，MVRV 却下降了，可能是什么原因？"
        a: "分母已实现市值上升了：大量筹码在更高价位换手，把持仓成本基础整体抬高。这说明供给在更高价格完成换手，而不是价格下跌造成的被动浮亏。"
    sources:
      - https://glassnode.com/

  - id: c319
    type: concept
    stage: 3
    order: 19
    title: SOPR
    en: Spent Output Profit Ratio
    minutes: 12
    tags: [onchain, metrics]
    sections:
      - h: 一句话
        p: "SOPR 是链上被花费输出的卖出价与买入价之比：大于 1 表示这批币在盈利状态下被卖出，小于 1 表示亏损卖出。"
      - h: 为什么重要
        p: "它刻画“谁在卖、赚还是亏”：亏损卖出集中出现，常对应恐慌与筹码换手；调整版 ASOPR 会剔除持有不足 1 小时的输出以减小噪音。相比只看价格与成交量，SOPR 把卖出行为按成本分成盈利盘和亏损盘两类，能反映市场情绪的质地。"
      - h: 核心机制
        p: "对每一笔被花费的输出，取它创建时的价格作为成本、花费时的价格作为卖出价，两者相除得到单个比值，再按数量加权平均得到全市场 SOPR。由于每枚币都以美元计价，SOPR 大致围绕 1 波动：高于 1 说明整体在获利了结，低于 1 说明整体在割肉。按持币年龄分组，还能看到长期持有者与短期持有者的不同行为。"
      - h: 例子
        p: "当价格跌破大量筹码的成本区时，SOPR 会从 1 上方跌到 0.95 附近并在低位反复，说明亏损盘在持续换手；如果随后 SOPR 迅速回到 1 上方，通常说明亏损筹码被承接、卖压被吸收。反过来，在持续上涨中 SOPR 长期高于 1 且不断抬升，说明获利了结活跃，但不构成方向判断。"
      - h: 常见误解
        p: "把 SOPR 跌破 1 当成抄底信号。反例：亏损盘可以持续很久，SOPR 只统计已花费的输出，不包含持仓不动的币，无法说明抛压何时结束。另一个误解是忽略找零噪音：同一笔交易里找回给自己的输出也被算作被花费，若不做调整，短时间内的找零会被误判为卖出。"
      - h: 边界与代价
        p: "SOPR 只覆盖发生移动的币，大量休眠筹码完全不进入统计；它也不区分卖出动机，交易所内部转账、钱包整理都会产生记录。指标定义依赖 UTXO 模型，在账户模型链上需要重新实现，跨链比较要格外小心。它是情绪与换手的描述，不是择时工具。另一个限制是样本偏差：交易所内部转账与钱包整理会产生大量与被卖出无关的输出，做分析前通常要先过滤掉这类地址行为。"
    quiz:
      - q: "为什么分析师更常用调整后的 ASOPR？"
        a: "因为同一笔交易里的找零输出也会被算作被花费，短时间内的找零会被误判为盈利或亏损卖出；ASOPR 剔除持有时间极短的输出，减少这类噪音。"
      - q: "SOPR 长期低于 1 意味着什么？"
        a: "意味着链上被花费的筹码整体处于亏损卖出状态，市场在割肉换手；但这只是已发生行为的统计，不能说明亏损盘什么时候结束，也不构成买入信号。"
    sources:
      - https://glassnode.com/

  - id: c320
    type: concept
    stage: 3
    order: 20
    title: 再质押
    en: Restaking
    minutes: 12
    tags: [staking, security]
    sections:
      - h: 一句话
        p: "再质押是把已经质押的 ETH 或流动性质押代币再次用于为其他协议提供经济安全，最知名的实现是 EigenLayer。"
      - h: 为什么重要
        p: "它让同一份资本同时保护多个服务（AVS），提高资本效率；但风险会叠加：服务被攻击、罚没（slashing）或流动性紧张会沿同一条资本链传导。理解再质押，才能看懂“同一份安全被重复抵押”带来的收益叠加与风险叠加是同一枚硬币的两面。"
      - h: 核心机制
        p: "以太坊主网质押的 ETH 有退出排队与罚没规则；再质押是在不退出主网质押的前提下，对额外的主动验证服务（AVS）做出可被罚没的承诺。EigenLayer 用两层结构：再质押者把资产委托给 operator，operator 运行 AVS 并承担罚没责任；不同 AVS 定义各自的罚没条件与安全模型，有的是“可被罚没”，有的是“可被否决”。"
      - h: 例子
        p: "假设 1 枚 ETH 同时为 5 个 AVS 提供安全，收益来自五份服务费叠加，但任一 AVS 判定 operator 违规，都可能罚没同一份 ETH。质押率越高，单位资本提供的安全供给越多，系统性关联也越强：一个服务的故障可以通过共享资本传导到其他服务，形成相关性风险。"
      - h: 常见误解
        p: "以为再质押是多赚一份收益且风险不变。反例：额外收益对应额外罚没条件，多个 AVS 的规则叠加后，尾部风险明显高于单纯质押。另一个误解是以为流动性质押代币（LST）价格始终等于 ETH：压力行情下 LST 可能脱锚，而此时退出队列又很长，流动性风险会同时出现。"
      - h: 边界与代价
        p: "再质押的代价包括尾部罚没风险、LST 脱锚与退出排队带来的流动性风险、罚没规则的复杂性，以及 operator 集中度风险。收益本质上是风险的价格，而不是免费午餐；评估时要看罚没条件的上限、AVS 的质量与共享资本的集中程度。再质押的收益与风险都难以事前量化：罚没条件写在各服务的规则里，但真实损失取决于极端情形下的判定，而不是日常收益率的平均值。"
    quiz:
      - q: "再质押提高资本效率的代价是什么？"
        a: "同一份质押资产要同时满足多个服务的罚没条件，一旦某个服务出问题，损失会沿共享的质押资本传导，尾部风险与复杂性都上升。"
      - q: "为什么 LST 脱锚会和再质押风险叠加？"
        a: "再质押者常用 LST 作为抵押或流动性来源，压力行情下 LST 可能折价，同时主网退出排队变长，想退出的人无法及时赎回；价格折价与流动性枯竭同时出现，放大损失。"
    sources:
      - https://ethereum.org/

  # ===== 课程轨道：theory / practice 交错（order 1–20） =====
  - id: t301
    type: theory
    stage: 3
    order: 1
    title: 市场结构全景：CEX、DEX 与永续
    minutes: 13
    tags: [market, structure]
    sections:
      - h: 核心机制
        p: "同一个资产在三种场所定价：中心化交易所（CEX）现货、链上 DEX 池子、中心化交易所永续。三者由套利者连接，价差超过套利成本就会被抹平；价差不能自由扩大的原因不是监管或约定，而是有人能从中获利，愿意用资金把价格买回去、卖下来。"
      - h: 关键细节
        p: "CEX 用订单簿撮合，深度集中、延迟低，但用户资产托管在平台；DEX 用 AMM 曲线或链上订单簿，结算在链上，成本是 Gas 与滑点；永续没有到期日，靠资金费率与标记价格锚定现货。三者的报价时基也不同：CEX 是毫秒级的连续报价，链上价格只在区块被包含时更新。"
      - h: 例子与数字
        p: "假设永续比现货贵 0.5%、资金费率为正。做空永续同时买入现货的对冲盘会被吸引进来：每 10 万美元名义、0.5% 的价差对应约 500 美元毛收益，扣掉两边手续费、资金费与冲击成本后才是净收益；卖压压住永续、买盘托住现货，价差随之收窄。若交易所暂停提现，对冲无法闭环，这个价差可以持续扩大。"
      - h: 对比与演进
        p: "早期只有 CEX 现货；2017 年后永续成为主流衍生品，价格发现重心从现货移到衍生品；2020 年后 AMM 崛起，聚合器把多个池子拼成一条最优兑换路径；2024 年现货 ETF 又打开了一条场外合规通道。每次演进都在降低某一类摩擦，同时引入新的信任假设：托管、代码、申赎通道、链路。"
      - h: 代价与边界
        p: "这种连接依赖流动性与通道畅通，交易所停止提现、链上拥堵或跨链桥故障时，价差可以维持很久，套利者也可能因为无法转移资产而被迫平仓。中国内地按 2026 年 2 月 6 日八部门 42 号文，境内虚拟货币业务一律禁止，本课只做公开数据的观察与机制分析。"
      - h: 常见误读
        p: "以为三个市场的价格应该完全一致：摩擦与信任假设不同，价差是常态而不是错误。以为某个市场的价格才是“真实价格”：三者各自反映不同参与者的边际需求。还把价差存在当成套利机会：能不能执行、多久能闭环、资金占用多少，才决定它是不是机会。"
    quiz:
      - q: "为什么 CEX 现货、DEX 与永续的价格不会完全一致？"
        a: "三者靠套利连接，但存在托管风险、Gas 与滑点、提现限制、资金费率等摩擦；套利成本决定价差能维持多宽、多久，而不是让价格瞬间相等。"
      - q: "如果交易所暂停提现，三个市场的价差会怎样？"
        a: "套利者无法把资产在场所之间转移，跨市场对冲断链，价差可以扩大到远超正常成本的水平并持续较长时间；这正是托管与通道风险会直接变成价格异常的例子。"
    sources: []

  - id: p301
    type: practice
    stage: 3
    order: 2
    title: 读价格模块的导出文件
    minutes: 11
    tags: [practice, data]
    sections:
      - h: 目标
        p: "打开本仓库 crypto-price 模块的导出文件，读懂一次行情快照里有哪些字段、哪些是衍生品数据、数据是否新鲜，并说清每个数字的单位与口径。"
      - h: 准备
        p: "已 clone 本仓库、本机有 python3；不需要任何 API key，也不需要联网。练习只用模块已经落盘的 data/exports 下的 JSON 文件；先把 latest.json 复制到一个临时目录再读，避免误改原始快照。"
      - h: 步骤
        p: "1) 进入 crypto-price；2) 运行 python3 -m json.tool data/exports/latest.json，先看 schema、generated_at 与 source_module；3) 找到 assets.BTC 下的 price、change_24h_pct、spread_bps、n_sources、funding_rate、funding_ts、oi、oi_ts；4) 对比 data/exports/daily-2026-11-09.json 与 latest.json 的字段差异；5) 用 python3 计算 generated_at 与当前时间的差值。"
      - h: 验收
        p: "写下至少 5 个字段的含义与单位，说明这条快照的生成时间与当前时间差多少，指出 funding_rate 和 oi 来自哪个市场（USD-M 永续），并解释 n_sources 与 spread_bps 各自说明什么、为什么这两个数能用来判断价格可信度。"
      - h: 安全与常见坑
        p: "全程只读：不运行 --notify、不修改 config、不写 state。常见坑：把 funding_rate 的 0.0001 当成 1%（它是 0.01%）；忽略 funding_ts、oi_ts 与 generated_at 可能不同步；把 daily 文件当成实时行情；不看清 spread_bps 是基点而不是百分比。"
    quiz:
      - q: "为什么读导出文件时要先看 generated_at？"
        a: "快照可能过期或采集失败，字段值再完整也代表过去；先确认生成时间，才能判断这份数据能否用于当前的分析。"
      - q: "funding_rate 等于 0.0001 实际表示多少？"
        a: "0.01%，也就是每个结算周期多头向空头支付名义价值的万分之一；把它读成 1% 会高估一百倍，后续所有成本估算都会错。"
    sources: []

  - id: t302
    type: theory
    stage: 3
    order: 3
    title: 永续资金费率机制
    minutes: 13
    tags: [derivatives, funding]
    sections:
      - h: 核心机制
        p: "永续没有到期日，靠资金费率把价格钉在现货附近。交易所用永续与现货的价差（溢价指数）加上利率成分算出费率，并在多空之间定期划转；价格偏离越远，费率越大，持仓激励随之改变，价差被拉回。这个机制相当于把“到期收敛”拆成无数次小额支付，代价是持仓者必须持续付费，而不是等到交割日一次性结算。"
      - h: 关键细节
        p: "常见结算间隔是 8 小时，也有 1 小时或 4 小时的合约，以各交易所文档为准；多数交易所对单次费率设上下限，防止极端行情下支付失控。资金费按持仓名义价值计算，与杠杆倍数无关：同样 10 万美元名义，无论用 3 倍还是 20 倍杠杆，付的资金费相同。"
      - h: 例子与数字
        p: "假设费率为每 8 小时 0.01%，一天结算三次就是 0.03%；持有 10 万美元多头，每天付出的资金费约 30 美元，一个月约 900 美元。按单利粗略年化，0.03% 乘以 365 约 11%。若费率转为负值，方向反过来：空头付钱给多头，做空的持仓成本上升。"
      - h: 对比与演进
        p: "交割合约靠到期日强制收敛，基差在到期时归零；永续没有到期日，只能用持续支付来模拟这种收敛，代价是持仓者必须长期付费。不同交易所在指数成分、结算频率、上下限上的差异，会让同一时刻的费率口径不同，跨所比较前要先把这些参数对齐。"
      - h: 代价与边界
        p: "高费率说明多头拥挤，但拥挤可以持续很久，把费率当方向信号容易在趋势里反复被打脸；费率也是现货与永续对冲套利的主要成本项。极端行情下交易所可能临时调整结算频率或上限，历史费率分布不能假设稳定，做成本估算时要留余量。另一个边界是流动性：当永续与现货之间的套利通道被手续费、资金成本或提现限制堵住时，费率再高也拉不回价格。"
      - h: 常见误读
        p: "把资金费率当手续费：前者是多空之间的划转，后者是交易所收的费用。把负费率当利好：它只说明空头拥挤、做空要付钱，不说明价格会涨。把单次费率乘以结算次数当成精确年化：费率和名义价值都会变，年化只是粗略估算。把资金费率与现货借币利率混为一谈也是常见错误：前者只存在于永续多空之间，后者是借入现货的成本。"
    quiz:
      - q: "为什么资金费率能抑制永续价格偏离现货？"
        a: "永续相对现货溢价时费率为正，多头要定期付钱给空头，做多成本上升、做空成本下降；持仓激励改变后，价差被拉回现货附近。"
      - q: "同样 10 万美元名义价值，10 倍杠杆和 2 倍杠杆付的资金费一样吗？"
        a: "一样。资金费按持仓名义价值计算，与杠杆倍数无关；杠杆只影响你占用多少保证金，不改变名义价值对应的资金费金额。"
    sources: []

  - id: p302
    type: practice
    stage: 3
    order: 4
    title: 连续 5 天记录资金费率和 OI
    minutes: 12
    tags: [practice, derivatives]
    sections:
      - h: 目标
        p: "用 5 个交易日建立一张自己维护的永续市场观察表，观察资金费率与未平仓合约如何随行情一起变化，并练习区分“存量换手”与“增量进场”两种结构。最后要能用自己的话说明：为什么同样的涨幅，在不同 OI 变化下含义完全不同。如果这 5 天所有指标都平淡，这本身也是一个结论：说明这段时间没有明显的增量资金结构变化。"
      - h: 准备
        p: "一张本地表格（或 CSV），列：日期、采样时间、价格、24h 涨跌幅、funding_rate、OI、数据来源。固定每天同一时刻采样，最好同时记录结算时点前后各一次；数据来源优先用 crypto-price 的 data/exports，缺失时可用交易所公开接口补。先把列名和单位写在第一行，避免 5 天后自己看不懂。"
      - h: 步骤
        p: "1) 每天固定同一时间记录 BTC、ETH 的 funding_rate 与 oi；2) 若模块未运行，用交易所公开的溢价指数与持仓量接口核验；3) 把数值与当日涨跌幅写进表格，OI 统一换算成同一种口径（张数或美元名义）；4) 每天写一句观察，标注是“价格与 OI 同向”还是“背离”；5) 第 5 天做一张二维表汇总。"
      - h: 验收
        p: "5 天数据齐全、采样时间戳一致，能指出哪一天费率与 OI 同时上升、哪一天两者背离，各写一句解释；还要说明你的 OI 用的是哪种口径、为什么跨天可比。最后写一段 100 字的总结：这 5 天里资金是在进场、离场还是原地换手，依据是哪几行数据。如果发现数据缺失或口径变化，要在总结里写明，而不是用插值填平。"
      - h: 安全与常见坑
        p: "只用公开只读接口，不注册交易账户、不下单、不充值，记录只保存在本地。常见坑：在结算时点前后取样，把划转瞬间的跳变当趋势；把不同交易所的 OI 直接相加；只看费率不看价格方向，导致把“拥挤”误读成“看涨”；漏记采样时间，事后无法判断数据对应哪一段行情。还有一个坑是把 OI 变化和价格变化画在同一张图上却不标双轴，读图时容易误判两者的相关性。"
    quiz:
      - q: "为什么记录时间必须每天固定？"
        a: "资金费率和 OI 都是随时间变化的快照，采样时点不同会把结算前后的跳变误当成趋势；固定时点才能让 5 天数据互相可比。"
      - q: "价格与 OI 同向变动、背离分别提示什么？"
        a: "同向更像新增资金进场（涨且 OI 增是新多头，跌且 OI 增是新空头）；背离更像存量平仓，例如涨但 OI 降通常是空头回补，缺少新增买盘支撑。"
    sources: []

  - id: t303
    type: theory
    stage: 3
    order: 5
    title: 清算与插针
    minutes: 12
    tags: [derivatives, risk]
    sections:
      - h: 核心机制
        p: "杠杆仓位有维持保证金要求，价格不利时保证金不足，强平引擎会以市价平掉仓位；强平单本身又推动价格，进一步触发更多强平。这个正反馈循环是衍生品市场把个体风险放大成市场波动的通道。循环的启动条件是强平单大于当下可承接的深度，所以同样的跌幅在深度薄的时段更容易触发级联。"
      - h: 关键细节
        p: "逐仓只损失该仓位的保证金，全仓会动用整个账户余额；强平引擎先撮合，再动用保险基金，仍不足时可能触发自动减仓（ADL），具体规则各交易所不同。多数交易所用标记价格而非最后成交价判断强平，就是为了避免一根插针直接扫掉一批健康仓位。标记价格本身也需要质量保障：指数成分交易所太少或权重失衡时，标记价格同样会失真。"
      - h: 例子与数字
        p: "10 倍杠杆、维持保证金率 0.5% 的仓位，价格反向变动约 9.5% 就会触及强平线，而不是等本金亏光。盘口在 100 附近只有很少买单时，一笔大额市价卖单会连续吃掉 99.5、99、98 的挂单，最低成交价远低于中间价；强平结束后买盘回来，价格迅速回到 100 附近，图上留下“针”。"
      - h: 对比与演进
        p: "早期交易所直接用最后成交价触发强平，薄盘口上很容易被单笔大单扫出连锁强平；后来普遍改用标记价格（多交易所现货指数加权），插针触发强平的概率下降。保险基金与 ADL 是对尾部风险的补充机制，但它们只能缓冲，不能消除杠杆集中带来的级联效应。"
      - h: 代价与边界
        p: "不是每根针都是操纵：流动性薄、深度差、市价单过大都能造成插针，判断需要订单流与持仓变化证据。强平机制本身是必要的风控设计，代价是把个体爆仓转化为市场级联。本课不讨论任何杠杆操作，也不构成交易指引。"
      - h: 常见误读
        p: "把爆仓量当亏损金额：爆仓量是名义价值，实际损失只是其中的保证金。把插针一律归因于操纵：薄盘口加一笔大单就能形成同样的图形。把“插针后价格回来了”当成没损失：被强平的仓位已经离场，回抽与它无关。也有人把“插针后价格回来了”理解成没有人受损：被强平的仓位已经离场，回抽只对仍有仓位的人有意义，损失是真实的。"
    quiz:
      - q: "插针在订单簿层面是怎么形成的？"
        a: "大额市价单在薄盘口连续吃掉多档挂单，成交价被推得很远；等卖单执行完、买盘重新挂出，价格又快速回到原区间，K 线上就留下长针。"
      - q: "为什么交易所用标记价格而不是最后成交价来判断强平？"
        a: "最后成交价可能被薄盘口上的单笔大单瞬间拉偏，用它判断会让健康仓位被错误强平；标记价格用多交易所现货指数加权，更难被单点操纵。"
    sources: []

  - id: p303
    type: practice
    stage: 3
    order: 6
    title: 画美国现货 ETF 净流入图
    minutes: 13
    tags: [practice, etf]
    sections:
      - h: 目标
        p: "用公开数据画一张美国现货比特币 ETF 的日度净流入与累计净流入图，分清日流量和累计流量两种口径，并能指出数据滞后与口径差异。做完这张图，你应该能回答：某一天的“净流入”到底在统计什么、它什么时候才会反映到基金持仓上。画图的过程比图本身重要：它会逼你面对缺失值、单位与日期对齐这些平时容易被忽略的细节。"
      - h: 准备
        p: "一个浏览器和一个表格工具（或 python3 加任意绘图库），数据来自公开 ETF 流量页面（例如 Farside 的 Bitcoin ETF 页面）。不需要注册账号，不需要付费数据；先在表格里建好三列：日期、日净流入、累计净流入，并把单位统一写成百万美元，避免后面混算。把窗口设成最近 20 个交易日，而不是最近 20 个自然日，避免周末造成空档。"
      - h: 步骤
        p: "1) 打开公开 ETF 流量页面的 Bitcoin ETF 页，找到每日 Total 行；2) 抄下最近 20 个交易日的净流入，注意单位是百万美元；3) 用表格公式或 python3 逐日累加得到累计值；4) 柱状图画日流量、折线图画累计值，两张图共用横轴；5) 标出净流出最多的三天；6) 对照基金发行方公开页面核验其中一两天的数字。"
      - h: 验收
        p: "图上能看出哪几天是净流出、累计曲线在哪个区间转平或转向；用一句话说清日流量与累计流量各回答什么问题；图上标注数据来源、抓取日期与单位，并能解释为什么周末和节假日没有数据点。再补一句：如果只看累计曲线，会漏掉哪一天的信息。最后列出两条你无法从这张图判断的信息，例如申赎来自哪些机构、动机是什么。"
      - h: 安全与常见坑
        p: "只浏览公开网页，不注册、不下载可疑文件、不点广告；本练习不做任何投资判断，也不涉及资金操作。常见坑：把周末和节假日当成“零流量”（ETF 不交易，应当是空值）；单位混淆百万与十亿；把成交额当净流入；把不同基金加总时重复计算同一笔资金。还有一类坑是拿不同基金的口径直接相加：各家披露的统计截止时间可能并不相同。"
    quiz:
      - q: "为什么画图时要把日流量和累计流量分开？"
        a: "日流量看单日申赎变化，累计流量看一段时间的方向；只看累计会漏掉单日大幅赎回，只看单日又看不出趋势。"
      - q: "为什么周末没有 ETF 净流入数据点？"
        a: "因为美股 ETF 只在交易日交易和申赎，周末与节假日没有一级市场申购赎回；把缺失值填成零会让累计曲线出现假的平台期。"
    sources:
      - https://farside.co.uk/

  - id: t304
    type: theory
    stage: 3
    order: 7
    title: ETF 与机构资金流
    minutes: 14
    tags: [etf, institutions]
    sections:
      - h: 核心机制
        p: "现货 ETF 由授权参与者用现金或一篮子资产申购份额、赎回份额，基金再按规则买卖标的。二级市场买卖只是份额换手，只有申赎才改变基金持仓；这个分离是理解一切 ETF 流量数据的前提。这套分离结构也解释了为什么 ETF 的份额数量每天会变化，而二级市场价格却总是贴着净值波动。"
      - h: 关键细节
        p: "每日净流入等于申购金额减去赎回金额。美国现货比特币 ETF 于 2024 年 1 月获批，此后成为观察机构需求的高频公开指标；现金申赎与实物申赎的差别在于，现金模式下基金需要自己去市场买入标的，做市商可能用期货对冲过渡，因此资金流与现货买盘之间不是一一对应。"
      - h: 例子与数字
        p: "某日净流入 3 亿美元，可能是 5 亿申购减 2 亿赎回的结果；同样是 3 亿美元，也可能只来自一两个大机构的配置，而不是“散户都在买”。再看成交：某日二级市场换手 10 亿美元但无申赎，基金持仓可以完全不变。三种数字读起来都像“资金在动”，含义完全不同。"
      - h: 对比与演进
        p: "更早的信托类产品设有锁定期、折溢价大，套利机制弱；现货 ETF 靠授权参与者申赎把价格拉回净值附近，跟踪质量明显改善。从期货 ETF 到现货 ETF 的变化，是把敞口从“合约曲线”换成“实物持仓”，代价是费用率与运营复杂度。"
      - h: 代价与边界
        p: "流量数据是滞后的日频快照，时区与统计口径也会造成差异；费用率与跟踪误差长期侵蚀收益；ETF 的买卖不等于标的现货的即时买卖。中国内地境内不提供此类产品，虚拟货币业务一律禁止（2026 年 2 月 6 日八部门 42 号文），本课只做公开数据解读。"
      - h: 常见误读
        p: "把成交额当净流入：成交是换手，申赎才改变规模。把 ETF 买盘等同于现货买盘：现金申赎下中间可能经过期货对冲。把单日大额流入当成趋势：单日流量可能来自一次再平衡或调仓，需要看多日累计。还有人把 ETF 的资金流当成“聪明钱”信号：流量只记录配置动作，不包含这些机构的判断依据与持有期限。"
    quiz:
      - q: "为什么 ETF 成交量很大不等于资金在流入？"
        a: "成交量是二级市场换手，只改变份额持有人；只有申购与赎回才改变基金资产。看资金流要看净流入，而不是成交额。"
      - q: "现金申赎模式下，ETF 买入为什么不完全等于现货买入？"
        a: "现金申赎时基金收到现金后自行买入标的，过程中做市商可能先用期货等工具对冲，实际现货买盘的时间与规模可能被平滑或延后。"
    sources:
      - https://farside.co.uk/

  - id: p304
    type: practice
    stage: 3
    order: 8
    title: 用 Glassnode 看 MVRV
    minutes: 11
    tags: [practice, onchain]
    sections:
      - h: 目标
        p: "亲手查一次比特币 MVRV，理解指标口径、历史区间，以及“状态描述”和“预测”之间的边界，并把读数、数据源与抓取时间完整记录下来。目标是能对着一张图说清“它现在在描述什么”，而不是“它接下来会怎样”。如果条件允许，再和另一个数据源对比一次，记录下来数值差异来自哪里。"
      - h: 准备
        p: "一个浏览器和一张记录表；在数据平台（如 Glassnode）注册免费账号，免费层可用指标以站点当前说明为准。记录表列：指标名、数值、时间粒度、数据源、抓取时间、页面上的口径说明。提前把这几列画好，读数时边读边填，比事后回忆可靠。免费层的图表可能有延迟或只保留部分历史，遇到这种情况要在记录里注明，而不是凭印象补全。"
      - h: 步骤
        p: "1) 登录后搜索 MVRV；2) 选 BTC 全历史，把时间粒度记为日线；3) 记录最近 3 个时点的数值并截图存档；4) 在同一图上打开已实现市值做对照，观察分母的变化；5) 找到最近一次 MVRV 明显大于 1 的区间；6) 阅读站点对实体调整与已实现市值的口径说明并摘录一句。记录时把图表的纵轴范围一起截进去，否则事后无法判断当时读数的精度。"
      - h: 验收
        p: "能说出 MVRV 的分子分母各是什么、最近一次大于 1 的区间在哪里，并解释为什么数值高不等于价格要跌；记录表里必须有数据源、抓取时间与口径说明，缺一项算未完成。再加一句：如果 MVRV 在价格不动的情况下下降，最可能是什么原因。另外写出一个你原本以为会成立、但数据并不支持的判断。"
      - h: 安全与常见坑
        p: "只查询公开图表，不连接钱包、不授权任何地址；不要在页面上输入交易所密钥或助记词。常见坑：把图表上读到的近似值当成精确值；忽略指标按日更新；把不同数据商的 MVRV 直接对比；把“历史上某阈值对应过顶部”当成规律；只截价格图而不截指标图，事后无法复现。不要为了“看懂”而先付费订阅：用免费层把方法跑通，再决定要不要买数据。"
    quiz:
      - q: "MVRV 高说明什么，又不说明什么？"
        a: "高说明全市场平均浮盈大、持仓成本远低于现价；但不说明何时下跌，指标只描述当前的盈亏状态，不能预测方向。"
      - q: "记录为什么要连同抓取时间和口径说明一起保存？"
        a: "因为指标会随数据商口径、更新时间与样本调整而变化；没有时间和口径的记录无法复核，也无法在两个时点之间做可比的分析。"
    sources:
      - https://glassnode.com/

  - id: t305
    type: theory
    stage: 3
    order: 9
    title: 链上指标怎么用
    minutes: 14
    tags: [onchain, metrics]
    sections:
      - h: 核心机制
        p: "MVRV、SOPR 与已实现市值都建立在链上转移上：每枚币最后一次移动的价格被视为成本，把全市场成本与现价对比，就得到浮盈浮亏的分布。链上数据的独特价值在于它是全网公开、可复算的原始记录，而不是某一家的统计口径。"
      - h: 关键细节
        p: "指标要回答具体问题：MVRV 看整体盈亏状态，SOPR 看卖出的是盈利盘还是亏损盘，已实现市值看成本基础的变化；单看一个数值没有意义，要看趋势与结构。使用前先确认三件事：统计单位是地址还是实体、是否做实体调整、时间窗口多长。"
      - h: 例子与数字
        p: "价格横盘但已实现市值持续上升，说明有币在更高价格换手、持仓成本上移；此时 MVRV 下降不是价格跌了，而是分母变大了。再看 SOPR：如果同期 SOPR 从 1 上方跌到 0.98 附近并反复，说明亏损盘在换手，两个指标一起读才能区分“成本上移的健康换手”和“恐慌抛售”。"
      - h: 对比与演进
        p: "早期链上分析只做地址级统计，交易所内部转账与同一实体多地址会严重干扰指标；后来引入实体聚类与调整版指标（如 ASOPR），可解释性提升。数据商之间的口径差异至今仍存在，所以跨源比较必须先统一方法，而不是直接比数值。"
      - h: 代价与边界
        p: "口径差异很大：不同数据商对实体调整、交易所内部转账、长期不动币的处理不同，长期不动或丢失私钥的币会低估成本基础。指标描述状态，不做预测；它也看不到场外交易、衍生品持仓与托管账户内部的划转。因此链上指标更适合用来确认结构，而不是单独用来择时；与交易所数据、衍生品数据交叉验证，结论才稳。"
      - h: 常见误读
        p: "把“跌破某个阈值”当成买卖信号：阈值是历史经验的总结，市场结构变了就会失效。把同一指标在不同数据商之间直接比较：口径不同，数值天然不同。把链上数据当成全市场真相：它只覆盖链上部分，CEX 内部账本与场外交易完全不在其中。还有一个常见问题是忽略统计单位：按地址统计与按实体统计，在交易所归集钱包上会得到差别巨大的结果。"
    quiz:
      - q: "为什么同一时点的 MVRV 在不同数据商那里可能不一样？"
        a: "数据商对地址聚类、交易所内部转账、丢失币的处理口径不同，已实现市值这个分母不同，比值自然不同；比较时要固定数据源与口径。"
      - q: "MVRV 与 SOPR 一起读，能多得到什么信息？"
        a: "MVRV 告诉你整体持仓处于浮盈还是浮亏，SOPR 告诉你现在卖出的是盈利盘还是亏损盘；两者结合能区分成本上移的健康换手与恐慌性抛售。"
    sources:
      - https://glassnode.com/

  - id: p305
    type: practice
    stage: 3
    order: 10
    title: 用 Dune 查 USDT 日转账额
    minutes: 12
    tags: [practice, dune]
    sections:
      - h: 目标
        p: "在 Dune 上用 SQL 统计以太坊上 USDT 的日转账额，理解链上稳定币流动与交易所资金流之间的区别，并能说清这个数字不能回答什么问题。重点是学会把一个链上大数字拆解成“它到底在统计什么”。如果结果与你预期差别很大，先检查过滤条件与合约地址，而不是急着解释市场。"
      - h: 准备
        p: "注册 dune.com 免费账号；了解以太坊 ERC-20 的 Transfer 事件包含 from、to、value 三个字段；USDT 的合约地址以 Tether 官方文档为准，不要凭记忆抄写。查询只需要只读权限，不需要钱包。先在脑子里写下你预期这张图会是什么形状，再和结果对照。"
      - h: 步骤
        p: "1) 新建一个查询，选择以太坊的 Transfer 事件表（表名以 Dune 当前数据目录为准）；2) 用 contract_address 过滤出 USDT 合约；3) 按天分组：date_trunc('day', evt_block_time) 作为日期，sum(value) 除以 1e6 换算成枚数；4) 限定最近 30 天；5) 用柱状图展示结果；6) 把 SQL 与结果截图保存在本地。"
      - h: 验收
        p: "得到一张 30 天日转账额柱状图，并能解释它为什么既包含真实结算、也包含同一实体内部的划转；还要写出一句“这个数字不能说明净流入”，并说明需要什么数据才能判断资金进出。验收时把你的 SQL 与一句口径说明一起存档。把你的查询链接与截图一起保存，方便下次复算同一张图。"
      - h: 安全与常见坑
        p: "只用公开数据与只读查询；不连接钱包、不在 Dune 上签名或授权，不涉及任何资金。常见坑：忘记 USDT 是 6 位小数（不除以 1e6 会大一百万倍）；把转账笔数当金额；重复统计 DEX 交易内部的 Transfer；忽略合约升级或代理地址导致的数据缺口。还有一点：平台表结构会调整，教程里的表名过时是常态，一切以数据目录为准。"
    quiz:
      - q: "USDT 日转账额很高，能说明有大量资金进场吗？"
        a: "不能。链上转账包含交易所内部划转、做市商调仓与同一实体内部转账；转账额只说明链上结算活跃，不代表净流入或新增资金。"
      - q: "为什么统计 USDT 金额时要除以 1e6？"
        a: "因为 USDT 合约的 decimals 是 6，链上记录的是最小单位；不换算会把金额放大一百万倍，图表纵轴与结论都会完全失真。"
    sources:
      - https://dune.com/

  - id: t306
    type: theory
    stage: 3
    order: 11
    title: 代币经济学
    minutes: 14
    tags: [tokenomics, supply]
    sections:
      - h: 核心机制
        p: "代币经济学描述供给（总量、初始流通、释放曲线、销毁）与需求（用途、费用、治理、激励）如何匹配：供给决定稀释速度，需求决定谁来承接。只写供给表而不写需求来源，等于只算了账本的一半；两者必须放在同一张纸上对照。"
      - h: 关键细节
        p: "常见结构是团队、投资人、社区与金库分池，悬崖期后线性释放；通胀率等于新增流通量除以现有流通量，销毁与回购则反向收缩。需求侧要看代币是否被用来付费、质押、治理或作为抵押品，以及这些用途是否由协议收入支撑，而不是靠增发补贴维持。"
      - h: 例子与数字
        p: "假设总量 10 亿、初始流通 1 亿，此后每月线性解锁总量的 1%，则第 12 个月流通量约 2.2 亿；同样是“每月 1%”，相对流通盘的稀释速度会随时间下降：第 1 个月相当于流通盘的 10%，第 12 个月只相当于约 4.8%。稀释压力在早期最大，这一点常被日历式的解锁提醒忽略。"
      - h: 对比与演进
        p: "固定总量模型（如比特币的 2100 万枚上限加周期性减半）与通胀模型（如以太坊 PoS 后的发行叠加销毁）是两条不同路线；前者供给曲线完全确定，后者供给取决于质押量与链上活动。还有双代币结构，把治理权与效用分开，代价是两种代币之间的价值捕获关系更难评估。"
      - h: 代价与边界
        p: "供给表只是必要条件，不能单独推出价格；解锁不等于抛售，回购也不等于上涨。评估时要把解锁量、持有人结构与市场深度放在一起看。激励驱动的需求尤其要小心：用增发补贴出来的使用量，一旦补贴停止就可能消失，它不构成可持续的需求。"
      - h: 常见误读
        p: "把低流通高 FDV 当成必然被低估或必然崩盘：两种结论都越过了需求与解锁节奏。把销毁等同于价值提升：销毁减少供给，但如果没有需求，减少的只是分母。把治理权等同于现金流：多数治理代币并不自动分享协议收入。还有一个常见误读是把“总量固定”当成价值保证：总量固定只保证供给曲线确定，不保证有人需要它。"
    quiz:
      - q: "为什么低流通、高 FDV 的项目需要额外警惕稀释？"
        a: "大部分代币还没进入流通，未来解锁会持续增加供给；在需求不变的情况下，同样的买盘要支撑更大的流通盘，稀释压力会体现在价格与深度上。"
      - q: "同样是每月解锁总量的 1%，为什么早期稀释压力更大？"
        a: "因为稀释的相对影响取决于新增量占现有流通盘的比例；早期流通盘小，1% 的总量可能相当于流通盘的 10%，后期流通盘变大后同样的绝对增量占比就下降了。"
    sources: []

  - id: p306
    type: practice
    stage: 3
    order: 12
    title: 用链上模块做一次归因
    minutes: 12
    tags: [practice, onchain]
    sections:
      - h: 目标
        p: "跑一次本仓库 crypto-onchain 模块，读懂它如何在放量下跌时把卖压归入四类之一：强平、空头加仓、资金撤离或去杠杆，并理解为什么它只给类别、不给身份。"
      - h: 准备
        p: "本机有 python3 与模块依赖；确认在 crypto-onchain 目录下能运行 ./scripts/run.sh。模块默认影子（shadow）模式，只写本地导出、不推送。准备一张纸，先写下你预期会看到的字段：类别、置信度、证据、反证、不可知说明。"
      - h: 步骤
        p: "1) 进入 crypto-onchain 目录；2) 运行 ./scripts/run.sh --dry-run --json 查看输出；3) 打开 data/exports/onchain-pressure.json，找到 attribution 下的 category_code、category、confidence、evidence、counter_evidence、unknown、basis；4) 对照 config/rules.yaml 的 attribution、taker、cex_flow、liquidations 段，看每类结论的判定条件与阈值；5) 把当次结论与证据抄进本地笔记。"
      - h: 验收
        p: "能用自己的话说出当前结论属于四类（long_liquidation、short_add、capital_exit、deleverage）中的哪一类、依据哪几个信号、置信度是什么，以及模块明确说不回答什么——也就是“谁在卖”。还要指出一条反证条件：出现什么数据就说明这个归因不成立。"
      - h: 安全与常见坑
        p: "使用 --dry-run，不改状态、不推送；模块只读公开数据，不接私钥、不做交易。常见坑：把 shadow 模式的输出当成实盘信号；把 category 当成身份归因；忽略 unknown 字段；看到证据不读 counter_evidence，把一个概率判断当成确定结论。"
    quiz:
      - q: "为什么这类归因只给类别，不给谁在卖？"
        a: "因为交易所匿名撮合加链上假名，身份无法从公开数据得出；强行给实体归因等于编造证据，结论只能到“类别加证据加反证”。"
      - q: "counter_evidence 字段的作用是什么？"
        a: "它列出与当前归因相反或会推翻结论的信号，迫使分析保留可证伪性；只看 evidence 会把一个概率判断当成确定结论，反证字段是防止过度自信的机制。"
    sources: []

  - id: t307
    type: theory
    stage: 3
    order: 13
    title: 估值框架：收入、TVL 与 FDV
    minutes: 14
    tags: [valuation, defi]
    sections:
      - h: 核心机制
        p: "加密项目没有统一的市盈率，常用三组替代指标：协议收入（费用）、总锁仓量（TVL）、完全稀释估值（FDV）。三者衡量的是不同东西，不能互相替代：收入看现金流，TVL 看锁定的资产规模，FDV 看供给侧的算术上限。三者放在一起才有意义：用收入验证需求、用 TVL 观察规模、用 FDV 衡量稀释，任意一个单独使用都容易得出相反的结论。"
      - h: 关键细节
        p: "收入要看归属：归协议金库、归代币持有人，还是分给流动性提供者；TVL 要看去重方式与计价（是否重复计算同一笔资产、是否包含激励冲量）；FDV 只是算术上限，不是目标价。把“费用”和“收入”区分开也很重要：用户付的是费用，协议留下的是收入，中间的部分可能给了流动性提供者。"
      - h: 例子与数字
        p: "两个借贷协议 TVL 都是 10 亿美元，一个年收入 1000 万、另一个 2000 万，在同样 FDV 下后者更便宜——前提是收入真的流向代币持有人。若后者的收入 100% 分给存款人和流动性提供者，代币持有人一分钱拿不到，那么对持币者而言两者的“有效收入”都是零，比较立刻失效。"
      - h: 对比与演进
        p: "早期 DeFi 用“市值除以 TVL”做粗略比较，后来发现 TVL 可以被高息激励短期冲高，于是转向费用与收入，再到回购与销毁。指标演进的方向是越来越靠近“真正流向代币持有人的现金流”，但每一步都需要更细的口径披露，跨协议比较的难度也随之上升。"
      - h: 代价与边界
        p: "TVL 可以被高息激励短期冲高，收入可能来自补贴换来的交易量；用激励买来的数据做估值，等于在给补贴定价。更要紧的是，协议收入不等于代币持有人收入，代币也不必然有索取权；用传统市盈率类比加密项目时，必须先确认现金流是否真的能到持币人手里。"
      - h: 常见误读
        p: "把 TVL 当估值核心：它衡量规模不衡量盈利能力。把 FDV 当目标价：它是价格乘总量的算术结果。把高收入当便宜：收入可能一次性、可能来自补贴、也可能全部流向流动性提供者。单一指标永远不足以支撑结论。"
    quiz:
      - q: "为什么不能只用 TVL 比较两个 DeFi 协议？"
        a: "TVL 只反映锁在合约里的资产规模，不反映这些资产产生多少收入、归谁所有，也不排除重复计算与激励冲量；估值要结合收入归属与 FDV。"
      - q: "协议费用与协议收入有什么区别？"
        a: "费用是用户为使用协议付出的总额，收入是其中协议实际留下的部分；差额通常分给流动性提供者或存款人。只有留下并可能流向代币持有人的部分才与估值相关。"
    sources:
      - https://defillama.com/

  - id: p307
    type: practice
    stage: 3
    order: 14
    title: 写一篇 500 字周期观察
    minutes: 12
    tags: [practice, writing]
    sections:
      - h: 目标
        p: "用 500 字把一段时间的市场变化写成可核对的事实、解释与反证，练习把数据和观点分开；写完后任何人都能按你标注的来源复现同样的数字。写作时把自己当成给三个月后的自己留记录：那时你不记得今天的行情，只能依赖纸面证据。如果你的三个数据点彼此无关，也很好：那说明你在描述不同层面的环境，而不是重复同一件事。"
      - h: 准备
        p: "三个公开且可复现的数据源，例如 ETF 净流入、稳定币总供应、永续资金费率；一张记录表写清每个数据点的来源、口径、时间窗口与抓取时间。写作前先决定观察窗口（例如最近 30 天），避免边写边换口径。如果某个数据点只有二手来源，就换一个能直达原始页面的指标，不要用转述的数字。"
      - h: 步骤
        p: "1) 选 3 个公开数据点，各自记录来源、口径、时间窗；2) 按“事实—解释—反证—未知”四段来写；3) 每个数字都标注来源与抓取时间；4) 至少写一条“如果怎样就说明我错了”；5) 通读一遍，把所有形容词换成可核对的数量描述；6) 统计字数并保存版本；7) 写完后隔一天再读一遍，专门找出那些“读起来很顺但没有数据支撑”的句子。"
      - h: 验收
        p: "500 字左右（上下 10%），每个结论都能追到一个数据点，结尾有明确、可检验的反证条件；事实段里没有“我觉得”，解释段里明确标注这是解释。让别人读一遍，能指出你的哪句话是推测。另外请一位朋友只读你的文章，指出哪句话最像主观判断，并记录他的答案。把全文的数字逐个圈出来，确认每个数字都能在原始页面上找到，且口径一致。"
      - h: 安全与常见坑
        p: "不写点位、不写目标价、不写买卖建议；只描述已经发生的数据，不做预测。常见坑：把解释写成事实；数据点之间口径不一致；反证条件写得无法检验（如“如果行情变了”）；字数超了靠删来源蒙混过关。如果发现自己在为一个结论找数据，就停下来把顺序倒过来：先列数据，再写解释。写完后检查一遍：如果删掉所有形容词文章是否还成立？如果不成立，说明形容词承载了不该承载的结论。"
    quiz:
      - q: "为什么周期观察要强制写出反证条件？"
        a: "反证条件把观点变成可检验的假设，防止事后随意解释；写不出反证，通常说明这段观察只是情绪而不是分析。"
      - q: "把解释写进事实段会带来什么问题？"
        a: "读者无法区分哪些是可核对的数据、哪些是作者的推断，事后复盘时也判断不出错在数据还是逻辑；两层混写会让整篇观察失去可检验性。"
    sources: []

  - id: t308
    type: theory
    stage: 3
    order: 15
    title: 宏观流动性与加密市场
    minutes: 14
    tags: [macro, liquidity]
    sections:
      - h: 核心机制
        p: "加密资产处在风险偏好链条的末端：利率、美元流动性与信用利差变化时，资金会先撤出高波动资产，紧缩周期里全球风险资产往往同向下跌。传导路径是资金成本上升、杠杆资金被迫收缩、高波动资产先被卖出。这个链条上还有一层放大器：杠杆与抵押品，风险资产价格下跌会触发抵押品贬值与被动卖出，使波动超过基本面变化。"
      - h: 关键细节
        p: "常用观察变量是实际利率、美元指数、主要央行资产负债表与稳定币总供应；稳定币增发可以看作链上流动性的代理指标，但不等于全部增量资金。还要区分“价格变化”与“流动性变化”：资产价格上涨本身不等于新增流动性入场。"
      - h: 例子与数字
        p: "2022 年美联储快速加息，纳斯达克与比特币同步走弱，相关性在紧缩期明显上升；到了政策转向预期阶段，两者又可能脱钩，相关性并不是常数。实务上要看滚动相关系数而不是一个静态数字：同一年内，滚动相关性可以从很高降到接近零，甚至短期转负。"
      - h: 对比与演进
        p: "2020 年流动性极度宽松时期，风险资产普遍受益；2022 年紧缩期则集体承压；说明宏观环境影响的是整条风险曲线，而不是单个资产的基本面。加密自身的周期（减半、杠杆结构、行业事件）会叠加在宏观之上，两者谁主导取决于当时哪个变量变化更剧烈。"
      - h: 代价与边界
        p: "相关性不等于因果，宏观变量多、时滞长；把“流动性宽松”直接翻译成“加密上涨”是过度简化，叙事与自身周期同样会主导短期走势。宏观数据发布有修订与滞后，用修订后的数据回看当时判断，很容易产生事后聪明的错觉。因此宏观框架的正确用法是设定情景与概率，而不是给出单一路径的结论。"
      - h: 常见误读
        p: "把流动性宽松当上涨保证：资金可能流向别的资产或停在现金。把相关性当因果：两个变量同向变动可能只是共同受第三因素驱动。把一次宏观事件当成可重复的模板：同样的政策在不同估值与杠杆水平下，市场反应可以完全相反。还有一种误读是只看央行资产负债表总量：结构变化，例如准备金与逆回购的构成，有时比总量更重要。"
    quiz:
      - q: "为什么用宏观变量解释加密涨跌要特别小心？"
        a: "宏观与风险资产的相关性会随政策阶段变化，且存在时滞与多因素叠加；相关性不构成因果，单一变量无法解释由资金、叙事和杠杆共同驱动的市场。"
      - q: "稳定币总供应为什么只是一个代理指标？"
        a: "它只反映链上稳定币的流通规模，不包含场外资金、其他币种与衍生品保证金；增发也可能只是内部调仓，因此只能作为流动性的间接线索，不能当作增量资金总量。"
    sources: []

  - id: p308
    type: practice
    stage: 3
    order: 16
    title: 写一篇 1000 字项目分析
    minutes: 15
    tags: [practice, research]
    sections:
      - h: 目标
        p: "用固定模板对一个项目写出 1000 字分析，把机制、代币经济学、公开数据与风险放在同一张纸上；目标是让读者能按你列的来源复核每个关键数字，而不是相信你的结论。分析对象可以是你感兴趣的任何公开项目，但不要选自己持有的项目，避免动机干扰判断。"
      - h: 准备
        p: "项目的官方文档与白皮书、公开数据看板（如 DefiLlama 的 TVL 与费用页面、区块浏览器）、代币归属与解锁表。先建一个空模板：机制、代币经济学、数据、竞争、风险、反证条件，六节各留位置，写作时只填不新增章节。把数据看板的抓取时间与页面链接一并保存，避免几天后数字变化导致无法复核。"
      - h: 步骤
        p: "1) 读官方文档，写清项目解决什么问题、机制是什么；2) 查 DefiLlama 的 TVL 与收入，记录口径与时间窗；3) 列代币供给与解锁表，算出 FDV 与稀释倍数；4) 写竞争格局，指出两个直接对手与差异；5) 写三条风险与一条可验证的反证条件；6) 通读并删掉所有无法追溯来源的数字；7) 最后用 100 字写一段“如果这个项目失败，最可能的原因”，逼自己给出可检验的判断。"
      - h: 验收
        p: "1000 字左右，数据都能复现，至少包含一张供给或解锁小表和一条可验证的反证条件；每个数字后面都有来源与时间，机制段里能说清“谁付钱给谁”。做不到复现的部分要明确标为未知，而不是含糊带过。如果某个数字来自项目方自报且无法交叉验证，必须在文中标出来源等级。"
      - h: 安全与常见坑
        p: "只用公开数据，不写价格预测与买卖建议。中国内地读者注意：境内虚拟货币业务一律禁止（2026 年 2 月 6 日八部门 42 号文），本文只做研究练习。常见坑：把官网宣传当机制描述；TVL 不看去重；FDV 用错供应口径；风险段写成套话。还有一个常见问题是用“赛道空间大”代替具体分析：这类句子无法被证伪，应当删掉。"
    quiz:
      - q: "项目分析里为什么必须先写清收入归谁？"
        a: "因为代币价值最终取决于协议产生的价值有多少流向代币持有人；收入归金库、归流动性提供者还是归持币者，决定了同一份收入对应的估值完全不同。"
      - q: "为什么要求每条数据都能复现？"
        a: "可复现意味着结论可以被他人检验，也意味着作者必须区分事实与推测；无法复现的数字事后无法判断对错，整篇分析就变成了不可证伪的观点。"
    sources:
      - https://defillama.com/

  - id: t309
    type: theory
    stage: 3
    order: 17
    title: 周期与减半
    minutes: 13
    tags: [bitcoin, cycle]
    sections:
      - h: 核心机制
        p: "比特币每 210,000 个区块（约四年）减半一次，区块补贴依次从 50 降到 25、12.5、6.25、3.125 BTC；2024 年 4 月完成第四次减半。减半只改变新增供给，不改变已有存量，所以它影响的是供给增速而不是供给总量。"
      - h: 关键细节
        p: "减半直接压缩新增供给：每天新增约 450 BTC（144 个区块乘以 3.125），占存量的比例越来越小；需求不变时，供给增速下降是结构性的。矿工收入由区块补贴与手续费两部分组成，减半后补贴下降，手续费占比上升，长期看网络必须靠使用需求支撑安全预算。"
      - h: 例子与数字
        p: "把减半理解成“新增供给的增速减半”，而不是“价格翻倍”：第四次减半后日新增从约 900 BTC 降到约 450 BTC；按约 1970 万枚存量估算，年化新增率不到 1%，而更早的周期里这个比例是它的数倍。历史上每次减半前后的宏观背景都不同，价格路径并没有重复出现。"
      - h: 对比与演进
        p: "前三次减半发生在散户主导、衍生品不发达的市场；第四次减半时现货 ETF 已上线、机构参与度更高，需求结构完全不同。供给冲击的边际影响随存量增大而递减，把早期周期的经验直接套到后来的周期，忽略了市场结构与资金体量的变化。"
      - h: 代价与边界
        p: "“减半必然带来牛市”是叙事，不是规律；供给冲击的边际影响随存量增大而递减，需求、杠杆与监管环境同样决定周期。减半日期本身是公开且确定的，因此“预期”早已被交易；实际影响更多取决于当时的资金结构与叙事状态，本课不构成任何交易建议。"
      - h: 常见误读
        p: "以为减半让存量减半：它只把新增产量减半。以为减半当天价格会跳涨：事件公开且可预期，价格可能早已反映预期。以为减半的边际效应永远一样：存量越大，同样减半对供给增速的影响越小。还有人把减半与矿工收入混为一谈：减半减少的是区块补贴，矿工总收入还取决于手续费市场与当时的币价。"
    quiz:
      - q: "减半改变的是供给存量还是供给增速？"
        a: "改变的是新增供给的增速：区块奖励减半让每天新产出的比特币减少，但存量不变；随着存量越来越大，新增供给对价格的边际影响递减。"
      - q: "为什么“减半必然带来牛市”是叙事而不是规律？"
        a: "因为减半日期公开且可预期，价格可能已提前反映；且需求、杠杆结构、宏观环境与监管都在同时变化，历史上每次减半后的走势并不相同，无法据此推出必然结论。"
    sources:
      - https://bitcoin.org/

  - id: p309
    type: practice
    stage: 3
    order: 18
    title: 整理自己的指标清单
    minutes: 11
    tags: [practice, metrics]
    sections:
      - h: 目标
        p: "建一张属于自己的指标表，每个指标都写清定义、口径、来源、更新频率，以及“它不能回答什么”，让以后每次看到数字都能先定位口径再下判断。这张表日后会成为你看任何数据时的第一道检查清单，值得多花十分钟把它做扎实。整理时先不要追求覆盖全市场，而是先覆盖你真正会用的那几个指标。"
      - h: 准备
        p: "一张本地表格，5 列固定为：指标名、定义与单位、口径与来源、更新频率、不能回答什么。另加一列备注，用来记录数据商的调整方法（例如是否做实体调整、是否按去重统计）。列名不要用缩写，除非在备注里写清全称，否则两周后自己都认不出来。"
      - h: 步骤
        p: "1) 列出至少 10 个指标：市值、FDV、OI、资金费率、MVRV、SOPR、已实现市值、TVL、协议收入、ETF 净流入、稳定币供应；2) 每个指标填满 5 列，局限一栏不允许写“无”；3) 标出哪些是链上原生数据、哪些依赖交易所或第三方披露；4) 挑两个指标去原始来源验证一次数值是否对得上；5) 把最容易混淆的三对指标并排放，写出它们在哪一步计算上分叉。6) 给每个指标写一句“它最容易骗人的地方”，这句话往往比定义更有用。"
      - h: 验收
        p: "表格至少 10 行，每个指标的局限性一栏都不为空，并能说出两组容易混淆的指标对，例如市值与 FDV、成交量与净流入、费用与收入；验证过的那两个指标要写清你对照的是哪个页面、哪一天的数据。另外标注每个指标的失效场景，例如交易所内部转账会污染哪一列、丢失私钥会压低哪个值。"
      - h: 安全与常见坑
        p: "只做整理，不写买卖阈值、不设目标价、不接入任何交易接口，也不需要购买任何付费数据终端。常见坑：定义抄成标语而不是可计算的口径；来源只写网站名不写具体页面；更新频率写“实时”但其实按日更新。不要为了凑行数把同一指标的不同时间窗拆成两行，那只是重复而不是覆盖。另外别把指标阈值写进表里，那会把描述性工具变成交易信号。"
    quiz:
      - q: "指标清单里“它不能回答什么”这一栏有什么用？"
        a: "它迫使你写出指标的口径边界，避免把一个描述性数据当成结论；知道自己的盲区，才能在选择时保留反证空间。"
      - q: "为什么要在清单里区分链上原生数据与第三方披露数据？"
        a: "两类数据的可信度与更新机制不同：链上数据可自行复算，第三方披露依赖其统计口径与商业动机；混在一起会让人误以为所有数字都有同等证据强度。"
    sources:
      - https://glassnode.com/
      - https://defillama.com/

  - id: t310
    type: theory
    stage: 3
    order: 19
    title: 如何读一份研究报告
    minutes: 13
    tags: [research, method]
    sections:
      - h: 核心机制
        p: "先读结论与利益冲突，再读方法与数据源，最后看它没说什么。研究报告的价值在可复现的分析过程，而不在结论本身；结论谁都能写，方法与数据才是可检验的部分。判断一份报告值不值得读，最快的方法是先看它的数据能否用公开工具复算一遍。"
      - h: 关键细节
        p: "重点核对：数据来自哪里、时间窗口多长、口径是 CEX 还是全市场、是否做过实体调整、有没有对照组、样本量是否足够、结论能否用公开数据重算。还要看它如何处理异常值、是否披露了失败案例，以及图表纵轴是否从零开始。还要注意图表的可比性：纵轴截断、时间窗口挑选、对数与线性坐标，都能让同一组数据讲出不同故事。"
      - h: 例子与数字
        p: "一份报告说“交易所净流出 X 亿美元”，要追问统计了哪些交易所、是否包含内部转账、是法币还是全币种；不同口径下同一个词可以指向完全不同的数字。同一个词在本周可能是几亿美元，在另一个口径下可能只有几千万，差一个数量级而结论方向都说得通。"
      - h: 对比与演进
        p: "过去的研报以叙事与结论为主，读者很难复核；现在越来越多报告附带数据看板与查询链接，可复现性成为竞争力。工具演进让复算变容易，但也让“看起来有数据”的报告变多——数据存在不等于数据支持结论。这个变化对读者的要求也变了：从判断结论是否可信，变成判断数据与查询是否支持结论。"
      - h: 代价与边界
        p: "研报可能是营销材料，作者可能持仓或收受赞助；把它当信息来源而不是投资建议，并在自己的指标清单里标注口径。阅读报告有时间成本，最省时的顺序是先看方法与数据源，如果口径与你的框架不兼容，后面的结论不必细读。"
      - h: 常见误读
        p: "把结论正确当成方法正确：对一次可能是运气。把引用多当成可信：引用可能互相转抄。把图表精致当成严谨：纵轴截断、时间窗口挑选都能做出完全不同的图形。把“机构发布”当成无利益冲突。还有一种误读是把报告的免责声明当成形式：它往往恰恰标明了作者不愿为之负责的部分。"
    quiz:
      - q: "读研究报告时，为什么要先看利益冲突与数据口径？"
        a: "因为结论的可信度取决于谁写的、有没有持仓或赞助，以及数据口径是否一致；同样一句话在不同口径下可以是不同数字，先核对这两点能过滤大部分噪音。"
      - q: "一份报告说“交易所净流出 X 亿美元”，你应该追问什么？"
        a: "统计了哪些交易所、时间窗口多长、是否包含交易所内部转账、是法币还是全币种口径；这些差异会让同一个说法对应完全不同的数字量级。"
    sources: []

  - id: p310
    type: practice
    stage: 3
    order: 20
    title: 复盘一次公开判断
    minutes: 12
    tags: [practice, review]
    sections:
      - h: 目标
        p: "找一条 30 天前公开可查的判断，自己的或公开研报的都可以，用今天的数据检验它对不对，练习校准判断力；重点是分清哪部分错了，而不是证明自己当初对。复盘的目的不是给自己打分，而是找出可复用的判断流程与必须放弃的坏习惯。复盘一次之后，最好把结论压缩成三条可执行的检查项。"
      - h: 准备
        p: "一条有原始时间戳的公开判断（保留原文与链接或截图）、它当时依据的数据、以及今天同口径的公开数据。准备一张三栏表：原始表述、当时依据、今天的数据；复盘时逐条填，不要凭记忆改写原话。如果原判断只有截图没有链接，就在准备阶段标注来源等级，避免复盘时高估其严谨性。"
      - h: 步骤
        p: "1) 选一条有原始时间戳的判断，抄下原文；2) 记下当时的依据与隐含假设（例如“监管不会变化”）；3) 用今天的公开数据逐条核对，标明数据口径与日期；4) 写 200 字复盘，区分事实、解释、预测三层；5) 给每条判断标注结果：成立、被证伪、暂时无法判断；6) 写一句下次要改的具体做法；7) 把“当时其实不知道”的部分单独列出来，那往往是下次可以提前研究的方向。"
      - h: 验收
        p: "复盘里至少指出一条被证伪的判断，并写清是数据错了、逻辑错了，还是运气；三栏表每行都有对应的今天数据与日期。做不到判断的部分标注为“无法判断”，不允许用模糊表述掩盖。另外统计一下：你的判断里有多少条属于预测、多少条属于事实复述，比例本身就有信息。复盘结束时给自己一个明确的改进项，下一轮复盘时先检查它是否做到。"
      - h: 安全与常见坑
        p: "复盘只针对已发生的公开信息，不做新预测、不给交易建议；引用他人观点时注明出处与时间。常见坑：事后改写自己原来的表述；用今天才知道的信息评判当时的选择；把运气好当成方法对；只挑对的案例复盘。还有一种坑是只复盘大错：小错积累起来同样会系统性偏移判断，样本要随机抽。引用他人观点时保留上下文，截断引用常常是误读的开始。"
    quiz:
      - q: "复盘时为什么要区分事实、解释、预测三层？"
        a: "三层混在一起就无法判断错在哪：事实错误要换数据源，解释错误要改逻辑，预测错误要承认不确定性；分开才能把一次失败变成方法上的改进。"
      - q: "为什么复盘时要保留原文与原始时间戳？"
        a: "因为记忆会自动改写过去的判断，让人以为当时就预见到了结果；保留原文才能客观比对，避免用事后信息重写历史，复盘才有校准价值。"
