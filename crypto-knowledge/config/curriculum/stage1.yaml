title: "基础：货币、账本、密码学与比特币"
weeks: "W1–W4"
items:

  # ============ 概念 c101–c120 ============

  - id: c101
    type: concept
    stage: 1
    order: 1
    title: "账本"
    en: "Ledger"
    minutes: 11
    tags: [basics, ledger]
    sections:
      - h: "一句话"
        p: "账本（ledger）记录“谁拥有什么、发生过什么”。货币本质上是一套被多方共同承认的记账系统，而不是一张纸或一块金属；比特币常被称为分布式账本，重点落在“账”而不是“币”。想清楚这一点，后面的共识、UTXO、Gas 才有落脚处。"
      - h: "为什么重要"
        p: "区块链不是“更快的数据库”，而是让互不信任的多方共用同一本账的机制。先有账本问题，共识、UTXO、Gas 这些设计才接得上；否则你会把区块链当成一种更贵的数据库，只记住它能存数据，却说不清它到底替代了什么。反过来，如果不从账本角度看，也很容易把“去中心化”当成目的本身，而它其实只是达成共同记账的手段。"
      - h: "核心机制"
        p: "任何账本都要回答三件事：记录什么、谁来记、冲突时听谁的。记录什么决定字段与精度（货币要记到分还是记到 sat）；谁来记决定权限与审计范围；冲突时听谁的，决定最终由谁裁决。中心化账本用银行与清算所回答第三个问题，效率高但信任集中；区块链把“听谁的”交给公开规则与多数算力、质押，代价是速度、冗余与最终性延迟。三问里最容易被忽略的正是第三问：大多数“要不要上链”的争论，本质都在争这个。此外账本还必须防重复、可追溯修改、能在灾难后恢复，这三点决定了备份、审计日志与权限模型的设计。"
      - h: "例子"
        p: "银行转账在你的账户里是一笔分录，在银行资产负债表上是负债的转移；跨行还要经过清算系统，所以到账与入账常常不是同一时刻。账本并不“搬钱”，它只是改记录：同一笔钱在同一时间只能出现在一处，靠的是记账方对顺序与余额的裁决。复式记账可以理解为最早的“双向校验”：每笔分录同时记借方与贷方，总额必须平衡，单边篡改会立刻暴露。区块链把这套记录公开给所有参与节点，让改记录必须付出全网验证的成本，裁决因此从机构转到规则手里。"
      - h: "常见误解"
        p: "把不可篡改当成账本的默认属性。银行数据库随时可改，成本极低，改错后还能冲正；不可篡改只在需要多方互相核对、且有人可能作恶时才值得付出冗余、延迟与手续费。混淆这两件事，就会得出“所有数据都该上链”的结论，然后在落地时付出不必要的成本。另一种误解是把“公开”当成“可信”：链上数据公开可查，但不等于内容真实，上链只是把“谁在什么时候说过什么”固定下来。"
      - h: "边界与代价"
        p: "当参与方本来就互相信任（公司内部、单一平台、已有强信任的清算系统），用区块链反而更慢更贵，还要额外处理密钥管理与合规。它的价值集中在“跨主体、低信任、需要共同审计”的场景；即便符合这三条，也要继续问数据是否适合公开、出错时由谁负责。另一个现实边界是成本可预测性：链上手续费随拥堵波动，做年度预算的机构很难接受这种不确定性。"
    quiz:
      - q: "如果只有一个人记账，还需要区块链吗？"
        a: "基本不需要。区块链的价值来自多方互不信任又要共用同一份记录；单人记账用普通数据库更快、更便宜，改错和审计也更容易，可信度并不需要靠冗余来买。"
      - q: "账本要回答的三个问题是什么？"
        a: "记录什么、谁来记、冲突时听谁。区块链的创新主要在第三个问题上：用公开规则与算力、质押替代中心机构的仲裁，代价是效率与最终性延迟。"
      - q: "为什么“不可篡改”是有代价的？"
        a: "它要求全网重复存储与验证、出块排队确认，换来的是无需信任中间人。在互信场景里这些成本没有对应收益，反而拖慢正常业务。"
    sources:
      - https://bitcoin.org/bitcoin.pdf

  - id: c102
    type: concept
    stage: 1
    order: 2
    title: "双花"
    en: "Double spending"
    minutes: 11
    tags: [basics, bitcoin]
    sections:
      - h: "一句话"
        p: "双花（double spending）指同一笔数字资产被花两次。纸币转手即离手，数字文件却能无损复制，所以数字现金必须有防重放与全网排序机制，否则同一份余额可以同时付给十个人。注意这不是密码学难题，而是排序难题。"
      - h: "为什么重要"
        p: "比特币真正的创新不是币，而是在没有中心机构的情况下解决双花。若没有这个机制，任何数字现金都必须依赖一个被信任的记账方做去重，代币也就只是某个数据库里的条目，随时可以按运营方的意志增删。在没有中心机构时，排序权本身就是权力：谁决定交易顺序，谁就能决定哪一笔双花先成立。"
      - h: "核心机制"
        p: "做法是给交易排出一个全网唯一的顺序：所有节点只接受累计工作量最大的链，每笔输入必须引用尚未被花费的输出，同一输出被引用第二次就直接判为无效。两个关键词是输入引用与累计工作量：前者让每一笔花费都有唯一出处，后者让“先来后到”不取决于谁先广播，而取决于谁累计做得更多。确认数越多，交易被重排的代价越高，去重因此从“信机构”变成“重做工作量”。"
      - h: "例子"
        p: "攻击者把同一笔 1 BTC 的 UTXO 同时广播给商家和矿工，想让两个版本分别进入两条分叉。诚实链先确认后，另一条链上的版本就成了无效双花。攻击者要翻盘，必须从分叉点重做工作量并追平主链，落后越多、概率越低，而且整个过程公开可见。从商家视角看，交易进内存池不等于收款成功：只有进块并被确认，双花风险才真正下降。"
      - h: "常见误解"
        p: "以为双花已被技术彻底消灭。它是被成本压住的：掌握多数算力仍可短暂双花，只是要重做大量工作量、支付机会成本，还会损害自己持有资产的价值与矿池声誉。正确说法是“双花代价高昂”，而不是“双花不可能”。另一类误解是以为零确认交易安全：商家接受零确认，等于自己承担了双花与被替换的风险。"
      - h: "边界与代价"
        p: "防护效果与等待时间挂钩：小额支付可以少等确认，大额结算要多等几个块，甚至以小时计。代价是结算不是瞬时完成；链越拥堵、费率越高，反双花的体验成本越高。这也解释了为什么交易所对大额充值设置确认数要求：不同金额对应不同等待时间，本质上是把概率风险量化成可执行的规则。"
    quiz:
      - q: "为什么数字现金天然更容易双花？"
        a: "因为数字文件可以无损复制，同一份余额能被同时发给多人。纸币有物理唯一性，所以数字现金必须靠全网排序与确认来解决重复花费，而不能只靠本地检查。"
      - q: "双花被彻底消灭了吗？"
        a: "没有，只是被成本压住。掌握多数算力仍可短暂双花，但需重做大量工作量、承担机会成本与声誉损失，收益往往抵不过代价。"
    sources:
      - https://bitcoin.org/bitcoin.pdf

  - id: c103
    type: concept
    stage: 1
    order: 3
    title: "哈希"
    en: "Hash"
    minutes: 11
    tags: [crypto, hash]
    sections:
      - h: "一句话"
        p: "哈希（hash）是把任意长度输入压成固定长度指纹的函数，例如 SHA-256 的输出恒为 32 字节，也就是 64 个十六进制字符。同一个输入永远得到同一个输出；输入哪怕只差一个比特，输出也会面目全非。"
      - h: "为什么重要"
        p: "它是区块链的指纹机：区块靠前块哈希串成链，交易靠 txid 定位，Merkle 树靠哈希逐层汇总，地址又是在哈希之上编码出来的。改动任何一个字节，指纹就会全变，防篡改因此可以被本地化验证，而不必信任某个机构说“没改过”。没有这个性质，链式结构就只是一串可随意覆盖的指针。"
      - h: "核心机制"
        p: "密码学哈希有三个要求：单向（给定输出无法反推输入）、抗碰撞（找不到两个不同输入同一输出）、雪崩效应（输入改一位，输出约一半比特翻转）。SHA-256 对任意输入都做固定轮数的压缩，输出永远 256 位，所以它能当短指纹用；同样的输入在任何设备、任何时间算出的结果都相同。这三个性质合起来，才让“用短值代表长内容”既省带宽又不可伪造。"
      - h: "例子"
        p: "hello 与 Hello 只差一个大写，SHA-256 结果完全不同。比特币交易改一个 sat 的金额，txid 就变，包含它的 Merkle 根、区块头、后续所有块都得推翻重算，这就是链式哈希的锁定效果。软件下载页给出的哈希值也是同一原理：你本地算一遍，对不上就说明文件被动过，不必信任下载站。"
      - h: "常见误解"
        p: "把哈希当成加密、以为能解密。哈希是单向摘要，没有密钥也不能还原原文；它能验证内容一致，却不能保密内容。密码存储用加盐哈希防彩虹表，是另一种工程用法，与“加密后能解开”是两回事。还有人以为“哈希值相同就等于内容相同”，严格说这是抗碰撞性成立时的概率结论，而不是逻辑恒等。"
      - h: "边界与代价"
        p: "哈希只保证“内容没变”，不保证内容真实或正确；抗碰撞依赖算法未被攻破，MD5、SHA-1 已被实际构造出碰撞，所以新系统用 SHA-256 或 Keccak。算力增长还会降低暴力枚举的成本，长密码与诚实的随机源同样重要。哈希也不能替代签名：它能证明一致性，不能证明“谁授权了这次修改”。"
    quiz:
      - q: "哈希和加密最大的区别是什么？"
        a: "哈希是单向摘要，从结果无法还原输入，也不需要密钥；加密是可逆的，需要密钥才能解密。区块链用哈希做防篡改指纹，而不是用来保密内容。"
      - q: "为什么改了交易金额 txid 就变了？"
        a: "因为 txid 是交易内容的哈希，内容变则哈希必变。它一旦写进区块，Merkle 根与后续区块头都会失效，所以篡改要重做工作量。"
      - q: "MD5 为什么不能再用？"
        a: "MD5 已被实际构造出碰撞，两段不同内容可以得到同一摘要，抗碰撞性失效。选哈希算法要看它是否仍被公认安全，而不是看它算得快不快。"
    sources:
      - https://github.com/bitcoinbook/bitcoinbook

  - id: c104
    type: concept
    stage: 1
    order: 4
    title: "Merkle 树"
    en: "Merkle tree"
    minutes: 10
    tags: [crypto, merkle]
    sections:
      - h: "一句话"
        p: "Merkle 树把一组交易哈希两两合并、逐层向上，最终得到一个 Merkle 根（Merkle root），写进区块头，用来代表整个交易集合。根只有 32 字节，却把成千上万笔交易压缩成一个可比较的值；改动任何一笔，根都会变。"
      - h: "为什么重要"
        p: "它让证明某笔交易在区块里只需约 log2(n) 个哈希。几千笔交易的区块，验证路径也只有十几层；轻客户端因此不必下载整块数据，就能把一笔交易与 80 字节的区块头对上，移动端钱包才可能轻量运行。没有它，轻客户端只剩两个选择：全量下载，或完全信任第三方。"
      - h: "核心机制"
        p: "叶子节点是交易的 txid，父节点是左右子哈希拼接后再哈希，逐层向上直到只剩一个根。例如 t1、t2 先哈希成 h12，t3、t4 合成 h34，再由 h12 与 h34 合成根；若某层为奇数，就把最后一个节点与自身配对。验证时给出从叶子到根的兄弟哈希序列，逐层重算，最后与区块头里的根比对；一致就说明该交易确实属于这个区块。验证者不需要知道其它交易的内容，只需信任根；这正是“简洁证明”的含义：证明大小与集合规模对数相关。"
      - h: "例子"
        p: "区块里有 4,096 笔交易，log2(4096)=12，所以只需 12 个 32 字节兄弟哈希，约 384 字节就能证明某笔交易被收录。若全量下载 4,096 笔交易，通常是兆字节量级，差距是数量级的，这正是 SPV 钱包能工作的原因。反过来，只有一个交易的区块，根本身就等于那笔交易的 txid。"
      - h: "常见误解"
        p: "以为有 Merkle 路径就能证明一切。路径只能证明“某笔交易存在”，不能证明别的交易不存在，也不能证明矿工没给你一条假链；轻客户端还要靠最长链假设与检查点，否则路径正确也只说明它在一棵错误的树上自洽。它也不证明交易的金额或时间合法，那要靠输入输出规则另行验证。"
      - h: "边界与代价"
        p: "树的结构依赖交易顺序，顺序不同根就不同，所以根只对“这一版排序”有效。证明还要求你能拿到正确的区块头，否则路径再对也只是在错误前提上自证。轻客户端用少量信任换体积，这正是它的边界：省下的带宽，换成了对最长链假设的依赖。另外，根也常被当作“承诺”使用：它本身不携带语义，必须配合区块头与验证规则才有意义。"
    quiz:
      - q: "Merkle 根变了说明什么？"
        a: "说明区块里的交易集合变了。根由全部交易哈希逐层合并得到，替换或改动任何一笔交易，沿途父节点与最终根都会变，因此它把区块头和交易绑在一起。"
      - q: "区块有几千笔交易，证明一笔要多少哈希？"
        a: "约 log2(n) 个。4,096 笔交易约需 12 个兄弟哈希、几百字节；全量下载则是兆字节量级，这就是轻客户端能省下带宽的原因。"
    sources:
      - https://bitcoin.org/bitcoin.pdf

  - id: c105
    type: concept
    stage: 1
    order: 5
    title: "公私钥"
    en: "Public and private key"
    minutes: 11
    tags: [crypto, keys]
    sections:
      - h: "一句话"
        p: "公钥（public key）与私钥（private key）成对出现：私钥是一个 256 位随机数，公钥由私钥经椭圆曲线乘法（如比特币与以太坊使用的 secp256k1）导出。公钥可以公开，私钥必须保密；2^256 约等于 10 的 77 次方，随机碰撞可以忽略。"
      - h: "为什么重要"
        p: "在链上，拥有资产就等于能对交易签名，而签名必须用私钥。地址、助记词、签名、多签都是从这对密钥派生出来的；理解它，才能理解为什么链上没有“忘记密码”和“改密码”，也才能判断“客服帮你找回资产”一定是骗局。把密钥理解为“账户的唯一凭据”，就会明白备份比记忆更可靠。"
      - h: "核心机制"
        p: "secp256k1 定义在有限域上，私钥 d 与固定基点 G 相乘得到公钥 P=dG。正向乘法一次就够，反向求 d 是离散对数问题，在现有算力下不可行。私钥空间约 2^256，随机碰撞概率可以忽略；所以安全性几乎完全取决于随机数质量与保管方式，而不是算法复杂不复杂。签名则是另一条运算：用私钥对摘要签出证明，任何人都能用公钥做一次运算验证，却无法伪造。"
      - h: "例子"
        p: "同一个私钥在比特币与以太坊上会导出不同格式的地址（不同哈希与编码），但控制权是同一把。硬件钱包在签名时才使用私钥，联网设备只拿到公钥与签名结果；这就是“私钥不出设备”能成立的技术前提。也正因为派生是确定性的，把同一串助记词导入另一个兼容钱包，看到的地址完全一致。所以判断两个钱包是否属于同一账户，比较的是地址与派生路径，而不是 App 名称或图标。"
      - h: "常见误解"
        p: "以为能从公钥反推私钥，或以为“密码”能重置。链上没有找回渠道；私钥泄露等于资产泄露，因为拿到私钥的人可以构造出任何人都无法拒绝的有效签名，而且交易一旦确认就不可撤销。还有一种误解是把地址当公钥：地址是公钥再经过哈希与编码的结果，从地址反推公钥同样不可行。"
      - h: "边界与代价"
        p: "私钥强度取决于随机源：用弱随机数生成会直接缩小搜索空间。保管成本也要计入：纸质备份怕火灾与水，单点备份怕丢失，所以要分散与冗余；而分散又带来“重组是否完整”的新问题，需要一次真实恢复演练才能验证。密钥模型还要求你接受一个前提——没有第三方兜底，这正是它自由与风险的同源。这也是为什么安全建议强调“先小额测试、再大额转入”：一次错误签名无法撤销，只能事后止损。"
    quiz:
      - q: "为什么私钥泄露等于资产丢失？"
        a: "因为签名只认私钥，拿到私钥的人可以构造出任何人都无法拒绝的有效签名。链上没有客服、没有回滚，也没有冻结账户的兜底手段。"
      - q: "公钥和私钥是什么关系？"
        a: "公钥由私钥经椭圆曲线乘法导出，单向不可逆：算公钥容易，反推私钥是离散对数难题。所以公钥可以公开，私钥必须保密。"
    sources:
      - https://github.com/bitcoinbook/bitcoinbook

  - id: c106
    type: concept
    stage: 1
    order: 6
    title: "数字签名"
    en: "Digital signature"
    minutes: 11
    tags: [crypto, signature]
    sections:
      - h: "一句话"
        p: "数字签名（digital signature）用私钥对交易内容生成一段证明，任何人用对应公钥即可验证，验证者全程不需要知道私钥。它把“我同意”变成一个可公开检查的数学对象，而不是一句口头承诺。"
      - h: "为什么重要"
        p: "它把身份变成数学：任何人都能验证这笔交易确实由该私钥持有者授权，不必先向机构证明你是谁。多签、链上治理、账户抽象都建立在这个原语之上。没有它，链上就只能靠账户密码或中心化白名单来确认授权，而这正是区块链要摆脱的东西。"
      - h: "核心机制"
        p: "签名通常对交易摘要做运算：先按规则序列化交易并哈希出 sighash，再用私钥对摘要签名；验证者重算摘要并用公钥校验。比特币用 ECDSA，2021 年 Taproot 激活后又支持 Schnorr 签名；以太坊用 secp256k1 的 ECDSA，且签名可以从交易中反推出公钥，所以以太坊交易不显式携带公钥。签名的不可伪造性来自私钥的保密性与离散对数难题。一笔交易可以有多个签名：多签脚本要求多个签名同时有效，任一缺失都会导致验证失败，这也是链上“共同授权”的实现方式。"
      - h: "例子"
        p: "ECDSA 签名由 (r,s) 两个 32 字节数组成。同一个 r 若出现两次而消息不同，就可能反推出私钥，所以签名时绝对不能重复使用随机数 k，这是历史上多次真实事故的根源。另一个例子是 low-s 规则：s 取 n-s 时旧节点可能都接受，导致同一交易出现两个合法签名、txid 可变，后续规则因此要求 low-s。因此签名界面上的“确认”按钮，等价于在合同上签字，区别只是它不会等你把全部内容读完。"
      - h: "常见误解"
        p: "以为签名等于把交易加密。比特币交易本身是明文公开的，签名只证明授权，不隐藏金额和地址；想要隐私需要额外手段，如 CoinJoin 或隐私链。还有人以为“钱包显示验证通过”就安全，其实签名只回答“是否有人授权”，不回答“这笔交易是否值得签”。"
      - h: "边界与代价"
        p: "签名证明“有人用这把私钥授权”，不证明对方是谁、也不证明内容合理。钓鱼网站正是让你对恶意交易签名，而签名一旦广播就不可撤回；所以核对签名请求的具体内容（收款地址、金额、合约调用）比相信“验证通过”更重要。签名也无法表达“我后悔了”，不可撤销是它的成本。"
    quiz:
      - q: "验证者需要知道你的私钥才能确认签名吗？"
        a: "不需要。签名用私钥生成、用公钥或地址验证，验证只是做一次数学检查，既看不到也不需要私钥，这正是无许可验证的基础。"
      - q: "为什么签名时绝不能重复使用随机数？"
        a: "因为 ECDSA 的随机数一旦在同一私钥下重复，攻击者比较两个签名就能解出私钥。这不是理论风险，历史上已有真实事故发生。"
    sources:
      - https://bitcoin.org/bitcoin.pdf

  - id: c107
    type: concept
    stage: 1
    order: 7
    title: "地址"
    en: "Address"
    minutes: 10
    tags: [wallet, address]
    sections:
      - h: "一句话"
        p: "地址（address）是公钥经哈希与编码后得到的收款字符串：比特币形如 1…、3…、bc1q…、bc1p…，以太坊是 0x 开头的 40 位十六进制。地址不是公钥本身，而是公钥的多层变换结果。"
      - h: "为什么重要"
        p: "地址就是你在链上的账号加收款码。它的编码里带校验和，抄错一位通常会被钱包直接判为无效，而不是悄悄打给另一个人；这也是为什么链上转账要求你核对完整字符串。理解地址的构造，还能解释为什么不同格式的地址手续费不同、为什么地址不能跨链乱用。"
      - h: "核心机制"
        p: "比特币 P2PKH：对公钥做 SHA-256 再 RIPEMD-160 得到 20 字节，加版本字节后用双 SHA-256 取前 4 字节作校验，Base58Check 编码，结果通常 25 字节、34 个字符。SegWit 用 bech32 或 bech32m，把数据按 5 位分组并附校验码，能定位错误位置。以太坊地址是公钥 Keccak-256 结果的后 20 字节，大小写混合本身承载 EIP-55 校验。"
      - h: "例子"
        p: "Base58Check 的 4 字节校验命中概率约 1/2^32，随机抄错几乎必被发现；bech32 校验和还能指出错误在哪个字符，钱包可以提示“疑似笔误”。但它挡不住攻击者故意构造首尾相似的地址，那需要你自己核对完整字符串或从地址簿取址。以太坊全小写或全大写地址则不携带校验信息。"
      - h: "常见误解"
        p: "以为地址等于公钥。地址是公钥的多层哈希与编码，反向推不出公钥。也以为同一个地址能跨链通用：不同链的地址格式与签名曲线不同，把资产转到另一条链的地址通常无法找回。还有人以为地址换了就等于账户换了，其实 HD 钱包只是不断派生新地址，控制权仍是同一串种子。还有一个细节：以太坊交易里合约调用的参数靠 calldata 编码，地址错一位通常不会报错，只会留下无法找回的资金。"
      - h: "边界与代价"
        p: "地址复用会暴露交易关联：所有收支被串成一张图，隐私与安全都受损，所以 HD 钱包每笔收款换新地址。代价是备份更依赖种子，而不是记住单个地址，也要求收款方每次都重新给地址。地址校验只能防转录错误，防不了收款方本身就给了错的地址，最终核对责任仍在付款人。"
    quiz:
      - q: "为什么地址里要带校验和？"
        a: "为了让抄错、漏字符的地址在解码阶段就被判为无效。校验和能挡住随机的输入错误，但挡不住攻击者故意构造的相似地址。"
      - q: "比特币地址和公钥是同一个东西吗？"
        a: "不是。地址是公钥经 SHA-256、RIPEMD-160 等哈希与编码后的结果，反向推不出公钥；以太坊地址则是公钥 Keccak-256 哈希的后 20 字节。"
    sources:
      - https://github.com/bitcoinbook/bitcoinbook

  - id: c108
    type: concept
    stage: 1
    order: 8
    title: "助记词"
    en: "Mnemonic"
    minutes: 11
    tags: [wallet, backup]
    sections:
      - h: "一句话"
        p: "助记词（mnemonic）用 12 到 24 个 BIP-39 词表里的单词编码随机种子：12 个词对应 128 位熵加 4 位校验，24 个词对应 256 位熵加 8 位校验。词表固定 2,048 个词，每个词承载 11 位信息。词表固定为 2048 个词，所以不同语言的助记词本质上是同一串熵的不同写法，恢复时要注意词表语言是否一致。"
      - h: "为什么重要"
        p: "它是人能抄写、能恢复的根密钥形态：同一串词在任何兼容钱包里都能恢复出同一批地址，所以备份助记词等于备份整个钱包。这也是钓鱼最常盯上的目标：拿到词就等于拿到全部资产，没有任何机构能帮你拦下这笔签名。备份的本质是保存“熵”，而不是保存某个 App 或某台设备。"
      - h: "核心机制"
        p: "BIP-39 从熵生成助记词，再经 PBKDF2-HMAC-SHA512 派生出 64 字节种子（可带可选 passphrase），种子交给 BIP-32 生成主密钥，再按派生路径生成地址树。校验位的作用是让抄错或乱序大概率被直接拒绝，而不是静默生成另一个钱包。因此助记词不是“密码”，它本身就能重建全部私钥。passphrase 是可选的额外因子，它不写在助记词里，因此忘掉它等于资产丢失；但它也能让同一串词派生出“隐藏钱包”，在胁迫场景下提供一层否认空间。"
      - h: "例子"
        p: "把 12 个词抄错一个，校验大概率失败，钱包直接提示无效；若恰好通过校验，恢复出的会是另一个从未用过的钱包，地址完全不同，看起来像“资产丢了”。这就是为什么必须做一次真实恢复演练：删掉钱包再用备份恢复，核对地址是否一致。"
      - h: "常见误解"
        p: "把它当密码，以为可以随便改。助记词是根种子而不是密码，改一个词就得到完全不同的钱包；也不要把 passphrase 与助记词写在同一处，否则等于没有第二因子。还有人以为“钱包 App 里能看到余额就说明备份没问题”，实际那只证明当前设备还能用，不证明备份可用。"
      - h: "边界与代价"
        p: "助记词一旦泄露无法撤回，只能立刻换新钱包并转移资产。备份要考虑火灾、水浸、丢失与继承：多份异地纸质或金属备份能抗物理损坏，但每一份都增加被发现的概率，所以分散与保密需要平衡。词库也依赖标准：非 BIP-39 的备份方案不能互相恢复。"
    quiz:
      - q: "为什么助记词不能拍照存到云端？"
        a: "因为助记词就是资产控制权，云相册、聊天记录、剪贴板都可能被同步或被入侵。一旦泄露就无法撤回，只能立刻换一个全新钱包并转移资产。"
      - q: "助记词末尾的校验位有什么作用？"
        a: "用来让抄错或词序错误大概率在恢复时被直接判无效，而不是悄悄生成另一个钱包。它防转录错误，不防泄露。"
    sources:
      - https://github.com/bitcoinbook/bitcoinbook

  - id: c109
    type: concept
    stage: 1
    order: 9
    title: "HD 钱包"
    en: "Hierarchical deterministic wallet"
    minutes: 10
    tags: [wallet, bip32]
    sections:
      - h: "一句话"
        p: "HD 钱包（hierarchical deterministic wallet，BIP-32）从一个种子确定性地派生出一整棵密钥树，同一种子永远得到同一批地址。所谓“分层”是父子结构，“确定性”是同样输入必得同样输出。"
      - h: "为什么重要"
        p: "一个助记词就能管理无数地址，每笔收款都可以换新地址；还能只导出公钥做观察钱包，在不接触私钥的情况下查余额、生成收款地址。交易所的充值地址体系、硬件钱包的多账户、以及“冷热分离”的日常做法，基础都是它。"
      - h: "核心机制"
        p: "BIP-32 用 HMAC-SHA512 从父密钥与链码派生子密钥，分 hardened 与 normal 两种派生：hardened 需要父私钥，normal 只需父公钥。BIP-44 约定路径 m/44'/0'/0'/0/0（用途/币种/账户/外部链/序号），钱包按路径逐个扫描地址来“发现”余额。normal 派生让 xpub 可以生成子公钥，这正是观察钱包能工作的原因。路径里的单引号表示 hardened 派生，能阻止由父公钥推导子私钥，也让 xpub 覆盖不到 hardened 分支。"
      - h: "例子"
        p: "把 xpub 交给观察钱包，它能派生出 m/44'/0'/0'/0/* 的全部收款地址并监控余额，但无法签名；冷钱包只保存种子，热端只保存 xpub，日常收付款流程因此不必每次拿出冷设备。反过来，只要拿到 xpub 加上任一子私钥，攻击者就能推导出同一链上其余子私钥。"
      - h: "常见误解"
        p: "以为导出 xpub 没有风险。xpub 能派生出所有收款地址，泄露会暴露你的全部交易关联；再叠加任一子私钥泄露，还可能牵连同一链上的更多地址。也以为换了钱包 App 地址就会变：只要种子与派生路径一致，地址就一致，变的只是界面。"
      - h: "边界与代价"
        p: "派生路径不是全局标准，不同钱包默认路径可能不同，用错路径恢复会得到“空的旧钱包”，看起来像资产丢失。备份时必须同时记住路径与 passphrase，否则种子正确也可能找不回资产。此外扫描地址需要逐条查询，地址很多时首次同步会明显变慢。所以“备份助记词”之外，最好也记下路径与账户结构，写在离线介质上，而不是只记在脑子里。"
    quiz:
      - q: "HD 钱包的确定性指什么？"
        a: "同一助记词或种子按同一路径永远派生出相同的子密钥与地址。因此备份只需保存一次种子，恢复后旧地址仍能使用，也可以核对地址来验证恢复正确。"
      - q: "导出 xpub 有什么风险？"
        a: "xpub 能派生出该链全部收款地址，泄露会暴露全部交易关联；再叠加任一子私钥泄露，攻击者还可能推出同链其他子私钥。它不能签名，但足以损害隐私。"
    sources:
      - https://github.com/bitcoinbook/bitcoinbook

  - id: c110
    type: concept
    stage: 1
    order: 10
    title: "多签"
    en: "Multisig"
    minutes: 10
    tags: [wallet, multisig]
    sections:
      - h: "一句话"
        p: "多签（multisig）要求 n 个私钥中的 m 个共同签名才能动用资金，常见配置是 2-of-3：丢一把不影响，丢两把才失控。阈值写在链上规则里，而不是靠某个人守规矩。阈值 m 与总数 n 的选择，直接决定安全与可用性的平衡点。"
      - h: "为什么重要"
        p: "它把单点故障变成阈值问题：私钥分给不同人、不同设备、不同地点，被盗或丢失都需要多个条件同时出问题才会发生。托管机构、DAO 金库、家庭共同账户与项目国库都用它；对企业来说，它还能把“一个人说了算”改成可审计的集体授权。"
      - h: "核心机制"
        p: "比特币上多签写在锁定脚本里（如 P2SH 多签或 Taproot 的阈值签名策略），链上可验证；以太坊上多签是智能合约，例如 Safe 合约记录所有者列表与阈值，达到阈值的确认才能执行。无论哪种，共同点是：验证者只需检查阈值条件是否满足，不需要知道签名者之间如何沟通。多签地址本身没有私钥：它是一段规则，只有满足阈值的签名集合才能让它花钱，规则之外没有“管理员后门”。"
      - h: "例子"
        p: "2-of-3：A 在办公室、B 用硬件钱包、C 放在异地保险柜。A 的设备被入侵，攻击者只有一票，动不了钱；A 的设备丢失，B 与 C 仍能转移资金并重建一套新的多签。这也是为什么丢了第一把之后必须尽快轮换，而不是继续用原配置。反过来，如果 A 与 B 同时被同一条钓鱼链拿下，攻击者就凑够两票；所以多签还要求签名者的操作环境互相独立。"
      - h: "常见误解"
        p: "把多签和 MPC 混为一谈。多签是链上规则，脚本或合约直接写明阈值，可以公开验证；MPC 在链下分片签名，链上只看到普通签名，验证者看不出这是集体决策。另一种误解是“用了多签就安全”：若三把钥匙由同一台电脑派生、或备份放在同一处，分散只是形式。还有人以为多签能防内部人员作恶，实际上 m-of-n 只防单点：若作恶者能凑够 m 票，规则本身拦不住。"
      - h: "边界与代价"
        p: "多签把复杂度前移：地址更长、手续费更高、每次操作要协调多人，还容易出现“三把钥匙由同一台电脑派生”的伪分散。阈值配置本身就是安全决策，2-of-2 丢一把就永久锁死，3-of-5 更稳但协调成本更高。合约多签还依赖合约代码没有漏洞，这一层风险不能忽略。"
    quiz:
      - q: "2-of-3 多签丢一个私钥会怎样？"
        a: "资金仍能动用，剩余两把可以凑够阈值；但容错已经用完，应尽快用剩余两把重建一套新多签，否则再丢一把就永久锁死。"
      - q: "多签和 MPC 的区别是什么？"
        a: "多签是链上规则，链上能验证阈值条件；MPC 在链下分片签名，链上只看到普通签名，验证者无法区分。两者的信任与故障模型不同。"
    sources:
      - https://github.com/bitcoinbook/bitcoinbook

  - id: c111
    type: concept
    stage: 1
    order: 11
    title: "UTXO"
    en: "Unspent transaction output"
    minutes: 11
    tags: [bitcoin, utxo]
    sections:
      - h: "一句话"
        p: "UTXO 是未花费交易输出（unspent transaction output）：比特币没有余额字段，只有一堆属于你的钞票，花的时候整张用掉再找零。钱包里显示的余额，是把属于你的 UTXO 加总后的视图，不是链上存在的某个数。"
      - h: "为什么重要"
        p: "它决定了交易结构、并行验证方式和手续费算法（按字节或重量收费，不按金额）。不理解 UTXO，就看不懂为什么一笔转账会有多个输入、为什么找零地址每次不同、为什么小额 UTXO 太多会让交易变贵。链上只存“未花费输出集合”，其余都是推导出来的。"
      - h: "核心机制"
        p: "交易由输入和输出组成：输入引用已有 UTXO 并附解锁脚本，输出生成新的 UTXO 并写明锁定条件。验证时检查每个输入引用的 UTXO 是否存在、是否已被花费、签名是否满足锁定脚本。输入总额必须不小于输出总额，差额就是手续费。节点维护的是 UTXO 集合，花费即从集合移除旧输出、加入新输出，集合不会出现“余额为负”。"
      - h: "例子"
        p: "你有一个 0.3 BTC 的 UTXO，要付 0.1 BTC：交易写输入 0.3，输出 0.1 给对方，输出约 0.1999 回自己，剩下 0.0001 给矿工。链上看不到“余额被扣”，只看到旧输出作废、新输出产生。如果有三个 0.01 BTC 的 UTXO 要付 0.025 BTC，钱包会把三个都用上，交易体积随输入数增加，手续费也随之上升。"
      - h: "常见误解"
        p: "以为转账是从余额里扣数字。实际是旧 UTXO 作废、产生新输出；找零是一次真实转账，脚本写错或漏掉找零就等于把这部分当手续费送给矿工，且无法撤回。还有人以为输入金额可以小于支付金额，“差额从余额补”——不存在余额，只能再加输入。"
      - h: "边界与代价"
        p: "UTXO 数量影响成本：小额输入越多，合并时交易越大越贵，还可能出现低于尘埃阈值的输出（P2PKH 常见 546 sat）根本无法再花。UTXO 模型对并行验证友好、便于审计，但对智能合约的状态表达不友好；这正是比特币与以太坊走向不同架构的根源之一。因此钱包会定期做“整合”：在费率低时把多个小额 UTXO 合成一个，避免未来高费率时被迫高价花小钱。"
    quiz:
      - q: "为什么比特币钱包的余额没有对应字段？"
        a: "因为链上只记录 UTXO 集合，钱包按地址或脚本筛出属于你的输出再求和。余额是钱包计算出的视图，不是链上存储的状态。"
      - q: "为什么一笔交易的输入金额常大于支付金额？"
        a: "输入是整笔 UTXO，不能只花一部分；超出支付金额的部分必须以找零输出退回自己，最后剩下的差额才是手续费，且找零也是链上一笔真实输出。"
    sources:
      - https://github.com/bitcoinbook/bitcoinbook

  - id: c112
    type: concept
    stage: 1
    order: 12
    title: "账户模型"
    en: "Account model"
    minutes: 10
    tags: [ethereum, account]
    sections:
      - h: "一句话"
        p: "账户模型（account model）在链上直接保存每个地址的状态：余额、nonce、代码与存储。以太坊采用这一套，交易直接改写余额，而不是像 UTXO 那样作废旧输出、生成新输出。“状态”是账户模型的核心：每个区块不是记录一笔笔转账，而是声明全局状态从上一版变成了哪一版。"
      - h: "为什么重要"
        p: "它让余额成为一等公民，写智能合约更自然；代价是同一账户的交易必须按 nonce 顺序执行，很难像 UTXO 那样天然并行处理。理解它才能读懂 nonce、gas、重放保护与“卡交易”现象，也才能判断为什么以太坊需要状态树与状态租金之类的长期讨论。"
      - h: "核心机制"
        p: "以太坊有两种账户：外部账户（EOA，由私钥控制，有 nonce 与余额）与合约账户（有代码与存储）。交易带 nonce，节点要求它等于账户当前 nonce，执行成功后加一；同一 nonce 的重复交易会被拒绝，这就是重放保护。所有账户状态由全局状态树维护，每个区块记录状态根，任何节点都能校验状态转换是否正确。"
      - h: "例子"
        p: "你连续发两笔交易，第一笔卡在低 gas，第二笔即使 gas 更高也无法先执行，因为 nonce 必须按序。想加速只能用同一 nonce 重发更高小费，替换掉原来那笔。另一个例子是重放攻击：若没有 nonce，别人可以把你已广播的签名交易在链上重复提交多次。这也是为什么钱包里会出现“待处理”交易：nonce 被占用后，后面所有交易都要排队。"
      - h: "常见误解"
        p: "以为账户模型更先进所以 UTXO 落后。两者是取舍：UTXO 易并行、便于审计；账户模型状态直观、合约表达力强，但要额外处理重放、状态膨胀与 nonce 管理。也有人以为“地址余额”是链上直接读取的字段——它其实来自状态树，轻客户端要靠证明才能确认。"
      - h: "边界与代价"
        p: "全局状态让每个全节点都要保存最新状态，状态越大门槛越高；这也是状态租金、无状态客户端等提案的动力。并行执行是当前主要改进方向，但会让 nonce 与状态访问的语义更复杂。账户模型还天然依赖 gas 计量，因为任何循环都必须有价格上限。状态根的存在让轻客户端可以用证明查询单个账户，但证明成本与状态规模相关，节点越大越难保持轻量。"
    quiz:
      - q: "以太坊账户的 nonce 有什么作用？"
        a: "防止重放：每笔交易带一个递增序号，同一笔签名交易被重复广播时序号已用过就无法再执行。它也决定同一账户内交易的执行顺序。"
      - q: "为什么账户模型更难并行处理交易？"
        a: "因为同一账户的交易必须按 nonce 顺序执行，且都修改同一份状态。UTXO 模型下不同输入的交易互不重叠，更容易并行验证。"
    sources:
      - https://ethereum.org/en/developers/docs/accounts/

  - id: c113
    type: concept
    stage: 1
    order: 13
    title: "共识"
    en: "Consensus"
    minutes: 11
    tags: [consensus, basics]
    sections:
      - h: "一句话"
        p: "共识（consensus）指互不信任的节点在没有中心裁判的情况下，对哪本账有效、下一条记录是什么达成一致。它要解决的不是“算得快”，而是“在没有裁判时，按什么规则算数”。共识的产物是一条所有节点都能独立校验的历史，而不是一份投票记录。"
      - h: "为什么重要"
        p: "它要解决的是：当说真话没有直接收益时，如何让多数人继续配合。共识机制决定了攻击成本、最终性时间和参与门槛，也决定了这条链适合承载什么：同样的智能合约，放在不同共识的链上，安全假设完全不同。它也是链与链之间最不可直接比较的部分：同一套共识机制换到不同网络、不同算力或质押分布下，安全边际完全不同。"
      - h: "核心机制"
        p: "公链共识先防女巫攻击（sybil attack）：创建身份几乎零成本，所以投票权必须绑定稀缺资源——算力、质押资产或存储。然后定义分叉选择规则（如累计工作量最大、LMD-GHOST）与最终性规则，节点按同一套规则独立判断。共识把“谁说了算”拆成两个可验证的问题：哪条链有效，以及一笔交易何时算最终确定。值得强调的是，节点验证的是规则而不是人：只要规则被违反，无论出块者是谁、算力多大，区块都会被拒绝。"
      - h: "例子"
        p: "两个矿工同时出块，网络短暂分成两支；节点各自先收到其中一个，直到下一块出现，累计工作量更大的一支胜出，另一支成为孤块，其中的交易回到内存池等待重新打包。整个过程没有投票会议，也没有管理员决策，只有规则、延迟与概率。若两支链长期并存，还会出现同一笔 UTXO 在两条链上各花一次的情况，这需要重放保护来区分。"
      - h: "常见误解"
        p: "把共识当成投票选真相。简单多数投票会被女巫攻击刷票：造账号几乎零成本。因此投票权必须绑定稀缺资源，否则“多数”毫无意义。另一种误解是以为共识能保证内容正确：它只保证节点对同一份记录达成一致，不保证记录里的智能合约没有漏洞。"
      - h: "边界与代价"
        p: "共识只保证账本一致，不保证账本内容有意义，也不保证参与者诚实。最终性越强，通常确认越快但重组风险与信任假设也更复杂；安全、活性与去中心化三者很难同时最大化。当网络分区时，多数一侧可能继续出块，少数一侧则可能被迫回滚交易，这就是“最终性”在极端情况下的代价。另外，共识不解决“数据可用性”：如果没人保存区块数据，新节点无法完成同步，链的可验证性也会受损。"
    quiz:
      - q: "为什么一人一票不适合公链？"
        a: "因为创建身份几乎不花钱，攻击者可以伪造海量账号操纵投票。公链必须把投票权绑定稀缺资源，比如算力或质押的资产。"
      - q: "共识机制只解决“一致”，不解决什么？"
        a: "不保证账本内容正确，也不保证参与者诚实。智能合约漏洞、私钥被盗、平台挪用都属于共识之外的风险层。"
    sources:
      - https://ethereum.org/en/developers/docs/consensus-mechanisms/

  - id: c114
    type: concept
    stage: 1
    order: 14
    title: "工作量证明"
    en: "Proof of work"
    minutes: 12
    tags: [consensus, pow]
    sections:
      - h: "一句话"
        p: "工作量证明（proof of work，PoW）要求矿工不断试 nonce，让区块哈希小于难度目标；找到只能靠算力硬碰，验证只需一次计算。这种“难算易验”的不对称，是整个机制的价值来源。“难算”保证出块权不能靠身份获得，“易验”保证任何人都能独立审计。"
      - h: "为什么重要"
        p: "它把出块权变成可计价的成本：想改写历史，就得重做对应的全部工作量。攻击成本随全网算力上升，而且任何人都能独立验证，不需要许可。它也让“加入网络”没有门槛——不需要身份、不需要审批，只要有电和机器。它还让攻击有一个明确的价格标签：租算力的市场价格，大致就是短期内攻击一条链的成本下限。"
      - h: "核心机制"
        p: "矿工拼装 80 字节区块头，反复改 nonce 与 coinbase 里的 extranonce 计算双 SHA-256，直到结果小于目标值。难度每 2016 个块按实际出块时间调整一次，目标是平均 10 分钟一块；算力上升则难度上升，算力下降则难度下降。难度调整有上限，因此算力骤变时出块节奏会短暂偏离 10 分钟。难度调整有倍数上限，所以算力暴增或暴跌时，出块间隔会先明显偏离 10 分钟，再被逐步拉回。"
      - h: "例子"
        p: "难度目标越小越难，等价说法是要求哈希前导零更多。全网算力翻倍后，同样时间内找到合格哈希的次数翻倍，难度会在下一次调整时上调，把出块节奏拉回 10 分钟。矿工的实际收益还要减去电费、矿机折旧与矿池抽成，所以不是所有算力都会一直在线。注意这里说的是期望值：算力只决定概率，短时间内的实际出块数量仍会明显波动，这也是确认数要留余量的原因。"
      - h: "常见误解"
        p: "以为解题有技巧或能预测。哈希输出近似随机，只能穷举；也不存在“更聪明的算法”能跳过工作量，能改善的只有硬件效率与电费。另一种误解是以为矿工“投票决定规则”：矿工决定区块顺序，规则的合法性由节点与用户决定，两者不是一回事。也有人以为矿工越多越安全，实际要看算力是否分散在多个独立主体手里，而不是看设备总数。"
      - h: "边界与代价"
        p: "PoW 的代价是能源与硬件，且算力容易通过矿池集中；收益是规则简单、进入无许可、抗审查性较强。它不保证交易对手诚实，也不保证私钥安全。此外，PoW 的最终性是概率性的：确认数越多越难回滚，但理论上永远不是“绝对终局”。"
    quiz:
      - q: "PoW 为什么难算但易验？"
        a: "矿工要在巨大空间里碰运气找到合格哈希，只能反复穷举；验证者把给出的 nonce 代进去算一次哈希就能确认，所以成本极不对称。"
      - q: "难度调整的作用是什么？"
        a: "每 2016 个块按实际出块时间调整难度，把平均出块间隔拉回约 10 分钟。算力上升则难度上升，算力下降则难度下降，使出块节奏长期稳定。"
    sources:
      - https://bitcoin.org/bitcoin.pdf

  - id: c115
    type: concept
    stage: 1
    order: 15
    title: "权益证明"
    en: "Proof of stake"
    minutes: 11
    tags: [consensus, pos]
    sections:
      - h: "一句话"
        p: "权益证明（proof of stake，PoS）用质押资产代替算力：验证者按质押份额被选中出块和投票，作恶则可能被罚没（slashing）。出块权不再用电力购买，而是用可被没收的资产做抵押。"
      - h: "为什么重要"
        p: "它免去挖矿电耗，门槛从矿机变成资产；但安全边界也从外部算力成本变成质押资产价值加惩罚规则，资本更容易集中，验证者集合的分散度成为关键指标。以太坊 2022 年 9 月完成合并（The Merge）转为 PoS，是这一机制最大规模的生产实践。"
      - h: "核心机制"
        p: "以太坊要求验证者质押 32 ETH 才能激活，按 RANDAO 等随机机制分配提议与投票任务；每个 epoch 含 32 个 slot，约 6.4 分钟，做一轮检查点投票，两个 epoch 后检查点被最终确定。作恶被罚没并逐出，离线只被 inactivity leak 缓慢扣减。有效余额上限 32 ETH 的设计，是为了避免大户按比例放大投票权。被选中的概率与有效余额相关，而不是与机器性能相关，这让参与门槛从硬件转向资本。"
      - h: "例子"
        p: "同一份验证者密钥在两台机器上同时运行会双签，两台都会被罚没；而单纯断网只会缓慢掉余额。运维事故往往比黑客更常见，所以客户端都内置防双签保护，运行者必须确保同一密钥不会同时启动两次。这也是为什么云上迁移节点时要格外小心。另一个常见事故是提款凭证或助记词泄露导致验证者被接管，攻击者可以直接作恶或转移收益。"
      - h: "常见误解"
        p: "以为 PoS 是零成本共识。成本从电费转成机会成本与罚没风险；另外新节点需要一个可信检查点才能安全同步，这叫弱主观性（weak subjectivity）。也以为质押越多越安全是线性关系：质押高度集中会带来治理与审查风险，安全性和去中心化都要看分布。也有人以为“只要多数质押诚实，链就绝对安全”，实际上客户端漏洞与治理攻击属于另一层风险。"
      - h: "边界与代价"
        p: "PoS 的最终性更快、能耗更低，但惩罚依赖可证明的违规，长程攻击与质押集中需要额外机制防范；安全预算与代币价值绑定，代币价格下跌会削弱攻击成本假设。验证者还要处理密钥管理、客户端升级与提款排队，运维门槛并不低。此外，质押的流动性衍生品会让同一份资产被重复计入不同协议，系统性风险因此被放大。"
    quiz:
      - q: "PoS 的安全性靠什么支撑？"
        a: "靠质押资产的经济惩罚：作恶会被罚没并逐出，攻击者必须先买下大量质押资产并承担损失。同时还需要活跃的验证者集合与明确的分叉选择规则。"
      - q: "什么是弱主观性？"
        a: "指新加入的节点需要一个近期可信检查点才能安全同步，不能只靠创世块和纯客观规则判断当前链。这是 PoS 与 PoW 在信任假设上的关键差异。"
    sources:
      - https://ethereum.org/en/developers/docs/consensus-mechanisms/pos/

  - id: c116
    type: concept
    stage: 1
    order: 16
    title: "分叉"
    en: "Fork"
    minutes: 10
    tags: [consensus, fork]
    sections:
      - h: "一句话"
        p: "分叉（fork）指链上同时出现两条候选历史：两个矿工同时出块、或节点升级规则不一致，都会造成短暂甚至永久的分裂。前者是常态，后者是治理事件。分叉是分布式系统的常态，而不是异常事件。"
      - h: "为什么重要"
        p: "它区分了升级和分裂：软分叉向后兼容（如 SegWit、Taproot），硬分叉不兼容，处理不当会永久分成两条链、两套资产。理解分叉才能读懂升级与治理争议，也才能理解为什么“比特币分叉出另一个币”并不意味着你的钱包余额自动翻倍可用。对钱包开发者而言，分叉还意味着要处理重放：同一笔交易可能在两条链上都被视为有效。"
      - h: "核心机制"
        p: "自然分叉由出块时间差造成，节点按分叉选择规则收敛到一条，落选块成为孤块，其交易回到内存池。规则分叉则是节点对有效性判断不同：软分叉是新规则更严格、老节点仍接受；硬分叉是新规则放宽或改变，老节点会拒绝新块。分叉点之前的历史是共享的，之后各自延伸。软分叉的收紧方式通常是把原本“无定义”的字段赋上含义，所以老节点不会拒绝新块，只是不理解新字段。"
      - h: "例子"
        p: "2017 年 SegWit 通过软分叉激活（BIP-141/143 等），未升级节点仍能接受新块；同年 BCH 走硬分叉路线，与 BTC 在分叉点后成为两条独立链，各有一份历史与资产。持币人若要动用分叉后的资产，通常必须在两条链上分别签名，这也带来重放保护的设计问题。分叉之后两条链的难度与算力会各自调整，长期算力分布决定了哪条链成为主流。"
      - h: "常见误解"
        p: "以为出现分叉就是被攻击。自然分叉很常见，是共识的正常现象；只有规则争议下的硬分叉才会长期分家，而且两边都自称正统。另一种误解是以为分叉“免费送币”：分叉资产能否使用取决于钱包、交易所与私钥控制情况，且伴随重放与安全风险。也有人说“分叉等于链被复制”，严格说只有规则分裂才会复制资产，自然分叉不会。"
      - h: "边界与代价"
        p: "分叉的代价是用户必须自己判断哪条链有效、私钥在两条链上同时有效（可能被重放）、交易所与钱包要暂停充提。越大的规则变更，协调成本越高；一次有争议的硬分叉还会分裂社区、开发者与算力，这些成本远比代码改动更贵。有争议的硬分叉会带来重放攻击风险：若两条链规则差异不足以区分交易，一笔签名可能在两边都生效。"
    quiz:
      - q: "软分叉和硬分叉的关键区别？"
        a: "软分叉收紧规则且向后兼容，未升级节点仍认为新块有效；硬分叉改变了不兼容的规则，未升级节点会拒绝新块，可能永久分成两条链。"
      - q: "自然分叉和规则分叉有什么不同？"
        a: "自然分叉由出块时间差造成，节点按累计工作量或分叉选择规则很快收敛回一条链；规则分叉源于对有效性的判断不同，可能长期分裂成两条独立链。"
    sources:
      - https://bitcoin.org/bitcoin.pdf

  - id: c117
    type: concept
    stage: 1
    order: 17
    title: "区块"
    en: "Block"
    minutes: 10
    tags: [bitcoin, block]
    sections:
      - h: "一句话"
        p: "区块（block）是一批交易的容器：区块头存前块哈希、Merkle 根、时间戳、难度目标和 nonce，区块体存交易列表。头很小、体很大，这个分离是轻量验证的关键。"
      - h: "为什么重要"
        p: "80 字节的区块头让链非常轻便：验证链只需逐个校验头部的哈希与工作量，不必先把历史上所有交易都读一遍。轻客户端与 SPV 都建立在这个结构上。理解区块结构，才能读懂浏览器上的高度、时间戳、奖励与确认数分别代表什么。"
      - h: "核心机制"
        p: "区块头 6 个字段：版本 4 字节、前块哈希 32 字节、Merkle 根 32 字节、时间戳 4 字节、nBits 4 字节、nonce 4 字节，合计 80 字节。区块体是交易列表，第一笔是 coinbase（区块补贴加手续费），它没有真实输入，也是新币唯一产生的地方。工作量由头部哈希满足目标值来证明，改任何交易都会改 Merkle 根，头部哈希随之失效。区块的合法性还要求时间戳大于前 11 个块时间戳的中位数，且不能超前网络调整时间太多。"
      - h: "例子"
        p: "比特币用重量（weight）计量容量：基础部分每字节计 4 单位，见证数据每字节计 1 单位，单块上限 4,000,000 重量单位，等效基础数据约 1 MB，但含 SegWit 交易时实际字节数可超过 1 MB。区间上限 4,000,000 是上限而非目标，实际区块常因交易不足而更小。"
      - h: "常见误解"
        p: "以为区块能无限扩容所以应该放大。上限是去中心化与容量的取舍：块越大，全节点存储、带宽与验证成本越高，能运行节点的人越少。它不是疏忽，而是明确的设计选择。也有人以为区块头里存了交易列表——头里只有 Merkle 根，交易要靠区块体或证明另取。"
      - h: "边界与代价"
        p: "容量受限意味着区块空间是稀缺资源，拥堵时手续费上升；同时出块间隔约 10 分钟、概率最终性意味着结算要等确认。要更快更便宜，只能上二层或换链，并接受不同的信任假设。时间的“准确”也有限：时间戳只要求大于前块中位数、且在允许误差内，并不等于精确物理时间。这带来一个实践后果：出块时间只是近似值，不能当作精确的物理时钟使用。"
    quiz:
      - q: "区块头为什么必须存前一个区块的哈希？"
        a: "这形成单向链接：改动任何一个旧块都会改变它的哈希，使后续所有块失效，必须重做全部工作量。链式哈希因此提供了历史的防篡改骨架。"
      - q: "比特币的区块容量上限是多少？"
        a: "单块上限 4,000,000 重量单位；基础数据每字节 4 单位、见证数据每字节 1 单位，等效基础数据约 1 MB，含 SegWit 交易时实际字节数可超过 1 MB。"
    sources:
      - https://github.com/bitcoinbook/bitcoinbook

  - id: c118
    type: concept
    stage: 1
    order: 18
    title: "内存池"
    en: "Mempool"
    minutes: 10
    tags: [bitcoin, mempool]
    sections:
      - h: "一句话"
        p: "内存池（mempool）是节点本地保存的未确认交易池，矿工从里面按手续费率（sat/vB）挑选交易打包进下一个区块。它不是全网共享的数据库，而是每个节点各自维护的候选队列。它的“大小”不是数据量，而是节点愿意为待确认交易付出多少内存。"
      - h: "为什么重要"
        p: "它解释了待确认状态：交易广播后在池里排队，费率越高越容易被优先打包；拥堵时低费率交易可能停留数天，甚至被节点丢弃。也解释了为什么“已广播”不等于“已确认”，以及为什么钱包会建议你提高费率——它在和别人的交易竞价。"
      - h: "核心机制"
        p: "交易先经过节点校验（签名、输入存在、未双花、费率达标），再进入池并按费率排序；矿工打包时按单位体积收益最大化选取，同时受祖先依赖与区块重量上限约束。池满时低费率交易被逐出；每个节点的池策略、最小费率与大小都不同，所以同一笔交易在不同节点眼里可能“存在”或“不存在”。节点之间通过 inv 与 getdata 消息互相转发交易，未确认交易因此在网络里扩散，但传播不保证所有节点都收到。"
      - h: "例子"
        p: "一笔交易在拥堵时费率 2 sat/vB，可能几天不进块；用 RBF（BIP-125）提高小费重发同一输入的交易，就是与旧版本竞价。若交易长期零确认，部分商户会拒收，节点也可能把它从池中淘汰。反过来，费率估算器通常看最近几个区块的中位数费率，所以它给的是参考区间，不是保证。如果交易带有一串未确认的祖先交易，矿工只能按依赖顺序打包，这也是“交易家族”费率计算的复杂性来源。"
      - h: "常见误解"
        p: "以为全网只有一份内存池。每个节点的池子大小与转发策略都不同，看到的交易顺序也不同；只有进了区块并被确认才算落定，且确认后仍可能因重组回到池里。也有人以为“零确认即可安全收款”，那是把风险转给了收款方自己。还有人以为提高手续费一定能加速，实际要看交易是否触发了 RBF 规则、以及矿工是否愿意替换。"
      - h: "边界与代价"
        p: "内存池是本地视图，没有全局一致状态，所以“未确认余额”只能当参考。它也带来 MEV 与抢跑空间：能看见待打包交易的人可以插队获利，这是公开内存池的结构性代价。对隐私来说，交易在池中停留越久，被关联分析的机会也越多。钱包给出的“预计确认时间”来自历史数据，是参考值而不是承诺。"
    quiz:
      - q: "为什么手续费高的交易先被确认？"
        a: "区块空间有限，矿工按单位体积收益最大化的方式挑交易，费率 sat/vB 越高越优先。拥堵时出价低的只能等待，甚至被逐出内存池。"
      - q: "为什么不同节点看到的内存池不一样？"
        a: "因为内存池是各节点本地的池子，容量、最小费率与转发策略都不同，网络延迟也会造成差异。没有全网唯一的内存池状态。"
    sources:
      - https://mempool.space/

  - id: c119
    type: concept
    stage: 1
    order: 19
    title: "减半"
    en: "Halving"
    minutes: 10
    tags: [bitcoin, issuance]
    sections:
      - h: "一句话"
        p: "减半（halving）指比特币每 210,000 个区块把区块补贴减半一次：50 降到 25、12.5、6.25，再到 3.125 BTC。它按高度执行，不看日期，也不看价格。"
      - h: "为什么重要"
        p: "它是总量 2100 万枚上限的实现方式：新币发行按固定节奏递减，通胀率随时间趋近于零，矿工收入逐渐从补贴转向手续费。这个规则写在共识里，不靠央行决定，也不给任何机构留下增发的裁量空间——这正是它被讨论的原因。"
      - h: "核心机制"
        p: "中本聪把发行写成阶梯：每 210,000 块（约四年）补贴减半，直到补贴小于 1 sat 归零。已发生四次减半（2012、2016、2020、2024），补贴从 50 降到 3.125 BTC；总量实际是 20,999,999.9769 BTC，因整数舍入略少于 2100 万。产出以 coinbase 输出兑现，包含补贴加当期手续费。四次减半分别发生在高度 210,000、420,000、630,000、840,000，第五次将在高度 1,050,000。"
      - h: "例子"
        p: "减半后若手续费不足以覆盖电费与设备折旧，高成本矿工会关机，全网算力下降、难度随之下调，直到剩下能覆盖成本的矿工重新达到平衡；这个调整通常滞后数周，期间出块间隔可能偏离 10 分钟。约四年一次的节奏意味着补贴大约每 210,000 块腰斩一次，而不是平滑衰减。对矿工而言，减半是收入端的突降；对持币者而言，它不改变任何链上余额。"
      - h: "常见误解"
        p: "把减半当成价格保证。它只改变新增供给的速度，与价格没有必然联系；把机制叙事当成买卖依据，是最常见的一类错误，也超出了本课范围。另一种误解是以为减半会让旧币“变少”——已有余额与 UTXO 完全不受影响，变的只是新币发行速度。还有一种误解是把减半与“通缩”混为一谈：总量有限与短期通缩是两件事，后者取决于流通与需求。"
      - h: "边界与代价"
        p: "随着补贴趋近于零，安全性将越来越依赖手续费市场。如果链上活动长期低迷，安全预算可能不足，这是比特币治理中最真实的开放问题之一，而不是已解决的问题。减半的固定节奏也意味着它无法对需求冲击做任何调整，这是“规则可信”换来的刚性代价。从长期看，减半节奏是固定的，无法对安全预算的缺口做任何调整，这正是“规则可信”的刚性代价。"
    quiz:
      - q: "减半到底改变了什么？"
        a: "只改变新增发行的速度和矿工补贴，不改变已有余额，也不改变总量上限。它按固定区块高度执行，与市场情绪和价格无关。"
      - q: "比特币总量为什么略少于 2100 万？"
        a: "因为补贴以 sat 为单位向下取整，多次减半的舍入累积后总量为 20,999,999.9769 BTC 左右，而不是精确的 2100 万。"
    sources:
      - https://bitcoin.org/bitcoin.pdf

  - id: c120
    type: concept
    stage: 1
    order: 20
    title: "自托管与冷热钱包"
    en: "Self-custody, hot and cold wallet"
    minutes: 11
    tags: [wallet, security]
    sections:
      - h: "一句话"
        p: "自托管（self-custody）指私钥由你自己掌握；热钱包（hot wallet）联网方便日常使用，冷钱包（cold wallet）离线保存私钥、签名时才接触网络。区别不在产品形态，而在私钥是否暴露在联网环境中。"
      - h: "为什么重要"
        p: "托管把风险交给机构：被盗、破产、挪用都可能让资产消失（Mt.Gox 2014、FTX 2022）；自托管把风险换成自己操作出错。选择哪一种，本质是选择你更能承受哪类风险，而不是在“安全”与“不安全”之间选。"
      - h: "核心机制"
        p: "热钱包把私钥放在联网设备，签名方便但攻击面大；冷钱包让私钥离线，交易在设备内签名后广播，联网电脑只看到签名结果。硬件钱包还要求在设备屏幕上核对地址与金额，避免电脑被篡改显示。真正的隔离发生在签名环节：私钥从不进入通用操作系统。因此“冷”是一种签名环境，而不是设备永不上电；固件升级通常仍需联网，这就带来新的信任链环节。"
      - h: "例子"
        p: "把大额资产放在冷钱包、小额日常放热钱包是常见的分层做法；但分层只有在备份演练过、地址核对流程固定下来时才有意义，否则冷钱包也会因抄错助记词而永久丢失。另一个常见做法是把冷钱包的 xpub 导入观察钱包，日常查余额而不必拿出设备。分层的前提是你先量出自己日常要用多少、长期不动多少，否则容易把常用资产锁进太麻烦的流程，最后又退回热钱包。"
      - h: "常见误解"
        p: "以为冷钱包绝对安全。它防的是远程窃取，不防抄错助记词、买到被改装的设备，也不防你在钓鱼网站上盲目签名。安全是流程，不是产品。还有人以为“自托管=不用信任任何人”，其实仍要信任设备固件、随机数生成与自己的操作纪律。还有人把硬件钱包当护身符，以为买了就不会丢资产，忽略了备份与核对才是主要防线。"
      - h: "边界与代价"
        p: "自托管要自己承担备份、继承与应急：设备丢失、火灾、意外身故都可能让资产锁死。托管有法律追索与客服，但你要信任机构的内控与偿付能力；两者都不能把风险归零。对多数人来说，关键是写下流程并演练一次，而不是买更贵的设备。建议把备份位置、恢复步骤与应急联系人写成一页流程，并每年演练一次，让流程在你之外也能被执行。"
    quiz:
      - q: "自托管真正转移的是什么风险？"
        a: "把机构违约与挪用的风险，换成自己操作失误的风险。前者你无法控制，后者可以通过备份演练、核对地址来压低，但两者都不能归零。"
      - q: "冷钱包能防住钓鱼网站签名吗？"
        a: "不能。冷钱包只保证私钥离线，如果你在钓鱼页面上构造并确认了一笔恶意交易，设备会如实签名。防钓鱼靠核对屏幕上的地址与金额。"
    sources:
      - https://bitcoin.org/bitcoin.pdf

  # ============ 课程轨 theory / practice，order 1–20 ============

  - id: t101
    type: theory
    stage: 1
    order: 1
    title: "货币与记账简史"
    minutes: 12
    tags: [money, history]
    sections:
      - h: "核心机制"
        p: "货币演化的主线是记账成本：从以物易物，到金属称重，到可兑换凭证，再到纯信用法币，每一步都在降低“确认谁拥有多少”的成本。以物易物的难点是双重需求巧合——你有粮、我要鞋，但我不缺粮；金属货币把价值标准化，却仍要每次验成色、称重量，交易越频繁，摩擦越大。"
      - h: "关键细节"
        p: "账本形态也在变：泥板与神庙账房、复式记账（double-entry bookkeeping，十四世纪意大利）、银行清算网络、央行资产负债表。复式记账把每笔交易记成借贷两笔，使错误与挪用更容易被发现；可兑换凭证把“凭纸取金”的承诺写进制度；金本位解体后，主要货币进入纯信用法币阶段，发行约束从金属存量变成央行政策与法律授权。金本位时代的“纸币可兑换黄金”本质是一种期权：持有人可以选择兑现，也可以选择继续持有凭证。"
      - h: "例子"
        p: "一张银行转账：你的存款是银行的负债，行内转账只是两笔分录对冲；跨行还要过清算系统，所以到账和入账常常不是一回事。1971 年美元与黄金脱钩后，法币的价值基础从“可兑换的金属”变成“发行方的信用与税收能力”。这也解释了为什么通胀与货币政策会成为现代货币讨论的核心。"
      - h: "对比或演进"
        p: "把这些形态排成一列，会看到信任对象从“金属的物理属性”换成“发行方的信用与制度”。比特币把信任对象再换一次：换成公开规则、工作量证明与可独立验证的账本历史，代价是效率与用户体验。三者不是取代关系：黄金、法币与加密资产在当前体系里各有分工，也各有监管位置。值得注意的是，这三套体系至今并存：比特币并没有取代法币，而是提供了另一种记账与结算选择。"
      - h: "代价与边界"
        p: "中心记账效率高，但要求你信任记账方不篡改、不超发、不挪用；一旦信任破裂，技术上没有兜底，只能靠法律与存款保险等制度安排。公开账本把验证权分散，却把成本转给每个使用者，并默认暴露全部交易。选哪种，取决于场景需要的是效率、可审计性还是抗审查性。"
      - h: "常见误读"
        p: "以为货币史是“从实物到信用”的单向进步，或以为比特币是史无前例的发明。它更像把已经存在的记账原理（复式记账、公开审计、发行规则约束）换一种技术实现。另一种误读是把“法币”等同于“无背书”：现代法币背后是税收、法律与央行操作，不是空口承诺。"
    quiz:
      - q: "中心化账本最根本的代价是什么？"
        a: "你必须信任记账方：相信它不篡改记录、不超发、不挪用资产。效率与可扩展性来自这种信任集中，一旦信任破裂就没有技术兜底。"
      - q: "复式记账解决了什么问题？"
        a: "它把每笔交易记成借贷两笔、要求总额平衡，使单边篡改与记账错误更容易被发现，也让审计有了可核对的依据。它是记账史上降低信任成本的关键一步。"
    sources:
      - https://github.com/bitcoinbook/bitcoinbook

  - id: t102
    type: theory
    stage: 1
    order: 2
    title: "为什么区块链又慢又贵"
    minutes: 13
    tags: [consensus, tradeoff]
    sections:
      - h: "核心机制"
        p: "每个节点都要独立验证并保存同一份账本，出块还要在开放网络里达成共识；重复验证、广播延迟和区块间隔共同决定了它快不过中心化数据库。中心化系统只写一次、读很多次，链上则是写一次、全网校验一次。冗余不是浪费，而是“不信任任何单一节点”的价格。更准确地说，链上成本由三部分构成：区块空间竞价、验证冗余与等待时间。"
      - h: "关键细节"
        p: "比特币目标出块间隔约 10 分钟，单块重量上限 4,000,000 单位；以太坊 PoS 后 12 秒一个 slot，但每块 gas 上限限制了可执行计算量。交易还要先广播、进内存池、被选中打包，再等确认。最终性也不同：比特币是概率最终性，以太坊 PoS 的检查点约两个 epoch（12.8 分钟）后被最终确定。以太坊的手续费还分基础费与小费，基础费被销毁，这使费用结构比“全部付给矿工”更复杂。"
      - h: "例子"
        p: "同样是转账：支付公司内部只是两次数据库写入，毫秒级完成；比特币要广播到上万个节点、进内存池排队、被矿工打包，再等几个确认，通常几十分钟。以太坊一笔简单转账固定 21,000 gas，而一次复杂的 DeFi 交互可能消耗几十万 gas，费用差出一个数量级。"
      - h: "对比或演进"
        p: "提速路线有两条：一是牺牲去中心化换容量（更大区块、更少验证者），二是把执行移到二层（Rollup、闪电网络）而把结算留在主链。后者把成本从全网共识转移到少数 Sequencer 或通道对手方，代价是引入新的信任假设与退出延迟。所以“更快”和“更便宜”往往要分别解决：二层主要解决成本，共识层主要决定安全下限。"
      - h: "代价与边界"
        p: "换来的是不需要信任任何中间人。当参与方本来就互相信任（公司内部、单一平台账务），用它只会更慢更贵；这是选型问题，不是技术高下。合规场景还要额外考虑数据公开与监管要求：链上地址一旦公开，后续很难“撤回”或“删除”。"
      - h: "常见误读"
        p: "以为 TPS 高就代表公链更强。提高 TPS 往往靠减少验证节点、放大区块或中心化排序，牺牲的是去中心化与可验证性；对不需要多方互不信任的场景，中心化数据库本来就更好。另一种误读是以为扩容只是工程问题，实际上它始终是安全、去中心化与吞吐之间的权衡。"
    quiz:
      - q: "为什么 TPS 高不一定是公链优势？"
        a: "提高 TPS 往往靠减少验证节点、放大区块或中心化排序，牺牲的是去中心化与可验证性。若场景不需要多方互不信任，高 TPS 的中心化系统本来就更合适。"
      - q: "Layer 2 为什么能更快更便宜？"
        a: "它把大量执行移到链下或少数排序者处，只把结果与证明提交回主链结算，因此不必每笔都全网共识。代价是引入新的信任假设、数据可用性依赖与退出延迟。"
    sources:
      - https://ethereum.org/en/developers/docs/

  - id: p101
    type: practice
    stage: 1
    order: 3
    title: "创建测试钱包并备份恢复"
    minutes: 12
    tags: [wallet, testnet]
    sections:
      - h: "目标"
        p: "用一个只用于测试的钱包，走完创建、备份、删除、用助记词恢复的完整流程，亲手确认备份真的能用，并理解地址、助记词与派生路径三者的关系。重点是验证备份，而不是安装钱包。整个流程约 20 分钟，建议一次做完，中途不要切换钱包插件或安装其它扩展，以免环境混用导致排查困难。做完后把笔记保存下来，换设备时可以直接复用。"
      - h: "准备"
        p: "一台干净设备，安装 Rabby 或 MetaMask 浏览器插件；准备纸笔；确认能切到 Sepolia 测试网并找到对应水龙头。全程不用真实资产，不导入任何现有助记词，也不要把这个测试助记词与真实钱包混用。建议先关掉同步与截图功能。如果使用浏览器插件，建议单独创建一个浏览器配置文件，与日常钱包分开；同时关闭自动同步与截图上传，减少助记词被意外留痕的机会。"
      - h: "步骤"
        p: "1) 新建钱包，抄下 12 词助记词并逐词核对顺序；2) 切到 Sepolia，记下第一个地址与派生路径；3) 用水龙头领测试 ETH，确认到账；4) 删除该钱包（先确认已备份）；5) 用同一串助记词在干净环境恢复；6) 逐字核对地址与余额是否与删除前一致。每一步都把结果记进笔记。若第 2 步找不到派生路径，可在钱包高级设置里查看当前账户路径并记录下来，恢复时必须选同一路径，否则会派生出不同地址。"
      - h: "验收"
        p: "恢复后地址与删除前完全一致，测试 ETH 余额可见；若地址不同，多半是助记词抄错、词序错，或用错了派生路径。此时不要“再试一次就算了”，要回头逐词核对并记录原因——这正是演练要暴露的问题。把恢复前后地址一致的结果、派生路径与操作时间记进笔记，作为下次演练的对照基线；也可以顺手记录一次“故意抄错一词”的失败现象。"
      - h: "安全与常见坑"
        p: "助记词只写在纸上，不拍照、不发聊天工具、不粘贴到任何网站；不要在测试环境导入真实钱包。常见坑：把观察钱包当成恢复成功；不同钱包默认路径不同导致地址不一致；误把测试网资产当真；在钓鱼站点“恢复钱包”时把助记词交给陌生人。演练结束后建议把测试钱包留在单独的浏览器配置里，不要在同一环境导入真实钱包；也不要把测试助记词存进密码管理器，以免与真实凭据混淆。"
    quiz:
      - q: "为什么删除后能恢复才算验证了备份？"
        a: "只看一眼助记词无法证明抄写完整、顺序正确。只有实际在干净钱包里恢复出同一地址，才验证了备份可用，这正是备份的唯一验收标准。"
      - q: "恢复后地址不一致，最可能的原因是什么？"
        a: "助记词抄错或词序错，或使用了不同的派生路径、不同的 passphrase。应按这三项逐一排查，而不是新建钱包了事。"
    sources:
      - https://ethereum.org/en/wallets/

  - id: t103
    type: theory
    stage: 1
    order: 4
    title: "比特币白皮书：交易与脚本"
    minutes: 13
    tags: [bitcoin, script]
    sections:
      - h: "核心机制"
        p: "白皮书把币定义成数字签名链：每笔交易把上一笔输出转让给新的公钥持有者，验证者只需检查签名链完整，且同一输出没有被重复花费。账本因此是一串授权转移，而不是余额表；所谓“拥有比特币”，就是拥有一笔尚未被花费输出的花费条件。"
      - h: "关键细节"
        p: "比特币脚本（Script）是一套非图灵完备的栈语言，没有循环，靠 OP_CHECKSIG、OP_HASH160 与时间锁指令（OP_CHECKLOCKTIMEVERIFY、OP_CHECKSEQUENCEVERIFY）组合支付条件；P2PKH、P2SH、SegWit、Taproot 都是不同的锁定脚本形态。脚本执行有明确步数上限，任何节点都能在有限时间内判定有效或无效。脚本条件可以组合成“支付到公钥哈希”“支付到脚本哈希”等模板，钱包只需识别模板即可展示用途。"
      - h: "例子"
        p: "普通 P2PKH 输出的锁定脚本写着“谁持有该地址对应的公钥并给出有效签名，谁就能花”；解锁脚本给出签名与公钥，两者拼接执行后栈顶为真即通过。2-of-3 多签则要求三把公钥中任意两把签名有效，规则公开可审计；时间锁脚本还能表达“半年后才能动”这类条件。"
      - h: "对比或演进"
        p: "演进方向是更省空间与更灵活：P2SH 把复杂脚本的哈希放进输出，SegWit 把签名移到见证区并修复交易可塑性，Taproot（2021 年激活）用 Schnorr 聚合签名让多签在链上看起来像普通单签，隐私与成本同时改善。这条路线始终遵守一个约束：不破坏旧节点的验证能力。这些升级的共同方向是“把更多信息移出基础层”，同时不改变旧节点的验证结果。"
      - h: "代价与边界"
        p: "脚本故意受限：不能循环、表达力有限，换来的是可终止、可静态分析、攻击面小。复杂逻辑只能放到二层网络或其他可编程链上，这既是安全设计，也是功能边界。脚本也不解决隐私：金额与地址默认公开，任何人都能做链上分析。"
      - h: "常见误读"
        p: "以为脚本能写任意智能合约，或以为签名能保密交易。脚本有限且交易明文公开；隐私需要额外方案，合约能力需要其他链或二层。另一种误读是把 P2SH 当成“另一种地址类型”而不理解它其实是用脚本哈希表达花费条件，这会影响你对多签与升级路径的理解。"
    quiz:
      - q: "比特币脚本为什么不做成图灵完备？"
        a: "为了避免无限循环和不可预测的执行成本，让每个节点都能在确定步数内完成验证。代价是表达力有限，复杂合约需要二层或其他链承担。"
      - q: "SegWit 修复了什么关键问题？"
        a: "它把签名数据移到见证区，消除了交易可塑性——即第三方修改签名编码而 txid 变化的问题，为闪电网络等二层方案铺路，同时提高了有效容量。"
    sources:
      - https://bitcoin.org/bitcoin.pdf

  - id: t104
    type: theory
    stage: 1
    order: 5
    title: "比特币白皮书：网络与激励"
    minutes: 13
    tags: [bitcoin, pow]
    sections:
      - h: "核心机制"
        p: "交易广播到点对点网络，矿工收集进区块，用工作量证明竞争记账权；节点接受累计工作量最大的链，诚实者靠延长这条链达成一致。激励使得诚实挖矿比作恶更划算：遵守规则能持续拿到补贴与手续费，攻击则要付出算力成本并损害自己持有的资产。"
      - h: "关键细节"
        p: "白皮书第 11 节给出概率计算：攻击者落后的区块越多，追上并改写历史的概率呈指数下降。实务上大额结算常等 6 个确认，小额支付可以更少；确认数是一种概率性保证，不是绝对终局。网络层面还有一条隐含假设：节点能在有限延迟内收到新块，否则算力会被浪费在分叉上。白皮书用“赌徒破产”模型估计攻击者追上的概率，结论是确认数增加时概率呈指数衰减。"
      - h: "例子"
        p: "创世块在 2009-01-03 生成，coinbase 里嵌着当天《泰晤士报》头版标题“Chancellor on brink of second bailout for banks”，既是时间戳也是宣言；此后每个块都靠前块哈希串成可验证的历史。区块高度 0 的这笔 coinbase 不可花费，也不进入 UTXO 集合。创世块 coinbase 的参数里还嵌着报纸标题的十六进制编码，这些细节可以自己在浏览器上查看。"
      - h: "对比或演进"
        p: "白皮书的网络模型是“非结构化点对点、尽力广播”：节点转发、矿工择优、没有中心调度。后来出现的矿池、ASIC、闪电网络与 Stratum 协议，都在这个骨架上叠加，但没有改变最长链原则；真正改变信任模型的是二层方案与托管服务，而不是共识本身。"
      - h: "代价与边界"
        p: "激励成立的前提是诚实挖矿的收益大于作恶收益。若攻击者能从做空、双花或破坏信任中获得远超区块奖励的回报，纯经济论证就被削弱；此外交易审查与矿池集中会削弱抗审查假设。白皮书的模型也假设多数算力掌握在诚实节点手中，这个假设本身无法被证明。同时，激励还依赖币价：币价下跌会降低矿工收入，进而影响算力与安全边际。"
      - h: "常见误读"
        p: "以为白皮书定义了完整协议，或以为确认数保证绝对不可逆。白皮书只给原理与安全论证，实现细节（如难度调整、脚本、P2P 消息格式）在后续 BIP 与客户端中演化；重组理论上始终可能，只是概率随确认数下降。"
    quiz:
      - q: "为什么等 6 个确认能降低双花风险？"
        a: "因为攻击者要改写已确认的区块，必须从分叉点重做全部工作量并追平主链；落后越多，追上的概率越小，成本迅速超过可获得的收益。"
      - q: "比特币激励成立的关键前提是什么？"
        a: "诚实挖矿的长期收益大于作恶收益，且攻击者无法从做空或破坏信任中获得远超区块奖励的回报。这个前提是经济假设，不是技术保证。"
    sources:
      - https://bitcoin.org/bitcoin.pdf

  - id: p102
    type: practice
    stage: 1
    order: 6
    title: "读一笔 BTC 交易"
    minutes: 10
    tags: [bitcoin, explorer]
    sections:
      - h: "目标"
        p: "在区块浏览器上独立读懂一笔真实比特币交易：输入、输出、找零、手续费与确认数，而不是只看一个到账金额。练完后你应该能从任意一笔交易反推出它花了哪些 UTXO、付了多少费。练完后你应能从任意一笔交易反推出它花了哪些 UTXO、付了多少费，并判断钱包给出的费率是否合理。"
      - h: "准备"
        p: "打开 mempool.space，准备纸笔或一张记录表，列出 txid、输入列表、输出列表、费率、确认数、所属区块高度这几栏。不需要钱包、不需要登录；全程只读公开数据，不连接任何钱包，也不签名。同时打开一个区块详情页作为对照，方便核对交易所属的区块高度与确认数；不要在这个环节连接钱包或扫描二维码。"
      - h: "步骤"
        p: "1) 点开最新区块里的一笔交易；2) 抄下 txid、输入列表、输出列表；3) 用输入总额减输出总额算出手续费；4) 用手续费除以虚拟体积（vB）得到 sat/vB；5) 记录确认数；6) 判断哪个输出是找零，并说出依据；7) 找到它所属的区块高度。如果再细心一点，可以对比输入脚本类型（P2PKH 或 SegWit），观察同一笔交易里是否混用了不同地址格式，这会直接影响虚拟体积。"
      - h: "验收"
        p: "能指出找零输出、自己算出 sat/vB 费率，并解释这笔交易为什么有多个输入（多个 UTXO 被合并花费）；还能说出该交易属于哪个区块、确认数是多少、输入总额与输出总额的差额是否与显示的手续费一致。差额对不上就说明漏看了某个输出。最后用浏览器自带的费率提示核对一次你算出的 sat/vB，误差应很小；如果差很多，通常是漏算了找零或看错了 vB。"
      - h: "安全与常见坑"
        p: "只读、不签名、不输助记词；不要点浏览器弹出的空投或验证链接。常见坑：把未确认交易的费率与区块内实际费率混淆；把“输出金额之和”当成转账金额；忽略找零导致误判手续费；把浏览器显示的“价值”当成当时法币价格。把每一步用到的浏览器标签页保留在只读状态，不要在同一个浏览器里登录网银或钱包；遇到弹窗要求连接钱包，一律关闭。"
    quiz:
      - q: "为什么一笔交易的输入金额常大于支付金额？"
        a: "因为输入是整笔 UTXO，不能拆开只花一部分；超出支付金额的部分必须以找零输出退回自己，最后剩下的差额才是付给矿工的手续费。"
      - q: "怎么从交易数据算出 sat/vB？"
        a: "先把输入总额减输出总额得到手续费（sat），再除以交易虚拟体积（vB）。vB 与字节数不同：SegWit 的见证数据按 1/4 权重计入。"
    sources:
      - https://mempool.space/

  - id: t105
    type: theory
    stage: 1
    order: 7
    title: "UTXO 与找零"
    minutes: 12
    tags: [bitcoin, utxo]
    sections:
      - h: "核心机制"
        p: "比特币交易由输入和输出组成：输入引用已有 UTXO 并附签名，输出生成新的 UTXO。输入必须被整笔花掉，多出来的部分作为找零回到自己，差额就是手续费。所以一笔交易本质上是“销毁旧钞票、印出新钞票”，而不是从账户里扣数。"
      - h: "关键细节"
        p: "找零输出通常回到钱包自己控制的地址，但它和普通输出没有区别，所以钱包会生成新地址减少地址复用；手续费等于输入总额减输出总额，按体积或重量计价，费率单位 sat/vB。交易体积由输入数与输出数共同决定，因此输入越多越贵。找零地址的脚本类型不一定与输入相同，钱包可以换成更省费的地址类型，这也是交易体积差异的来源之一。"
      - h: "例子"
        p: "你有一个 0.3 BTC 的 UTXO，要付 0.1 BTC：交易写输入 0.3，输出 0.1 给对方，输出约 0.1999 回自己，剩下 0.0001 给矿工。链上看不到余额被扣，只看到旧输出作废、新输出产生。手续费通常由钱包自动计算，但费率是你（或钱包默认策略）选的。如果手续费估算偏低，交易可能在池中停很久，这也是“费率选择”成为钱包核心体验的原因。"
      - h: "对比或演进"
        p: "与账户模型相比，UTXO 的交易天然可以并行验证，因为每个输入互不重叠；代价是钱包要管理一堆输出、做选币（coin selection），还要处理找零与地址复用。账户模型则把这一切压成一个余额与 nonce。两者在隐私、并行与合约能力上各有取舍。在链上分析里，找零识别是聚类启发式的核心：常用“新地址加金额接近输入”来判断哪个输出属于发送者。"
      - h: "代价与边界"
        p: "UTXO 越多，交易越大越贵；小额 UTXO 太多时，合并它们本身就成了一笔可观开销。尘埃输出和地址整合因此是真实的成本问题：低于尘埃阈值的输出可能永远无法花费，甚至会被节点拒绝转发。这也是为什么频繁小额收款的钱包需要主动做“整合”。此外，交易体积还受签名类型影响，Schnorr 与 Taproot 的引入让多签交易的体积显著下降。"
      - h: "常见误读"
        p: "以为手续费是“按金额百分比”收的，或以为找零是内部记账。手续费只与交易大小有关，与金额无关；找零是链上一笔真实输出，丢失即等于付给矿工。还有人以为“输入必须等于输出加手续费”是可选规则，实际上不满足就会被判无效。"
    quiz:
      - q: "为什么比特币转账会出现找零地址？"
        a: "因为输入必须整笔花掉，钱包把超出支付金额的部分作为新输出退回自己控制的地址，这就是找零。它是链上一笔真实输出，不是内部记账。"
      - q: "手续费按什么计算？"
        a: "按交易体积或重量计价，单位 sat/vB，与转账金额无关。输入越多、输出越多，交易越大，手续费越高，所以合并小额 UTXO 的成本会明显上升。"
    sources:
      - https://github.com/bitcoinbook/bitcoinbook

  - id: t106
    type: theory
    stage: 1
    order: 8
    title: "PoW 安全模型与 51% 攻击"
    minutes: 13
    tags: [bitcoin, security]
    sections:
      - h: "核心机制"
        p: "PoW 的安全性来自改写历史必须重做工作量：攻击者要追上主链，就得拥有与全网竞争的算力，越落后的区块越难追。攻击成本因此可以粗略理解为“重做这些块所需的算力与时间”，而且这些成本大部分是链外的电费与硬件。攻击者还有一个隐性成本：攻击期间算力无法用于诚实挖矿，机会成本会随攻击时长线性增长。"
      - h: "关键细节"
        p: "51% 算力并不等于能偷币。攻击者无法伪造他人签名，只能排斥交易、审查地址、制造短暂双花或让链重组；要花掉别人的钱仍需对方私钥。攻击是破坏活性与结算确定性，而非直接盗取。算力占比越高，攻击能维持的时间越长，但收益仍受限于可套现的额度。实际案例中，攻击者更常见的收益来源是交易所充值：先充值、确认后卖出、再回滚充值交易。"
      - h: "例子"
        p: "2014 年 GHash.io 矿池一度接近全网半数算力，社区施压下主动限流；小币种上多次出现租算力双花的案例，说明算力规模小则攻击成本低。以太坊经典、比特币黄金等链都发生过重组攻击。共同点是：链小、算力便宜、交易所确认数要求低。这些案例的共同教训是：确认数要求要与链的算力规模匹配，小链上的大额充提要更保守。"
      - h: "对比或演进"
        p: "PoS 把安全预算换成质押资产与罚没，最终性更快但引入弱主观性；PoW 用外部成本（电力、硬件）换取简单与无许可，代价是能耗与矿池集中。两者都在回答同一个问题：作恶要付出什么。答案不同，适用的威胁模型也不同。"
      - h: "代价与边界"
        p: "PoW 只保证账本难以篡改，不保证交易对手诚实、不保证平台不挪用、也不保证私钥不丢。链上安全与链下风险是两回事，把两者混为一谈会导致错误的安全感。此外，算力可以通过租借市场短期集中，小链尤其脆弱。另外，算力集中还会带来治理层面的风险：单个矿池接近半数时，即使没有作恶也会引发信任危机。"
      - h: "常见误读"
        p: "以为 51% 攻击能让攻击者“为所欲为”或直接清空别人的账户。签名与私钥是独立的一层；攻击者能做的更多是让支付变得不可信、让交易被排除，以及从交易所套利。另一种误读是以为只要“去中心化”就不会被攻击，实际还要看算力分布与交易所确认策略。也有人说“51% 攻击无法防御”，实际上提高确认数、分散算力与监控链重组都是可操作的缓解手段。"
    quiz:
      - q: "拿到 51% 算力能偷走别人的币吗？"
        a: "不能。攻击者无法伪造他人签名，只能做双花、审查或重组，动用别人的资产仍需其私钥。所以 51% 攻击破坏的是活性与结算确定性，而非直接盗取。"
      - q: "小币种为什么更容易遭遇 51% 攻击？"
        a: "因为全网算力小，租借算力达到多数的成本低，而交易所确认数要求往往也低，攻击收益相对成本更高。这是算力规模与被攻击收益的对比问题。"
    sources:
      - https://bitcoin.org/bitcoin.pdf

  - id: p103
    type: practice
    stage: 1
    order: 9
    title: "看区块与 Merkle 根"
    minutes: 10
    tags: [bitcoin, merkle]
    sections:
      - h: "目标"
        p: "打开一个真实区块，找到区块头关键字段与 Merkle 根，理解区块头很小、交易很多的层次结构。做完后你应该能解释为什么 80 字节的头就足以代表整个区块，以及为什么改一笔交易会让根失效。做完后你应该能解释为什么 80 字节的头就足以代表整个区块，也能说清区块、交易、Merkle 根三者谁包含谁。"
      - h: "准备"
        p: "在 mempool.space 准备打开任意已确认区块；做一张记录表，含高度、时间戳、交易数、前块哈希、Merkle 根、难度、区块奖励与手续费总额。只读工具，不连接钱包，也不需要节点。如果浏览器提供原始区块数据入口，可以顺便复制一份头字段的十六进制，方便按 4/32/32/4/4/4 的字节数逐段对照。"
      - h: "步骤"
        p: "1) 打开任意已确认区块；2) 记录高度、时间戳、交易数、前块哈希；3) 复制 Merkle 根并记录长度；4) 任选一笔交易记下 txid；5) 确认它属于这个区块；6) 观察 coinbase 交易与奖励构成；7) 找到“下一个区块”并核对它的前块哈希就是本块哈希。记录字段时注意区分“难度”与“nBits”：前者是数值化难度，后者是区块头里的压缩目标编码，两者可以互相换算。"
      - h: "验收"
        p: "能说出区块头包含哪几个字段、Merkle 根如何绑定全部交易，以及修改其中一笔交易后根会变成什么结果；能解释为什么 80 字节的头就足以代表整个区块，以及为什么“下一个块的前块哈希等于本块哈希”能形成防篡改链。再验证一次：把区块高度加一，找到下一个区块，确认它的前块哈希等于你记录的本块哈希，这样你就手动走通了一节链。"
      - h: "安全与常见坑"
        p: "全程只读，不运行来路不明的一键全节点脚本。常见坑：把区块哈希与 Merkle 根搞混；用未确认区块的数据；以为区块头里存了交易列表；把 coinbase 交易当成普通转账；忽略区块奖励与手续费是两笔来源。不要为了“看全量数据”去安装来路不明的浏览器插件或一键脚本；很多所谓区块工具会请求钱包权限。只用官方浏览器站点。"
    quiz:
      - q: "为什么改一笔交易会让 Merkle 根变化？"
        a: "因为根由全部交易哈希逐层两两合并得到，叶子节点哈希一变，沿途每个父节点都跟着变，最终的根自然不同。这就是根能代表整个交易集合的原因。"
      - q: "coinbase 交易有什么特殊之处？"
        a: "它是每个区块的第一笔交易，没有真实输入，用来产生区块补贴与手续费收入；创世块的 coinbase 不可花费，也不进入 UTXO 集合。"
    sources:
      - https://mempool.space/

  - id: t107
    type: theory
    stage: 1
    order: 10
    title: "共识机制对比"
    minutes: 13
    tags: [consensus, comparison]
    sections:
      - h: "核心机制"
        p: "公链共识首先要防女巫攻击，办法是把投票权绑定稀缺资源：PoW 绑算力与电力，PoS 绑质押资产，两者都靠让作恶成本高于收益来维持诚实。共识机制的第二部分是分叉选择规则：给定两条候选链，节点按什么标准选一条。前者决定“谁能出块”，后者决定“分歧时听谁的”。"
      - h: "关键细节"
        p: "最终性是另一条分界线：PoW 是概率最终性，确认越多越难回滚；以太坊 PoS 用 Casper FFG，约两个 epoch（12.8 分钟）后检查点被最终确定，回滚需要至少 1/3 质押被罚没。参与门槛也不同：PoW 买矿机即可参与，PoS 需要 32 ETH 才能独立激活验证者，小额持有者通常走质押池。两种最终性对应不同的用户体验：PoW 需要等待确认数，PoS 在检查点最终确定后可以给出较强承诺。"
      - h: "例子"
        p: "比特币矿工要试海量 nonce 并耗电，算力占比决定出块概率；以太坊验证者质押 32 ETH，按算法被分配到 slot 提议或投票，作恶被罚没并逐出，收益率随质押总量变化。同一笔交易在两条链上的“安全感”来源完全不同：一个来自外部成本，一个来自链内抵押。"
      - h: "对比或演进"
        p: "此外还有 BFT 类共识（如 Tendermint）与 PoA，前者在已知验证者集合内快速达成最终性，适合联盟链；后者依赖身份与声誉。选共识其实是选“谁有资格出块”与“作恶如何被惩罚”。也有链采用 PoW 出块加 PoS 最终性的混合方案，试图兼得两者。"
      - h: "代价与边界"
        p: "没有全面更优的一方：PoW 简单、抗审查强，但耗能且易受矿池集中影响；PoS 高效、惩罚明确，但依赖弱主观性与更复杂的客户端。还有一点常被忽略：共识不负责数据可用性与智能合约正确性。链上数据没人存、合约写错，共识再稳也救不回来。因此讨论“哪种共识更好”时，先要问清楚应用愿意为最终性付多少等待与多少信任。"
      - h: "常见误读"
        p: "以为 PoS 只是“挖矿的省电版”。两者的信任假设、攻击向量与最终性都不同；也以为质押越多越安全是线性关系，实际上质押集中会带来治理与审查风险。另一种误读是把“去中心化”当成单一指标，它至少包含节点分布、算力或质押分布、客户端多样性三个维度。"
    quiz:
      - q: "PoW 与 PoS 最本质的差别是什么？"
        a: "投票权绑定的稀缺资源不同：PoW 绑算力与能源，成本在链外；PoS 绑质押资产，成本在链内且可被协议罚没。由此带来不同的攻击成本与最终性模型。"
      - q: "什么是概率最终性与确定性最终性？"
        a: "概率最终性指确认越多回滚越难，但没有绝对终点，如 PoW；确定性最终性指检查点被最终确定后，回滚需要极端条件，如以太坊 PoS 的 FFG 最终性。"
    sources:
      - https://ethereum.org/en/developers/docs/consensus-mechanisms/

  - id: t108
    type: theory
    stage: 1
    order: 11
    title: "PoS 与罚没"
    minutes: 12
    tags: [consensus, ethereum]
    sections:
      - h: "核心机制"
        p: "在以太坊 PoS 中，验证者质押 32 ETH 才获得提议区块与投票的资格；违反协议规则会被扣除部分质押并强制退出，这就是罚没（slashing）。罚没与离线惩罚是两套机制：前者针对可证明的恶意行为，后者针对掉线。罚没不是自动执行，而是需要被其他验证者举报并在链上证明，这使惩罚可审计，也让举报有激励。"
      - h: "关键细节"
        p: "触发罚没的典型行为是双重签名（同一高度为两个不同区块投票）和环绕投票（投票结构自相矛盾）；被罚没后还有约 36 天的退出期，期间不能提款，且相关验证者会被关联处罚。罚没金额随同期被罚没的验证者比例放大，这叫相关性惩罚，目的是防止协同攻击。退出期与提款队列的设计，是为了在发现大规模违规时仍有时间执行惩罚，避免攻击者快速撤资。"
      - h: "例子"
        p: "同一份验证者密钥在两台机器上同时运行，会导致双签并双双被罚没，罚没金额还随同期被罚没的验证者数量放大。这说明运行验证节点最怕的往往不是黑客，而是运维失误重复启动客户端——迁移服务器时忘记停掉旧实例，是最典型的翻车方式。"
      - h: "对比或演进"
        p: "与 PoW 的“作恶靠算力浪费”不同，PoS 把惩罚写进协议：作恶者可被直接没收资产，但前提是行为可被证明。离线不算作恶，因此用 inactivity leak 按时间扣减，避免大量验证者掉线时链彻底停摆。两套惩罚的分工，是安全与可用性权衡的体现。"
      - h: "代价与边界"
        p: "罚没只惩罚可证明的违规，不惩罚离线，也不惩罚“审查交易”这类难以证明的行为；安全与可用性是两套机制，最终性依赖至少 2/3 质押诚实。验证者还需要处理密钥管理与客户端升级，运维门槛并不低。质押服务商还可能把罚没风险通过条款转嫁给用户。对委托质押者而言，服务商的罚没风险与合约风险会叠加，选择时不能只看收益率。"
      - h: "常见误读"
        p: "以为质押就是无风险收益，或以为离线不会被扣。离线会被 inactivity leak 缓慢扣减，且提款排队时间可能很长；把质押当成存款产品，是常见的范畴错误。另一种误读是以为“不跑节点也能拿到同样的安全保证”，实际上委托质押引入了服务商风险。还有人以为罚没会“没收全部 32 ETH”，实际金额按规则计算，通常小于全额，相关性惩罚则会放大它。"
    quiz:
      - q: "罚没和离线惩罚有什么区别？"
        a: "罚没针对可证明的恶意行为，如双签与环绕投票，会扣掉大额质押并逐出；离线只按 inactivity leak 缓慢扣减，目的是让链在多数验证者掉线时仍能恢复出块。"
      - q: "什么是相关性惩罚？"
        a: "当同期被罚没的验证者比例较高时，单位罚没金额会放大。它用来提高协同攻击的成本，避免攻击者把损失分摊到大量验证者身上。"
    sources:
      - https://ethereum.org/en/developers/docs/consensus-mechanisms/pos/

  - id: p104
    type: practice
    stage: 1
    order: 12
    title: "地址核对与地址投毒防范"
    minutes: 11
    tags: [security, address]
    sections:
      - h: "目标"
        p: "识别地址投毒（address poisoning）手法，并建立不靠复制历史记录、只核对完整地址的操作习惯。目标是让你在真实的转账流程里有一套固定的核对清单，而不是临场凭记忆判断。目标是让你在真实的转账流程里有一套固定的核对清单，而不是临场凭记忆判断；清单应在十秒内可执行完。"
      - h: "准备"
        p: "在 etherscan.io 打开任意一个活跃地址的交易历史；准备一个地址簿（钱包内置或纸质清单），列出你要用到的几个完整地址并标注用途；全程只读观察，不连接钱包、不签名、不转账。准备一个地址簿，收录你要用的完整地址，并标注用途与添加日期；地址簿本身也要备份，但没有必要放在联网设备上。"
      - h: "步骤"
        p: "1) 打开任意地址的交易历史；2) 找一笔金额为 0 或极小的转入，看它是否来自与常用地址首尾相似的新地址；3) 打开钱包地址簿核对完整地址；4) 演练一次只从地址簿选地址的流程；5) 在设备屏幕上再核对一次完整字符串；6) 写下你的核对清单有几步。核对时可以分两段进行：先看前六位与后六位，再逐字核对中间段；如果是硬件钱包，最后在设备屏幕上再读一遍完整地址。"
      - h: "验收"
        p: "能复述攻击手法：伪造首尾字符相同的地址、发 0 金额交易污染你的历史记录，诱导你下次从历史记录里复制到假地址；并能说出你的核对清单有哪几步、哪一步最难被跳过。如果你只能说出“注意核对”，说明还没形成流程。再补一条练习：给你的地址簿加一条错误记录（例如少一位），看钱包会在哪一步报错，这能帮你判断校验和的实际保护范围。"
      - h: "安全与常见坑"
        p: "任何转账前核对完整地址，并在硬件钱包屏幕上再确认一次；不要假设转错了能撤回。常见坑：只看首尾四位；从交易历史直接复制；把 ENS 或域名当成地址本身；在多个窗口间复制粘贴时被剪贴板劫持。稳妥做法是从地址簿取址并逐字符核对中间段。不要用聊天记录里的地址，也不要相信“官方客服”发来的地址；地址只从你自己的地址簿或对方当面确认过的来源取。"
    quiz:
      - q: "为什么只核对首尾几位防不住地址投毒？"
        a: "因为攻击者正是刻意构造首尾相同的地址来骗过这种核对，真正有区分度的是中间字符。稳妥做法是从地址簿取地址、核对完整字符串，并在设备屏幕上二次确认。"
      - q: "地址投毒的第一步通常是什么？"
        a: "从攻击者地址向受害者转入 0 或极小金额，使这个相似地址出现在受害者的交易历史里，等受害者下次图省事从历史记录复制地址。"
    sources:
      - https://etherscan.io/

  - id: t109
    type: theory
    stage: 1
    order: 13
    title: "什么时候不该用区块链"
    minutes: 12
    tags: [tradeoff, architecture]
    sections:
      - h: "核心机制"
        p: "判断标准只有一句：是否存在多个互不信任、又必须共用同一份记录的主体。若只有一个写入方，或各方已有可信中介，上链带来的是成本而不是价值。这条标准比“要不要去中心化”更可操作，因为它问的是具体场景里有没有需要多方核对的状态。换句话说，先问“这份记录有没有第二方需要独立验证”，再问“这个第二方是否已经信任某个中介”。"
      - h: "关键细节"
        p: "常见反例：公司内部数据库、单平台积分、已有强信任的清算系统、数据无需多方共享的场景。这些用普通数据库更快更便宜，改动和审计也更容易；即便要审计，也能用签名日志做到。反过来，只有“多方各自持有一份、彼此不信任、需要共同确认”的状态，才真正需要共识。另一个信号是写入频率：如果每秒要写很多次、单次价值极低，链上成本结构基本不可行。"
      - h: "例子"
        p: "一家公司记录员工报销，用关系数据库加审计日志就够了；硬上链则每笔操作都要付手续费、把内部数据暴露给全网，还要写迁移脚本，最后仍要有人负责与线下凭证核对。另一个例子是单店会员积分：改成链上积分不会让用户更信任，只会增加使用门槛与合规负担。反例之外也有正面例子：跨机构的贸易单据、溯源凭证，参与方互不信任且需要共同审计，才适合考虑链上方案。"
      - h: "对比或演进"
        p: "另一类不该上链的情况是高频低价值写入：链上吞吐与成本决定了它不适合当业务数据库。反过来，需要公开可验证、跨主体、长周期的结算与凭证，才是它的强项。很多“上链”需求其实可以用可验证日志、时间戳服务或第三方审计替代。"
      - h: "代价与边界"
        p: "即便确实需要多方共识，也要继续问：数据要不要公开、能否承担手续费与延迟、出问题时谁负责、合规上是否可行。技术可行不等于业务合适，尤其涉及用户资金与监管牌照时。链上不可撤销也意味着错误无法像数据库那样回滚，运维与风控要求更高。此外，链上治理与升级协调往往比技术实现更慢，组织的决策成本要提前计入。"
      - h: "常见误读"
        p: "以为“去中心化”本身是卖点。对用户来说真正重要的是降低成本、提高可信度或打开新场景；为了去中心化而牺牲体验与合规，往往是产品的失败模式。另一种误读是把“上链”当成审计的替代品：链上只证明记录没被改，不证明记录一开始就是真的。也常被误读的是“链上数据不可篡改所以更可信”，其实数据上链前仍可能造假，上链只固定“谁在何时提交了什么”。"
    quiz:
      - q: "什么情况下不该用区块链？"
        a: "只有一个可信写入方、或各方本就信任同一个中介、且数据不需多方共享时。此时普通数据库更快更便宜，上链只增加手续费、延迟与运维复杂度。"
      - q: "“上链”为什么不能替代审计？"
        a: "上链只能证明某条记录之后没被改动，不能证明记录一开始真实、完整。链下凭证、业务逻辑与人为判断仍需审计，两者互补而非替代。"
    sources:
      - https://ethereum.org/en/developers/docs/

  - id: p105
    type: practice
    stage: 1
    order: 14
    title: "测试网多签体验"
    minutes: 15
    tags: [multisig, testnet]
    sections:
      - h: "目标"
        p: "在测试网上创建并执行一次 2-of-3 多签，亲手体会阈值签名的流程，以及签名不足时的失败状态。重点是理解“提案—确认—执行”的三段式流程，以及为什么阈值必须大于一。重点是理解“提案—确认—执行”的三段式流程，以及为什么阈值必须大于一；同时观察多个签名者之间的协调成本。"
      - h: "准备"
        p: "三个测试网签名地址（可以是同一钱包的三个账户，但更推荐两台设备加一个备份，以体现分散）；Sepolia 测试 ETH（水龙头领取）；打开 Safe 的测试网界面。全程只用测试资产，不导入任何真实私钥，也不要在主网演练。三个签名地址至少要分布在两台不同设备上，这样才能体会“同一台机器点三次”的差别；测试 ETH 要留出足够 gas 余量。"
      - h: "步骤"
        p: "1) 在 Sepolia 上用 Safe 创建 2/3 多签；2) 记录三个签名者地址与多签地址；3) 用第一个签名者发起一笔测试转账；4) 换第二个签名者确认；5) 观察达到阈值后才执行；6) 再试一次只留一个签名，观察待确认状态；7) 记录每一步的界面状态与交易哈希。发起提案时先确认目标地址与金额，再让第二个签名者独立核对；如果界面支持更严格的模式，可以勾选要求所有签名者确认。"
      - h: "验收"
        p: "只有第二个签名确认后交易才上链；只有一个签名时交易停在待确认状态，并且你能解释为什么 1 个签名不够；多签地址余额变化与交易记录一致。如果第二个签名后仍未执行，检查是否漏了执行步骤——提案与确认是两件事，执行常常是第三步。把只差一个签名时的待确认状态截图保存，并记录“提案者是否等于执行者”这一区别；很多多签允许不同的人执行最后一笔。"
      - h: "安全与常见坑"
        p: "全程只用测试网与水龙头资产，不要在真实网络演练，也不要把真实私钥导入测试环境。常见坑：三个签名者都由同一台电脑派生，失去分散意义；忘了另外两个地址的助记词；把测试网多签当成真实金库；忽略合约层面的多签与链上脚本多签的区别。把三个签名者地址与多签地址记录在纸上并分开存放；演练结束后不要继续用这个多签接收真实资产，测试配置不具备生产级运维条件。"
    quiz:
      - q: "为什么 2-of-3 多签能改善单点失败？"
        a: "动用资金需要两个独立私钥同时授权，单把泄露或丢失都不足以转移资产。代价是操作更麻烦，且必须保证三把私钥不会同时被同一台设备控制。"
      - q: "多签的“提案—确认—执行”为什么要分开？"
        a: "提案只表达意图，确认才积累签名，达到阈值后执行才真正改动链上状态。分开设计让参与者能先审查内容再签名，也便于在阈值未达成时撤销或替换提案。"
    sources:
      - https://ethereum.org/en/developers/docs/

  - id: t110
    type: theory
    stage: 1
    order: 15
    title: "减半与矿工经济"
    minutes: 13
    tags: [bitcoin, mining]
    sections:
      - h: "核心机制"
        p: "矿工收入由区块补贴加交易手续费组成。补贴每 210,000 个块减半一次，长期看手续费必须接过安全预算的主要部分。矿工是逐利的：只要收入覆盖不了电费与设备折旧，就会关机或迁移到更便宜的电价，全网算力因此随成本波动。矿工的收入还包括交易排序带来的额外价值（常被称为 MEV），这部分并不体现在基础手续费里。"
      - h: "关键细节"
        p: "2012、2016、2020、2024 年四次减半把补贴从 50 降到 3.125 BTC，第五次在高度 1,050,000；难度每 2016 个块调整，使出块节奏保持约 10 分钟。补贴以 sat 为单位向下取整，总量因此略少于 2100 万。手续费在区块收入中的占比取决于链上活动，拥堵时会明显上升。难度调整的公式基于最近 2016 个块的实际耗时，因此它对算力变化的响应有明显滞后。"
      - h: "例子"
        p: "减半后若手续费不足以覆盖电费与设备折旧，高成本矿工会关机，全网算力下降、难度随之下调，直到剩下能覆盖成本的矿工重新达到平衡；这个调整通常滞后数周，期间出块间隔可能偏离 10 分钟。矿池还会按算力份额分配收益，单台矿机的收益波动因此被平滑。"
      - h: "对比或演进"
        p: "历史上手续费占比在拥堵期可达区块收入的显著部分，但长期看仍由链上活动决定。二层网络把大量支付移出主链后，主链手续费收入反而可能下降，这是安全预算讨论中的真实张力。矿工收入结构的变化，也推动了矿场向低成本电力与余热利用迁移。这也解释了为什么减半往往伴随矿机迭代：单位算力效率提升，才能抵消补贴下降。"
      - h: "代价与边界"
        p: "随着补贴趋近于零，安全性将越来越依赖手续费市场。如果链上活动长期低迷，安全预算可能不足，这是比特币治理中最真实的开放问题之一；此外矿工还可能通过交易排序（MEV）获得额外收入，这会改变“手续费=安全预算”的简单叙事。安全预算还受币价影响：币价下跌会同时压低矿工收入与攻击成本，两个方向的影响相反。"
      - h: "常见误读"
        p: "以为减半必然推高价格，或以为矿工只能靠补贴。价格不受机制保证；矿工收入结构会随手续费与效率变化，减半前后也常见矿工提前升级设备与迁移低成本电力。另一种误读是把“关机”理解为网络停摆：算力下降只会让难度下调，出块仍会继续。"
    quiz:
      - q: "减半之后矿工靠什么生存？"
        a: "靠交易手续费与更高效率。成本高的矿工退出会使算力与难度下调，网络在更低成本上重新平衡；长期看手续费必须承担几乎全部安全预算。"
      - q: "为什么矿工会关机而网络不会停摆？"
        a: "关机只减少算力，难度会在下一次调整时下调，剩下能覆盖成本的矿工仍会出块。关机是成本竞争的结果，不是网络故障。"
    sources:
      - https://bitcoin.org/bitcoin.pdf

  - id: p106
    type: practice
    stage: 1
    order: 16
    title: "硬件钱包认知：只读"
    minutes: 12
    tags: [wallet, security]
    sections:
      - h: "目标"
        p: "在不初始化真机、不接触真实资产的前提下，弄清硬件钱包的信任边界与常见骗局。做完后你应该能说清“设备防住什么、防不住什么”，以及为什么安全最终取决于流程而不是产品型号。做完后你应该能说清“设备防住什么、防不住什么”，并能为自己的资产规模匹配一个合理的设备与流程组合。"
      - h: "准备"
        p: "到厂商官网阅读安全模型、固件校验与供应链说明；准备纸笔记录要点。全程只阅读官方文档，不购买、不连接设备、不输入任何助记词；也不要相信第三方测评里的“破解演示”作为决策依据。把官方文档里的“安全模型”“固件校验”“供应链”三部分分别看完，重点不是记型号参数，而是记清信任链从芯片、固件到屏幕显示的每一环。"
      - h: "步骤"
        p: "1) 读厂商官网的安全与固件校验说明；2) 看官方关于供应链攻击与防钓鱼的文档；3) 了解设备如何在屏幕上显示并核对地址与金额；4) 查清官方恢复流程与支持渠道；5) 记录设备丢失或损坏时的迁移步骤；6) 记下你现有备份方案的缺口。阅读时顺便查清三件事：设备如何显示收款地址、如何在屏幕上确认金额、恢复时是否需要输入 passphrase。这三者最容易出错。"
      - h: "验收"
        p: "能说明硬件钱包防住什么（远程窃取、恶意软件）、防不住什么（抄错助记词、钓鱼网站签名、被话术骗），并说出至少三种常见骗局：假客服、假固件升级、空投钓鱼。你还应能说出官方固件校验的入口在哪里，以及为什么不能从第三方链接下载固件。试着向一个不懂技术的人解释“为什么不能把助记词输入网页”，如果对方听懂并复述正确，说明你确实理解了这个边界。"
      - h: "安全与常见坑"
        p: "只从官方渠道了解产品与固件校验方式；任何人以客服、升级固件、空投为由索要助记词，或让你把助记词输入网页，都是骗局。常见坑：买二手设备；相信包装里的“说明书”卡片；忽略地址在设备屏幕上的核对；把官方 App 的推送通知当成交易确认。不要因为在文档里看到某个功能就急着购买设备；先确认你所在地区能否正常获得官方固件更新与支持，否则设备可能长期无法升级。"
    quiz:
      - q: "硬件钱包能防什么、防不住什么？"
        a: "能防联网设备上的恶意软件与远程窃取，因为私钥不出设备；但防不住抄错助记词、在钓鱼网站盲目签名，或被人骗着主动转出资产。安全取决于流程。"
      - q: "为什么不能从第三方链接下载固件？"
        a: "因为第三方固件可能被植入恶意代码，导致签名被替换或私钥被导出。应只从官方渠道下载并按官方流程校验哈希与签名。"
    sources:
      - https://bitcoin.org/bitcoin.pdf

  - id: t111
    type: theory
    stage: 1
    order: 17
    title: "自托管 vs 托管"
    minutes: 12
    tags: [custody, security]
    sections:
      - h: "核心机制"
        p: "区别只有一条：私钥在谁手里。自托管由你签名，风险是操作失误与丢失；托管由机构签名，风险是机构的信用、内控与破产。两者的安全目标不同：自托管防的是“别人拿走”，托管防的是“自己弄丢”，但后者把“机构出事”重新变成主要风险。因此“自托管”不是一种产品，而是一种责任分配：签名权与后果都归你。"
      - h: "关键细节"
        p: "托管不只是交易所账户：受监管托管人、现货 ETF 份额、银行托管，都属于你持有对机构的债权或份额，而不是链上资产本身。提款权、破产隔离与审计安排决定了这份债权的质量。判断标准可以具体化为三条：资产是否隔离存放、是否有独立审计、破产时你排在债权人第几顺位。在受监管框架下，托管人通常还要承担反洗钱与客户资产隔离义务，这些义务的执行质量决定实际安全。"
      - h: "例子"
        p: "Mt.Gox 在 2014 年因被盗与挪用破产，用户多年后才部分获赔；FTX 在 2022 年挪用客户资产崩塌。两次都不是链被攻破，而是替你保管的人出了问题。反过来，自托管的典型事故是助记词丢失或抄错，这类事故没有索赔对象，也没有清算程序。两次事件的共性是：用户以为自己“持有”资产，实际持有的是对平台的债权。"
      - h: "对比或演进"
        p: "行业演化出折中方案：多签托管、受监管信托、以及自托管加社会恢复。它们试图在不放弃控制权的前提下降低单点失误，但也引入了新的对手方与复杂度。机构侧常见的做法是“自托管 + 专业托管人 + 保险”，把风险拆成技术、流程与保险三层。"
      - h: "代价与边界"
        p: "自托管不是免费的：要自己备份助记词、防范钓鱼与地址投毒、安排继承与意外处理。选择哪种，取决于你更能承受机构违约还是自己出错；金额越大，越应该把流程写成可演练的清单。此外托管还受司法辖区影响：跨境冻结与合规审查可能让提款权变得不确定。还有一层是法律风险：自托管资产在离婚、继承、债务纠纷中如何认定，各地规则差异很大。"
      - h: "常见误读"
        p: "以为“不在交易所”就等于安全，或以为托管账户里的币属于你名下可随时提取的资产。自托管仍可能因钓鱼签名而丢币；托管资产在破产时通常只是债权。另一种误读是把“交易所显示余额”当成资产存在的证明：那只是一个数据库条目，提款能力才是关键。"
    quiz:
      - q: "托管账户里你真正拥有什么？"
        a: "通常是对机构的债权或份额，而不是链上私钥。机构破产或被挪用资产时你只能按法律程序索赔，无法像自托管那样直接用私钥转移资产。"
      - q: "判断托管质量可以看哪三条？"
        a: "资产是否隔离存放、是否有独立审计、破产时债权人顺位如何。这三点决定了你在机构出事时能否拿回资产，而不只是看界面是否好用。"
    sources:
      - https://www.sec.gov/

  - id: p107
    type: practice
    stage: 1
    order: 18
    title: "写下个人威胁模型"
    minutes: 12
    tags: [security, risk]
    sections:
      - h: "目标"
        p: "用一页纸写清你要保护什么、怕谁、最可能怎么丢，把安全从买设备变成按风险排序的具体行动。目标是产出一份可执行清单：每条风险都对应一个对策与一个残余风险，而不是一份装备采购单。目标是产出一份可执行清单：每条风险都对应一个对策与一个残余风险，而不是一份装备采购单；清单应能在一页纸内读完。"
      - h: "准备"
        p: "一张纸或本地文档；列出你实际持有的资产类型与大致规模（不写具体金额）；确认文档不上传云端明文、不写助记词、不写地址与身份的组合信息。如果必须电子化，用加密容器并单独备份密钥，且不要让同一台联网设备同时持有文档与密钥。如果有多人共享资产，准备一次共同讨论，把每个人的担忧分别写下来；威胁模型不是单人作业，遗漏他人视角是最常见的盲区。"
      - h: "步骤"
        p: "1) 列出需要保护的资产范围；2) 列出对手：远程黑客、身边人、自己失误、机构违约；3) 为每种写一条最可能的攻击路径；4) 给每条配一个成本可接受的对策；5) 标出残余风险；6) 定一个复查周期。写完后请一个可信任的人按你的清单复述一遍，看是否有歧义。对每条对策标注成本（时间、金钱、麻烦程度）与生效时间，然后按风险严重度与成本的比值排序；先做前三条，剩下的留到复查时评估。"
      - h: "验收"
        p: "能说出你的首要威胁与首选对策，并承认仍有残余风险。例如“我最可能丢在助记词抄错，所以先做两份异地纸质备份并完成一次恢复演练”。验收标准是：清单上的每条对策都能在十分钟内被另一个人照着执行，而不是停留在“小心一点”。请家人或同事按清单复述一次“如果明天你出事，别人该怎么做”，能照着执行才算合格；如果对方需要追问，就把歧义写回文档。"
      - h: "安全与常见坑"
        p: "这份文档不写助记词、不写地址与身份的组合信息、不上传云端明文；写完只保留结论清单，敏感细节不留痕。常见坑：把威胁模型写成设备清单；只列外部黑客，忽略自己与身边人；对策没有负责人和复查日期；写完不演练，等于没有验证过。只把清单的结论部分放在随手可见处，涉及具体金额、地址与备份位置的信息单独加密保存；不要把完整威胁模型发给不可信的第三方。"
    quiz:
      - q: "为什么威胁模型要先写我怕谁？"
        a: "因为不同对手对应完全不同的对策：防远程黑客靠离线保存与硬件签名，防身边人靠分散与隐蔽，防自己失误靠备份演练与核对流程。不先定对手，措施就会乱买。"
      - q: "威胁模型里的“残余风险”指什么？"
        a: "指采取措施后仍然存在、且你选择接受的风险。例如两份异地纸质备份仍怕同时火灾，但概率已可接受。写明残余风险才能避免“已做安全措施”的虚假安心。"
    sources:
      - https://bitcoin.org/bitcoin.pdf

  - id: t112
    type: theory
    stage: 1
    order: 19
    title: "现货 ETF 与机构化"
    minutes: 12
    tags: [market, institution]
    sections:
      - h: "核心机制"
        p: "现货比特币 ETF 让传统券商账户间接获得比特币的市场敞口：基金在托管人处持有实物 BTC，份额像股票一样在交易所交易，投资者不接触私钥。基金需要按监管要求披露持仓与净资产值，申购赎回由授权参与者（AP）完成，普通投资者只能在二级市场买卖份额。"
      - h: "关键细节"
        p: "美国 SEC 于 2024 年 1 月批准多只现货比特币 ETF 并开始交易，现货以太坊 ETF 于 2024 年 7 月开始交易；香港也在 2024 年 4 月批准了现货虚拟资产 ETF。份额的申赎由授权参与者完成，普通投资者无法直接用份额换回一枚比特币，只能卖出份额换回现金。ETF 的份额价格由二级市场供需决定，可能出现相对净值的溢价或折价，套利机制会把它拉回但不保证即时。"
      - h: "例子"
        p: "买 ETF 时你的对手方是券商与基金，背后是托管人持有的实物资产；基金每日公布持仓与份额，跟踪误差来自管理费、现金拖累与申赎机制。买卖在交易时段内完成，与 7×24 小时的链上市场不同，所以周末或休市期间的链上波动无法即时反映在份额价格里。"
      - h: "对比或演进"
        p: "机构化的路径不止 ETF：还有受监管期货、信托产品与托管服务。它们共同把“自己保管私钥”换成“在既有金融中介体系内持有敞口”，扩大了参与者范围，也把链上结算外包给了中介。对市场结构而言，这意味着更多资金通过受监管渠道进出，也意味着托管集中度上升。"
      - h: "代价与边界"
        p: "ETF 解决了合规与便利，但把自托管换成了层层中介：管理费、跟踪误差、托管方与对手方风险都回来了。境内按 2026-02-06 八部门 42 号文，虚拟货币相关业务一律禁止，RWA 代币化按分类监管口径处理。跨境产品还涉及税务与申报义务，需按所在地规则判断。此外，ETF 无法表达链上原生功能，例如参与治理或质押收益，是否允许取决于产品结构。"
      - h: "常见误读"
        p: "以为 ETF 增加了链上需求就一定推高价格，或以为持有 ETF 等于持有比特币。前者是叙事不是机制；后者混淆了份额与资产，你无法用份额提币，也不掌握私钥。还有一种误读是把 ETF 当成“无风险套利工具”，实际存在溢价折价、流动性与交易时段错配。"
    quiz:
      - q: "持有现货 ETF 份额等于自托管比特币吗？"
        a: "不等于。你持有的是基金份额，BTC 由托管人保管，无法用份额直接提币；同时承担管理费、跟踪误差与托管方风险，换来券商账户内的合规与便利。"
      - q: "ETF 份额价格为什么可能与链上价格偏离？"
        a: "因为份额在交易时段内按市场供需定价，存在溢价或折价；而链上 7×24 小时交易、休市期间无法即时套利。申赎机制与流动性也会放大偏差。"
    sources:
      - https://www.sec.gov/
      - https://www.hkma.gov.hk/

  - id: p108
    type: practice
    stage: 1
    order: 20
    title: "用公共 RPC 读一笔交易"
    minutes: 15
    tags: [ethereum, rpc]
    sections:
      - h: "目标"
        p: "不依赖区块浏览器界面，用一条 RPC 请求直接向公共节点查询交易与最新区块号，理解链上数据是从哪里来的。做完后你应该知道浏览器只是节点数据的展示层，以及 JSON-RPC 的请求与返回长什么样。做完后你应该知道浏览器只是节点数据的展示层，以及 JSON-RPC 的请求与返回长什么样；也能解释“链上数据”为什么依赖节点。"
      - h: "准备"
        p: "终端与 curl；一个公开的以太坊 RPC 端点（可从 ethereum.org 节点文档的公共端点列表里选）；一个真实 txid 与对应区块号。只读查询，不需要私钥，也不要在公共端点上发送任何签名请求。建议同时准备两个不同提供方的端点做对照。如果公共端点受限，可以换用本地节点或其它公开提供方；准备 jq 之类的命令行工具会更容易查看返回结构，但没有也不影响练习。"
      - h: "步骤"
        p: "1) 选一个公共 RPC 端点；2) 发送 eth_getTransactionByHash 并带上真实 txid；3) 再发送 eth_blockNumber；4) 回到 etherscan.io 对照字段是否一致；5) 观察 value 以 wei 计；6) 换一个端点再查一次，比较返回与延迟。每一步都把原始 JSON 存到本地文件，方便比对字段。对照时重点看 blockNumber 与 transactionIndex：前者说明交易在哪个块，后者说明它在块内第几笔，两者结合才能唯一确定顺序。"
      - h: "验收"
        p: "能读懂返回 JSON 里的 from、to、value、gas、blockNumber 字段，并说明 value 以我们常说的最小单位 wei 计，1 ETH 等于 10 的 18 次方 wei；能解释为什么两个端点可能返回不同结果（同步延迟或分叉）。还应能区分 pending 与已确认交易在返回字段上的差异。再核对一次 gas 与 gasPrice（或 EIP-1559 的 maxFeePerGas、maxPriorityFeePerGas），算出手续费等于 gas 用量乘实际单价，并与浏览器对比。"
      - h: "安全与常见坑"
        p: "公共 RPC 能看到你的 IP 与查询内容，不要用它发送需要保密的请求，也不要把私钥交给任何端点；只做只读查询。常见坑：把十六进制 blockNumber 当成十进制；把 pending 交易当已确认；只依赖单一端点；把 RPC 返回当成最终真相而忽略节点可能落后。不要用带写入权限的 RPC 端点做任何尝试，也不要在公共端点上测试签名交易；所有需要私钥的操作都应在本地节点或硬件钱包上完成。"
    quiz:
      - q: "用公共 RPC 查询交易暴露了什么？"
        a: "暴露你的 IP、查询目标与查询时间，节点运营方可以记录并做关联分析。查询本身不需要私钥，所以只读是安全的，但不要把私钥交给任何端点。"
      - q: "RPC 返回的 value 单位是什么？"
        a: "以 wei 计的十六进制字符串，1 ETH 等于 10 的 18 次方 wei。展示前要换算，否则容易把数值看错几个数量级。"
    sources:
      - https://ethereum.org/en/developers/docs/nodes-and-clients/
