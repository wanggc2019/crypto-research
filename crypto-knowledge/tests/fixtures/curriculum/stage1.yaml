- id: c101
  type: concept
  stage: 1
  order: 1
  title: 测试概念一
  en: Test Concept One
  minutes: 11
  tags:
  - test
  sections:
  - h: 一句话
    p: 这是测试用的概念定义，长度需要满足五十个字符的下限要求，同时还要留出足够空间来验证正文总字数是否达到十分钟课程的标准，因此每个小节都要写得足够充实。这一段补充说明用来把正文补到十分钟课程所需的长度，同时保持语义通顺，并确保每条内容都落在校验器要求的区间内。再补充一句测试说明：这一段的长度经过刻意控制，既能保证整条内容达到十分钟课程的下限，又不会超过校验器规定的单节上限。
  - h: 为什么重要
    p: 这是测试用的重要性说明，长度同样需要满足校验器要求，避免测试数据本身不合法；同时它还要贡献足够的正文字数，让整条内容落在八百到一千八百字的区间内。这一段补充说明用来把正文补到十分钟课程所需的长度，同时保持语义通顺，并确保每条内容都落在校验器要求的区间内。
  - h: 核心机制
    p: 测试内容也要讲清机制，所以这一节用来说明一个抽象机制如何运转、参与者各自付出什么、系统用什么方式防止作弊，以及这些设计在什么条件下会失效。这一段补充说明用来把正文补到十分钟课程所需的长度，同时保持语义通顺，并确保每条内容都落在校验器要求的区间内。
  - h: 例子
    p: 这里放一个具体例子：假设有甲乙两个参与者，甲先提交记录，乙负责验证，出现冲突时按预先约定的规则处理，整个过程不需要一个双方都信任的中心机构来仲裁。这一段补充说明用来把正文补到十分钟课程所需的长度，同时保持语义通顺，并确保每条内容都落在校验器要求的区间内。
  - h: 常见误解
    p: 常见误解是把测试数据当成可以随便写的占位符，其实字段长度、必填项、正文字数和自测题数量都会被校验器逐项检查，任何一项不达标都会导致内容加载失败。这一段补充说明用来把正文补到十分钟课程所需的长度，同时保持语义通顺，并确保每条内容都落在校验器要求的区间内。
  - h: 边界与代价
    p: 任何机制都有代价，这一节说明它在什么场景下不适用、会带来哪些额外成本，以及为什么在这些场景里用更简单的中心化方案反而更划算，避免把工具用在错误的问题上。这一段补充说明用来把正文补到十分钟课程所需的长度，同时保持语义通顺，并确保每条内容都落在校验器要求的区间内。
  quiz:
  - q: 这是第一道测试问题吗？
    a: 是的，这是第一道测试问题。答案长度需要满足二十个字符的下限要求，用于验证校验器对答案长度的检查是否生效。
  - q: 测试内容需要多少道自测题？
    a: 概念和理论条目需要两到三道，实践条目需要一到两道；总题目数不能超过三道，每道题的答案长度都要落在规定区间内。
  sources:
  - https://example.com/a
- id: c102
  type: concept
  stage: 1
  order: 2
  title: 测试概念二
  minutes: 12
  sections:
  - h: 一句话
    p: 第二个测试概念，用来验证概念轨道按顺序推进，并且不会和第一条重复发送；它的正文同样需要凑够八百字以上的总量，才能通过升级后的内容校验器。这一段补充说明用来把正文补到十分钟课程所需的长度，同时保持语义通顺，并确保每条内容都落在校验器要求的区间内。再补充一句测试说明：这一段的长度经过刻意控制，既能保证整条内容达到十分钟课程的下限，又不会超过校验器规定的单节上限。
  - h: 为什么重要
    p: 它还要验证复习课能否正确取到当天两条内容的自测题，并在二十三点把问题和折叠答案一起展示出来，让用户在不看答案的情况下先做一次主动回忆。这一段补充说明用来把正文补到十分钟课程所需的长度，同时保持语义通顺，并确保每条内容都落在校验器要求的区间内。
  - h: 核心机制
    p: 复习课会把当天两条内容各自的两道题抽出来，再加上到期条目的检索题，最后给出一道综合思考题，要求用户用三句话把两个概念之间的关系讲清楚。这一段补充说明用来把正文补到十分钟课程所需的长度，同时保持语义通顺，并确保每条内容都落在校验器要求的区间内。
  - h: 例子
    p: 假设今天学的是账本与双花，那么综合思考题会问两者是什么关系：账本负责记录所有权，双花问题说明为什么数字记录需要额外的排序与确认机制才能防止重复花费。这一段补充说明用来把正文补到十分钟课程所需的长度，同时保持语义通顺，并确保每条内容都落在校验器要求的区间内。
  - h: 常见误解
    p: 常见误解是认为复习就是把原文再读一遍；有效的复习是主动回忆，先合上材料回答问题，再对照答案，发现记错的地方才是真正需要重新学习的地方。这一段补充说明用来把正文补到十分钟课程所需的长度，同时保持语义通顺，并确保每条内容都落在校验器要求的区间内。
  - h: 边界与代价
    p: 这种复习方式的代价是需要更多注意力，不能边刷手机边看；好处是同样的十分钟比被动重读留下更深的记忆痕迹，长期坚持的复利也更高。这一段补充说明用来把正文补到十分钟课程所需的长度，同时保持语义通顺，并确保每条内容都落在校验器要求的区间内。
  quiz:
  - q: 第二条概念会先发吗？
    a: 不会，概念轨道严格按 order 排序，第一条发完才轮到第二条；如果第一条发送失败，状态不会推进，下一轮还会重试第一条。
  - q: 复习课会用到当天的内容吗？
    a: 会，复习课先做当天两条内容的主动回忆，再复习更早到期的条目，最后用一道综合思考题把当天两个概念联系起来。
  sources:
  - https://example.com/b
- id: t101
  type: theory
  stage: 1
  order: 1
  title: 测试理论课
  minutes: 13
  tags:
  - test
  sections:
  - h: 核心机制
    p: 这是测试用的理论说明，用来验证课程轨道会按顺序取到理论条目并渲染成十分钟以上的消息卡片；它需要足够长，才能让正文总字数落在校验器要求的区间内。这一段补充说明用来把正文补到十分钟课程所需的长度，同时保持语义通顺，并确保每条内容都落在校验器要求的区间内。再补充一句测试说明：这一段的长度经过刻意控制，既能保证整条内容达到十分钟课程的下限，又不会超过校验器规定的单节上限。
  - h: 关键细节
    p: 理论条目通常包含机制、细节、例子、边界与误读几个部分，每一部分都要写得具体，不能只给结论；读者应该能在读完之后复述机制并说出一个反例。这一段补充说明用来把正文补到十分钟课程所需的长度，同时保持语义通顺，并确保每条内容都落在校验器要求的区间内。再补充一句测试说明：这一段的长度经过刻意控制，既能保证整条内容达到十分钟课程的下限，又不会超过校验器规定的单节上限。
  - h: 例子
    p: 例子也是测试数据，长度需要满足五十个字符的下限要求，否则校验器会直接报错；同时它还要贡献足够的字数，让整条内容的正文总量达到八百字以上。这一段补充说明用来把正文补到十分钟课程所需的长度，同时保持语义通顺，并确保每条内容都落在校验器要求的区间内。再补充一句测试说明：这一段的长度经过刻意控制，既能保证整条内容达到十分钟课程的下限，又不会超过校验器规定的单节上限。
  - h: 代价与边界
    p: 理论不是越抽象越好，好的理论要能指导判断；这一节说明该机制在什么条件下成立、在什么条件下失效，以及读者应该用哪些可观测的信号去验证它。这一段补充说明用来把正文补到十分钟课程所需的长度，同时保持语义通顺，并确保每条内容都落在校验器要求的区间内。
  - h: 常见误读
    p: 常见误读是把机制当成保证，忽略了它依赖的假设；一旦假设不成立，同样的机制可能带来相反的结果，所以学习理论时要同时记住它的适用边界。这一段补充说明用来把正文补到十分钟课程所需的长度，同时保持语义通顺，并确保每条内容都落在校验器要求的区间内。
  quiz:
  - q: 理论课会带自测题吗？
    a: 会，概念和理论条目都必须带两到三道自测题，实践条目至少带一道；复习课会直接复用这些题目做主动回忆。
  - q: 理论条目至少要写几节？
    a: 四到六节，建议包含核心机制、关键细节、例子、代价与边界、常见误读；每节正文五十到四百二十字，整条正文合计八百到一千八百字。
  sources:
  - https://example.com/c
- id: p101
  type: practice
  stage: 1
  order: 2
  title: 测试实践课
  minutes: 14
  tags:
  - test
  sections:
  - h: 目标
    p: 这是测试用的实践任务，用来验证实践条目也能正常渲染，并且不会被当成理论课；实践条目要求读者在测试网或公开只读数据上完成一个可检查的动作。这一段补充说明用来把正文补到十分钟课程所需的长度，同时保持语义通顺，并确保每条内容都落在校验器要求的区间内。再补充一句测试说明：这一段的长度经过刻意控制，既能保证整条内容达到十分钟课程的下限，又不会超过校验器规定的单节上限。
  - h: 准备
    p: 准备阶段需要列出工具、账号和前置条件，例如安装一个只用于测试的钱包、准备一点测试币、打开一个区块浏览器，并确认自己不会接触任何真实资金。这一段补充说明用来把正文补到十分钟课程所需的长度，同时保持语义通顺，并确保每条内容都落在校验器要求的区间内。再补充一句测试说明：这一段的长度经过刻意控制，既能保证整条内容达到十分钟课程的下限，又不会超过校验器规定的单节上限。
  - h: 步骤
    p: 第一步做这个，第二步做那个，所有步骤都只在测试环境里完成，不涉及任何真实资金；每一步都要能照着做，读者不需要额外查资料就能完成整个流程。这一段补充说明用来把正文补到十分钟课程所需的长度，同时保持语义通顺，并确保每条内容都落在校验器要求的区间内。再补充一句测试说明：这一段的长度经过刻意控制，既能保证整条内容达到十分钟课程的下限，又不会超过校验器规定的单节上限。
  - h: 验收
    p: 验收标准要可检查，例如能看到一笔测试网交易、地址余额发生变化、或者某个只读查询返回了预期结果；验收不通过就说明步骤里还有没讲清楚的地方。这一段补充说明用来把正文补到十分钟课程所需的长度，同时保持语义通顺，并确保每条内容都落在校验器要求的区间内。再补充一句测试说明：这一段的长度经过刻意控制，既能保证整条内容达到十分钟课程的下限，又不会超过校验器规定的单节上限。
  - h: 安全与常见坑
    p: 安全提示包括不输入助记词、不点私信链接、不使用真实资产；常见坑包括网络选错、测试币领不到、把只读操作误当成写入操作，这些都要在步骤里提前说明。这一段补充说明用来把正文补到十分钟课程所需的长度，同时保持语义通顺，并确保每条内容都落在校验器要求的区间内。
  quiz:
  - q: 实践课要在真实资金上做吗？
    a: 不需要，本模块的所有实践都在测试网或公开只读数据上完成，不碰真实资金，也不提供任何交易、出入金或账户操作指引。
  sources:
  - https://example.com/d
