# 信源清单（sources）—— 当前范围：BTC / ETH / BNB
# 约定：
#   type:         rss | json_api | html_diff | statuspage | market_api
#   tier:         T0 一手 / T1 专业媒体 / T2 社交 / T3 聚合
#   verified:     2026-11-07 本机实测是否连通
#   poll_seconds: 建议轮询间隔（零成本方案下不要低于 60s）
#
# SOL / ASTER 专属信源已移除，需要时从 git 历史或方案文档附录恢复。

version: 8
updated: "2026-11-10"
default_user_agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7) crypto-intel/0.4 (contact: me@example.com)"

sources:
  # ---------- T0 交易所公告 ----------
  - id: binance_ann
    name: Binance 公告
    type: json_api
    tier: T0
    url: "https://www.binance.com/bapi/composite/v1/public/cms/article/list/query?type=1&pageNo=1&pageSize=20"
    poll_seconds: 60
    verified: true
    filter:
      keep_catalogs: [48, 161, 157, 49]   # 48 上币 161 下架 157 维护 49 官方新闻
      drop_catalogs: [93, 128, 51]        # 93 活动 128 空投 51 API 更新
      listing_watchlist_only: true        # 上币类只保留 BTC/ETH/BNB
    notes: 网页版有 JS 挑战（202），必须走 CMS JSON

  - id: okx_ann
    name: OKX 公告
    type: json_api
    tier: T0
    url: "https://www.okx.com/api/v5/support/announcements"
    poll_seconds: 120
    verified: true
    notes: 不要带 annType 参数，带了会报 51000

  - id: bybit_ann
    name: Bybit 公告
    type: json_api
    tier: T0
    url: "https://api.bybit.com/v5/announcements/index?locale=en-US&limit=20"
    poll_seconds: 120
    verified: true
    notes: retCode=0 为正常；可按 type 筛 new_crypto

  - id: kraken_blog
    name: Kraken 博客
    type: rss
    tier: T0
    url: "https://blog.kraken.com/feed"
    poll_seconds: 300
    verified: true

  - id: tg_binance_ann
    name: Binance 公告 Telegram（备用通道）
    type: html_diff
    tier: T2
    url: "https://t.me/s/binance_announcements"
    poll_seconds: 300
    verified: true
    notes: 与 binance_ann API 互为备份；公开频道预览页，无需 bot 权限

