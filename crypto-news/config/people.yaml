# ---------- 明确不监控 ----------
excluded:
  - 泛指 KOL / 影响者 / 喊单账号 / 财经博主
  - 转发（RT）、点赞、引用他人且无本人评论的内容
  - 已离职且不再影响所涉平台的高管（可按需调整）

# ---------- 采集方式（零成本）----------
access:
  primary:
    method: jina_x_profile
    url_template: "https://r.jina.ai/https://x.com/{handle}"
    poll_seconds: 300
    verified: true
    notes: 返回 Markdown，含最近若干条帖子；无需 API key；jina 免费额度有限速，5 分钟一次足够
  secondary:
    method: google_news
    url_template: "https://news.google.com/rss/search?q={query}"
    poll_seconds: 900
    notes: 媒体转述，覆盖更全但有延迟；用于交叉确认
  caveat: fxtwitter（api.fxtwitter.com）只返回主页信息且会间歇性 404，不作为主通道
