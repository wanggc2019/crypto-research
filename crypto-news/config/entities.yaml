# ---------- 事件关键词（用于分类，不是过滤器）----------
event_keywords:
  protocol_security: [hack, exploit, drained, stolen, 被盗, 攻击, 重入, 私钥泄露, 闪电贷, compromised]
  exchange_custody: [withdrawals halted, 暂停提币, 暂停充提, insolvent, 破产, 挤兑, bank run, proof of reserves, 储备证明]
  regulatory: [lawsuit, 起诉, settlement, 和解, ban, 禁令, license, 牌照, enforcement, 执法, subpoena]
  tokenomics: [unlock, 解锁, cliff, 悬崖, emission, 增发, buyback, 回购, burn, 销毁, auto-burn, 自动销毁]
  macro: [fomc, cpi, nfp, 非农, rate cut, 降息, rate hike, 加息, qt, liquidity, 流动性]
  capital_flow: [etf inflow, etf outflow, 净流入, 净流出, whale, 巨鲸, mint, 增发, exchange netflow]
  tech_upgrade: [hard fork, 硬分叉, mainnet, 主网, upgrade, 升级, client bug, 客户端, hardfork]
  governance: [proposal, 提案, vote, 投票, quorum, treasury, 财库]
  market_structure: [liquidation, 清算, basis, 基差, market maker, 做市商, expiry, 到期, funding rate, 资金费率]
  industry_labor: [layoff, laid off, 裁员, 重组, restructuring, severance, 遣散, resignation, resign, 辞职, 离职, steps down, 卸任]
