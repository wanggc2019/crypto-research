# 实体词典（entities）—— 当前范围：BTC / ETH / BNB
# 命中规则：标题/正文命中任一 alias 或关键词 → 进入候选；否则丢弃。

version: 3
updated: "2026-11-07"

# ---------- 标的（与 watchlist 对齐）----------
assets:
  BTC:
    aliases: [bitcoin, btc, xbt, 比特币, 大饼]
    related: [ibit, fbtc, gbtc, spot bitcoin etf, 减半, halving, hashrate, 算力, miner, 矿工]
  ETH:
    aliases: [ethereum, eth, ether, 以太坊]
    related: [staking, 质押, beacon chain, EIP-4844, EIP-7702, blob, L2, rollup, 升级, Dencun, Pectra, validator]
  BNB:
    aliases: [bnb, binance coin, 币安币, bsc, bnb chain, opbnb]
    related: [auto-burn, 自动销毁, 季度销毁, burn, 销毁, bnb chain upgrade, opbnb, bsc, bnb greenfield, mega fuel]

# 冻结标的（不参与匹配）
paused: [SOL, ASTER]

# ---------- 稳定币（系统性风险，不做交易）----------
stablecoins:
  - {symbol: USDT, aliases: [tether, 泰达]}
  - {symbol: USDC, aliases: [circle, usd coin]}
  - {symbol: USDe, aliases: [ethena]}
  - {symbol: FDUSD, aliases: [first digital]}

