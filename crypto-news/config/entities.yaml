    - {name: DOJ, aliases: [department of justice, 司法部]}
    - {name: SFC, aliases: [香港证监会, hong kong sfc]}
    - {name: MAS, aliases: [新加坡金管局]}
    - {name: FSA, aliases: [日本金融厅]}
    - {name: ESMA, aliases: [mica, 欧盟]}
  exchanges:
    - {name: Binance, aliases: [币安, cz]}
    - {name: Coinbase, aliases: [coinbase]}
    - {name: OKX, aliases: [欧易, okex]}
    - {name: Bybit, aliases: [bybit]}
