schema_version: 1
# 政策雷达：低频（6 小时）扫权威源，只对「新且相关」的法规/案例建卡。
enabled: true
poll_seconds: 3600           # 1 小时；由 tools/render_launchd.py 读取（发现新政策更快）
max_new_per_source: 20       # 单源单轮最多处理的新条目
detail_fetch_limit: 24       # 单轮最多抓多少个详情页
max_detail_per_source: 5     # 单源单轮详情上限（防止某个源吃光预算）
backfill_per_source: 2       # 单源单轮补抓正文上限（旧条目只入库不推送）
push_max_age_days: 540       # 超过 540 天的旧文件只入库、不推送（避免把历史文件当新闻）
body_max_chars: 20000

