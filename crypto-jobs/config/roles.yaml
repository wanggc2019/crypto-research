schema_version: 1
# 岗位/资历判定规则（业务策略，可随时调）。
# 匹配顺序：roles 从上到下，标题命中第一个即归类；exclude_keywords 优先级最高。
# 目标岗位（2026-11-09 起）= 原 DevOps/SRE/MLOps/平台 + 开发岗位（后端/前端/全栈/移动/区块链/
# 数据/ML/嵌入式/交易系统/通用软件）。改目标范围时同步改 target_roles 与 app.yaml filters.target_roles。
# 每个 keyword 按「词边界 + 大小写不敏感」匹配。
target_roles: [devops, sre, mlops, platform, software, backend, frontend, fullstack, mobile,
               blockchain, trading, data, ml, embedded]

roles:
  - id: sre
    label: SRE / 可靠性
    keywords:
      - site reliability
      - sre
      - reliability engineer
      - production engineer
      - observability
      - incident response
      - incident management

  - id: mlops
    label: MLOps / AI 基础设施
    keywords:
      - mlops
      - ml ops
      - ml platform
      - machine learning infrastructure
      - machine learning platform
      - machine learning infrastructure
      - ai infrastructure
      - ai platform
      - model serving
      - model deployment
      - model training
      - llm infrastructure
      - inference infrastructure

  - id: devops
    label: DevOps / 交付
    keywords:
