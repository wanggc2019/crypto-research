# 资历：从标题解析，按顺序第一个命中
seniority:
  - {id: principal, keywords: [principal]}
  - {id: staff, keywords: [staff]}
  - {id: lead, keywords: [lead, leader, tech lead]}
  - {id: head, keywords: [head, director, vp]}
  - {id: senior, keywords: [senior, sr., sr]}
  - {id: junior, keywords: [junior, jr., jr, entry level, entry-level, graduate, new grad]}
  - {id: intern, keywords: [intern, internship]}
  - {id: mid, keywords: [mid-level, mid level, intermediate, ii, iii]}
