  - {id: cloud, label: 云平台与主机}
  - {id: network, label: 操作系统与网络}
  - {id: observability, label: 可观测性}
  - {id: reliability, label: 可靠性与应急}
  - {id: mlops, label: MLOps 与 AI 基础设施}
  - {id: data, label: 数据与流处理}
  - {id: crypto-chain, label: 公链与协议}
  - {id: crypto-node, label: 节点与验证者运维}
  - {id: crypto-trading, label: 交易与市场基础设施}
  - {id: crypto-custody, label: 托管与密钥安全}
  - {id: security, label: 安全与合规}
