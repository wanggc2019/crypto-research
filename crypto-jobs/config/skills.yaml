# 宽口径技能的「拆解」：报告/日报里把 AI、可观测性、钱包这类大项展开成具体技术。
# key = 大项 skill id，value = 子技能 id 列表（必须都能在 skills 里找到；只影响展示聚合，不影响抽取）。
drilldown:
  # Python 是具体技能，但求职者常问「Python 具体做什么」，这里拆成它最常见的生态/方向
  python: [django, flask, fastapi, airflow, pytest, pytorch, tensorflow]
  ai: [llm, machine-learning, rag, pytorch, tensorflow, huggingface, fine-tuning, rlhf, vector-database, model-serving]
  mlops: [mlflow, kubeflow, feature-store, model-serving, vllm, triton, ray, sagemaker]
  observability: [prometheus, grafana, datadog, opentelemetry, distributed-tracing, logging, sentry, pagerduty]
  incident-management: [on-call, postmortem, error-budget]
  sre: [slo-sli, on-call, incident-management, chaos-engineering, postmortem]
  wallet: [custody, cold-wallet, hsm, kms, multi-sig, mpc, key-management, fireblocks]
  dapp: [smart-contracts, solidity, evm, hardhat, foundry, ethersjs, viem, wagmi, web3js]
  kubernetes: [helm, istio, service-mesh, kubernetes-operator]
  devops: [cicd, gitops, argocd, iac, terraform, ansible]
  platform-engineering: [developer-experience, internal-developer-platform, backstage]

skills:
  # ============ 1. 编程语言（12）============
  - {id: python, label: Python, category: language, aliases: [python, py, "python 3"]}
  - id: go
    label: Go
    category: language
    aliases: [golang, "go language", "go developer", "go engineer", "go programming"]
    # 歧义：go to market / go live 等动词用法不命中；只认大写 Go 或明确语言语境。
    regex: |-
      (?<![A-Za-z0-9_-])Go(?![A-Za-z0-9_-])(?![ \t]+(?:to|live|ahead|through|beyond|above|below|back|forward|down|up|away|after|with|on|off|in|out|into|over|under|by|from)\b)|(?i:\bgo\s+(?:language|developer|engineer|programming|code|services?|backend)\b)
  - id: rust
    label: Rust
    category: language
    aliases: [rustlang, "rust programming", "rust developer", "rust engineer"]
    # 歧义：rust prevention / rust-proof 等不命中（语言名在 JD 里通常大写）。
    regex: |-
      (?<![A-Za-z0-9_-])Rust(?![A-Za-z0-9_-])(?![ \t]+(?:prevention|proof|proofing|removal|protection|treatment|corrosion|resistant|bucket|oleum|free|colored|stain)\b)
  - {id: typescript, label: TypeScript, category: language, aliases: [typescript, "type script"]}
  - id: javascript
    label: JavaScript
    category: language
    aliases: [javascript, "java script", ecmascript]
    # 歧义：裸 js 会误命中 node.js / next.js / web3.js 等文件名，只认独立的 JS（且不能紧跟在点号后）。
    regex: '(?<![A-Za-z0-9._])[Jj][Ss](?![A-Za-z0-9_])'
  - {id: java, label: Java, category: language, aliases: [java, jdk, jvm]}
  - {id: cpp, label: C++, category: language, aliases: [cpp, "c++", "c plus plus"]}
  - id: c
    label: C
    category: language
    aliases: ["c language", "c programming", "ansi c"]
    # 歧义：C++/C#/CI/CD/CPU 都不算 C；C-suite/C-level 也不算。
    # 歧义：C++/C#/CI/CD/CPU/C-suite 不算；Series C（融资轮次）、Class C、Washington D.C. 也不算。
    # 只认「列表语境」里的独立 C（后面紧跟逗号/斜杠/竖线/右括号），避免融资轮次/地名误报。
    regex: |-
      (?<![A-Za-z0-9_])(?<![Ss]eries )(?<![Cc]lass )C(?![A-Za-z0-9_+#-])(?![ \t]+(?:suite|level|officer|executive|corporation)\b)(?=\s*[,/|)\]、])
  - {id: bash, label: Bash, category: language, aliases: [bash, "shell scripting", "shell script"]}
  - {id: zig, label: Zig, category: language, aliases: [zig, "zig language"]}
  - {id: solidity, label: Solidity, category: language, aliases: [solidity, "solidity developer", "solidity contracts"]}
  - id: move
    label: Move
    category: language
    aliases: ["move language", movevm, "move smart contract"]
    # 歧义：动词 move 不命中；仅命中列表语境中的大写 Move 或明确语言语境。
    regex: |-
      (?<![A-Za-z0-9_-])Move(?![A-Za-z0-9_-])(?=[ \t]*(?:[,/()、]|$|\band\b|\bor\b))|(?i:\bmove\s+(?:language|programming|smart contracts?|developer|engineer|vm)\b)
  - id: r-lang
    label: R
    category: language
    aliases: ["r programming", "r language", rstudio, "r statistics"]
    # 歧义：R&D / R&R / R-squared / "R and R" 不命中；只认列表语境或 R 语言语境。
    regex: |-
      (?:(?:^|[\n\r])[ \t]*(?:[-*•·+][ \t]+)?R(?![A-Za-z0-9_+\-&])(?![ \t]+(?:and|or|&)[ \t]+R\b)(?![ \t]+(?:squared|squar|value|package|studio)\b))|(?:[,/（(、][ \t]*R(?![A-Za-z0-9_+\-&])(?![ \t]+(?:squared|squar|value|package|studio)\b))|(?i:(?:in|with|using|proficiency\s+in)\s+R(?![A-Za-z0-9_+\-&])(?![ \t]+(?:squared|squar|value|package|studio)\b))

