# 技能分类法（skill taxonomy）—— crypto-jobs「技能抽取」的唯一配置源。
#
# 设计约定：
#   - id：小写短横线、全局唯一、语义单一。报告按 id 聚合趋势，改 id 会断历史，只增不改。
#   - label：中文优先；技术专有名词保留英文原名（Kubernetes/Prometheus 等）。
#   - aliases：大小写不敏感、按词边界匹配（中文别名同样适用），支持常见复数。
#   - regex：可选；原样编译（默认大小写敏感，需要不敏感时写 (?i:...)），与 aliases 按 OR 合并。
#     短词/歧义词（go/rust/c/r/move/ray/spark/l2/ml/ai）不要放进 aliases，必须用显式 regex。
#   - 每个技能至少 1 个 alias；尽量 2+，且第一个 alias 选无歧义写法（测试据此回验）。
#
# 分类法覆盖目标：通用 DevOps / SRE / MLOps 技能 + 加密行业特有技能（节点/验证者/托管/HSM/撮合等）。
# 缺省不收录：db、ops 这类过于宽泛、单独出现几乎不能说明需求的词（由具体技能覆盖）。

schema_version: 1

categories:
