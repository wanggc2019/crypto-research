schema_version: 1
# crypto-jobs 招聘源注册表（采集层用，scripts/sources.py 读取）。
#
# 分层（tier）：
#   T0 = 公司官方 ATS 公开接口（Greenhouse / Lever / Ashby），为「招聘嵌入」设计，免密钥，最权威。
#   T1 = 加密垂直招聘站（RSS / HTML），只做线索补充，需遵守 robots.txt。
#   T2 = 通用远程招聘站（带 crypto 关键词过滤），噪音最大，必须命中 crypto 语境或公司白名单才收录。
#
# 采集礼貌约定（scripts/sources.py 实现）：
#   - 严格串行，每源每轮只请求 1 次；timeout 20s；失败重试 1 次；UA 用 crypto_core 默认浏览器 UA。
#   - 单源失败只记 health.error，绝不抛整轮异常；不做登录 / 不破解反爬 / 不碰付费接口。
#   - 不抓取 JD 详情页（ATS 接口已带回正文），避免放大请求量。
#
# type 取值（scripts/source_adapters.py 里的适配器）：
#   greenhouse | lever | ashby | rss_jobs | web3career | remoteok | remotive | jobicy
#
# 每源字段：id / enabled / tier / type / name / company / company_slug / url / note / tos
#   crypto_only: true 时套用 crypto 关键词 + 公司白名单过滤（只用于 T2 通用站）。
#   keywords: 该源额外的 crypto 关键词（会与 app.yaml filters.crypto_keywords、companies.yaml 合并）。

defaults:
  timeout_seconds: 20
  retries: 1
  # 兜底值；实际以 app.yaml fetch.description_max_chars 为准
  description_max_chars: 20000

# T2 通用站补充关键词（app.yaml filters.crypto_keywords 之外再补几个强信号词）
t2_keywords:
  - web3
  - cryptocurrencies
  - smart contract
  - tokenization
  - layer 2
  - crypto-native
  - onchain
  - digital asset

