# 运行配置（app）—— 数据源端点、轮询频率、衍生品开关、日报与日志。
# 凭据只放仓库根 .env（当前只有 Telegram；本模块其余数据源全部免 key）。

schema_version: 1
updated: "2026-11-08"

poll_seconds: 60

# 行情源（全部免 API key 的公开只读接口）。weight 仅用于未来加权的展示，当前取中位数。
sources:
  binance:
    enabled: true
    tier: primary          # primary=主源（top 大所，决定价格）；secondary=对比校验
    spot_base: "https://api.binance.com"
    futures_base: "https://fapi.binance.com"
    weight: 1.0
    timeout_seconds: 5        # 单次请求超时；失败后本轮不再请求该源（下一轮自动重试）
    # Binance 返回的 K 线最完整，作为 K 线主源；失败时由 OKX 接管。
  okx:
    enabled: true
    tier: primary
    base: "https://www.okx.com"
    weight: 1.0
    timeout_seconds: 5
  coinbase:
    enabled: true
    tier: primary
    base: "https://api.exchange.coinbase.com"
    weight: 1.0
    timeout_seconds: 5
  # CMC：用户提过，但免费 key 额度有限且要注册；需要时在根 .env 配 CMC_API_KEY 并置 enabled=true。
  # 当前实现不依赖它，默认关闭，留作扩展位。
  cmc:
    enabled: false
    tier: secondary        # 只做对比/校验，不参与定价
    base: "https://pro-api.coinmarketcap.com"
    api_key_env: CMC_API_KEY
    weight: 0.5

# 数据源分级：
#   primary   = top 大所（Binance/OKX/Coinbase），决定价格，失败会影响数据质量
#   secondary = 其它源，只做对比/校验，失败可跳过
quality:
  # 价格只取这几个头部交易所（顺序即展示顺序）；其他源即使 enabled 也只做对比校验。
  primary_sources: [binance, okx, coinbase]
  # 只要还有 1 个主源能出价就不告警；0 个才告警。改 3 则要求三家全在。
  min_primary_sources: 1
  # 3 个主源中某个源偏离中位数超过该值时，若其余源一致则剔除离群源继续判断。
  outlier_bps: 40
  # 剔除后剩余源允许的最大价差；与 rules.yaml consensus.max_spread_bps_p1 保持一致。
  max_spread_bps: 50

# 衍生品数据（Binance USD-M 永续，公开接口）
derivatives:
  enabled: true
  funding: true          # 资金费率（每轮取一次，低频变化）
  open_interest: true    # 持仓量（每轮一次，用于 15m 变化）

# 日报：每天在指定本地时间生成一次并推送（含夜间被压制的 P1）
report:
  enabled: true
  # 每天 10:00（本地时区 = ）生成并推送日报
  time: "10:00"
  send: true
  include_quiet_alerts: true

# 日志与数据保留（prune.py 统一执行，这里只做提示）
log:
  keep_days: 30
