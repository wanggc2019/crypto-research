# 全仓 AI 选择（ADR 0011）：按「功能」决定用哪个提供商 / 模型 / effort。
# 改这里即可换 AI，不用改代码；只写环境变量名，key 本身只放仓库根 .env。
# 校验：make gate 会检查本文件（未知提供商 / 代码里用到但这里没登记的功能 → 失败）。
schema_version: 1

# 提供商：代码里实现了 anthropic（官方 SDK）与 deepseek（OpenAI 兼容 /chat/completions）两种调用方式。
providers:
  anthropic:
    label: Claude
    key_env: ANTHROPIC_API_KEY
  deepseek:
    label: DeepSeek
    key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    default_model: deepseek-chat

# 功能未单独写的字段，从这里继承。
defaults:
  provider: anthropic
  model: claude-opus-5-5
  # effort：anthropic 专用（low / medium / high / xhigh / max）；不写 = 模型默认；deepseek 忽略
  # max_tokens：含思考 token，默认 16000

# 直接调用（单次请求）的功能。功能名 = <模块>.<功能>，代码里用这个名字取配置。
tasks:
  x-kol.analyze:            # 推文中文翻译 + 一句话总结（每 5 分钟一轮，批量 8 条，有缓存）
    model: claude-haiku-5-5
    effort: low
  news.translate:           # crypto-news 标题翻译（批量一次调用，有缓存）
    model: claude-haiku-5-5
    effort: low
  policy.interpret:         # crypto-policy P0/P1 解读草稿（低频）
    model: claude-opus-5-5
  ci.pr-review:             # GitHub Actions 的 PR 审查（CI 里 key 来自 secret，变量名同 key_env）
    model: claude-opus-5-5
    effort: high

# 例：某个功能换回 DeepSeek 省钱
#   x-kol.analyze:
#     provider: deepseek
#     model: deepseek-chat

# ---------------------------------------------------------------------------
# headless agent（多轮、会用工具的 AI 任务），由 tools/agent_run.py <功能名> <prompt 文件> 启动。
#   runner: claude（Claude Code 的 claude -p）| dsh（原 DeepSeek dsh headless）
#   auth（仅 claude）：subscription = 用本机 Claude Code 登录（占订阅额度，不另计费）
#                      api          = --bare + 根 .env 的 ANTHROPIC_API_KEY（按量计费，与日常 Claude Code 完全隔离）
#   allowed_tools（仅 claude）：只放行这些工具，其余一律自动拒绝（无人值守，没有人能点“允许”）
#     写文件用 Edit(路径)（Claude Code 的文件权限只认 Edit 规则，覆盖所有写/改文件工具；Write(路径) 不生效）
#   每次运行都是新会话（--no-session-persistence），不读你的用户级设置/hooks（--setting-sources project,local）
#   另有写死在 tools/agent_run.py 的拒绝清单（读写 .env、WebFetch/WebSearch 等），配置放不开
#   effort（仅 claude）：low / medium / high / xhigh / max，不写 = 模型默认
agents:
  defaults:
    runner: claude
    auth: subscription
    model: claude-opus-5-5
    timeout_seconds: 1800
  tasks:
    news.inspect:             # crypto-news 健康巡检 + 有限自愈（healthcheck 发现 FAIL 时异步触发）
      allowed_tools:
        - Read
        - Glob
        - Grep
        - Bash(.venv/bin/python tools/healthcheck.py --module crypto-news *)
        - Bash(.venv/bin/python tools/render_launchd.py --module crypto-news --install)
        - Bash(.venv/bin/python tools/prune.py --module crypto-news --apply)
        - Bash(rm crypto-news/data/state/collect.lock)
        - Bash(tail *)
        - Edit(crypto-news/data/state/health-agent.json)
    policy.interpret-push:    # crypto-policy：pending 里的 P0/P1 写解读草稿并推送 Telegram
      allowed_tools:
        - Read
        - Glob
        - Grep
        - Edit(crypto-policy/data/reports/interpret-*.md)
        - Bash(cd crypto-policy)
        - Bash(./scripts/push_text.py *)
    analyst.daily:            # crypto-analyst 每日 AI 综合
      allowed_tools:
        - Read
        - Glob
        - Grep
        - Bash(ls *)
        - Bash(python3 crypto-analyst/scripts/score.py --dry-run*)
        - Bash(.venv/bin/python crypto-analyst/scripts/score.py --dry-run*)
        - Edit(crypto-analyst/data/reports/*-ai-*)
    analyst.weekly:           # crypto-analyst 周日 AI 分析
      allowed_tools:
        - Read
        - Glob
        - Grep
        - Bash(ls *)
        - Bash(python3 crypto-analyst/scripts/score.py --dry-run*)
        - Bash(.venv/bin/python crypto-analyst/scripts/score.py --dry-run*)
        - Edit(crypto-analyst/data/reports/*-ai-*)
    analyst.period:           # crypto-analyst 月/季/年 AI 分析
      allowed_tools:
        - Read
        - Glob
        - Grep
        - Bash(ls *)
        - Bash(python3 crypto-analyst/scripts/score.py --dry-run*)
        - Bash(.venv/bin/python crypto-analyst/scripts/score.py --dry-run*)
        - Edit(crypto-analyst/data/reports/*-ai-*)
