name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hygiene: # 凭据/运行产物不得入库
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: No secrets / data / venv tracked
        run: |
          ! git ls-files | grep -E '(^|/)\.env$'
          ! git ls-files | grep -E '(^|/)data/' | grep -vE '(^|/)tests/fixtures/'
          ! git ls-files | grep -E '(^|/)\.venv/'

  gate: # 唯一质量门：与本地 make gate / pre-push 完全一致（自动发现 crypto-* 模块：ruff + 单测 + scripts/e2e.py）
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]   # 3.9 = 当前线上 .venv；3.12 = 升级目标（见 docs/adr/0010）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install pyyaml ruff
      - name: Gate
        run: make gate
