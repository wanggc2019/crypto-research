name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # fork PR 的 GITHUB_TOKEN 只读，无法写评论；直接跳过，避免无意义红叉。
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c  # v5
        with:
          python-version: "3.12"

      - name: Fetch base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" || git fetch --no-tags origin "$BASE_REF"

      # 这个 job 拿得到 CLAUDE_CODE_OAUTH_TOKEN：只装审查真正需要的、锁定版本的依赖，缩小供应链面
      # （默认 claude-code 提供商不用 anthropic SDK；若把 ci.pr-review 改成 anthropic，需在这里加 anthropic==<requirements.txt 里的版本>）
      # 版本与 requirements.txt 一致，由 tools/tests/test_workflows.py 校验
      - name: Install
        run: pip install --no-deps PyYAML==6.0.3

      # config/ai.yaml 的 ci.pr-review 默认用 claude-code（Claude Code 订阅）：
      # 订阅凭据 = `claude setup-token` 生成的长期 token，存为 secret CLAUDE_CODE_OAUTH_TOKEN；没配就不装、审查跳过
      - name: Install Claude Code
        continue-on-error: true   # 安装失败（npm/网络）→ 没有 claude 命令 → 审查跳过，不让 job 变红
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            npm install -g @anthropic-ai/claude-code@2.1.325
            claude --version
          else
            echo "::warning::未配置 CLAUDE_CODE_OAUTH_TOKEN，跳过安装 Claude Code（AI 审查会跳过）"
          fi

      - name: Run AI review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 仅当 ci.pr-review 改用 anthropic 时生效
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}   # config/ai.yaml 的 ci.pr-review 改用 deepseek 时生效
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ai_review_pr.py
