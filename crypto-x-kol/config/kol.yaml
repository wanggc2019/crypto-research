# KOL 白名单（crypto-x-kol）
#
# ★ 这是「起始名单」：把 enabled 按你的口味开关，或直接替换 accounts。
#   handle 不带 @；抓取失败只记录在 data/state/kol-<handle>.json 的 last_error，不影响整轮。
#   2026-11-08 用 r.jina.ai 匿名实测过全部 handle：除 saylor（匿名登录墙）外均可读。
#
# ⚠️ 账号边界（避免和 crypto-news 双推）：
#   crypto-news 的 T2「高管发声」已监控 cz_binance、heyibinance、brian_armstrong、benbybit、jespow；
#   不要把这 5 个 handle 加进本文件——同一条推文会被两个模块各推一次。
#   tools/tests/test_account_overlap.py 会自动检查两边账号集合不重叠。
#
# tier：T1 = 一手/研究/高信噪比；T2 = 交易/中文/补充。日报与推送按「高信号 → tier → 首次发现时间」排序。
# tags：仅用于报告展示。
